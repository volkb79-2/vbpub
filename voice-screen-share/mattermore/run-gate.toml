# mattermore tryout gate lane — parsed ONLY by Run-Gate CLI. Stdlib-only tests
# (isolation guard: names, ports, digests); pytest from the tester venv.
schema_version = 1

[lanes.suite]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/voice-screen-share/mattermore && \"$TESTER_VENV/bin/python\" -m pytest tests -q -p no:cacheprovider",
]
clean_tree = false
budget = "5m"
