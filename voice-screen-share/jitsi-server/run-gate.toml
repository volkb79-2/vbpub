# jitsi-server gate lane — parsed ONLY by Run-Gate CLI. Offline tests: render,
# compose validation, no-credentials/no-domain guard, port-plan agreement, the
# user-registration hook (fake docker). pytest from the tester venv.
schema_version = 1

[lanes.suite]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/voice-screen-share/jitsi-server && \"$TESTER_VENV/bin/python\" -m pytest tests -q -p no:cacheprovider --cov=hooks --cov-branch --cov-report=term-missing",
]
clean_tree = false
budget = "5m"
