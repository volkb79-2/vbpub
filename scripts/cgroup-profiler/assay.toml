# cgroup-profiler's assay lane declarations. Consumed by run-gate.toml's
# [lanes.r2] via a live, worktree-installed assay (assay/docs/
# INTERNAL-CONSUMERS.md) — no pinned zipapp for an in-repo consumer.
schema_version = 2

[lanes.r2]
scope = "S1"
rigor = ["R0", "R2"]
enforcement = "gate"
# /opt/tester-venv/bin/python3, not bare "python3": assay spawns this argv
# as its own subprocess, independent of whatever interpreter invoked
# `assay.cli` itself -- bare "python3" resolves via PATH to
# /usr/local/bin/python3 inside tester-unified, which has no pytest.
# Hardcoded, scoped to this file's one documented consumption path
# (run-gate.toml's [lanes.r2], always inside a tester-unified container);
# see scripts/debian-install-v2/assay.toml, where this exact pattern was
# worked out and verified live first.
argv = ["/opt/tester-venv/bin/python3", "-m", "pytest", "tests", "-q", "-x"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
# Controller ruling RW-438's P6 counts/rate are historical and do not size
# this P1 request-base campaign. Inspect and record the exact plan for the
# supplied base before launch, then set a safety window with measured headroom.
# Expiry is incomplete, never a mutant verdict; resume the same exact tree.
budget = "24h"
allow_argv_append = false

# This is a monorepo lane: assay's snapshot walks the whole resolved commit,
# not just this project's own source roots, so a tracked hostile symlink
# anywhere else in vbpub (Topos's fixtures) would otherwise refuse every
# lane in every unrelated project. See assay/docs/CONSUMERS.md's "A
# monorepo lane: omitting declared unsafe symlinks" for the full mechanism
# and the maintenance obligation this list creates.
[lanes.r2.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.r2.judge]
language = "python"
source_roots = ["lib"]
# The comparison scope is caller-selected. After the provisional P1 merge,
# origin/main contains the daemon changes and would yield a truthful but empty
# changed-lines campaign. The controller supplies the recorded pre-wave base
# with `./run-gate.py r2 --base REF`; omission must fail rather than certify 0
# eligible mutants as a green P1 result.
base_source = "request"

[lanes.r2.judge.mutation]
jobs = 2
max_mutants = 1500
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
# Controller ruling RW-28 (2026-09-12): candidate 47 (lib/serve.py:479, the
# session-loop's `threading.Thread(..., daemon=True)` flipped to
# `daemon=False`) let pytest finish reporting results but then HUNG at
# interpreter exit for 37 minutes waiting on the now-non-daemon thread
# (other tests that start a real session and rely on daemon=True to let
# the process exit cleanly, without themselves joining the thread, leave
# it dangling under this exact mutation) -- with no per-candidate budget,
# assay waited indefinitely; the controller SIGKILLed it live. Mandatory
# for every r2 lane in the wave per this ruling: ~6x the ~100s baseline
# candidate cost measured for this project. Belongs under
# `[lanes.r2.judge.mutation]` (assay's `_MUTATION_OPTIONAL_FIELDS`,
# src/assay/config.py) -- NOT under `[lanes.r2]` itself; a first attempt
# placed it at the lane's top level and assay's loader correctly refused
# it as an unknown key (BAD_LANE_CONFIG) on the very next real invocation.
budget_per_candidate = "600s"
