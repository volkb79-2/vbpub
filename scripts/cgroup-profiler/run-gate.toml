# =============================================================================
# cgroup-profiler gate lanes — parsed ONLY by Run-Gate CLI (one parser,
# D-110). r0-r1 wraps this project's OWN pre-existing tools/gate.sh
# verbatim, host-scoped, because that script already does its own complete
# docker orchestration (placement-verified, detached-run, separate
# verdict-read — see gate.sh's own header for why) and Run-Gate CLI's
# container orchestration would just be a second, redundant layer around
# the same docker calls. This mirrors debian-install-v2's
# r1-vm-real-commit precedent (a host lane whose argv happens to be a
# script that itself launches docker).
#
# r2 and r3 both run INSIDE Run-Gate CLI's own tester-unified container
# (SPEC.md R-15/R-16 — placement, dual-mount, safe.directory, detached-
# run+separate-verdict-read): r2 because assay's R2 execution needs this
# project's report-tier deps (pandas/plotly/etc, already baked into
# tester-unified:local per this project's own nyxloom-trove/nyxloom.toml);
# r3 because tools/canary-run.sh, UNLIKE gate.sh, does NOT launch its own
# container — it expects to already be running somewhere with those same
# deps (resolving python via $TESTER_VENV, which tester-unified:local's
# own Dockerfile bakes in) or a local venv/, so it needs an outer
# container, not none.
#
# nyxloom-trove/nyxloom.toml's [gates.unit]/[gates.coverage]/[gates.canary]
# stay as they are — this file is an ADDITIONAL, standard-naming lane
# matrix layered on top for scripts/LANE-MATRIX-PROGRESS.md's program, not
# a replacement.
#
# environment = "bare-host", not "host", for r0-r1/gate (run-gate RG-43
# estate-wide sweep, 2026-09-03): as of rev 36, plain "host" is a CONTAINER
# default with no docker-socket mount (verified live via --dry-run) —
# gate.sh needs real docker access to launch its own nested container, and
# gate needs it to launch r0-r1/r2/r3 as nested `run-gate <lane>`
# processes. r2's `pip install -e assay` also can't work inside
# tester-unified (its site-packages is root-owned, read-only for the
# non-root user the container runs as) -- PYTHONPATH points straight at
# assay's own src-layout source instead (verified equivalent: pip install
# -e never gave assay a real installed-distribution identity either). See
# scripts/debian-install-v2/run-gate.toml, where this exact pattern was
# worked out and verified live first.
# =============================================================================
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "bare-host"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/cgroup-profiler && exec tools/gate.sh {worktree} coverage",
]
clean_tree = false
budget = "20m"

# Mutation testing via a live worktree assay (never a pinned zipapp for an
# in-repo consumer — assay/docs/INTERNAL-CONSUMERS.md), executed inside
# tester-unified since this project's report-tier modules need
# pandas/plotly/matplotlib/scipy/ruptures. Keep this as a native Assay lane:
# it needs Run-Gate's source-backed Assay invocation, resume/progress/state
# handling, and the RG-89 observer-only socket mount because the tester has a
# private cgroup namespace. The judge policy (source roots, operators, budget)
# lives in this project's own assay.toml [lanes.r2].
[lanes.r2]
kind = "assay"
assay_lane = "r2"
environment = "tester-unified"
resource_observer = "cgprofile"
# `assay.toml` delegates the changed-lines base to the request. Invoke with
# `./run-gate.py --base <exact-ref> r2`, and inspect the exact Assay plan before
# the campaign: run-gate can derive a base if the flag is omitted, so the
# acceptance command must supply the recorded ref explicitly.
# Selective diagnostics use run-gate's assay-only request controls
# (`--reuse-from`, repeatable `--rejudge`, `--rejudge-outcome`, RG-66); it
# records those runs as selective, non-gate runs. Arbitrary arguments after
# `--` are refused for an assay lane (`accepts_args` is command-lane only), so
# there is deliberately no `accepts_args` here. Omit the controls for an
# acceptance R2 campaign.
clean_tree = true
# The prior P6 counts/rate in RW-438 are historical, not an estimate for this
# P1 request-base campaign. Inspect and record the exact plan for the supplied
# base before launch, then set a safety window with measured headroom. Expiry
# is incomplete, never a mutant verdict; resume the same exact tree.
budget = "24h"
artifacts = [".assay/verdict-r2.json", ".assay/r2-progress.jsonl"]
[lanes.r2.resources]
memory = "2g"
pids = 8192
# Apply the ceiling before any mutation candidate can execute; it remains
# directly verifiable as Docker NanoCpus on the exact campaign container.
cpus = "3"

# Proves the gate REJECTS known-bad code — this project's own
# tools/canary-run.sh (7 real canaries, built by a prior session). Runs
# inside tester-unified (see file header) since the script itself does not
# launch a container and needs $TESTER_VENV's report-tier deps.
[lanes.r3]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/cgroup-profiler && exec tools/canary-run.sh",
]
clean_tree = false
budget = "10m"
[lanes.r3.resources]
memory = "1g"
memory_swap = "16g"
cpus = "3"

# The COMPLETE gate: r0-r1, then the 24h r2, then r3. Agents and humans who want
# full-source mutation evidence run THIS lane; none duplicates the sub-lane
# sequence. RG-1: every sub-invocation carries --worktree {worktree} explicitly
# (cmru's [lanes.gate] is the reference shape). CMRU's release gate is
# deliberately narrower — cmru.toml runs only `run-gate r0-r1` and
# `run-gate r3` — because the operator's release policy allows the long R2
# campaign to be deferred. A release cut without running this lane to
# completion (the initial 1.0.0 release) has NO completed full-source R2
# verdict and must not claim one.
[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/cgroup-profiler && run-gate --worktree {worktree} r0-r1 && run-gate --worktree {worktree} --base {base} r2 && run-gate --worktree {worktree} r3",
]
clean_tree = false
# The full sequence includes the enforced 24h assay R2 window. This outer
# command-lane budget is advisory; assay.toml owns the actual R2 deadline.
budget = "25h"
