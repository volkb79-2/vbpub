# =============================================================================
# debian-install gate lanes — parsed ONLY by the installed Run-Gate CLI (D-110).
# r0-r1, r2 and r3 are the standard 3-tier lane matrix (see scripts/
# LANE-MATRIX-PROGRESS.md) and are host-scoped because they exercise
# dry-run and fake-command boundaries only; no disk/systemd mutation is
# permitted in any of them. fake-integration and r1-vm-real-commit are
# extra, non-aggregate lanes alongside the 3-tier scheme; r1-vm-real-commit
# is the one deliberate exception that mutates a disposable disk image, but
# only inside the QEMU guest's separate kernel via testing/vm/.
# Neither fake-integration nor r1-vm-real-commit is part of [lanes.gate];
# run them by explicit name. r2 joined that list 2026-09-03: it is a native
# Assay mutation lane, which can only ever be 100%-or-FAIL by assay's own
# design (no fail_under floor exists for a native lane, unlike an ingested
# report) -- the measured whole-tree baseline was 113 killed / 118 survived =
# 48.9% against base=origin/main, where the whole debian_install_v2 subtree
# counts as "changed" (it does not exist on main yet), not just any one
# session's edits, so this reflects the package's overall test-suite maturity,
# not a regression. r2 still runs and reports its real, complete result
# whenever invoked by name (`run-gate r2 --base <ref>`) or as part of an
# `assay lanes --file assay.toml` inventory -- it is excluded from the
# aggregate specifically so a pre-existing, estate-typical mutation-coverage
# gap does not block every debian-install-v2 change from merging, while
# closing it properly is out of scope for one session
# (assay/docs/CONSUMERS.md's own R2-adoption guidance: "adopt R2
# deliberately... expand only after observing real runs"). Fold it back into
# [lanes.gate] once real coverage closes the gap. DIV2-BL-22 (2026-11-26)
# converted it from a `kind = "command"` lane that drove Assay by hand to the
# native lane below: a command lane could not shard, its PYTHONPATH went
# through assay's env_passthrough so judge_sha256 folded in the checkout path
# and a seeded resume in a new checkout reused nothing (assay B577), and its
# per-candidate bound was derived from the baseline measured at start, so the
# verdict moved with host load.
#
# Ordinary lanes use environment = "tester-unified", deliberately
# (run-gate RG-43): as of rev 36, plain "host" is a CONTAINER default
# (DEFAULT_HOST_IMAGE), not bare execution, and that image has no pytest at
# all. tester-unified (the shared [environments.tester-unified] in the
# repo-root run-gate.root.toml — already built, already what every vbpub-internal
# project's ordinary lanes use) DOES carry test tooling, but in its own
# dedicated venv at /opt/tester-venv/, not on the default PATH/python3 — every
# argv below that needs pytest/pip/assay says so explicitly
# (/opt/tester-venv/bin/python3, matching assay/docs/INTERNAL-CONSUMERS.md's
# own documented mechanism for exactly this). A first pass at this fix
# used environment = "bare-host" instead (running directly on the invoking
# devcontainer shell) -- that worked, but gives up the isolation the whole
# run-gate/tester-unified architecture exists to provide, for no reason
# once the real venv path is used correctly; corrected the same day.
# RG-43's own estate-wide sweep of every other `environment = "host"` lane
# this flip affects has not happened yet -- this file is that sweep's
# first, scoped instance.
# =============================================================================
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/debian-install-v2 && python3 -m compileall -q debian_install_v2 && PYTHONPATH=.:../../libraries/cli-extended/src:{worktree}/libraries/cowtree/src /opt/tester-venv/bin/python3 -m pytest debian_install_v2/tests -m 'not os_integration' -q --cov=debian_install_v2 --cov-branch --cov-report=term-missing",
]
clean_tree = false
budget = "5m"

# Mutation testing as a NATIVE Assay lane (DIV2-BL-22). The judge policy --
# source roots, operators, budgets, the explicit per-candidate bound -- lives
# in this project's own assay.toml [lanes.r2]; run-gate binds the JUDGE itself
# from the judged worktree's own assay/ source (RG-285: editable install of
# that checkout, import identity verified) and never from a pinned zipapp, so
# an in-repo consumer needs no `pip install -e assay` here
# (assay/docs/INTERNAL-CONSUMERS.md; the older hand-written argv this replaced
# carried an absolute {worktree} PYTHONPATH, which is what broke resume across
# checkouts).
#
# What run-gate itself supplies to the inner command (build_assay_inner):
# `--resume --progress .assay/progress-r2.jsonl --state-dir
# <repo>/.run-gate/assay-state/<project>[/assay-shards/...]` unconditionally
# (RG-33/RG-38), `--jobs` from `jobs` below (R-53), and `--request-base` from
# `--base` because the assay lane declares judge.base_source = "request"
# (RG-26/R-35). Without `--base` the ref is the judged tree's ciu-recorded
# fork point, else `merge-base HEAD @{upstream}`; a throwaway remote checkout
# has neither, so a remote run MUST pass `--base` (docs/R2-RUNBOOK.md does).
#
# jobs = 2 is EXPLICIT, not "auto", so every host gets the same worker count;
# it equals the assay lane's own jobs_max, and any count above one additionally
# requires a Cowtree-confirmed btrfs cheap-clone workspace (a host without that
# CoW area refuses `--jobs 2` by name; pass `-- --jobs 1` there).
#
# No `resources.shared`: a shared-infra lock would serialise the shards of one
# campaign, and run-gate refuses `--shard` on a lane that declares one.
#
# budget 450m = the assay lane's own 430m plus the >= 5m wrapper margin
# run-gate `lanes --check` requires (R-59). Headroom, not a measured need
# (complete 194-candidate runs took 174-224 min at 2 jobs).
[lanes.r2]
kind = "assay"
assay_lane = "r2"
resource_observer = "cgprofile"
environment = "tester-unified"
jobs = 2
clean_tree = false
budget = "450m"
# Keyed by the ASSAY lane name, which is what run-gate itself writes
# (assay_verdict_rel/assay_progress_rel); a shard instance appends
# `.shard<K>of<N>` to these names.
artifacts = [".assay/verdict-r2.json", ".assay/progress-r2.jsonl"]

# Proves the gate REJECTS known-bad code — each canary breaks exactly one
# contract a named test claims to assert, and that test must go red.
# tools/canary-run.sh's own `python_bin="${DEBIAN_INSTALL_V2_PYTHON:-python3}"`
# already anticipated needing a different interpreter per environment.
[lanes.r3]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/debian-install-v2 && PYTHONPATH={worktree}/libraries/cli-extended/src DEBIAN_INSTALL_V2_PYTHON=/opt/tester-venv/bin/python3 exec tools/canary-run.sh",
]
clean_tree = false
budget = "5m"

[lanes.fake-integration]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/debian-install-v2 && PYTHONPATH=.:../../libraries/cli-extended/src:{worktree}/libraries/cowtree/src /opt/tester-venv/bin/python3 -m pytest debian_install_v2/tests/test_fake_integration.py -m 'not os_integration' -q --cli-case-partial",
]
clean_tree = false
budget = "3m"

# Requires a Docker daemon reachable from the host lane runner (this repo's
# devcontainer talks to one via docker-outside-of-docker) and builds/boots a
# unprivileged QEMU/TCG runner — see scripts/debian-install-v2/testing/README.md.
# Skip this lane in any environment without Docker access; it is not part
# of any aggregate lane and nothing else here depends on it passing.
# bare-host, not tester-unified: this script launches the unprivileged
# persistent QEMU runner, then runs pytest INSIDE the VM over SSH. The same
# docker-socket access [lanes.gate] needs and tester-unified does not have
# wired up is required. No python/pytest is needed in the OUTER lane.
[lanes.r1-vm-real-commit]
kind = "command"
environment = "bare-host"
description = "Real loop/swap commit tests inside an isolated QEMU/TCG guest"
required_env = ["CGROUP_PARENT_DEV_GATES", "CGROUP_PARENT_DEV_INTERACTIVE", "BUILDX_BUILDER"]
argv = [
    "bash", "{worktree}/scripts/debian-install-v2/testing/vm/run-vm-tests.sh",
]
clean_tree = false
budget = "30m"

# The implementation/release gate: every consumer (release steps, agents,
# humans) runs THIS lane; none duplicates the sub-lane sequence. RG-1: every
# sub-invocation carries --worktree {worktree} explicitly (cmru's [lanes.gate]
# is the reference shape). fake-integration, r1-vm-real-commit, and r2
# are deliberately NOT part of this aggregate — see the file header.
[lanes.gate]
kind = "command"
# bare-host, not tester-unified: this lane's whole job is launching OTHER
# lanes' containers (each sub-lane below runs in tester-unified on its
# own), which needs docker-socket access tester-unified doesn't have wired
# up (nested docker-in-docker) -- matches the reference shape (cmru's own
# [lanes.gate] uses a non-isolated environment for its orchestrator lane
# for the identical reason). No python/pytest needed here at all.
environment = "bare-host"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/debian-install-v2 && run-gate --worktree {worktree} r0-r1 && run-gate --worktree {worktree} r3",
]
clean_tree = false
budget = "1h"

# `memory` and `pids` are both REQUIRED by resource_observer = "cgprofile"
# (run-gate needs them to attribute candidate-local memory and PID-limit
# events). 2g is the cap the preceding command lane already ran two workers
# under, so this conversion changes the lane's shape, not its cap.
# `candidate_ram` is absent on purpose: it is the estimate `jobs = "auto"`
# reads (R-53), and an explicit count does not consult it.
[lanes.r2.resources]
pids = 8192
memory = "2g"
io_sync = "durable"
