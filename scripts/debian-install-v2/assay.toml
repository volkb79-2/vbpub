# debian-install-v2's assay lane declarations. Consumed by run-gate.toml's
# [lanes.r2] via a live, worktree-installed assay (assay/docs/
# INTERNAL-CONSUMERS.md) — no pinned zipapp for an in-repo consumer.
schema_version = 2

[lanes.r2]
scope = "S1"
rigor = ["R0", "R2"]
# advisory, not gate: a NATIVE mutation lane can only ever be 100%-or-FAIL
# by assay's own design (judge.mutation.fail_under is REQUIRED for an
# ingested report and FORBIDDEN for a native one -- assay/src/assay/
# mutation.py's own docstring: "a native lane... which never passes this
# parameter... reaches exactly the terminal it reached before. Any
# survivor at all makes the score strictly less than 100"). Measured
# baseline (2026-09-03, full 231/231 candidates, base=origin/main): 113
# killed / 118 survived = 48.9%. base=origin/main means EVERY line in
# debian_install_v2 counts as "changed" (the whole subtree is new
# relative to main), not just this session's own edits, so this reflects
# the package's overall test-suite maturity, not a regression introduced
# now. Most survivors are `dangerous=True/False` kwargs on _run() calls
# (an audit/disclosure flag PlannedAction records but nothing branches
# on -- see actions.py) plus assorted pre-existing code with
# behavior-level rather than exhaustive-branch coverage. R2 still RUNS and
# reports its real, complete result every gate invocation (r0-r1 stays
# `enforcement = "gate"`, unaffected) -- this only stops a pre-existing
# coverage gap from blocking the whole gate while genuinely reaching
# 100% is out of scope for one session. Raise back to "gate" once real
# coverage closes the gap, per assay/docs/CONSUMERS.md's own R2-adoption
# guidance ("adopt R2 deliberately... expand only after observing real
# runs").
enforcement = "advisory"
argv = ["python3", "-m", "pytest", "debian_install_v2/tests", "-q"]
env = { PYTHONPATH = ".", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
budget = "50m"
allow_argv_append = false

# This is a monorepo lane: assay's snapshot walks the whole resolved commit,
# not just this project's own source roots, so a tracked hostile symlink
# anywhere else in vbpub (Topos's fixtures) would otherwise refuse every
# lane in every unrelated project. See assay/docs/CONSUMERS.md's "A
# monorepo lane: omitting declared unsafe symlinks" for the full mechanism
# and the maintenance obligation this list creates.
[lanes.r2.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.r2.judge]
language = "python"
source_roots = ["debian_install_v2"]
base = "origin/main"

[lanes.r2.judge.mutation]
jobs = 2
max_mutants = 320
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
