# ---------------------------------------------------------------- build-customscript

[[cases]]
id = "case:route:entrypoint:debian-install-v2/build-customscript/constraint-requires/1"
state = "retired"
retirement_reason = "The Requires(--repo-url, --bootstrap-url) constraint was reverted: it needed --repo-url to default to None and wrongly refused an explicit canonical URL. The handler's own check (customscript.resolve_bootstrap_url) enforces the rule; a constraint with a defaulted option is tracked as cli-extended CLI-EXT-20."

[[cases]]
id = "case:route:entrypoint:debian-install-v2/build-customscript/exclusive-conflict/configuration-source/option:route:entrypoint:debian-install-v2/build-customscript/--config/option:route:entrypoint:debian-install-v2/build-customscript/--config-json"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:f0317d8896f98136d1ba895adcb808fcb34d4a1aa98afc750093c0d9e7c75cb7"
rationale = "Two settings sources would need a precedence rule that hides mistakes; exactly one is required."
invocation = ["build-customscript", "--config", "install.json", "--config-json", "{}"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "not allowed with argument --config"
effects = ["None: refused by the parser before any file is read"]
test_ids = ["debian_install_v2/tests/test_cli_review_cases.py::test_both_configuration_sources_are_refused[build-customscript]"]

[[cases]]
id = "case:route:entrypoint:debian-install-v2/build-customscript/exclusive-member/configuration-source/option:route:entrypoint:debian-install-v2/build-customscript/--config"
