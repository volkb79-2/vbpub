[[cases]]
id = "case:route:entrypoint:install-host/attach/option-spelling/option:route:entrypoint:install-host/attach/--debug-raw/--debug-raw"
state = "active"
decision = "accept"
reviewed_signature = "sha256:bf231712a0bbbb73f7fb37eb8475822aab90469798a0efd1e4c8a5a6520ce922"
rationale = "The shared raw-diagnostics escape hatch is available on attach; it warns on stderr that secrets may be exposed and is off unless asked for."
