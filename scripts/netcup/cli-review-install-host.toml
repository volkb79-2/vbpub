expected_stderr_contains = "not allowed with argument --monitor"
effects = ["Refuses during argument parsing (exit 2); makes no request."]
test_ids = ["tests/test_cli_cases_install_host.py::test_replayed_case_matches_catalog[configure-conflict-monitor]"]

[[cases]]
id = "case:route:entrypoint:install-host/configure/exclusive-member/task-monitor-mode/option:route:entrypoint:install-host/configure/--monitor"
