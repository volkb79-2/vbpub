schema_version = 1
cli_id = "install-host"

[[cases]]
id = "case:route:entrypoint:install-host/attach/minimum"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:7e1db8698d723f41716f7f57280bb3c7e5e3dd704ee6acc3c3c49c9b150a841f"
rationale = "attach has no Netcup API fallback for the host address: without --ssh-host (or NETCUP_SCP_API_SSH_HOST) there is nothing to attach to, so it refuses with a usage error instead of guessing a host."
invocation = ["attach"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "attach requires --ssh-host or NETCUP_SCP_API_SSH_HOST"
effects = ["Refuses before any SSH, key or API activity; starts no follower and makes no request."]
test_ids = ["tests/test_cli_cases_install_host.py::test_replayed_case_matches_catalog[attach-minimum]"]

[[cases]]
id = "case:route:entrypoint:install-host/attach/option-spelling/option:route:entrypoint:install-host/attach/--attach-initial-delay/--attach-initial-delay"
state = "active"
decision = "accept"
reviewed_signature = "sha256:b1c48d5db2a022f4ba74bc053474095eec606a9bc25422b07b5c6ec5594c8a82"
rationale = "Delays the first SSH probe so a host that is still rebooting is not probed immediately; a finite number greater than zero, defaulting to install-host.toml."
invocation = ["attach", "--ssh-host", "192.0.2.10", "--attach-initial-delay", "1.5"]
expected_exit_status = 130
expected_stdout_contains = "[attach] Streaming until Ctrl-C."
expected_stderr_contains = "Cancelled."
effects = ["Starts the SSH log follower with a 1.5 second initial delay and streams until interrupted; makes no Netcup API call."]
test_ids = ["tests/test_cli_cases_install_host.py::test_replayed_case_matches_catalog[attach-attach-initial-delay]"]

