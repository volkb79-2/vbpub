effects = ["Starts the SSH log follower and streams until interrupted, warning on stderr that raw diagnostic data may expose secrets (the redaction switch itself is only observable on install); makes no Netcup API call."]
test_ids = ["tests/test_cli_cases_install_host.py::test_debug_raw_warns_and_is_off_by_default[attach]"]

