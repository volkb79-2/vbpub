[[cases]]
id = "case:route:entrypoint:install-host/attach/option-spelling/option:route:entrypoint:install-host/attach/--ssh-host/--ssh-host"
state = "active"
decision = "accept"
reviewed_signature = "sha256:aec0d7fdd91296678963075cecf91b8148b69da17ff3c5d0f6bb13186d4f9631"
