[[cases]]
id = "case:route:entrypoint:install-host/attach/option-spelling/option:route:entrypoint:install-host/attach/--ssh-identity-file/--ssh-identity-file"
state = "active"
decision = "accept"
reviewed_signature = "sha256:da846797f937647cffb24bfb0e6085191fc7c302c2bf4fa43691f2bb1f3d96a7"
rationale = "attach never creates a key: the named identity must already exist and be a readable private key, otherwise it is refused rather than replaced."
invocation = ["attach", "--ssh-host", "192.0.2.10", "--ssh-identity-file", "controller-key"]
expected_exit_status = 130
expected_stdout_contains = "[attach] Streaming until Ctrl-C."
expected_stderr_contains = "Cancelled."
effects = ["Requires the named key file to exist (a missing file is refused with exit 2), then starts the follower with it and streams until interrupted; writes no key material."]
test_ids = ["tests/test_cli_cases_install_host.py::test_replayed_case_matches_catalog[attach-ssh-identity-file]"]

