reviewed_signature = "sha256:739de71f229c19ed54f370518069997d5de1b741b6cef686c3fde5e1f01ac09f"
rationale = "--monitor alone selects explicit task monitoring after installation; it is one of the two mutually exclusive task-monitor-mode choices."
