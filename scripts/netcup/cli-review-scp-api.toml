decision = "accept"
reviewed_signature = "sha256:f93f345720cc99b745c0dc923e85db17ad34ed030afa7adf311d67ddec667b44"
rationale = "Selecting an ISO the operator uploaded earlier by its name is the other accepted way to name the image."
