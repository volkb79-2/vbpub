schema_version = 1
cli_id = "scp-api"

# Every row replays its invocation through the real main() in
# tests/test_cli_cases_scp_api.py (fake SCP client, HOME and cwd under tmp_path).
# The library controls --json/--debug-raw/--yes carry one parametrised test per
# control, with one cli_case marker per route (CLI-EXT-18 is the future
# library fix that would let one row stand for the control on every route).

[[cases]]
id = "case:route:entrypoint:scp-api/attach-iso/argument-shape/argument:route:entrypoint:scp-api/attach-iso/server_id"
state = "active"
decision = "accept"
reviewed_signature = "sha256:f09ec351a4ad00b32bcbfc46c11d67836400dae1729a13a0b93e3c0deede3b39"
rationale = "The server id is the one required positional and must be an integer: a typo such as 'not-an-id' is refused by the parser before any request, so the provider never sees a malformed path."
invocation = ["attach-iso", "42", "--iso-id", "1234", "--yes"]
expected_exit_status = 0
expected_stdout_contains = "attach requested"
expected_stderr_contains = "Confirmation accepted via --yes"
effects = ["Sends one POST /api/v1/servers/42/iso with isoId 1234 after the --yes consent."]
test_ids = [
  "tests/test_cli_cases_scp_api.py::test_replayed_case_matches_catalog[attach-iso-shape-server-id]",
  "tests/test_cli_cases_scp_api.py::test_invalid_argument_is_refused[attach-iso-server-id]",
]

[[cases]]
id = "case:route:entrypoint:scp-api/attach-iso/exclusive-conflict/iso-source/option:route:entrypoint:scp-api/attach-iso/--iso-id/option:route:entrypoint:scp-api/attach-iso/--user-iso-name"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:b0f1ebf94fc2a2c0287f073103dd864684f3c0180a7a45de4e95b0ee87a03fd7"
rationale = "A provider ISO id and an uploaded user ISO name name two different images; accepting both would silently pick one, so the parser refuses the pair."
invocation = ["attach-iso", "42", "--iso-id", "1234", "--user-iso-name", "a.iso"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "not allowed with argument --iso-id"
effects = ["Refuses at parse time; makes no request."]
test_ids = ["tests/test_cli_cases_scp_api.py::test_replayed_case_matches_catalog[attach-iso-conflict-iso]"]

[[cases]]
