expected_exit_status = 0
expected_stdout_contains = "attach requested"
expected_stderr_contains = "Confirmation accepted via --yes"
effects = ["Sends one POST /api/v1/servers/42/iso with isoId 1234 and changeBootDeviceToCdrom true."]
test_ids = ["tests/test_cli_cases_scp_api.py::test_replayed_case_matches_catalog[attach-iso-change-boot]"]

[[cases]]
id = "case:route:entrypoint:scp-api/attach-iso/option-spelling/option:route:entrypoint:scp-api/attach-iso/--debug-raw/--debug-raw"
state = "active"
decision = "accept"
reviewed_signature = "sha256:19b30bced643836aa3e4dcdfef95fd7a412f87b3541442ba1a8f88c12219791b"
rationale = "Library debugging control: turns redaction of diagnostic output off and warns that secrets may be exposed; it never changes which requests are made."
