expected_exit_status = 0
expected_stdout_contains = "attach requested"
expected_stderr_contains = "--debug-raw is active"
effects = ["Prints the secrets-exposure warning on stderr, then sends the same single POST as without the flag."]
test_ids = ["tests/test_cli_cases_scp_api.py::test_debug_raw_warns_and_is_off_by_default[attach-iso]"]

