[[cases]]
id = "case:route:entrypoint:scp-api/attach-iso/minimum"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:1eac32fcdc2455be95c7ec7da33a8a55e931d54a8567a615cafb37a25ca23a5a"
rationale = "The smallest parse-valid call (server id plus one image option) is still a mutation without consent: with no terminal and no --yes the run refuses rather than attach an ISO unattended. Omitting the image option entirely is refused by the parser (one of --iso-id/--user-iso-name is required)."
invocation = ["attach-iso", "42", "--iso-id", "1234"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "confirmation is required, but stdin is not interactive"
effects = ["Refuses before sending anything; the server is untouched."]
test_ids = ["tests/test_cli_cases_scp_api.py::test_replayed_case_matches_catalog[attach-iso-minimum]"]

[[cases]]
id = "case:route:entrypoint:scp-api/attach-iso/option-spelling/option:route:entrypoint:scp-api/attach-iso/--change-boot-device-to-cdrom/--change-boot-device-to-cdrom"
state = "active"
decision = "accept"
reviewed_signature = "sha256:668077da32986d0b6a4b06f95b3d165d1028e5e0086e796aa3a97757e8ccd93f"
rationale = "Opt-in flag so the guest boots from the attached ISO; off by default so a plain attach never changes the boot order."
