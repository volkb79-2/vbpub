status = "wontfix"
severity = "minor"
category = "adoption"
summary = "AC-04 synopsis-overrides: 14 verbs keep a hand-written synopsis such as '[server_id] [detach]'"
remedy = "Keep the overrides."
rationale = "They name the optional action positionals ('[server_id] [detach]', '[task_uuid] [cancel]') that the derived '[server_id] [options]' hides because those positionals come from configure callbacks (see SA-008 to SA-017). The four redundant overrides (login, servers, server-details, guest-agent-status) were removed."

