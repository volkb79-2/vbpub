schema_version = 1
cli_id = "monitor-task"

[[interaction_groups]]
id = "show-poll-refusal"
route_id = "route:entrypoint:monitor-task/show"

[[interaction_groups.combinations]]
id = "foreign-watch-poll"
option_ids = ["option:route:entrypoint:monitor-task/watch/--poll"]

[[interaction_groups]]
id = "raw-json-opt-out"
route_id = "route:entrypoint:monitor-task/show"

[[interaction_groups.combinations]]
id = "json-and-debug-raw"
option_ids = [
  "option:route:entrypoint:monitor-task/show/--json",
  "option:route:entrypoint:monitor-task/show/--debug-raw",
]

[[interaction_groups]]
id = "watch-json-refusal"
route_id = "route:entrypoint:monitor-task/watch"

[[interaction_groups.combinations]]
id = "show-json"
option_ids = ["option:route:entrypoint:monitor-task/show/--json"]

[[interaction_groups]]
id = "poll-validation"
route_id = "route:entrypoint:monitor-task/watch"

[[interaction_groups.combinations]]
id = "refuse-invalid"
option_ids = ["option:route:entrypoint:monitor-task/watch/--poll"]

[[interaction_groups]]
id = "poll-repeat"
route_id = "route:entrypoint:monitor-task/watch"

[[interaction_groups.combinations]]
id = "repeated-poll-last-wins"
option_ids = ["option:route:entrypoint:monitor-task/watch/--poll"]

[[cases]]
id = "case:route:entrypoint:monitor-task/show/argument-shape/argument:route:entrypoint:monitor-task/show/task_uuid"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:4a8a6bea7b2477352d97c60adae50310b34ee33730ca7813732c01b7383e282c"
rationale = "The task selector is a UUID. Reject malformed values in argparse before credentials or API setup."
invocation = ["show", "not-a-uuid"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "expected a task UUID"
effects = ["Refuses during argument parsing; reads no credentials or API settings and makes no request."]
test_ids = ["tests/test_monitor_task.py::test_real_executable_obeys_help_version_and_parse_contract"]

[[cases]]
id = "case:route:entrypoint:monitor-task/show/interaction:raw-json-opt-out/json-and-debug-raw"
state = "active"
decision = "accept"
reviewed_signature = "sha256:b12e22b22d1047798d9951f53646783612f091919b477c5f5591b8b97c656594"
rationale = "JSON remains redacted by default; combining --debug-raw is an explicit, warned opt-out for diagnosis."
invocation = ["show", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--json", "--debug-raw"]
expected_exit_status = 0
expected_stdout_contains = "root-secret"
expected_stderr_contains = "--debug-raw is active"
effects = ["Reads one task and prints its JSON response without secret redaction after the explicit raw-output opt-out."]
test_ids = ["tests/test_monitor_task.py::test_show_json_redacts_sensitive_fields_and_debug_raw_disables_redaction"]

[[cases]]
id = "case:route:entrypoint:monitor-task/show/interaction:show-poll-refusal/foreign-watch-poll"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:6f93f71c1dcadb09cf32c3682a3b770b68aea0881f5c1d203b3b4a5dce38daa2"
rationale = "show fetches one snapshot. Polling belongs to watch, so --poll is rejected instead of silently ignored."
invocation = ["show", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--poll", "2"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "unrecognized arguments"
effects = ["Refuses during argument parsing; reads no credentials or API settings and makes no request."]
test_ids = ["tests/test_monitor_task.py::test_real_executable_obeys_help_version_and_parse_contract"]

[[cases]]
id = "case:route:entrypoint:monitor-task/show/minimum"
state = "active"
decision = "accept"
reviewed_signature = "sha256:ba7203bbd62f0ba98c7431683d2312d342d47fbe95821e96799a807b92c3d19a"
rationale = "The minimum show form retrieves and summarizes one task snapshot; it does not poll or mutate provider state."
invocation = ["show", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f"]
expected_exit_status = 0
expected_stdout_contains = ""
expected_stderr_contains = "Task state: FINISHED"
effects = ["Loads API credentials and configuration, issues one task GET, and prints a human-readable snapshot; no mutation."]
test_ids = ["tests/test_monitor_task.py::test_show_fetches_one_snapshot_without_polling"]

[[cases]]
id = "case:route:entrypoint:monitor-task/show/option-spelling/option:route:entrypoint:monitor-task/show/--debug-raw/--debug-raw"
state = "active"
decision = "accept"
reviewed_signature = "sha256:4f88d465c58df4f7cc615f77710efa7cd134f1763c103a1f9678746d16b99e5a"
rationale = "--debug-raw is accepted on show to make the explicit raw-output escape hatch available; help warns that it may reveal secrets."
invocation = ["show", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--json", "--debug-raw"]
expected_exit_status = 0
expected_stdout_contains = "root-secret"
expected_stderr_contains = "--debug-raw is active"
effects = ["Reads one task and prints secret-bearing fields only after the explicit raw-output opt-out."]
test_ids = ["tests/test_monitor_task.py::test_show_json_redacts_sensitive_fields_and_debug_raw_disables_redaction"]

[[cases]]
id = "case:route:entrypoint:monitor-task/show/option-spelling/option:route:entrypoint:monitor-task/show/--json/--json"
state = "active"
decision = "accept"
reviewed_signature = "sha256:0a98915b962161328fba7ca7c2e5624b215e5d035b474c7dfc9f2cd5a5ecd614"
rationale = "JSON is available for a single snapshot; sensitive fields are redacted unless --debug-raw is also explicit."
invocation = ["show", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--json"]
expected_exit_status = 0
expected_stdout_contains = "***REDACTED***"
expected_stderr_contains = ""
effects = ["Reads one task and prints redacted JSON; no mutation."]
test_ids = ["tests/test_monitor_task.py::test_show_json_redacts_sensitive_fields_and_debug_raw_disables_redaction"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/argument-shape/argument:route:entrypoint:monitor-task/watch/task_uuid"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:a1109cdc751339b060c51f8dc235db13022b5165c1b77be9a33a4db8ca6a078a"
rationale = "The watch selector uses the same task UUID contract as show and must fail before login or network activity."
invocation = ["watch", "not-a-uuid"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "expected a task UUID"
effects = ["Refuses during argument parsing; reads no credentials or API settings and makes no request."]
test_ids = ["tests/test_monitor_task.py::test_real_executable_obeys_help_version_and_parse_contract"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/interaction:poll-repeat/repeated-poll-last-wins"
state = "active"
decision = "accept"
reviewed_signature = "sha256:a234187dd370eb5cd3ca0d99aec97d215f4b4f16f5ed7c954556f7a3edc5691b"
rationale = "Argparse accepts repeated scalar options and the final --poll value takes effect. This is retained deliberately and pinned by behavior coverage."
invocation = ["watch", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--poll", "9", "--poll", "0.25"]
expected_exit_status = 0
expected_stdout_contains = ""
expected_stderr_contains = "Task finished: FINISHED"
effects = ["Loads credentials and API configuration, polls the selected task, and uses 0.25 seconds between requests; no mutation."]
test_ids = ["tests/test_monitor_task.py::test_watch_repeated_poll_uses_last_interval"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/interaction:poll-validation/refuse-invalid"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:d94f09943452d9a2720f0292318e131f1ecdd261cf7c9a5cf774e29a1ff172af"
rationale = "--poll requires a finite number greater than zero. Refuse NaN, zero, and negative intervals before credentials or API setup."
invocation = ["watch", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--poll", "nan"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "finite number greater than zero"
effects = ["Validates the interval and exits before reading credentials or making a request."]
test_ids = ["tests/test_monitor_task.py::test_watch_rejects_nonpositive_or_nonfinite_poll_before_authentication"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/interaction:watch-json-refusal/show-json"
state = "active"
decision = "refuse"
reviewed_signature = "sha256:c2d96dbae598a239fdf11e47037bc0cd0850eb4434db92552785950e4eae5b40"
rationale = "watch streams progress and diagnostics to stderr, so JSON mode is available on show only and must be refused here."
invocation = ["watch", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--json"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "unrecognized arguments"
effects = ["Refuses during argument parsing; reads no credentials or API settings and makes no request."]
test_ids = ["tests/test_monitor_task.py::test_real_executable_obeys_help_version_and_parse_contract"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/minimum"
state = "active"
decision = "accept"
reviewed_signature = "sha256:32f43416dec5f2eca9e0c299a209daf411942f0d78125e01a9bd4f994317093b"
rationale = "The minimum watch form reads monitor-task.toml for its polling interval and continues until a terminal provider state."
invocation = ["watch", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f"]
expected_exit_status = 0
expected_stdout_contains = ""
expected_stderr_contains = "Task finished: FINISHED"
effects = ["Loads monitor settings and API credentials, performs repeated task GETs until terminal, and reports progress on stderr; no mutation."]
test_ids = ["tests/test_monitor_task.py::test_watch_polls_changes_until_terminal_and_reads_default_interval"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/option-spelling/option:route:entrypoint:monitor-task/watch/--debug-raw/--debug-raw"
state = "active"
decision = "accept"
reviewed_signature = "sha256:f5a7a72e6f728aa37d7a626eca735ca807f007e7ab2b8fbae7a333f9ffa2e015"
rationale = "watch shares the explicit debug-raw diagnostic escape hatch; response errors may expose secret-bearing fields and the option warns when active."
invocation = ["watch", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--poll", "0.25", "--debug-raw"]
expected_exit_status = 0
expected_stdout_contains = ""
expected_stderr_contains = "root-secret"
effects = ["Polls task state and prints raw response-error details only after explicit opt-out."]
test_ids = ["tests/test_monitor_task.py::test_watch_accepts_explicit_poll_and_debug_raw"]

[[cases]]
id = "case:route:entrypoint:monitor-task/watch/option-spelling/option:route:entrypoint:monitor-task/watch/--poll/--poll"
state = "active"
decision = "accept"
reviewed_signature = "sha256:ed1581cb350465948a2cf3b701c23fc7d3a2cc4e8758a434c2ed0aaf34c90364"
rationale = "--poll overrides the configuration interval for this watch invocation and accepts only finite values greater than zero."
invocation = ["watch", "3a27fe8e-e747-4f3b-80b0-f930c0d0db3f", "--poll", "0.25"]
expected_exit_status = 0
expected_stdout_contains = ""
expected_stderr_contains = "Task finished: ERROR"
effects = ["Reads the task repeatedly with a 0.25-second interval; no mutation."]
test_ids = ["tests/test_monitor_task.py::test_watch_accepts_explicit_poll_and_debug_raw"]
