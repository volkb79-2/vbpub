# =============================================================================
# scripts/netcup gate lane — parsed ONLY by Run-Gate CLI (one parser, D-110).
# pytest suite. `environment = "host"` maps to a container image that lacks
# pytest (confirmed 2026-09-07); tester-unified (repo-root central env) has
# it, but only in its $TESTER_VENV, not on bare `python3`/PATH - see
# tester-unified/Dockerfile lines ~96-120.
# See run-gate-project/CONSUMERS.md.
# =============================================================================
schema_version = 1

[lanes.suite]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/scripts/netcup && export PYTHONPATH=\"{worktree}/libraries/cli-extended/src${PYTHONPATH:+:$PYTHONPATH}\" && \"$TESTER_VENV/bin/python\" -m pytest tests/ -q"]
# Measured need, not a safety margin for flakiness. Registered runs of this lane
# on 2026-11-24 (before this change): 17 completed in 127 s to 289 s (pytest's own
# "passed in"); the slowest completed, 288.95 s on v1001 while two other netcup
# suites and three scripts/controller suites ran on that host, was 96% of the
# previous 5m budget. Five v1001 runs ended BUDGET_EXCEEDED at 300 s (08:01Z x2,
# 15:08Z, 15:17Z, 15:25Z) at 75-88% of their tests; extrapolated linearly, the
# slowest needed about 390 s. The budget is that slowest need x 1.6 (about 624 s,
# rounded up to 11m). A run that needs more than this is a heavier host load than
# measured here or a real regression in the suite's cost; investigate it, do not
# absorb it here.
budget = "11m"
# RG-320/RG-326: SILENT BY CONSTRUCTION during pytest -q; the test output
# cadence is not guaranteed within 300s; no silence bound is measured; see RG-326.
stall_timeout = "11m"
