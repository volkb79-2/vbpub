# =============================================================================
# scripts/netcup gate lane — parsed ONLY by run-gate.py (one parser, D-110).
# pytest suite. `environment = "host"` maps to a container image that lacks
# pytest (confirmed 2026-09-07); tester-unified (repo-root central env) has
# it, but only in its $TESTER_VENV, not on bare `python3`/PATH - see
# tester-unified/Dockerfile lines ~96-120.
# See run-gate-project/CONSUMERS.md.
# =============================================================================
schema_version = 1

[lanes.suite]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/scripts/netcup && \"$TESTER_VENV/bin/python\" -m pytest tests/ -q"]
budget = "2m"
