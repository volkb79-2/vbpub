schema_version = 1

[lanes.offline]
kind = "command"
environment = "tester-unified"
network = "none"
argv = [
    "bash", "-c",
    "set -euo pipefail; cd {worktree}/scripts/debian-rollback; export PYTHONDONTWRITEBYTECODE=1; shellcheck poc/dr-pick-disk poc/*.sh iso/dr-autoinstall iso/dr-plan iso/config-hook iso/*.sh; bash -n poc/dr-pick-disk; bash -n iso/dr-autoinstall; bash -n iso/dr-plan; sh -n iso/config-hook; for shell_file in poc/*.sh iso/*.sh; do bash -n \"$shell_file\"; done; git diff --check; for test_file in poc/test-*.sh iso/test-*.sh; do bash \"$test_file\"; done; /opt/tester-venv/bin/python -B -I -m unittest discover -s tests -v; exec /opt/tester-venv/bin/python -B -I poc/test-dr-serial.py",
]
clean_tree = false
budget = "10m"
description = "Run the Debian rollback offline shell, Python unit, and serial-scenario suites in tester-unified"

[lanes.offline.resources]
memory = "1g"
