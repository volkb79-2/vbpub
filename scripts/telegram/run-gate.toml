# =============================================================================
# scripts/telegram gate lane — parsed ONLY by Run-Gate CLI (one parser, D-110).
# pytest suite. environment = "host" lacks pytest (confirmed this session for
# scripts/netcup's identical setup); tester-unified has it.
# See run-gate-project/CONSUMERS.md.
# =============================================================================
schema_version = 1

[lanes.suite]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/scripts/telegram && \"$TESTER_VENV/bin/python\" -m pytest tests/ -q"]
budget = "2m"
# RG-320/RG-326: SILENT BY CONSTRUCTION during pytest -q; no <=300s output
# cadence is guaranteed by every test; no bound is measured; see RG-326.
stall_timeout = "2m"
