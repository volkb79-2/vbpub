# =============================================================================
# gstammtisch-guide gate lanes — parsed ONLY by run-gate.py (one parser,
# D-110). The modules under test load via importlib.util.spec_from_file_
# location against fixture data (fake_rcon_server.py, a local socketpair,
# monkeypatched subprocess/docker calls) — the one file that talks to a real
# Docker daemon (tests/test_soulmask_monitor_docker.py) already self-skips
# gracefully without one (pytest.mark.skipif on shutil.which("docker")).
#
# environment = "tester-unified" for r0-r1/r2/r3 (run-gate RG-43 estate-wide
# sweep, 2026-09-03): as of rev 36, plain "host" is a CONTAINER default with
# no pytest reachable (measured live: `/usr/local/bin/python3 -m pytest` ->
# "No module named pytest") — tester-unified (the shared
# [environments.tester-unified] in the repo-root run-gate.toml) DOES carry
# test tooling, in its own dedicated venv at $TESTER_VENV (baked into the
# image), not on the default PATH. r2 additionally can't `pip install -e
# assay` there (its site-packages is root-owned, read-only for the non-root
# user the container runs as) -- PYTHONPATH points straight at assay's own
# src-layout source instead (verified equivalent: pip install -e never gave
# assay a real installed-distribution identity either). See
# scripts/debian-install-v2/run-gate.toml, where this exact pattern was
# worked out and verified live first.
#
# gate stays bare-host: its whole job is launching the three lanes above as
# nested `./run-gate.py <lane>` processes, each starting its own docker
# container -- that needs real docker-socket access tester-unified does not
# have wired up.
# =============================================================================
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/gstammtisch-guide && python3 -m compileall -q files/usr/local/sbin && $TESTER_VENV/bin/python3 -m pytest tests -q --cov=files/usr/local/sbin --cov-branch --cov-report=term-missing",
]
clean_tree = false
budget = "5m"

# Mutation testing via a live worktree assay (never a pinned zipapp for an
# in-repo consumer — assay/docs/INTERNAL-CONSUMERS.md). The judge policy
# (source roots, operators, budget) lives in this project's own assay.toml
# [lanes.r2].
[lanes.r2]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "export PYTHONPATH={worktree}/assay/src && cd {worktree}/scripts/gstammtisch-guide && mkdir -p .assay && exec $TESTER_VENV/bin/python3 -m assay.cli run r2 --resume --progress .assay/r2-progress.jsonl --verdict-json .assay/verdict-r2.json",
]
clean_tree = false
budget = "20m"
artifacts = [".assay/verdict-r2.json", ".assay/r2-progress.jsonl"]

# Proves the gate REJECTS known-bad code — each canary breaks exactly one
# contract a named test claims to assert, and that test must go red.
# tools/canary-run.sh's own `python_bin="${GSTAMMTISCH_PYTHON:-python3}"`
# needs the override; bare python3 has no pytest in this environment.
[lanes.r3]
kind = "command"
environment = "tester-unified"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/gstammtisch-guide && GSTAMMTISCH_PYTHON=$TESTER_VENV/bin/python3 exec tools/canary-run.sh",
]
clean_tree = false
budget = "5m"

# The implementation/release gate: every consumer (release steps, agents,
# humans) runs THIS lane; none duplicates the sub-lane sequence. RG-1: every
# sub-invocation carries --worktree {worktree} explicitly (cmru's [lanes.gate]
# is the reference shape).
[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
    "bash", "-c",
    "cd {worktree}/scripts/gstammtisch-guide && ./run-gate.py --worktree {worktree} r0-r1 && ./run-gate.py --worktree {worktree} r2 && ./run-gate.py --worktree {worktree} r3",
]
clean_tree = false
budget = "1h"
