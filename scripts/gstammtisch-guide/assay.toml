# gstammtisch-guide's assay lane declarations. Consumed by run-gate.toml's
# [lanes.r2] via a live, worktree-installed assay (assay/docs/
# INTERNAL-CONSUMERS.md) — no pinned zipapp for an in-repo consumer.
schema_version = 2

[lanes.r2]
scope = "S1"
rigor = ["R0", "R2"]
enforcement = "gate"
# /opt/tester-venv/bin/python3, not bare "python3": assay spawns this argv
# as its own subprocess, independent of whatever interpreter invoked
# `assay.cli` itself -- bare "python3" resolves via PATH to
# /usr/local/bin/python3 inside tester-unified, which has no pytest.
# Hardcoded, scoped to this file's one documented consumption path
# (run-gate.toml's [lanes.r2], always inside a tester-unified container);
# see scripts/debian-install-v2/assay.toml, where this exact pattern was
# worked out and verified live first.
argv = ["/opt/tester-venv/bin/python3", "-m", "pytest", "tests", "-q"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
budget = "20m"
allow_argv_append = false

# This is a monorepo lane: assay's snapshot walks the whole resolved commit,
# not just this project's own source roots, so a tracked hostile symlink
# anywhere else in vbpub (Topos's fixtures) would otherwise refuse every
# lane in every unrelated project. See assay/docs/CONSUMERS.md's "A
# monorepo lane: omitting declared unsafe symlinks" for the full mechanism
# and the maintenance obligation this list creates.
[lanes.r2.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.r2.judge]
language = "python"
source_roots = ["files/usr/local/sbin"]
base = "origin/main"

[lanes.r2.judge.mutation]
jobs = 2
max_mutants = 400
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
