# gstammtisch — memory/swap tuning for a zswap-fronted, RAM-constrained host.
# Reasoning: see gstammtisch-guide/MEMORY-ARCHITECTURE.md (§4 sysctl).

# LOW swappiness (operator decision 2026-10-21, was 100): this disk is write-capped
# and provider-metered, reads are cheap. Evicting clean file cache costs no writes (a
# refault is a read); evicting anon becomes 4K swap WRITES once the zswap pool is full.
# Not 0: hot mapped files would thrash. The games are governed by memory.min/low, not
# this knob. Reasoning and measurements: MEMORY-ARCHITECTURE.md "vm.swappiness".
vm.swappiness = 10

# Keep dentry/inode caches (<100 = prefer to keep them). Docker does an enormous
# amount of path lookups during container create/teardown and builds.
vm.vfs_cache_pressure = 50

# Wake kswapd earlier so background reclaim starts before pressure is acute —
# smoother under bursty container churn and build storms. Default 10.
vm.watermark_scale_factor = 50

# No watermark boost (kernel default 15000 = up to 1.5 x high). On 2026-10-20 a boost of
# ~860 MB was observed with node_unreclaimable set and all reclaim in the allocating
# threads; a watermark recompute cleared it. Operator decision 2026-10-20.
# Facts and open questions: MEMORY-ARCHITECTURE.md "Watermark boost".
vm.watermark_boost_factor = 0

# No swap readahead. Wasteful on SSD / thin-provisioned backing and on zswap
# fault-back (random access). 0 => 1 page per fault.
vm.page-cluster = 0

# Reserve ~64 MB so root can always SSH in and act, even under OOM.
vm.admin_reserve_kbytes = 65536
