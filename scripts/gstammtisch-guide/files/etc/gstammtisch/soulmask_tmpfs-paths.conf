# soulmask_tmpfs-setup.sh reads this file: one path per line under a section
# header. Section [incompressible] paths are charged to
# soulmask_tmpfs-ZSwapMax0.slice (pak data — zstd-incompressible, bypasses
# zswap); section [compressible] paths are charged to
# soulmask_tmpfs-ZSwapMax1.slice (binaries/libraries/text — zswap-eligible).
#
# Each path is relative to a Soulmask instance's volume root
# (/var/lib/pterodactyl/volumes/<uuid>/<path>). Directories and single files
# are handled identically (cp -a / mount --bind).
#
# After the tmpfs is populated it is remounted read-only at the VFS level
# (mount -o remount,ro). Steam/game updates MUST go through the manual
# update procedure: stop all containers → stop soulmask_tmpfs.service →
# start main server to update on disk → stop main → start
# soulmask_tmpfs.service (re-populates from the ROLE=main instance) → start
# all containers. See soulmask_tmpfs-setup.sh's header and
# SOULMASK-TMPFS.md.
#
# Deliberately NOT listed (stay on disk, per-instance state):
#   WS/Saved/          — world save, account database (per-instance); its
#                         Logs/ subdirectory is a PER-INSTANCE tmpfs, below
#   WS/Config/         — server config (per-instance)
#   Steam/logs/        — steam connection/bootstrap logs (writable during
#                         runtime; keep on disk to avoid EROFS log-spam)
#   Steam/appcache/    — steam HTTP cache (writable during runtime)
#   archive-*.tar.gz   — Wings backup tarballs (per-instance)
#
# NOTE: unlike the legacy static-ramdisk-paths.conf, steamapps/, steamcmd/,
# and WS/Content/Paks/ ARE listed below. The legacy design excluded them,
# which allowed a steam update to partially corrupt state (download to
# staging on disk succeeded, but commit to tmpfs-backed Paks/ failed
# mid-write). Including them here + the read-only remount guarantees that
# updates fail cleanly with EROFS on EVERY steam-touched path.
#
# Blank lines and lines starting with # are ignored inside sections.
# Section headers are [incompressible], [compressible] (both SHARED: copied
# from the ROLE=main instance into one tmpfs and bind-mounted into every
# TMPFS=1 instance), and the two PER-INSTANCE sections below.
#
# PER-INSTANCE sections (SMT-01): [per-instance-compressible] and
# [per-instance-noswap]. Each path listed there gets its OWN, initially EMPTY,
# read-write tmpfs per TMPFS=1 instance, mounted directly on
# <volume>/<path>. Nothing is copied in or back, the shared
# /mnt/soulmask_tmpfs is not involved, and the path must already exist as a
# directory in the volume (uid/gid/mode of the mount are DERIVED from it; a
# missing directory is skipped, never created). Every component of
# <volume>/<path> must be a real directory: a symlink anywhere in it (or a path
# resolving outside the volume) is REFUSED, since the tree is container-writable.
# Paths must be relative, without '..', whitespace, '%', '|' or glob characters,
# and must not repeat, nest, or overlap a shared path above. Use this for paths
# the game WRITES and that two instances must not share. Contents are LOST on
# service restart/reboot (by decision). soulmask_logs-prune.sh (every 10 min via
# soulmask-logs-prune.timer) deletes old WS-backup-*.log files to stay under the
# cap, never the live WS.log. A problem here never blocks the shared tmpfs
# above; setup finishes it and then exits non-zero.
#   - tmpfs pages are charged to the memcg of the task that WRITES them: the
#     game container's own cgroup (wings.slice/docker-<id>.scope), NOT the
#     soulmask_tmpfs-* slices. The ZSwapMax0/1 placement above does not apply.
#   - [per-instance-compressible]: pages are swappable, so zswap-eligible under
#     the game cgroup's own memory.zswap.max.
#   - [per-instance-noswap]: mounted with the tmpfs `noswap` option, pages stay
#     resident and uncompressed; setup FAILS (no swappable fallback) if the
#     kernel rejects the option.
# Size / backups to keep / high-water mark come from the unit's Environment
# (SOULMASK_TMPFS_PER_INSTANCE_{SIZE,KEEP_BACKUPS,HIGH_WATER_PCT}), not from
# this file.

[incompressible]
# UE4 pak + IO store assets — zstd-incompressible (measured 1.006×), so
# pages in this slice bypass zswap entirely (MemoryZSwapMax=0). Hot pak
# regions are protected by the slice's MemoryMin floor.
WS/Content/Paks

[compressible]
# Engine and game binaries — executable code, zswap-eligible.
Engine
WS/Binaries

# Steam runtime + bundled libraries — zswap-eligible.
linux64
Steam/config
Steam/depotcache
Steam/steamapps
Steam/userdata
Steam/libraryfolder.vdf
steamclient.so
libsteamwebrtc.so

# Steam download staging and app manifests — these are written during the
# manual update process (when the ramdisk is OFF, writing to underlying
# disk); during normal read-only operation they hold static manifest data.
steamapps
steamcmd

# Top-level depot metadata files — updated each patch, tiny text files.
Manifest_DebugFiles_Linux.txt
Manifest_NonUFSFiles_Linux.txt

[per-instance-compressible]
# UE log directory. FAsyncWriter_WS fdatasync()s WS.log on the shared root
# ext4 journal and stalls the game thread for seconds under dev IO load; on a
# private tmpfs the log touches no ext4 at all. UE renames WS.log to
# WS-backup-<ts>.log at every start; soulmask_logs-prune.sh prunes those.
WS/Saved/Logs

[per-instance-noswap]
# (none today)
