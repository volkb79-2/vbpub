# soulmask_tmpfs-setup.sh reads this file: one path per line under a section
# header. Section [incompressible] paths are charged to
# soulmask_tmpfs-ZSwapMax0.slice (pak data — zstd-incompressible, bypasses
# zswap); section [compressible] paths are charged to
# soulmask_tmpfs-ZSwapMax1.slice (binaries/libraries/text — zswap-eligible).
#
# Each path is relative to a Soulmask instance's volume root
# (/var/lib/pterodactyl/volumes/<uuid>/<path>). Directories and single files
# are handled identically (cp -a / mount --bind).
#
# After the tmpfs is populated it is remounted read-only at the VFS level
# (mount -o remount,ro). Steam/game updates MUST go through the manual
# update procedure: stop all containers → stop soulmask_tmpfs.service →
# start main server to update on disk → stop main → start
# soulmask_tmpfs.service (re-populates from the ROLE=main instance) → start
# all containers. See soulmask_tmpfs-setup.sh's header and
# SOULMASK-TMPFS.md.
#
# Deliberately NOT listed (stay on disk, per-instance state):
#   WS/Saved/          — world save, account database, logs (per-instance)
#   WS/Config/         — server config (per-instance)
#   Steam/logs/        — steam connection/bootstrap logs (writable during
#                         runtime; keep on disk to avoid EROFS log-spam)
#   Steam/appcache/    — steam HTTP cache (writable during runtime)
#   archive-*.tar.gz   — Wings backup tarballs (per-instance)
#
# NOTE: unlike the legacy static-ramdisk-paths.conf, steamapps/, steamcmd/,
# and WS/Content/Paks/ ARE listed below. The legacy design excluded them,
# which allowed a steam update to partially corrupt state (download to
# staging on disk succeeded, but commit to tmpfs-backed Paks/ failed
# mid-write). Including them here + the read-only remount guarantees that
# updates fail cleanly with EROFS on EVERY steam-touched path.
#
# Blank lines and lines starting with # are ignored inside sections.
# Section headers are [incompressible] and [compressible].

[incompressible]
# UE4 pak + IO store assets — zstd-incompressible (measured 1.006×), so
# pages in this slice bypass zswap entirely (MemoryZSwapMax=0). Hot pak
# regions are protected by the slice's MemoryMin floor.
WS/Content/Paks

[compressible]
# Engine and game binaries — executable code, zswap-eligible.
Engine
WS/Binaries

# Steam runtime + bundled libraries — zswap-eligible.
linux64
Steam/config
Steam/depotcache
Steam/steamapps
Steam/userdata
Steam/libraryfolder.vdf
steamclient.so
libsteamwebrtc.so

# Steam download staging and app manifests — these are written during the
# manual update process (when the ramdisk is OFF, writing to underlying
# disk); during normal read-only operation they hold static manifest data.
steamapps
steamcmd

# Top-level depot metadata files — updated each patch, tiny text files.
Manifest_DebugFiles_Linux.txt
Manifest_NonUFSFiles_Linux.txt
