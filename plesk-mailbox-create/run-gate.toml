# =============================================================================
# plesk-mailbox-create gate lanes — parsed ONLY by run-gate.py (one parser,
# D-110). Single-script project with no test suite: the lane is a syntax
# smoke (py_compile) so `./run-gate.py --list` answers "how do I test this?"
# uniformly. Host lane.
# See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.smoke]
kind = "command"
environment = "host"
argv = ["bash", "-c", "cd {worktree}/plesk-mailbox-create && python3 -m py_compile email_creator.py && echo 'smoke: OK'"]
budget = "1m"
