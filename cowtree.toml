# cowtree.toml: the shared paths of this repository, in the format owned by cowtree (schema, resolver and provisioning:
# libraries/cowtree/SPEC.md "Repo paths"). The entries below are data, one table per declaring consumer; consumers never
# hardcode `downloads/` or `vm-lab/`: they ask the resolver by entry name (`libraries/cowtree/repo-path NAME [--project DIR]`,
# or `cowtree.repo_paths`) and do not know this file.
#
# The CoW area and the mode are owned by the HOST, not by this file: MDT_COW_ROOT and COWTREE_MODE are never set here.
#
# repo (top)  the repository's folder below $MDT_COW_ROOT, the same for the main checkout and every worktree
# repo        the plain location, relative to the repo root (the checkout stays on ext4)
# cow         where the same folder lives as a btrfs subvolume, below $MDT_COW_ROOT/<repo>/ ; omit = never CoW
# compression none | zstd (the two portable values), applied when the subvolume is provisioned ; omit = filesystem default
# {project}   a per-project path: the caller passes the project directory (relative to the repo root)
#
# With MDT_COW_ROOT unset or empty, or when the cow folder does not exist, a name resolves to its plain `repo` location.
# Policy: AGENTS.md "Directory conventions and VM files".
schema = 1
repo = "vbpub"

# owner: vm-lab project
[paths.iso]
repo = "downloads/iso"
cow = "downloads/iso"
compression = "none"

# owner: vm-lab project
[paths.vm-images]
repo = "downloads/vm-images"
cow = "downloads/vm-images"
compression = "zstd"

# owner: vm-lab project
[paths.vm-lab]
repo = "{project}/vm-lab"
cow = "{project}/vm-lab"
compression = "zstd"

# owner: shared fetched inputs
[paths.downloads]
repo = "downloads"
