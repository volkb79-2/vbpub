# nyxloom LIVE routing matrix for this host — tracked copy.
# Deployed to $XDG_STATE_HOME/nyxloom/routes.toml (keep in sync; the
# attempt events snapshot the resolved route + this revision at dispatch).
# Values from controller-workflow-v2 §5 as of 2026-07-13/15; probe before
# trusting a route that hasn't run recently.
#
# 2026-07-23 (B16): tiers renamed to the verb-band taxonomy locked in D-R1
# (docs/routing-model-redesign.md) -- `{implement,review,carve}-{1,2,3}`.
# Tiers now name the TASK, not the model; routes (below) keep their
# model-named ids and are the swappable, policy-driven selection within a
# tier. Each old standalone tier's route is kept PRIMARY (first) in its
# consolidated tier so existing handoffs resolve to the same model as
# before the rename -- this is a data migration, not a re-ranking (cost-
# posture ordering is the separate D-R5).

revision = "2026-07-23"

# 2026-07-23 (operator): added codex-luna-high (gpt-5.6-luna @ high effort via
# codex) as a medium/band-2 implementation route. Folded into `implement-2`
# by the B16 tier-rename (was previously its own [tiers.luna-high] pending
# the migration). Being trialed on B17.

# 2026-07-17: LIFTED the 2026-07-15 temporary sonnet-high override on the
# implementation tiers -- cheap-first (deepseek) restored, codex reintegrated
# as a fallback, and vetted free OpenRouter models available via
# [tiers.implement-1-free] (opt-in; see the free-route block + the
# free-endpoint confidentiality guard).
[tiers.implement-1]      # was haiku-low + flash-high (band 1: mechanical/cheap)
routes = ["claude-haiku", "opencode-deepseek-high", "reasonix-deepseek-high", "codex-terra-med"]

[tiers.implement-2]      # was sonnet5-high + luna-high + flash-max (band 2: medium)
routes = ["claude-sonnet5-high", "codex-luna-high", "opencode-deepseek-max", "reasonix-deepseek-max", "codex-terra-med"]

[tiers.implement-1-free] # was free-high (opt-in; free-endpoint confidentiality guard; NOT a default path)
routes = ["openrouter-free-nemotron-ultra", "openrouter-free-hy3", "openrouter-free-nemotron-nano", "openrouter-free-laguna-xs"]

[tiers.review-3]         # was frontier-review (review + carve authority)
routes = ["claude-opus-high"]

# 2026-07-16 (user): cheap band for mechanical, well-specified handoffs
# (add-a-branch-mirroring-existing, config edits, small lint fixes). The
# BLOCKED escape hatch makes cheap-first safe — haiku re-routes up on
# anything beyond it. Route fitting handoffs here via `tier: implement-1`
# (was `tier: haiku-low` before the B16 rename).
# (Live-deployed 2026-07-16; backfilled into this tracked copy 2026-07-19 --
# it had drifted deployed-only, see the P44/P45 pilot's routes-sync step.)

# Vetted free OpenRouter coding models (2026-07-17, probed live via opencode+
# openrouter). OPT-IN tier -- deliberately NOT in the default implementation
# path: free providers may LOG/TRAIN on prompts, so every free route carries the
# `free-endpoint` prompt_hint, which makes adapters.build_dispatch inject a
# no-secrets guard into the agent prompt.
# VETTED USABLE: nemotron-ultra (1M ctx), nemotron-nano, hy3, laguna-xs.
# EXCLUDED: cohere/north-mini-code:free -> "No allowed providers are available"
# (its free providers are filtered out under this account's data policy).
# GOTCHA for the future `route doctor` (D-R9): opencode returned exit 0 even for
# that failure -- probe by OUTPUT content, never the exit code alone.

[routes.opencode-deepseek-high]
cli = "opencode"
model = "openrouter/deepseek/deepseek-v4-flash"
variant = "high"
argv_max = 1500
prompt_hints = ["incremental-write"]
probe = ["opencode", "--version"]
dispatch_extra = ["--auto"]
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/deepseek/deepseek-v4-flash", "--variant", "high", "--dir", "{worktree}", "{prompt}"]
session_discover = ["opencode", "session", "list", "--dir", "{worktree}", "--format", "json"]
usage_source = "session-json"

[routes.opencode-deepseek-max]
inherit = "opencode-deepseek-high"
variant = "max"

[routes.reasonix-deepseek-high]
cli = "reasonix"
model = "deepseek-flash-high/deepseek-v4-flash"
status = "fallback-only"
probe = ["reasonix", "--version"]
resume = ["reasonix", "run", "-c", "-dir", "{worktree}", "{prompt}"]
usage_source = "run-log-deepseek-usage"

[routes.reasonix-deepseek-max]
inherit = "reasonix-deepseek-high"
model = "deepseek-flash-max/deepseek-v4-flash"

[routes.codex-terra-med]
cli = "codex"
model = "gpt-5.6-terra"
effort = "medium"
sandbox = "danger-full-access"
probe = ["codex", "--version"]
resume = ["codex", "exec", "--sandbox", "danger-full-access", "--cd", "{worktree}", "resume", "--last", "{prompt}"]
usage_source = "exec-output-footer"

[routes.codex-luna-high]
cli = "codex"
model = "gpt-5.6-luna"
effort = "high"
sandbox = "danger-full-access"
probe = ["codex", "--version"]
resume = ["codex", "exec", "--sandbox", "danger-full-access", "--cd", "{worktree}", "resume", "--last", "{prompt}"]
usage_source = "exec-output-footer"

# OpenAI models are always dispatched through Codex, never through OpenRouter.
# This low-effort route is intentionally trial-only; the controller selects it
# explicitly after the cheaper OpenRouter routes have their two-package record.
[routes.codex-luna-low]
inherit = "codex-luna-high"
effort = "low"

[routes.claude-sonnet5-high]
cli = "claude"
model = "sonnet"
effort = "high"
dispatch_extra = ["--dangerously-skip-permissions"]
probe = ["claude", "--version"]
session_capture = "newest-jsonl"
resume = ["claude", "--resume", "{session}", "--model", "sonnet", "--effort", "high", "-p", "{prompt}"]
usage_source = "output-format-json"

[routes.claude-opus-high]
inherit = "claude-sonnet5-high"
model = "opus"
role_default = "review-independent"

# Haiku 4.5 — cheap/fast tier for mechanical implementation. Explicit route
# (not `inherit`) so the resume template carries `--model haiku`, not the
# inherited `--model sonnet` literal. No `--effort` (haiku has no effort tiers).
[routes.claude-haiku]
cli = "claude"
model = "haiku"
dispatch_extra = ["--dangerously-skip-permissions"]
probe = ["claude", "--version"]
session_capture = "newest-jsonl"
resume = ["claude", "--resume", "{session}", "--model", "haiku", "-p", "{prompt}"]
usage_source = "output-format-json"

# --- vetted free OpenRouter routes (see [tiers.implement-1-free] note) ------
# Every free route carries prompt_hints=["free-endpoint"] -> the no-secrets
# guard is injected into the dispatch prompt. status="free" is informational.
# resume hardcodes each route's own model (build_resume does NOT substitute
# {model}), so an inherit-with-model-override alone would resume on the wrong
# model -- hence resume is restated per route.
[routes.openrouter-free-nemotron-ultra]
cli = "opencode"
model = "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
status = "free"
prompt_hints = ["free-endpoint"]
argv_max = 1500
probe = ["opencode", "--version"]
dispatch_extra = ["--auto"]
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free", "--dir", "{worktree}", "{prompt}"]
session_discover = ["opencode", "session", "list", "--dir", "{worktree}", "--format", "json"]
usage_source = "session-json"

[routes.openrouter-free-nemotron-nano]
inherit = "openrouter-free-nemotron-ultra"
model = "openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", "--dir", "{worktree}", "{prompt}"]

[routes.openrouter-free-hy3]
inherit = "openrouter-free-nemotron-ultra"
model = "openrouter/tencent/hy3:free"
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/tencent/hy3:free", "--dir", "{worktree}", "{prompt}"]

[routes.openrouter-free-laguna-xs]
inherit = "openrouter-free-nemotron-ultra"
model = "openrouter/poolside/laguna-xs-2.1:free"
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/poolside/laguna-xs-2.1:free", "--dir", "{worktree}", "{prompt}"]

# Paid OpenRouter trial routes.  Both model IDs were verified against the
# OpenRouter catalog on 2026-07-26.  The controller invokes them explicitly,
# keeps a single session per two-package trial, and uses backoff+resume on 429
# rather than a fresh prompt/session.  Do not substitute an OpenAI model here.
[routes.opencode-qwen37-plus]
cli = "opencode"
model = "openrouter/qwen/qwen3.7-plus"
argv_max = 1500
prompt_hints = ["incremental-write"]
probe = ["opencode", "--version"]
dispatch_extra = ["--auto"]
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/qwen/qwen3.7-plus", "--dir", "{worktree}", "{prompt}"]
session_discover = ["opencode", "session", "list", "--dir", "{worktree}", "--format", "json"]
usage_source = "session-json"

[routes.opencode-mimo-v25]
inherit = "opencode-qwen37-plus"
model = "openrouter/xiaomi/mimo-v2.5"
resume = ["opencode", "run", "-c", "--session", "{session}", "--auto", "--model", "openrouter/xiaomi/mimo-v2.5", "--dir", "{worktree}", "{prompt}"]
