# ─── PRE-RENDERED from ciu.compose.yml.j2 (defaults) — keep in sync ─────────
# Plain-compose FALLBACK only. The PRIMARY, supported deploy path is
# `ciu up --dir nyxloom/mattermost -y` (see README.md): that is the path
# that applies the governance overlay. This file exists for the case ntfy's
# sibling documents — a stale workspace ciu.env — and carries ABSOLUTE
# PHYSICAL host paths, because compose here runs against the HOST docker
# daemon from a devcontainer (DooD) and container-side /workspaces/... paths
# do not exist for that daemon.
#
# nyxloom-P106 / NL-6: this path receives NO ciu governance overlay, so every
# cap below is INLINE and MUST be kept in step BY HAND with
# [mattermost.governance] in ciu.defaults.toml.j2 and the root
# [governance] table in ../ciu.global.defaults.toml.j2. Starting this stack
# from here while believing the ciu governance config applies is exactly the
# ntfy incident (NL-6): weeks of an unconfined container on a shared host.
#
# Before running this path, export the DB password from ciu's own store
# (the ciu path injects it via the S4.19 expose_env hatch; plain compose has
# no such injection):
#
#   export MM_DB_PASSWORD="$(sudo cat /home/vb/volkb79-2/vbpub/nyxloom/.ciu/secrets/mattermost/postgres_password)"
#   docker compose -f docker-compose.yml -p nyxloom-mattermost up -d
#
# Container names differ from the ciu path on purpose (nyxloom-mattermost vs
# nyxloom-prod-mattermost) so the two cannot silently collide — stop the ciu
# stack first.
#
# STORAGE — READ THIS, it CHANGED in nyxloom-P107. The three bind mounts
# below (vol-postgres-data / vol-mattermost-config / vol-mattermost-logs) are
# absolute host paths, so THIS PATH AND THE CIU PATH NOW SHARE THEM. The
# pre-P106 warning that starting here gives you "an EMPTY database in a
# separate volume set" is no longer true for those three, and relying on it
# would be dangerous rather than merely wrong. "Stop the ciu stack first" is
# now a HARD requirement, not tidiness. (Postgres's own postmaster.pid
# refuses a second postmaster on one PGDATA, which is a backstop, not a
# licence to try.)
#
# The remaining three named volumes (mattermost-data / -plugins /
# -client-plugins) DO still diverge by compose project — nyxloom-mattermost_*
# here vs nyxloom-prod-mattermost_* under ciu. All three are empty in practice
# (attachments and the plugin framework are both disabled), so the divergence
# is inert; it is recorded rather than fixed because giving a fallback path
# its own copy of nothing is harmless.
#
# HOSTDIR OWNERSHIP IS NOT AUTOMATIC HERE. Under ciu, S6.5 pre-owns those
# three directories with a root helper container. Plain compose has no such
# step, and the Mattermost image cannot fix it up itself (its default user IS
# uid 2000 — no root phase, no /bin/sh), so a from-scratch run on this path
# fails with `could not create config file: ... permission denied`. Create
# them first:
#
#   P=/home/vb/volkb79-2/vbpub/nyxloom/mattermost
#   docker run --rm -v "$P":/t alpine:3.20 sh -c '
#     mkdir -p /t/vol-postgres-data /t/vol-mattermost-config /t/vol-mattermost-logs
#     chown 70:994   /t/vol-postgres-data     && chmod 0700 /t/vol-postgres-data
#     chown 2000:994 /t/vol-mattermost-config && chmod 0770 /t/vol-mattermost-config
#     chown 2000:994 /t/vol-mattermost-logs   && chmod 0770 /t/vol-mattermost-logs'
#
# (994 is DOCKER_GID on this host; uid 70 is postgres in the ALPINE image —
# not 999, which is the Debian one.)
#
# THIS FILE IS MAIN-CHECKOUT-ONLY. The three bind paths above are hardcoded
# absolutes under `/home/vb/volkb79-2/vbpub/nyxloom/mattermost/`, because a
# pre-rendered fallback has no ciu render context to resolve a stack-relative
# path with. The ciu path resolves its hostdirs RELATIVE to whichever stack
# directory it is invoked from, so running THIS file from a worktree writes
# into the MAIN checkout's `vol-*` directories — the exact inverse of the
# worktree-path trap the P107 report describes for the ciu side, and just as
# easy to miss. Do not run this file from a worktree. If a worktree ever needs
# the fallback path, re-render it from `ciu.compose.yml.j2` for that stack dir
# rather than editing these paths by hand.
#
# There is also NO PROVISIONING on this path: the team/channels/accounts/
# webhooks come from ciu's post_compose hook (hooks/post_compose_provision.py),
# which plain compose never runs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nyxloom-mattermost-db
    hostname: nyxloom-mattermost-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # ── governance, inlined (see header) ──
    cgroup_parent: dev-background.slice
    mem_limit: 512m
    memswap_limit: 4g
    mem_reservation: 256m
    blkio_config:
      device_read_iops:
        - path: /dev/vda
          rate: 200
      device_write_iops:
        - path: /dev/vda
          rate: 400
    cpus: 0.5
    environment:
      TZ: "UTC"
      POSTGRES_DB: "mattermost"
      POSTGRES_USER: "mmuser"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    secrets:
      - postgres_password
    volumes:
      # nyxloom-P107: bind mount, SHARED with the ciu path (see header).
      - /home/vb/volkb79-2/vbpub/nyxloom/mattermost/vol-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mattermost:
    image: mattermost/mattermost-team-edition:11.10.1
    container_name: nyxloom-mattermost
    hostname: nyxloom-mattermost
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ── governance, inlined (see header) ──
    cgroup_parent: dev-background.slice
    mem_limit: 2g
    memswap_limit: 18g
    mem_reservation: 256m
    blkio_config:
      device_read_iops:
        - path: /dev/vda
          rate: 200
      device_write_iops:
        - path: /dev/vda
          rate: 400
    cpus: 1.5
    environment:
      TZ: "UTC"
      MM_SQLSETTINGS_DRIVERNAME: "postgres"
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:${MM_DB_PASSWORD}@nyxloom-mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_SERVICESETTINGS_SITEURL: "http://nyxloom-mattermost:8065"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: "/var/tmp/mattermost_local.socket"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      # nyxloom-P110: "false", not "true" — with ENABLEOPENSERVER=false alone,
      # `POST /api/v4/users?iid=<team invite_id>` still created an account
      # anonymously (measured, 201). See ciu.compose.yml.j2 for the full note.
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "false"
      MM_TEAMSETTINGS_ENABLEUSERDEACTIVATION: "false"
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "true"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_EMAILSETTINGS_ENABLEEMAILBATCHING: "false"
      MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
      MM_SERVICESETTINGS_ENABLEOUTGOINGWEBHOOKS: "false"
      MM_SERVICESETTINGS_ENABLECOMMANDS: "false"
      MM_SERVICESETTINGS_ENABLEPOSTUSERNAMEOVERRIDE: "true"
      MM_SERVICESETTINGS_ENABLEPOSTICONOVERRIDE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "false"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"
      MM_SERVICESETTINGS_ENABLETESTING: "false"
      # ── nyxloom-P110 hardening. Reasons per key in ciu.compose.yml.j2;
      #    this pre-rendered fallback carries the SAME values by hand, the
      #    same way it carries governance caps by hand — and drifting apart
      #    is the same trap NL-6 was.
      #    Rendered for expose_public = false (no proxy in front), which is
      #    why VARYBYREMOTEADDR is "true" and VARYBYHEADER is absent.
      MM_SERVICESETTINGS_ENABLEOAUTHSERVICEPROVIDER: "false"
      MM_SERVICESETTINGS_ENABLEAPITEAMDELETION: "false"
      MM_SERVICESETTINGS_ENABLEAPIUSERDELETION: "false"
      MM_SERVICESETTINGS_ENABLEAPICHANNELDELETION: "false"
      MM_SERVICESETTINGS_MAXIMUMLOGINATTEMPTS: "10"
      MM_SERVICESETTINGS_SESSIONLENGTHWEBINHOURS: "168"
      MM_SERVICESETTINGS_EXTENDSESSIONLENGTHWITHACTIVITY: "true"
      MM_SERVICESETTINGS_ENABLEMULTIFACTORAUTHENTICATION: "true"
      MM_SERVICESETTINGS_ENFORCEMULTIFACTORAUTHENTICATION: "false"
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
      MM_PRIVACYSETTINGS_SHOWEMAILADDRESS: "false"
      MM_PRIVACYSETTINGS_SHOWFULLNAME: "false"
      MM_RATELIMITSETTINGS_ENABLE: "true"
      MM_RATELIMITSETTINGS_PERSEC: "10"
      MM_RATELIMITSETTINGS_MAXBURST: "100"
      MM_RATELIMITSETTINGS_MEMORYSTORESIZE: "10000"
      MM_RATELIMITSETTINGS_VARYBYREMOTEADDR: "true"
      MM_FILESETTINGS_ENABLEFILEATTACHMENTS: "true"  # nyxloom-P111 — see ciu.defaults.toml.j2
      MM_PLUGINSETTINGS_ENABLE: "false"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "false"
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: "INFO"
    volumes:
      # nyxloom-P107: config + logs are bind mounts, SHARED with the ciu
      # path (see header); data stays a project-scoped named volume.
      - /home/vb/volkb79-2/vbpub/nyxloom/mattermost/vol-mattermost-config:/mattermost/config
      - /home/vb/volkb79-2/vbpub/nyxloom/mattermost/vol-mattermost-logs:/mattermost/logs
      - mattermost-data:/mattermost/data
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
    expose:
      - "8065"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "system", "status", "--local"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  # nyxloom-P107: postgres-data / mattermost-config / mattermost-logs are
  # bind mounts now (header). These three carry nothing an operator reads.
  mattermost-data:
  mattermost-plugins:
  mattermost-client-plugins:

secrets:
  # ABSOLUTE PHYSICAL host path (DooD). ciu's GEN_LOCAL project store, as
  # materialized from the MAIN checkout's ciu root.
  postgres_password:
    file: /home/vb/volkb79-2/vbpub/nyxloom/.ciu/secrets/mattermost/postgres_password
