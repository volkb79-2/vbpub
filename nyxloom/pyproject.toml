[project]
name = "nyxloom"
dynamic = ["version"]
description = "Files-first, daemon-supervised control plane for role-separated AI-assisted development"
requires-python = ">=3.11"
dependencies = [
  # cli-extended is a REAL wheel dependency (unified-adoption CX-D1), never
  # vendored: this wheel used to carry cli_extended/* itself through
  # package-dir + packages.find (NYX-CLIX removed that), which put two owners
  # on the same `cli_extended/*` files in one environment (nyxloom 0.10.0 and
  # a separately installed cli-extended 0.3.0 both wrote them). Floor 0.3.0:
  # the latest release, and the one nyxloom's suite is verified against.
  # nyxloom imports only package-root names (ArgumentSpec, CliFailure,
  # CliIdentity, CliRegistry, OptionSpec, PromptCancelled, VerbGroup,
  # VerbSpec); all eight also exist in 0.2.0 (checked against the
  # cli-extended-v0.2.0 tag), but 0.2.0 was never tested here, so the floor
  # is not lowered to it. Same floor as cmru. Published to GitHub Releases only;
  # the bare name is unclaimed on PyPI, so install the cli-extended wheel
  # first / alongside with `--no-index` or `--find-links` (CX-D2); see
  # README "Install".
  "cli-extended>=0.3.0",
  "PyYAML>=6",
  "jsonschema>=4",
  "structlog>=24,<27",  # structlog: D-L1, runtime dep (nyxloom/docs/plan-logging.md)
  # `extract --render-markdown` (session_extract/render_markdown.py). Floor =
  # the latest release as of 2026-09-12 (15.0.0, published 2026-04-12 — five
  # months past, so well clear of the estate's ">= 14 days after its own
  # release" freshness rule). Only Console(record=)/Markdown are used, stable
  # across 14.x and 15.x; the floor is the latest rather than the oldest
  # workable version per the same rule.
  "rich>=15.0.0",
  # `extract --highlight` / `--follow --highlight`
  # (session_extract/highlight.py). Floor = the latest release as of
  # 2026-09-12 (2.21.0, published 2026-08-17 — 26 days, past the 14-day
  # rule). Deliberately a SECOND rendering dependency, not a duplicate of
  # rich: pygments colors markdown SOURCE (every control character left in
  # place, so what you copy out is still markdown) where rich renders it
  # (characters consumed) — see render_markdown.py's docstring.
  "pygments>=2.21.0",
]

[project.optional-dependencies]
# tester-unified SoT: nyxloom's test closure lives HERE (not duplicated in
# a hand-maintained requirements file). The vbpub test container installs this
# extra, so a dep change here flows to the gate on the next image rebuild.
test = ["pytest>=8", "hypothesis>=6", "coverage[toml]>=7", "pytest-xdist>=3", "pytest-cov>=5"]  # coverage: D-064-L2 diff-coverage gate; pytest-xdist+pytest-cov: factory-hardening G (parallel gate with xdist-safe coverage — see nyxloom-trove/nyxloom.toml [gates.tester-unified])
interactive = ["questionary==2.1.1"]

[project.scripts]
nyxloom = "nyxloom.cli:main"
nyxloom-harness = "nyxloom.cli_harness:main"
nyxloomctl = "nyxloom.cli_ctl:main"
nyxloomd = "nyxloom.daemon_entrypoint:main"

# Build toolchain pinned exactly (matches ciu/cmru) so wheel builds are
# reproducible — same toolchain + SOURCE_DATE_EPOCH → identical sha256.
[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

# cli_extended is NOT mapped or searched here: it comes from its own wheel
# (dependency above, CX-D1). A `cli_extended*` include or a package-dir entry
# for it re-vendors the library and is a release-blocking regression.
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nyxloom*"]

# Version is derived from git tags by setuptools-scm (no clock, no manual bump),
# matching the estate's other wheel projects (ciu, cmru). Release = annotated tag
# `nyxloom-vX.Y.Z`; untagged commit = `X.Y.(Z+1).devN+g<sha>`. cmru's
# `strategy = "scm"` + `bump = "conventional"` computes and applies these tags
# (cmru.toml [project.nyxloom]). `root = ".."` because the git root is one level
# up (the vbpub monorepo), same as ciu.
[tool.setuptools_scm]
root = ".."
tag_regex = "^nyxloom-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "nyxloom-v*"]
fallback_version = "0.1.0"

[tool.setuptools.package-data]
nyxloom = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
