# =============================================================================
# nyxloom project config — nyxloom itself (self-hosted / dogfooding).
# Also the BEST-PRACTICE TEMPLATE. Lives in the VISIBLE managed folder
# `nyxloom-trove/` (see STANDARD.md — the spec). Copy the folder into a new
# project with `exec-nyxloom init <project_folder>` and adjust marked values.
# =============================================================================

[project]
id = "nyxloom"
default_branch = "main"

# --- the managed folder (visible, tracked, tool-named) -----------------------
# EVERYTHING nyxloom durably manages lives under here, so it is unmistakably a
# managed resources folder (not `nyxloom/` the project home, not a hidden dir).
trove = "nyxloom-trove"

# Durable docs (paths relative to the project root). Each is either UNDER the
# trove (managed, explicit) or declared in [refs] below (read-only, external).
handoff_globs   = ["nyxloom-trove/handoffs/*.md"]   # work packages (frontmatter, lint-gated)
reports_dir     = "nyxloom-trove/reports"            # P<NN>-LOG.md / P<NN>-REPORT.md
decisions_inbox = "nyxloom-trove/decisions.md"       # product calls (D-<NNN>)

# --- direction spine (docs/spine-documents-spec.md, PACKAGE F1): schema-
#     validated frontmatter, non-AI-checked by `nyxloom lint`'s S1-S4 rules.
#     roadmap/backlog REPOINTED here from the old unprefixed roadmap.md/
#     backlog.md (still the default for projects that haven't adopted the
#     spine -- see config.ProjectConfig).
north_star         = "nyxloom-trove/1-north-star.md"         # the invariant vision/WHY
product_definition = "nyxloom-trove/2-product-definition.md" # versioned features+acceptance
roadmap            = "nyxloom-trove/3-roadmap.md"             # self-dev milestones
backlog            = "nyxloom-trove/4-backlog-inbox.md"        # un-carved idea INBOX (managed entries live in backlog/, docs/backlog-entries-spec.md)
archive_dir     = "nyxloom-trove/archive"             # merged handoffs+reports land here
archive_keep_visible = 10                             # dashboard shows last N completed; rest behind an Archive button
agent_logs      = "nyxloom-trove/agent-logs"          # per-attempt transcripts (spec/receipt/attempt.log); gitignored by default, committable for traceability

worktree_root = "../.worktrees"                       # vbpub is the git repo; nyxloom is a subdir

# Managed per-entry backlog (docs/backlog-entries-spec.md): filed issues/
# features as one file per entry; INDEX.md is generated, lint-enforced.
# NOTE: this must stay BELOW every bare top-level key — a TOML table swallows
# all subsequent bare keys (the 2026-08-22 merge silently reordered it above
# agent_logs/worktree_root and the dogfood gate red'd with CFG1).
[backlog_entries]
id_prefix = "NL"                                       # issue sequence (entries live in nyxloom-trove/backlog/)

# The daemon's SOURCE OF TRUTH (event log, statefiles, registry, routes, leases,
# pidfile) does NOT live in a project doc — it lives in the persistent
# `nyxloom-state` docker volume mounted into the nyxloomd container (see
# STANDARD.md "trove vs state volume" + backlog B7). Only agent-log TRANSCRIPTS
# come back into the trove (above), for locality + optional traceability.

# --- [refs]: docs nyxloom READS but does not manage (live in the project tree).
# Declaring them makes the full document surface nyxloom depends on explicit.
# CR-01 (DR-04, 2026-08-03): `roadmap_tool` (docs/ROADMAP.md) and `evolution`
# (docs/EVOLUTION.md) were REMOVED here after both docs were archived to
# docs/archive/product-docs/ -- roadmap_tool's concern (self-dev milestones)
# is already covered by the `roadmap` spine key below (nyxloom-trove/
# 3-roadmap.md), and evolution had no current successor (historical, a
# completed one-time migration). `nyxloom lint` (CFG4) now rejects any [refs]
# entry that resolves into docs/archive/, so re-adding either key verbatim
# would fail lint rather than silently reintroducing the ambiguity.
[refs]
spec         = "docs/SPEC.md"
architecture = "docs/ARCHITECTURE.md"

# --- the gate: NEVER the devcontainer (cockpit doctrine). tester-unified
#     container, same python (3.14) the nyxloomd runtime uses. {worktree} = the
#     attempt checkout; the nyxloom package is at {worktree}/nyxloom.
[gates.tester-unified]
# 2026-08-22 (run-gate P01): gate MECHANICS moved into ./run-gate.py — the
# docker/mounts/cgroup/detached-run incantation that lived in this argv is now
# TESTED CODE (run-gate-project/, see its SPEC.md; adoption contract in its
# CONSUMERS.md). This entry is scheduling policy only.
# Cgroup (controller A3): the slice resolves at run time from
# $CGROUP_PARENT_DEV_BACKGROUND via run-gate.py — the hardcoded
# `nyxloom-gates.slice` literal was intended for a future PROD instance
# outside this repo, not for dev gates here. Its measured IO/CPU policy
# (infra/slices/) travels with that prod deployment.
# SSOT pointer (D-110/D-111): all test definitions live in
# nyxloom/run-gate.toml; this entry owns only scheduling policy.
# run-gate resolves the slice from $CGROUP_PARENT_DEV_BACKGROUND,
# dual-mounts the repo, and runs the pinned assay lane
# (assay.toml [lanes.tester-unified]) in tester-unified. NL-1 landed
# 2026-09-02 (nyxloom-P48): judgment moved off `nyxloom.coverage_gate`.
argv = ["bash", "-c", "cd {worktree}/nyxloom && ./run-gate.py --worktree {worktree} tester-unified"]
phase = "implementation"
asserts = ["tests-pass", "changed-line-coverage", "canary-verified", "assay-verdict"]
timeout_seconds = 1800
environment = "tester-unified"

[policy]
max_active_tasks = 5
# 2026-07-19: operator asked for 10; capped at 5 instead -- host has 8 CPUs
# and was observed at only ~3GB available / 20GB swap in use with ZERO
# nyxloom attempts active yet. Each attempt's gate phase spins up its own
# `docker run tester-unified pytest` (CPU/memory-heavy, ~4min observed);
# N concurrent gates competing for 8 CPUs on an already-tight host risks
# thrashing. Revisit upward once concurrent-gate behavior is observed live.
ready_queue_target = 5
# 2026-07-16: RESTORED to 5 after the tini+bridge+ntfy-url rebuild completed and
# was verified (PID1=tini, bridge dashboard, NTFY_URL single-source). The
# convergence freeze (carve=0, to drain to a quiet window) is over; autonomous
# carving resumes. dstdns/topos remain project-paused for the nyxloom-only focus.
# 2026-07-19: raised 5->10 (operator request, paired with P47's carve-dispatch
# mutex landing first -- carving further ahead of actual dispatch increases
# concurrent-carve exposure, so the lock needed to land before this). See B12
# for the still-open companion concern this does NOT fix: input_revision is a
# schema field the carver stamps but nothing ever re-validates against current
# main before an implementer attempt starts, so carving 10-deep genuinely
# raises stale-premise risk with no safety net yet.
carve_ahead_target = 0
# 2026-07-19: TEMPORARY convergence freeze (operator directive) -- drain all
# currently-carved/queued/active/awaiting-review/merge-ready work to a
# terminal state, with no NEW headroom-refill carve dispatch (reconcile.py
# item 9) starting in the meantime, so a deep review can converge on a
# stable point. Does NOT stop item 12's READY_TO_CARVE re-carve handler
# (not gated by carve_ahead_target) -- a task already in the backlog that
# needs re-carving after an exhausted-budget rejection still gets one,
# since that is finishing existing work, not starting new work. Restore to
# 10 after the deep review.
test_health_interval_days = 0
# D-065 2026-07-20 (B63): cadence in days for the project-WIDE test-health
# carve (reconcile.py module contract item 15) -- a seldom-run pass where the
# strategic carver evaluates the SUITE's standing debt and carves test-
# improvement packages. It complements the D-064-L2 diff-coverage gate: that
# gate enforces coverage on lines a change TOUCHES and so is structurally
# blind to code that was already there and already untested.
# The committed value is 14 (nyxloom dogfoods its own features). HELD AT 0
# HERE, alongside the carve_ahead_target=0 freeze above and for the same
# reason: item 15 is gated by its own cadence, NOT by carve_ahead_target, so
# leaving it at 14 would fire a brand-new carve the moment the project
# unpauses -- precisely the "no NEW work starting" the freeze exists to
# prevent. Restore to 14 together with carve_ahead_target after the deep
# review. (Its first fire is immediate whenever enabled: a null age means
# "never run", which item 15 reads as "do a first pass".)
gap_audit_after_changed_lines = 0
# F007 2026-07-27 (gap-engine, module contract item 17): activity-counted
# threshold (in changed lines) for the periodic gap-audit carve trigger that
# evaluates whether shipped features are actually backed by code. UNLIKE
# test_health_interval_days above (time-based cadence), this fires when
# accumulated changed production lines exceed the threshold since the last
# gap-audit carve -- an idle project with zero code changes must not accrue
# carve budget on an unchanged codebase.
# The intended dogfood value is 2000 (audit every ~2K lines of change).
# HELD AT 0 HERE, alongside carve_ahead_target=0 and test_health_interval_days=0,
# for the same reason: item 17 is gated by its own cadence, NOT by
# carve_ahead_target, so leaving it at 2000 would fire a brand-new carve the
# moment the project unpauses. Restore to 2000 together with the others after
# the deep review.
gap_audit_source_paths = ["nyxloom/src"]
# Scope the gap-audit activity count to production source, excluding tests/docs.
mutation_gate = true
# 2026-07-27 (operator directive): ENABLED. Built by F017, parallelized by the
# mutation fan-out package, and never once switched on for the project that
# built it -- so the whole layer was dead weight. Affordable because it is
# CHANGED-LINES-ONLY: _resolve_added_lines delegates to
# coverage_gate._git_added_lines against the merge base, so cost scales with
# diff size, not repo size. No codebase "healing" pass is needed before turning
# it on; pre-existing untested code is simply never mutated.
#
# What it buys that coverage cannot: coverage proves a changed line EXECUTED,
# never that its behaviour was ASSERTED. The `falsy-swap` operator added the
# same day targets the exact bug class three separate defects took this session
# -- an error path returning a value indistinguishable from a legitimate benign
# result (None meaning both "never ran" and "git failed"; [] meaning both
# "found nothing" and "could not look"). Those lines were at 100% coverage.
# A surviving mutant is the only mechanical signal that catches them.
max_attempts_per_task = 3
merge_mode = "guarded-automatic"  # 2026-07-19: P48 shipped -- real git merge --no-ff
                                   # via a scratch worktree, escalates NEEDS_OPERATOR
                                   # on a genuine conflict, never fires while paused
retention_days = 60
reconcile_interval_seconds = 30
http_port = 8942

# --- notifications: the hostname (nyxloom.<fqdn>) scopes everything to nyxloom,
#     so channels are simple + shared across projects, tagged by project in the
#     message body (NOT per-project topics). `feedback` is bidirectional and
#     unifies the old cmd topic + the decision-chat escalation loop.
#     ntfy_url is NOT set here (P39): the ntfy server is deployment-
#     authoritative for its own URL via the NTFY_URL env var (set alongside
#     NTFY_TOKEN in the nyxloomd deployment env).
[notify]
notifications_topic = "notifications"   # any progress update (write-only token)
feedback_topic = "feedback"             # decisions + escalation Q&A, bidirectional (rw token)

# --- SELF-HOSTING CAVEAT: worktree isolation + manual merge keep the RUNNING
#     nyxloomd safe from an in-flight change, but a merge to daemon-core code
#     needs a container rebuild (`ciu up --dir nyxloom/nyxloomd`) to take effect.
