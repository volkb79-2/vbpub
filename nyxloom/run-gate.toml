# =============================================================================
# nyxloom project gate lanes -- parsed ONLY by run-gate.py (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.toml (nearest
# ancestor); judgment policy lives in assay.toml [lanes.tester-unified] (R0+R1:
# the existing pytest-cov suite, D-064-L2 changed-line floor). NL-1 landed
# here (nyxloom-P48): judgment moved from `nyxloom.coverage_gate`
# self-judgment to Assay's own R1 changed-line judge -- ciu/run-gate.toml is
# the proven precedent this mirrors. See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.tester-unified]
kind = "assay"
assay_lane = "tester-unified"        # -> assay.toml [lanes.tester-unified]
environment = "tester-unified"       # central [environments.tester-unified]
assay_command = ["/opt/tester-venv/bin/python", "tools/assay/assay-6.1.0.pyz"]
# -n auto is the measured optimum on this 8-core host (~2m28s vs 4m56s
# serial); pytest-cov (NOT `coverage run`) is load-bearing under xdist for
# the same reason it always was -- coverage run traces only the parent,
# measuring ~nothing of xdist workers. Both facts now live in assay.toml's
# argv (the judged command), not here.
budget = "30m"                       # advisory; consumers may enforce

# Re-pinned 6.0.0 -> 6.1.0 on 2026-09-09 via `cmru tool-deps --refresh assay`
# (assay B074/B077/B078: additive, no schema change -- byte-identical for
# this project's native R0/R1 lane, which declares neither result_report
# nor allow_test_path_targets). KI-27: --refresh does not itself rewrite
# this file's own pin/argv -- manual follow-up here, same recurring gap.
[lanes.tester-unified.pins.assay]
version = "6.1.0"
sha256 = "tools/assay/assay-6.1.0.pyz.sha256"

# session-extract: a NARROW, package-scoped lane for src/nyxloom/session_extract
# (+ its cli.py wiring), added 2026-09-10 to carry R1 branch coverage and R2
# mutation for that package without touching tester-unified's existing R0+R1
# contract or its origin/main base. judge.base is pinned to the last commit
# before this package's session-extract work started (edc55648) rather than
# origin/main -- local main was 61 commits ahead of origin/main at the time
# this lane was authored, spanning many unrelated subprojects; origin/main
# would have judged that whole accumulated diff, not this package's own.
[lanes.session-extract]
kind = "assay"
assay_lane = "session-extract"       # -> assay.toml [lanes.session-extract]
environment = "tester-unified"       # central [environments.tester-unified]
assay_command = ["/opt/tester-venv/bin/python", "tools/assay/assay-6.1.0.pyz"]
budget = "30m"

[lanes.session-extract.pins.assay]
version = "6.1.0"
sha256 = "tools/assay/assay-6.1.0.pyz.sha256"
