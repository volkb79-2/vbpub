# =============================================================================
# nyxloom project gate lanes -- parsed ONLY by run-gate.py (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.root.toml (nearest
# ancestor); judgment policy lives in assay.toml [lanes.tester-unified] (R0+R1:
# the existing pytest-cov suite with a whole-source line and branch floor).
# NL-1 landed
# here (nyxloom-P48): judgment moved from `nyxloom.coverage_gate`
# self-judgment to Assay's own R1 whole-source judge -- ciu/run-gate.toml is
# the proven precedent this mirrors. See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.tester-unified]
kind = "assay"
assay_lane = "tester-unified"        # -> assay.toml [lanes.tester-unified]
environment = "tester-unified"       # central [environments.tester-unified]
# -n auto is the measured optimum on this 8-core host (~2m28s vs 4m56s
# serial); pytest-cov (NOT `coverage run`) is load-bearing under xdist for
# the same reason it always was -- coverage run traces only the parent,
# measuring ~nothing of xdist workers. Both facts now live in assay.toml's
# argv (the judged command), not here.
budget = "30m"                       # advisory; consumers may enforce

# Internal vbpub lanes omit assay_command and pins deliberately. run-gate
# installs assay from the selected worktree in the lane environment; the
# verdict records the exact runtime assay version and source commit.

# session-extract: a NARROW, package-scoped lane for src/nyxloom/session_extract
# (+ its cli.py wiring and exact selector regression nodes), added 2026-09-10
# to carry R1 branch coverage and R2 mutation for that package without
# touching tester-unified's existing R0+R1 contract. The full branch fork point
# at this HEAD is main's merge-base 364945ddaaa528e4ca105bbe3af371d4d0360b04,
# already owned by tester-unified's base = "main". This lane's judge.base stays
# at the reviewed 3d27c67e boundary so its changed-line scope does not pull in
# the earlier CLI-wide project-id/help wave; the old edc55648 pin had that
# same overreach.
[lanes.session-extract]
kind = "assay"
assay_lane = "session-extract"       # -> assay.toml [lanes.session-extract]
environment = "tester-unified"       # central [environments.tester-unified]
# session-extract's serial R2 campaign currently has 413 candidates; this is
# the outer/advisory mirror of assay.toml's complete-campaign budget.
budget = "8h"
