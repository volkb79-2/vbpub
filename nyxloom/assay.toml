# nyxloom's own implementation gate claim (NL-1 -- Assay-backed judgment,
# replacing the retired `nyxloom.coverage_gate` self-judgment).
#
# The lane command is nyxloom's existing pytest invocation (pytest-cov, NOT
# `coverage run` -- coverage run traces only the parent, measuring ~nothing
# of xdist workers, which would false-FAIL under `-n auto`). R1 makes Assay
# JUDGE that coverage: the whole-source line and branch floor (the role the
# retired `nyxloom.coverage_gate` used to play) and a verifiable verdict
# artifact. tester-unified supplies the environment; run-gate installs the
# selected worktree's assay source as the Assay CLI boundary, and the verdict
# records the runtime version/source. `python -m nyxloom.coverage_gate` no
# longer runs from the gate.
#
# nyxloom-P98 (2026-09-02): coverage_gate.py, mutation_gate.py's gate-judgment
# half, and gate_canary.py are deleted outright, not merely unused from this
# lane -- neither module was ever imported as a library by any project,
# including nyxloom itself, and nyxloom's own [gates.tester-unified] has run
# entirely through this Assay-backed lane since NL-1. mutation_gate.py's pure
# mutant-generation engine (Mutant/generate_mutants) survives as
# src/nyxloom/mutants.py, imported only by tools/remote_mutation_audit.py --
# not something this lane exercises or any other project consumes as a
# toolkit.
#
# The main CLI lane measures and enforces whole-source line and branch
# coverage. The narrower session-extract lane already had this contract; the
# estate baseline now requires the broad CLI surface to carry it as well.
#
# snapshot_selection = "repository-minus-unsafe-symlinks": this assay.toml
# lives in the same vbpub monorepo as ciu/assay.toml, whose repository-wide
# snapshot includes topos's three absolute-symlink security fixtures --
# declared verbatim below, byte-identical to ciu/assay.toml's declaration
# (same repo, same fixtures, same reason).
schema_version = 2

[lanes.tester-unified]
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = ["/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-n", "auto", "-q", "--cov=src/nyxloom", "--cov-branch", "--cov-report=json:coverage.json"]
env = { PYTHONPATH = "src:../libraries/cli-extended/src", PYTHONDONTWRITEBYTECODE = "1" }
# PATH: xdist worker spawn (subprocess). HOME: config/cache dirs some tests
# touch. TERM/LANG: parity with ciu's lane. No CGROUP_PARENT_DEV_BACKGROUND
# passthrough -- nyxloom's suite (unlike ciu's cgroup-governance tests) never
# reads it.
env_passthrough = ["HOME", "PATH", "TERM", "LANG"]
budget = "30m"
allow_argv_append = false

[lanes.tester-unified.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

# base = "main" (2026-09-11, corrected from "origin/main"): assay's own
# resolve_base (assay/src/assay/git.py) always computes merge-base(base,
# HEAD) -- "the fork point, ... rather than base's current tip" -- so this
# was never "diff against origin/main's tip," it was "diff against wherever
# HEAD forked from an ancestor of origin/main." That's only correct while
# origin/main tracks local main closely. Under the standing "not pushed,
# flagged separately" policy, origin/main silently drifted 85 commits
# behind local main, so merge-base(origin/main, HEAD) resolved 85 commits
# back and this lane judged that whole accumulated, already-verified diff
# -- not the current worktree's own change. Identical failure already hit
# session-extract's own authoring moment (61 commits of drift then); that
# lane's fix was a one-time SHA pin (base = "edc55648", see run-gate.toml),
# which itself goes stale and needs manual re-pinning (the same recurring
# gap KI-27 already flags for this file's assay zipapp version). "main" is
# strictly better: a worktree/feature branch (created via `ciu worktree add
# --base main`) always forks from local main, so merge-base("main", HEAD)
# is exactly that fork point, self-updating, no re-pin ever needed, and
# behaves identically to "origin/main" whenever the two happen to be in
# sync. Known consequence: running this lane directly against the PRIMARY
# checkout (HEAD == local main) now yields an empty base..HEAD diff, since
# every real gate invocation in this estate already goes through
# `--worktree <path>` (never the primary checkout bare) -- see
# AGENTS.md's worktree protocol -- this is not believed to be a live use
# case, but is called out here in case that assumption ever changes.
[lanes.tester-unified.judge]
language = "python"
source_roots = ["src"]
fail_under = 100.0
allow_excluded = false
require_branch = true
base = "main"

[lanes.tester-unified.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

# session-extract: narrow package lane (2026-09-10), added alongside
# tester-unified rather than modifying it. Its judged source scope is only
# src/nyxloom/session_extract. The selected CLI tests below exercise the
# installed harness routes; parser/registry source coverage belongs to the
# broader tester-unified lane, whose R1 suite covers the complete CLI surface.
#
# require_branch = true: unlike tester-unified, this lane's argv passes
# --cov-branch and this judge.mode is the ONLY thing gating the new
# session_extract code, so there is no reason to leave branch coverage
# unmeasured here the way tester-unified's D-064-L2 migration had to.
#
# base = "126ccc39e151e33cc7bbcaa18bf765f9c9cd7dd1": the selected
# current-main boundary for this integration. source_roots still limits the
# judged diff and mutation targets to the session-extract implementation
# package; the broader tester-unified lane covers the CLI registry changes.
#
# R0/R1/R2/R3 are all declared. A prior run exposed that the source root and
# candidate cap had drifted from this lane's intended package scope; see the
# P112 follow-up log for the failed invocation and corrected contract.

[lanes.session-extract]
scope = "S1"
rigor = ["R0", "R1", "R2", "R3"]
enforcement = "gate"
argv = ["/opt/tester-venv/bin/python", "-m", "pytest",
  "tests/test_session_extract_adapters_registry.py",
  "tests/test_session_extract_reasonix.py",
  "tests/test_session_extract_classifier.py",
  "tests/test_session_extract_claude_code.py",
  "tests/test_session_extract_cli_acceptance.py",
  "tests/test_session_extract_codex.py",
  "tests/test_session_extract_config_validation.py",
  "tests/test_session_extract_debug_diff.py",
  "tests/test_session_extract_edge_contracts.py",
  "tests/test_session_extract_init.py",
  "tests/test_session_extract_ledger.py",
  "tests/test_session_extract_mangle.py",
  "tests/test_session_extract_lossless_codex.py",
  "tests/test_session_extract_lossless_opencode.py",
  "tests/test_session_extract_lossless.py",
  "tests/test_session_extract_opencode.py",
  "tests/test_session_extract_render.py",
  "tests/test_session_extract_select.py",
  "tests/test_session_extract_stats_codex.py",
  "tests/test_session_extract_stats_opencode.py",
  "tests/test_session_extract_stats.py",
  "tests/test_cli_extract.py",
  "tests/test_session_extract_follow.py",
  "tests/test_session_extract_locate.py",
  "tests/test_session_extract_successor.py",
  "tests/test_session_extract_compress.py",
  "tests/test_session_extract_r2_survivors.py",
  "tests/test_session_extract_harness.py",
  "tests/test_session_extract_presets.py",
  "tests/test_session_extract_gap_closure.py",
  "tests/test_session_extract_real_corpus.py",
  "tests/test_cli_extract_groups.py",
  "tests/test_cli_help.py",
  "tests/test_cli.py::test_tick",
  "tests/test_cli.py::test_tick_project_id_passes_the_selector_to_daemon",
  "-n", "4", "--maxfail=1", "-q", "--cov=src/nyxloom", "--cov-branch", "--cov-report=json:coverage-session-extract.json"]
env = { PYTHONPATH = "src:../libraries/cli-extended/src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["HOME", "PATH", "TERM", "LANG"]
# The current-main diff had 43 eligible candidates (cap 45); the SUCCESSOR
# package (2026-10) adds toolresult/stopstate/successor and brought the plan to
# 144 (`assay plan`, measured with a temporary cap of 3000: 54 claude_code.py,
# 34 stopstate.py, 32 toolresult.py, 10 successor.py, 8 ledger.py, 5 render.py,
# 1 config.py; a plan over the cap reports cap+1, so earlier 46/53/61/67 readings
# were only "more than the cap"), so the cap is raised to 150 (see
# [lanes.session-extract.judge.mutation]). The plan estimates 8640 s wall with two
# mutation jobs at the 120s per-candidate failsafe (a worst-case bound); allow 3h
# for baseline, scheduling, and verdict overhead.
budget = "6h"  # 336 candidates x 120s / 2 jobs = 20160s worst case (5.6h); a bound, not a measurement
allow_argv_append = false

[lanes.session-extract.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.session-extract.judge]
language = "python"
source_roots = ["src/nyxloom/session_extract"]
fail_under = 100.0
allow_excluded = false
require_branch = true
base = "126ccc39e151e33cc7bbcaa18bf765f9c9cd7dd1"

# R2: native python mutation, changed-lines-only -- resolve_mutation_targets
# reuses R1's SAME current-main diff, so this mutates exactly the changed lines
# under the session-extract source root, not the whole package. jobs=2 with
# pytest -n 4 bounds total xdist fan-out to eight workers on this shared
# 8-core host. The authoritative source-backed Assay plan at this selected
# boundary found 43 candidates under the cap of 45; this finite cap prevents an
# unbounded campaign.
# budget_per_candidate remains 120s.
[lanes.session-extract.judge.mutation]
jobs = 2
# Cap 350: the real plan at c4812cbc8 is 336 candidates (`assay plan --allow-dirty` with
# a temporary cap of 3000: claude_code 89, shellcmd 47, toolresult 40, stopstate 37,
# compress 28, presets 22, ledger 18, watch 17, render 16, successor 13, config 4,
# harness 3, follow 2). The earlier "151" was the plan's cap+1 sentinel for "more than
# the 150 cap", and a cap of 200 reported 201 (the same sentinel), so neither was a count.
max_mutants = 350
operators = ["python:compare-swap", "python:boolop-swap", "python:bool-const-flip", "python:falsy-swap"]
budget_per_candidate = "120s"

[lanes.session-extract.judge.coverage]
format = "coverage-py-json"
artifact = "coverage-session-extract.json"

# R3: cause-sensitive canary, uncovered-line mechanism -- proves this lane's
# R1 changed-line coverage FLOOR actually has teeth (a genuinely uncovered
# line in the judged package really does FAIL the gate), not merely that
# some failure mode exists. `uncovered-line` requires R1 declared (it does,
# above) and, since this lane is diff-mode (judge.mode is NOT
# "whole_target"), the target need not be one of an explicit judge.targets
# list -- any real file under source_roots qualifies. classifier.py: small,
# stable, and central to the package this lane actually judges.
[lanes.session-extract.judge.canary]
mechanism = "uncovered-line"
target = "src/nyxloom/session_extract/classifier.py"
budget_per_attempt = "120s"
