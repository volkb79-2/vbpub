schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"

[targets]
host = "github"
registry = ["ghcr.io"]

[env]
NYXLOOM_RELEASE_NOTES = "## nyxloom wheel\n\nFiles-first, daemon-supervised control plane for role-separated AI-assisted development.\n\n**Install**\n```bash\npipx install nyxloom-*.whl\n```"

[project]
id = "nyxloom"
description = "Files-first daemon-supervised development control plane."
template_revision = 4
prefix = "nyxloom-v"
artifacts = ["wheel", "oci-image"]
scm_dist = "nyxloom"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  { label = "nyxloom: tester-unified parallel suite", argv = ["cmru", "tester-gate", "--cwd", ".", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-n", "auto", "-q"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "nyxloom: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
  { label = "nyxloom: build OCI images", argv = ["python3", "build-push.py", "--build"], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "nyxloom: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "nyxloom", "--cwd", ".", "--notes-env", "NYXLOOM_RELEASE_NOTES"], cwd = "." },
  { label = "nyxloom: push OCI images", argv = ["python3", "build-push.py", "--push"], cwd = "." },
]
