schema_version = 1

[runtime]
kind = "none"

[env]
NYXLOOM_RELEASE_NOTES = "## nyxloom wheel\n\nFiles-first, daemon-supervised control plane for role-separated AI-assisted development.\n\n**Install**\n```bash\npipx install nyxloom-*.whl\n```"

[project]
id = "nyxloom"
description = "Files-first daemon-supervised development control plane."
template_revision = 4
prefix = "nyxloom-v"
# OCI image publishing deliberately deferred (see nyxloom-CMRU-ADOPTION-CODE-REVIEW.md
# findings on build-push.py: uncapped buildx builder + an unsafe irreversible-GitHub-
# Release-before-image-push ordering, NL-15) until nyxloomd has a real deployment
# need -- nyxloom is currently offline, no forcing function to publish images for it yet.
artifacts = ["wheel"]
scm_dist = "nyxloom"

[project.version]
strategy = "scm"
bump = "conventional"

# Assay is an internal source dependency: nyxloom's run-gate lanes install the
# assay package from the selected vbpub worktree and record its runtime
# version/source in the verdict. It is intentionally not an S15 artifact pin.

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  # SSOT pointer (D-110/D-111): the real test/coverage/canary contract lives
  # in nyxloom/run-gate.toml + nyxloom-trove/nyxloom.toml [gates.tester-unified]
  # (tests-pass + whole-source line/branch coverage via Assay's real judge;
  # the canary remains in the separate session-extract lane and is not part
  # of this bounded release step, NL-1/nyxloom-P48). This step owns no test logic; a bare
  # `cmru tester-gate -- pytest` here would release on a lesser bare-pytest
  # check than every other gate this project's own pipeline actually trusts.
  { label = "nyxloom: run-gate tester-unified", argv = ["./run-gate.py", "tester-unified"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "nyxloom: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
  # OCI image build/push (build-push.py) deliberately NOT invoked here -- see
  # [project] artifacts comment above. Re-enable only after fixing the
  # uncapped buildx builder and the push-ordering finding (NL-15), and only
  # once nyxloomd has a real consumer (nyxloom is currently offline).
]

[steps.push]
quiet = true
commands = [
  { label = "nyxloom: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "nyxloom", "--cwd", ".", "--notes-env", "NYXLOOM_RELEASE_NOTES"], cwd = "." },
]

[versions]

[versions.targets]

[versions.targets."pypi.pyyaml"]
mode = "single"
constraint = ">=6"

[versions.targets."pypi.pyyaml".pypi]
name = "pyyaml"
registry = "https://pypi.org"

[versions.targets."pypi.jsonschema"]
mode = "single"
constraint = ">=4"

[versions.targets."pypi.jsonschema".pypi]
name = "jsonschema"
registry = "https://pypi.org"

[versions.targets."pypi.structlog"]
mode = "single"
constraint = ">=24,<27"

[versions.targets."pypi.structlog".pypi]
name = "structlog"
registry = "https://pypi.org"

[versions.targets."pypi.rich"]
mode = "single"
constraint = ">=15.0.0"

[versions.targets."pypi.rich".pypi]
name = "rich"
registry = "https://pypi.org"

[versions.targets."pypi.pygments"]
mode = "single"
constraint = ">=2.21.0"

[versions.targets."pypi.pygments".pypi]
name = "pygments"
registry = "https://pypi.org"

[versions.targets."oci.node-agent"]
mode = "single"
constraint = "*"

[versions.targets."oci.node-agent".oci]
image = "docker.io/library/node"
tag = "26-slim"
selection = "rolling"

[versions.targets."oci.mdt-base"]
mode = "single"
constraint = "*"

[versions.targets."oci.mdt-base".oci]
image = "ghcr.io/volkb79-2/modern-debian-tools-python-debug-php85-vsc-devcontainer"
tag = "trixie-py3.14-latest"
selection = "rolling"

[versions.targets."oci.ntfy"]
mode = "single"
constraint = ">=2.14.0"

[versions.targets."oci.ntfy".oci]
image = "docker.io/binwiederhier/ntfy"
tag = "v{version}"

[versions.targets."oci.postgres"]
mode = "single"
constraint = "*"

[versions.targets."oci.postgres".oci]
image = "docker.io/library/postgres"
tag = "16-alpine"
selection = "rolling"

[versions.targets."oci.mattermost"]
mode = "single"
constraint = ">=11.10.1"

[versions.targets."oci.mattermost".oci]
image = "docker.io/mattermost/mattermost-team-edition"
tag = "{version}"

[versions.targets."oci.pwmcp"]
mode = "single"
constraint = ">=1.61.0-r6,<2.0.0"

[versions.targets."oci.pwmcp".oci]
image = "ghcr.io/volkb79-2/pwmcp"
tag = "{version}"
