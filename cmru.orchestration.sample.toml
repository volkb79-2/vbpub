# Estate coordination only — save as <repository-root>/cmru.orchestration.toml.
# Project commands and release facts are forbidden here; each entry points to a
# portable project-local cmru.toml.  Estate-wide gate/build policy belongs in
# [orchestration.defaults.env] below and is resolved before a project override.
schema_version = 1

[orchestration]
project_order = ["example-wheel"]
default_projects = ["example-wheel"]
default_steps = ["run-tests", "build", "push"]
execution_mode = "project-first"
# Repository credentials live in the gitignored root cmru.secret.toml; an
# individual project may overlay it from <project>/cmru.secret.toml.

# Estate policy for common gate/build inputs. Project [env] may override a
# value only where it has a genuinely different requirement.
[orchestration.defaults.env]
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_TESTER_UNIFIED_IMAGE = "tester-unified:local"
CMRU_TESTER_MEMORY = "3g"
CMRU_TESTER_MEMORY_SWAP = "16g"
CMRU_TESTER_CPUS = "1.5"
CMRU_TESTER_CGROUP_PROBE_IMAGE = "debian:trixie-slim"

# GOVERNANCE SLICE for gate containers — declared, never ambient:
#   CMRU_TESTER_CGROUP_PARENT = "${CGROUP_PARENT_DEV_BACKGROUND:-dev-background.slice}"
# ${NAME:-default} expands at load time (unset NAME without :-default is a
# load error). Empty result = NO slice tier on purpose (announced unscoped
# launch; per-container caps still apply). Whatever resolves is verified
# against the host systemd before launch.
#
# Per-container IO caps (optional, device-specific "<device>:<rate>"):
#   CMRU_TESTER_DEVICE_READ_BPS / _WRITE_BPS / _READ_IOPS / _WRITE_IOPS
# Setting any of them triggers a host cgroup-v2-io-controller preflight.

[orchestration.project.example-wheel]
config = "example-wheel/cmru.toml"
depends_on = []

[cleanup]
release_tag_prefixes = ["*"]
keep_release_tags = ["example-wheel-latest"]
ghcr_packages = ["*"]
ghcr_delete_packages = []
