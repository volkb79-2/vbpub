[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "vmscreen"
description = "Exact console text of local QEMU guests (VGA text buffer, serial log) without OCR, plus screenshot+text ground-truth pairs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
# Standard library only, apart from the CLI shell: cli-extended is a real wheel dependency, never vendored.
# Floor 0.4.0 (same reason as iobench): CliIdentity.resolve, the surface/review workflow and register_skills_verbs.
dependencies = ["cli-extended>=0.4.0"]
dynamic = ["version"]

# External tool (not a pip dependency): qemu-system-x86_64 >= 7.1. Reason: `screendump -f png` landed in 7.1.
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
vmscreen = "vmscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vmscreen = ["skills/**/*"]

# Version comes from the git tag `vmscreen-vX.Y.Z` (minted by cmru once a release contract exists, see BACKLOG.md
# VMS-BL-01). No fallback_version: a build without git metadata must fail (AGENTS.md "Defaults and fallbacks are hazards").
[tool.setuptools_scm]
root = "../.."
tag_regex = "^vmscreen-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "vmscreen-v*"]

[tool.cli-extended]
schema_version = 1

[[tool.cli-extended.clis]]
id = "vmscreen"
factory = "vmscreen.cli:build_cli"
review = "docs/cli-review.toml"
manifest = "docs/cli-surface.json"
spec = "docs/CLI-SPEC.md"
findings = "docs/cli-review-findings.toml"
