# vmscreen's gate matrix (declarative; same shape as libraries/iobench). Registered for release: cmru.toml runs `r0-r1`
# (assay.toml carries the judged lane `vmscreen`, consumed by `r2`).
# The real-QEMU smoke test is explicitly opted out here (VMSCREEN_SKIP_QEMU_SMOKE=1): tester-unified is not where QEMU runs.
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/vmscreen && VMSCREEN_SKIP_QEMU_SMOKE=1 PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=vmscreen --cov-branch --cov-fail-under=95 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "10m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"

[lanes.r2]
kind = "assay"
assay_lane = "vmscreen"
resource_observer = "cgprofile"
environment = "tester-unified"
jobs = "auto"
clean_tree = false
budget = "120m"
artifacts = [".assay/verdict-vmscreen.json",
  ".assay/progress-vmscreen.jsonl"]

[lanes.r2.resources]
pids = 8192
memory = "1536m"
io_sync = "durable"

[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/vmscreen && run-gate --worktree {worktree} r0-r1 && run-gate --worktree {worktree} r2",
]
clean_tree = false
budget = "140m"
