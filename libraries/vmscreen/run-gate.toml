# vmscreen's gate matrix (declarative; same shape as libraries/iobench). Not yet wired into a release (BACKLOG VMS-BL-01).
# The real-QEMU smoke test is explicitly opted out here (VMSCREEN_SKIP_QEMU_SMOKE=1): tester-unified is not where QEMU runs.
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/vmscreen && VMSCREEN_SKIP_QEMU_SMOKE=1 PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=vmscreen --cov-branch --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "10m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"
