# Complete R0-R1 contract and 100% line+branch coverage in tester-unified.
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/patchseries && PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=patchseries --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "10m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "512m"
