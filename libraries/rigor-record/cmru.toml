# rigor-record release contract -- parsed ONLY by cmru. Tags `rigor-record-v*`; a stdlib-only wheel
# and its sha256 go to GitHub Releases only, never PyPI.
schema_version = 1

[runtime]
kind = "none"

[env]
RIGOR_RECORD_RELEASE_NOTES = "## rigor-record wheel\n\nInterchange layer for the vbpub rigor-evidence record (library modules are stdlib-only, the command line uses cli-extended): the `rigor-fragment/1`, `rigor-record/1` and `rigor-waivers/1` JSON Schemas, a schema and semantic validator, `assemble`/`render`/`check`, the nearest-rank distribution and Geekbench normalisation rules, and the privacy lint every published record must pass. See `libraries/rigor-record/SPEC.md`.\n\n**Read before using**\n- This release carries the schemas and validator (RR-1) and `assemble`, `render`, `check` with the `rigor-record` command line (RR-2). `sync` and `update` (RR-3) commit records to main through a locked, retrying git procedure. `queue`, `base`, `adopt` and `note` arrive in RR-4, RR-5 and GN-1.\n- Producers vendor the schemas and golden fixtures; they do not import this wheel at run time.\n\n**Install (wheel)**\n```bash\npython -m pip install --no-index ./<wheel-file>\n```"

[project]
id = "rigor-record"
description = "rigor-record -- rigor-evidence interchange schemas, validator and privacy lint"
template_revision = 4
prefix = "rigor-record-v"
artifacts = ["wheel"]
scm_dist = "rigor-record"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]
evidence_paths = ["coverage.json"]

[steps.run-tests]
quiet = true
commands = [
  { label = "rigor-record: r0-r1 (unit + 100% branch coverage)", argv = ["run-gate", "r0-r1"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "rigor-record: build wheel", argv = ["cmru", "handler", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "rigor-record: publish wheel", argv = ["cmru", "handler", "wheel-publish", "--prefix", "rigor-record", "--cwd", ".", "--notes-env", "RIGOR_RECORD_RELEASE_NOTES"], cwd = "." },
]
