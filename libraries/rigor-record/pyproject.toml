[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "rigor-record"
description = "Interchange schemas, validator and privacy lint for the vbpub rigor-evidence record"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
# The library modules (schemas, validator, lint, assemble, render, check) import only the
# standard library (memo 2026-11-05 section 0 decision 3): producers vendor the schemas and
# golden fixtures instead of importing this wheel. Only the `rigor-record` command line
# (rigor_record.cli) uses cli-extended, a REAL wheel dependency like every estate CLI (RR-2,
# operator instruction; RRK-01). cli-extended itself is stdlib-only, so the wheel still has no
# third-party runtime dependency. Floor 0.3.0: the version cmru adopted; the surface used
# (CliIdentity.resolve, CliRegistry, VerbSpec confirmation_required) exists from 0.2.0.
# tomllib (waivers/1) is why the Python floor is 3.11.
dependencies = ["cli-extended>=0.3.0"]
dynamic = ["version"]

[project.scripts]
rigor-record = "rigor_record.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.setuptools.packages.find]
where = ["src"]

# The JSON Schemas are read at run time through importlib.resources.
[tool.setuptools.package-data]
rigor_record = ["schemas/*.json"]

# Version comes from the git tag `rigor-record-vX.Y.Z` minted by the cmru release transaction,
# resolved against the enclosing checkout. No fallback_version: a build without git metadata
# must fail (AGENTS.md "Defaults and fallbacks are hazards").
[tool.setuptools_scm]
root = "../.."
tag_regex = "^rigor-record-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "rigor-record-v*"]
