[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "rigor-record"
description = "Interchange schemas, validator and privacy lint for the vbpub rigor-evidence record"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
# Stdlib-only at runtime by design (memo 2026-11-05 section 0 decision 3): producers vendor the
# schemas and golden fixtures instead of importing this wheel, and the validator must run
# anywhere a release runs. tomllib (waivers/1) is why the floor is 3.11.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.setuptools.packages.find]
where = ["src"]

# The JSON Schemas are read at run time through importlib.resources.
[tool.setuptools.package-data]
rigor_record = ["schemas/*.json"]

# Version comes from the git tag `rigor-record-vX.Y.Z` minted by the cmru release transaction,
# resolved against the enclosing checkout. No fallback_version: a build without git metadata
# must fail (AGENTS.md "Defaults and fallbacks are hazards").
[tool.setuptools_scm]
root = "../.."
tag_regex = "^rigor-record-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "rigor-record-v*"]
