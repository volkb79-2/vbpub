# cli-extended's test lane is consumed through run-gate.toml in tester-unified.
schema_version = 2

[lanes.cli-extended]
scope = "S1"
rigor = ["R0", "R1", "R2"]
enforcement = "gate"
argv = [
  "/opt/tester-venv/bin/python3", "-m", "pytest", "tests", "-q",
  "--maxfail=1",
  "--cov=cli_extended", "--cov-branch", "--cov-report=json:coverage.json",
]
env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
# Measured 2026-10-05: ~2-3 candidates/min at jobs=2 under host contention, so
# 1,400 candidates need ~9-11 h; jobs=3 matches the 3-CPU slice cap. See assay
# B144 for the covering-test ordering that would cut this.
budget = "720m"
allow_argv_append = false

[lanes.cli-extended.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.cli-extended.judge]
language = "python"
source_roots = ["src/cli_extended"]
mode = "whole_target"
# Every shipped module, kept in step by
# tests/test_docs.py::test_mutation_targets_cover_every_module so a new module
# cannot ship without entering the campaign.
targets = [
  "src/cli_extended/__init__.py",
  "src/cli_extended/audit.py",
  "src/cli_extended/cli.py",
  "src/cli_extended/config.py",
  "src/cli_extended/constraints.py",
  "src/cli_extended/contract.py",
  "src/cli_extended/doctor.py",
  "src/cli_extended/findings.py",
  "src/cli_extended/identity.py",
  "src/cli_extended/output.py",
  "src/cli_extended/parser.py",
  "src/cli_extended/progress.py",
  "src/cli_extended/prompts.py",
  "src/cli_extended/pytest_plugin.py",
  "src/cli_extended/review.py",
  "src/cli_extended/skills.py",
  "src/cli_extended/surface.py",
  "src/cli_extended/surface_cli.py",
  "src/cli_extended/testing.py",
  "src/cli_extended/values.py",
]
fail_under = 100.0
allow_excluded = false
require_branch = true

[lanes.cli-extended.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.cli-extended.judge.mutation]
jobs = 3
# Raised for the unified-adoption wave (2026-10-05): the library roughly
# doubled (skills, doctor, config, findings, constraints), so the previous
# 1,200 cap would refuse with MUTANT_LIMIT_EXCEEDED rather than sample.
max_mutants = 3000
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
