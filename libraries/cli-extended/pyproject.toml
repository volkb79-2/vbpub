[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-extended"
version = "0.1.0"
description = "Shared contract helpers for vbpub user-facing Python CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["cli_extended"]

[tool.coverage.report]
show_missing = true
