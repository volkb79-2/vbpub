[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-test-policy"
description = "pytest policy plugin (load- and speed-independent tests) and the flakehunt stress-repeat runner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
# Standard library plus pytest. Floor 8: the plugin relies on `pytest.Parser`/`pytest.Config`/`pytest.FixtureRequest`
# exported at top level (pytest >= 7) and `Item.iter_markers`; 8 is the estate tester-base pytest line, and the
# estate-wide freshness rule prefers the newest line at least 14 days old, so the floor is a minimum, not a pin.
dependencies = ["pytest>=8"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest-cov>=6"]

[project.entry-points.pytest11]
estate_test_policy = "estate_test_policy.plugin"

[project.scripts]
flakehunt = "flakehunt.hunt:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version from the git tag `test-policy-vX.Y.Z` minted by the release contract in cmru.toml. No fallback_version.
[tool.setuptools_scm]
root = "../.."
tag_regex = "^test-policy-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "test-policy-v*"]
