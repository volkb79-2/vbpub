# test-policy's executable gate matrix. All lanes run inside tester-unified; no test or mutation run happens in
# the cockpit. No docker lane: the tests use a fake docker runner, flakehunt's real container mode is exercised
# by hand on the test hosts (README Limits).
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/test-policy && PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "20m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"
io_sync = "durable"

[lanes.r2]
kind = "assay"
assay_lane = "test-policy"
resource_observer = "cgprofile"
environment = "tester-unified"
jobs = "auto"
clean_tree = false
budget = "120m"
artifacts = [".assay/verdict-test-policy.json",
  ".assay/progress-test-policy.jsonl"]

[lanes.r2.resources]
pids = 8192
memory = "1536m"
io_sync = "durable"

[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/test-policy && run-gate --worktree {worktree} r0-r1 && run-gate --worktree {worktree} r2",
]
clean_tree = false
budget = "150m"
