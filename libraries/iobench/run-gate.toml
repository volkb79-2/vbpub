# iobench's executable gate matrix. All lanes run inside tester-unified; no test or
# mutation run happens in the cockpit. There is deliberately no VM lane (ruling R-10,
# IOB-03): live acceptance of mechanics is the r1002 run (IOB-ACC-01, a probe).
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/iobench && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=iobench --cov=studies.ibx.driver --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "20m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"
io_sync = "durable"

# ---------------------------------------------------------------------------
# r2 — the DIFF-SCOPED, parallel mutation lane (the one to run; see
# docs/R2-RUNBOOK.md). It mutates only the lines a request base..HEAD diff adds
# under src/iobench, which is what makes an owed R2 on one package affordable:
# the whole-target lane below plans 1891 candidates on the 2026-11-24 tree while
# the P1 change (94d9c2227..74e86a3f5) plans the fraction recorded in the
# runbook.
#
# It DELEGATES its comparison base (`assay.toml` [lanes.iobench-diff]
# judge.base_source = "request"), so run-gate appends `--request-base <ref>`
# from `run-gate r2 --base <ref>` (RG-26/R-35). Without `--base` the ref is the
# judged tree's ciu-recorded fork point, else `merge-base HEAD @{upstream}`;
# on a throwaway remote checkout neither exists, so a remote run MUST pass
# `--base` (the runbook does).
#
# jobs = 3 is EXPLICIT, not "auto", so the controller gets the same worker
# count on every host instead of whatever the probe decided. It is legal only
# with an enforced memory cap, the counted CPUs and a Cowtree-confirmed btrfs
# cheap-clone workspace; a host without that CoW area refuses `--jobs 3` by
# name rather than silently serialising (then pass `--jobs 1`).
#
# Arithmetic (run-gate SPEC R-53; run-gate 25.9.0 "R2 jobs" INFO line prints
# all of it before the container starts):
#   cpu_cap 3 (environments.tester-unified resources.cpus), oversubscribe 1.0
#     -> cpu_workers = floor(3 * 1.0) = 3
#   enforced lane memory 4g -> memory budget 75% of 4g = 3072 MiB
#   declared candidate_ram 512 MiB is a FLOOR over the measured per-candidate
#     RSS (p95 391,901,184 B = 374 MiB measured over 234 candidate events in
#     the 2026-11-02 campaign; the largest single candidate there was
#     1,568,337,920 B = 1.46 GiB) -> memory_workers = 3072 // 512 = 6
#   assay max_mutants remaining cap is never binding here
#   jobs = min(jobs_max 4, cpu 3, memory 6, remaining) = 3
# 3 workers x 512 MiB = 1536 MiB estimated candidate RSS inside a 4096m cap,
# which leaves the rest of the cap for the baseline (measured 253-270 s) and
# pytest/coverage overhead. The 2.67 GiB (2,864,095,232 B) peak of the
# 2026-11-02 campaign at N=3 is the campaign sampler's peak on the gate SLICE,
# not a lane figure: 2.67 GiB cannot fit in the 1536m LANE cap that campaign
# ran under, which is why that cap is 4g now. 4g is measured, not a guess.
#
# budget = 245m is sized from the measurement in docs/R2-RUNBOOK.md and keeps
# the 5m margin above the assay lane's own 240m that `run-gate lanes --check`
# requires (R-59).
[lanes.r2]
kind = "assay"
assay_lane = "iobench-diff"
resource_observer = "cgprofile"
environment = "tester-unified"
jobs = 3
clean_tree = false
budget = "245m"
artifacts = [".assay/verdict-iobench-diff.json",
  ".assay/progress-iobench-diff.jsonl"]

[lanes.r2.resources]
pids = 8192
memory = "4g"
candidate_ram = "512m"
io_sync = "durable"

# The WHOLE-TARGET mutation lane, unchanged in behaviour (every shipped module,
# every candidate, 1891 of them on the 2026-11-24 tree). It is NOT part of
# `[lanes.gate]` any more (the repository gate runs `r0-r1` only), and it is
# NOT the lane to run for an owed R2 on one change -- that is the diff-scoped
# `r2` above (docs/R2-RUNBOOK.md). Keep it reachable by name: a periodic
# whole-package campaign is still the only way to judge a file nobody touched.
# `run-gate r2-whole`.
[lanes.r2-whole]
kind = "assay"
assay_lane = "iobench"
resource_observer = "cgprofile"
environment = "tester-unified"
jobs = "auto"
clean_tree = false
budget = "365m"
artifacts = [".assay/verdict-iobench.json",
  ".assay/progress-iobench.jsonl"]

[lanes.r2-whole.resources]
pids = 8192
memory = "1536m"
io_sync = "durable"

# The repository gate: R0/R1 only. R2 is OWED asynchronously on the latest
# code (the operator release rule), so this lane runs no mutation campaign:
# the diff-scoped `r2` (owed, one change at a time, docs/R2-RUNBOOK.md) and
# the periodic whole-package `r2-whole` are run by name by the controller.
# A mutation campaign inside the gate is what made every iobench merge gate
# end BUDGET_EXCEEDED (75 of 1891 candidates in 6 h, ETA about 8450 min).
#
# budget 25m = [lanes.r0-r1] 20m + the 5m margin R-59 requires above an inner
# lane (`run-gate lanes --check`, LANES_CHECK_BUDGET_MARGIN_SECONDS = 5m in
# run-gate-project/run_gate.py:217), for the nested container start. Raising
# this instead of adding margin would let the outer bound cut the inner lane.
[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/iobench && run-gate --worktree {worktree} r0-r1",
]
clean_tree = false
budget = "25m"
