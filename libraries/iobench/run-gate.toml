# iobench's executable gate matrix. All lanes run inside tester-unified; no test or
# mutation run happens in the cockpit. There is deliberately no VM lane (ruling R-10,
# IOB-03): live acceptance of mechanics is the r1002 run (IOB-ACC-01, a probe).
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/iobench && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=iobench --cov=studies.ibx.driver --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "20m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"
io_sync = "durable"

[lanes.r2]
kind = "assay"
assay_lane = "iobench"
resource_observer = "cgprofile"
environment = "tester-unified"
jobs = "auto"
clean_tree = false
budget = "360m"
artifacts = [".assay/verdict-iobench.json",
  ".assay/progress-iobench.jsonl"]

[lanes.r2.resources]
pids = 8192
memory = "1536m"
io_sync = "durable"

[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
  "bash", "-c",
  "cd {worktree}/libraries/iobench && run-gate --worktree {worktree} r0-r1 && run-gate --worktree {worktree} r2",
]
clean_tree = false
budget = "400m"
