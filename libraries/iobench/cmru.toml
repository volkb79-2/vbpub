# iobench release contract -- parsed ONLY by cmru (IOB-REL-01). Tags `iobench-v*`; a wheel and
# its sha256 go to GitHub Releases only, never PyPI. External tool floor: fio >= 3.30 for latency fields; startup separately checks --allow_mounted_write (reason in pyproject.toml).
schema_version = 1

[runtime]
kind = "none"

[env]
IOBENCH_RELEASE_NOTES = """## iobench wheel

Cache-proof disk benchmark: every proposed value says how far it can be trusted. See `libraries/iobench/CHANGES.md` for the full entry.

**Read before running**
- Partial live mechanics acceptance ran on 2026-11-09 in a Debian 13 QEMU/TCG guest with fio 3.39 and ext4/XFS/btrfs qcow2 disks. TCG rates and cache results are not disk-performance evidence. IOB-ACC-01 still owes `systemd-run --wait`, the mounted-filesystem raw-boundary case, a second SIGTERM during `fallocate -p`, a real 150 s fresh observation, cross-direction/plausibility checks, a disk with known cache, and a live re-probe of SIGKILL cleanup.
- Targets need at least 1 GiB usable plus the reserved 1 MiB tail. `--work-dir` must name an existing empty directory; leave `max(4 GiB, 3 x planned cell volume)` free after target initialization.
- RealHost refuses raw writes and discards: the marker O_EXCL protects marker creation only, and neither fio nor `blkdiscard` can use a held O_EXCL descriptor for the full mutation interval. At the raw stage boundary, EBUSY identifies a kernel block-device holder conflict; an ordinary non-exclusive opener does not make the probe busy. Use a file target for current benchmark runs.
- Runs as root in the host's initial PID and mount namespaces (a container is refused); needs fio >= 3.30 for latency fields and a runtime-documented `--allow_mounted_write` option (every device job pins `--allow_mounted_write=0`).
- `check` exit 7 (valid, some proposal unproven) is the expected answer for `caps` and `iocost_model` until a `seq1m` ceiling history exists (IOB-BL-03, IOB-BL-07). The abort guard watches the protected cgroup's `io.pressure` only (IOB-BL-12); `--confirm-quiet-window` is the operator's protection against the cross-direction blind spot (IOB-BL-04).

**Install (wheel)**
```bash
python -m pip install --no-index --find-links . iobench-*.whl cli-extended-*.whl
```"""

[project]
id = "iobench"
description = "iobench -- cache-proof disk benchmark"
template_revision = 4
prefix = "iobench-v"
# SPEC IOB-REL-01 also asks for a zipapp + sha256. cmru has no zipapp handler and a zipapp cannot carry the
# cli-extended wheel dependency without a project-owned build script; recorded as BLOCKED in IMPLEMENTATION-NOTES.md.
artifacts = ["wheel"]
scm_dist = "iobench"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]
evidence_paths = ["coverage.json"]

[steps.run-tests]
quiet = true
commands = [
  { label = "iobench: r0-r1 (unit + 100% branch coverage)", argv = ["run-gate", "r0-r1"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "iobench: build wheel", argv = ["cmru", "handler", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "iobench: publish wheel", argv = ["cmru", "handler", "wheel-publish", "--prefix", "iobench", "--cwd", ".", "--notes-env", "IOBENCH_RELEASE_NOTES"], cwd = "." },
]
