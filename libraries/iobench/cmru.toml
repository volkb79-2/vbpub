# iobench release contract -- parsed ONLY by cmru (IOB-REL-01). Tags `iobench-v*`; a wheel and
# its sha256 go to GitHub Releases only, never PyPI. External tool floor: fio >= 3.30 for latency fields; startup separately checks --allow_mounted_write (reason in pyproject.toml).
schema_version = 1

[runtime]
kind = "none"

[env]
IOBENCH_RELEASE_NOTES = "## iobench wheel\n\nCache-proof disk benchmark: every proposed value says how far it can be trusted. See `libraries/iobench/CHANGES.md` for the full entry.\n\n**Read before running**\n- Verified on a fake host only: `RealHost` (subprocess, sysfs, O_EXCL, prctl) has never run against a real device, fio or systemd; the live acceptance run (IOB-ACC-01) is pending. RealHost refuses raw writes/discards even when the device is free; an ordinary opener is reported as `device_in_use`. Use a file target for current benchmark runs.\n- Runs as root in the host's initial PID and mount namespaces (a container is refused); needs fio >= 3.30 for its latency fields and a runtime-documented `--allow_mounted_write` option (every device job pins `--allow_mounted_write=0`; `fio_option_unsupported` otherwise).\n- Writes to preallocated file targets and `iobench-*` load files in the work dir. Raw-device write/discard stages are refused: marker O_EXCL protects marker creation only, and neither fio nor `blkdiscard` can use a held O_EXCL descriptor for the full mutation interval. `--allow_mounted_write=0` is an additional mounted-device guard. Never persists a setting; restores every changed knob on every exit.\n- `check` exit 7 (valid, some proposal unproven) is the expected answer for `caps` and `iocost_model` until a `seq1m` ceiling history exists (IOB-BL-03, IOB-BL-07).\n- Known limits: the abort guard watches the protected cgroup's `io.pressure` only, not memory/reclaim stalls (IOB-BL-12); a provider throttle visible only on reads is not seen by a write cap (IOB-BL-04). `--confirm-quiet-window` is the operator's protection against both.\n\n**Install (wheel)**\n```bash\npython -m pip install --no-index --find-links . iobench-*.whl cli-extended-*.whl\n```"

[project]
id = "iobench"
description = "iobench -- cache-proof disk benchmark"
template_revision = 4
prefix = "iobench-v"
# SPEC IOB-REL-01 also asks for a zipapp + sha256. cmru has no zipapp handler and a zipapp cannot carry the
# cli-extended wheel dependency without a project-owned build script; recorded as BLOCKED in IMPLEMENTATION-NOTES.md.
artifacts = ["wheel"]
scm_dist = "iobench"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]
evidence_paths = ["coverage.json"]

[steps.run-tests]
quiet = true
commands = [
  { label = "iobench: r0-r1 (unit + 100% branch coverage)", argv = ["run-gate", "r0-r1"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "iobench: build wheel", argv = ["cmru", "handler", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "iobench: publish wheel", argv = ["cmru", "handler", "wheel-publish", "--prefix", "iobench", "--cwd", ".", "--notes-env", "IOBENCH_RELEASE_NOTES"], cwd = "." },
]
