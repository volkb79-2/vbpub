[pytest]
pythonpath = src ../cli-extended/src
testpaths = tests
addopts = -p no:cacheprovider -p cli_extended.pytest_plugin -m "not real_fio"
markers =
    time_limit(seconds): override the per-test CPU-time limit of tests/conftest.py
    real_fio: opt-in end-to-end IBX rehearsal using upstream fio 3.39 and a /tmp regular file
