# Augeaswrap's executable gate matrix. All lanes run inside tester-unified;
# no test, mutation, or canary command runs in the cockpit.
# The r0-r1 tool contract requires augtool and augparse from augeas-tools;
# check both before pytest so a missing image package cannot silently hide real-tool tests.
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/augeaswrap && { command -v augtool >/dev/null 2>&1 && command -v augparse >/dev/null 2>&1 || { echo 'r0-r1 requires augtool and augparse from augeas-tools in tester-unified' >&2; exit 2; }; } && export PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 && /opt/tester-venv/bin/python3 -m pytest tests -q --cov=augeaswrap --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json && /opt/tester-venv/bin/python3 -m pytest tests -q --capture=sys --cov=augeaswrap --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json && cli-extended surface check --cli augeaswrap && tools/lens-check.sh",
]
clean_tree = false
budget = "10m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "512m"

[lanes.r2]
kind = "command"
resource_observer = "cgprofile"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "export PYTHONPATH={worktree}/assay/src:{worktree}/libraries/cowtree/src:{worktree}/libraries/cli-extended/src && cd {worktree}/augeaswrap && mkdir -p .assay && exec /opt/tester-venv/bin/python3 -m assay.cli run augeaswrap --resume --state-dir .assay/mutation-state-r2 --progress .assay/progress-r2.jsonl --verdict-json .assay/verdict-r2.json",
]
clean_tree = false
budget = "720m"
artifacts = [".assay/verdict-r2.json", ".assay/progress-r2.jsonl"]

[lanes.r2.resources]
pids = 8192
# B157 keeps one native candidate active so cgroup event windows do not overlap.
memory = "1536m"

[lanes.r2-sample]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/augeaswrap && export PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 && exec /opt/tester-venv/bin/python3 tools/r2_sample.py",
]
clean_tree = false
budget = "30m"
artifacts = [".assay/r2-sample-results.csv"]

[lanes.r2-sample.resources]
memory = "512m"

[lanes.r3]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/augeaswrap && AUGEASWRAP_PYTHON=/opt/tester-venv/bin/python3 exec tools/canary-run.sh",
]
clean_tree = false
budget = "10m"

[lanes.r3.resources]
memory = "512m"

[lanes.gate]
kind = "command"
environment = "bare-host"
argv = [
  "bash", "-c",
  "cd {worktree}/augeaswrap && run-gate --worktree {worktree} r0-r1 && run-gate --worktree {worktree} r2 && run-gate --worktree {worktree} r3",
]
clean_tree = false
budget = "750m"
