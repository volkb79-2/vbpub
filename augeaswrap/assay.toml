# Augeaswrap's test lane is consumed through run-gate.toml in tester-unified.
schema_version = 2

[lanes.augeaswrap]
scope = "S1"
rigor = ["R0", "R1", "R2"]
enforcement = "gate"
argv = [
  "/opt/tester-venv/bin/python3", "-m", "pytest", "tests", "-q",
  "--maxfail=1",
  "--cov=augeaswrap", "--cov-branch", "--cov-report=json:coverage.json",
]
env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
# B157 serializes native R2 so event-counter deltas remain attributable; the
# budget is a ceiling, not a measured completion estimate for this project.
budget = "720m"
allow_argv_append = false

[lanes.augeaswrap.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.augeaswrap.judge]
language = "python"
source_roots = ["src/augeaswrap"]
mode = "whole_target"
# Every shipped module, kept in step by
# tests/test_docs.py::test_assay_targets_cover_every_package_module so a new module
# cannot ship without entering the campaign.
targets = [
  "src/augeaswrap/__init__.py",
  "src/augeaswrap/__main__.py",
  "src/augeaswrap/_fs.py",
  "src/augeaswrap/_resource_files.py",
  "src/augeaswrap/augtool.py",
  "src/augeaswrap/check.py",
  "src/augeaswrap/cli.py",
  "src/augeaswrap/edit.py",
  "src/augeaswrap/endpoint.py",
  "src/augeaswrap/endpoints.py",
  "src/augeaswrap/engine.py",
  "src/augeaswrap/file.py",
  "src/augeaswrap/formats/__init__.py",
  "src/augeaswrap/formats/fstab.py",
  "src/augeaswrap/formats/pam_env.py",
  "src/augeaswrap/json_key.py",
  "src/augeaswrap/kinds.py",
  "src/augeaswrap/shadow.py",
  "src/augeaswrap/sysctl.py",
  "src/augeaswrap/sysusers.py",
  "src/augeaswrap/tmpfiles.py",
  "src/augeaswrap/transactions.py",
  "src/augeaswrap/unit.py",
]
fail_under = 100.0
allow_excluded = false
require_branch = true

[lanes.augeaswrap.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.augeaswrap.judge.mutation]
# Ceiling (assay >= 11). Not yet measured for this multi-thousand-statement project: the
# R2 lane is a command lane, so it only honours `--jobs N` added to its argv.
# Re-measure with a bounded pilot before relying on a completion estimate.
jobs_max = 3
# Generous cap so a campaign over every module is never refused with
# MUTANT_LIMIT_EXCEEDED instead of sampled; tighten once a pilot gives a count.
max_mutants = 3000
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
