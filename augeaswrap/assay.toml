# Augeaswrap's test lane is consumed through run-gate.toml in tester-unified.
schema_version = 2

[lanes.augeaswrap]
scope = "S1"
rigor = ["R0", "R1", "R2"]
enforcement = "gate"
argv = [
  "/opt/tester-venv/bin/python3", "-m", "pytest", "tests", "-q",
  "--maxfail=1",
  "--cov=augeaswrap", "--cov-branch", "--cov-report=json:coverage.json",
]
env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
# The 2026-10-05 rate was measured with multiple workers. B157 now serializes
# native R2 so event-counter deltas remain attributable. Re-measure this large
# campaign with a bounded pilot before treating the 12-hour gate window as a
# completion estimate. B144 tracks covering-test ordering that may reduce its
# per-candidate work.
budget = "720m"
allow_argv_append = false

[lanes.augeaswrap.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.augeaswrap.judge]
language = "python"
source_roots = ["src/augeaswrap"]
mode = "whole_target"
# Every shipped module, kept in step by
# tests/test_docs.py::test_assay_targets_cover_every_package_module so a new module
# cannot ship without entering the campaign.
targets = [
  "src/augeaswrap/__init__.py",
  "src/augeaswrap/__main__.py",
  "src/augeaswrap/_fs.py",
  "src/augeaswrap/cli.py",
  "src/augeaswrap/endpoints.py",
]
fail_under = 100.0
allow_excluded = false
require_branch = true

[lanes.augeaswrap.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.augeaswrap.judge.mutation]
# Ceiling (assay >= 11). Measured 1461 candidates, median 10.9 s, mean 15 s;
# the run-gate r2 lane is a command lane, so it only honours `--jobs N` added
# to its argv (see reports/assay-jobs-audit-REPORT.md: convert it to
# kind = "assay" like iobench to get `jobs = "auto"`).
jobs_max = 3
# Raised for the unified-adoption wave (2026-10-05): the library roughly
# doubled (skills, doctor, config, findings, constraints), so the previous
# 1,200 cap would refuse with MUTANT_LIMIT_EXCEEDED rather than sample.
max_mutants = 3000
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
