schema_version = 1

[runtime]
kind = "none"

[env]
BUILDX_BUILDER = "mdt-managed"
BUILDKIT_HOST = "unix:///run/mdt-buildkitd/buildkitd.sock"

[project]
id = "tester-base"
description = "Minimal gate base image: python 3.14 + docker client + minisign + shellcheck."
template_revision = 5
prefix = "tester-base-v"
artifacts = ["oci-image"]

[project.version]
strategy = "file:VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = []

# ONE build (R1), versioned late (V1), private candidate tag (W5). cmru runs prepare -> gate ->
# (VERSION written, committed, tagged) -> build_step -> push, so `prepare` cannot know the release version.
# It builds the image under a private per-release tag tester-base:release-<source-commit> (NOT the shared
# developer tag tester-base:local, which other sessions rebuild) and records tag + id; the gate runs the
# contract lane against that recorded tag; `build` (the first step after the version exists) reads
# VERSION, re-verifies the id and gives the SAME image its registry names with `docker tag`; `push` logs in
# with the step's credentials (stdin, isolated config), never overwrites a version tag that serves another
# image, pushes :latest and then :<VERSION> last, and checks the served digests.
# The `oci-image-*` handlers are not used (see handoff/CMRU-GAPS-2026-10-19.md).
[steps.prepare]
quiet = true
commands = [
  { label = "tester-base: build the image once under its private per-release tag", argv = ["python3", "scripts/release_image.py", "build"], cwd = "." },
]

[steps.run-tests]
quiet = true
commands = [
  { label = "tester-base: run-gate contract lane against the recorded private tag", argv = ["python3", "scripts/release_image.py", "gate"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "tester-base: give the tested image its version and latest names", argv = ["python3", "scripts/release_image.py", "tag"], cwd = "." },
]

[steps.push]
quiet = true
required_env = ["GITHUB_USERNAME", "GITHUB_PUSH_PAT"]
commands = [
  { label = "tester-base: log in, push the tested image, verify the served digests", argv = ["python3", "scripts/release_image.py", "push"], cwd = "." },
]

