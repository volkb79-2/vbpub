schema_version = 1

[runtime]
kind = "none"

[env]
# The candidate the `contract` lane tests: built by the `prepare` step below.
TESTER_BASE_IMAGE = "tester-base:local"
BUILDX_BUILDER = "mdt-managed"
BUILDKIT_HOST = "unix:///run/mdt-buildkitd/buildkitd.sock"

[project]
id = "tester-base"
description = "Minimal gate base image: python 3.14 + docker client + minisign + shellcheck."
template_revision = 5
prefix = "tester-base-v"
artifacts = ["oci-image"]

[project.version]
strategy = "file:VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = []

# ONE build (R1): `prepare` builds the release target - tagged tester-base:local AND the registry
# names - and records its image id; the contract lane tests that image; `build` re-verifies that every
# release tag still is the tested id; `push` is `docker push` of those same tags (never a rebuild) and
# asserts the registry serves the pushed digest. The `oci-image-*` handlers are not used: they log in
# to the registry even for a local build and bake-push rebuilds.
[steps.prepare]
quiet = true
commands = [
  { label = "tester-base: build the release image once", argv = ["docker", "buildx", "bake", "-f", "docker-bake.hcl", "tester-base-release", "--load"], cwd = "." },
  { label = "tester-base: record the tested image id", argv = ["python3", "scripts/release_image.py", "record"], cwd = "." },
]

[steps.run-tests]
quiet = true
commands = [
  { label = "tester-base: run-gate contract lane", argv = ["./run-gate.py", "contract"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "tester-base: verify the release tags are the tested image", argv = ["python3", "scripts/release_image.py", "verify"], cwd = "." },
]

[steps.push]
quiet = true
required_env = ["GITHUB_USERNAME", "GITHUB_PUSH_PAT"]
commands = [
  { label = "tester-base: push the tested image and verify the served digest", argv = ["python3", "scripts/release_image.py", "push"], cwd = "." },
]

[versions]

# The FROM digest of the Dockerfile is the digest cmru resolves here, under the 14-day age window
# (cmru.orchestration.toml `age_window_days`). A *rolling* tag cannot express "the newest digest of
# python:3.14-trixie that is already 14 days old" (it refuses while the CURRENT digest is younger),
# so the target follows the immutable patch tags: the newest `3.14.N-trixie` that is old enough. The
# floor (3.14.7) is the digest in use; it also bounds how many manifests cmru must fetch (Docker Hub
# allows only 100 anonymous manifest pulls per hour per IP).
[versions.targets."oci.python.314.trixie"]
mode = "single"
constraint = ">=3.14.7,<3.15"

[versions.targets."oci.python.314.trixie".oci]
image = "docker.io/library/python"
tag = "{version}-trixie"

# The node stage of tester-unified/Dockerfile (D-004): the official image, major 26 (the cockpit's
# NODE_MAJOR; the major is the deliberate manual pin), newest patch release that is old enough.
[versions.targets."oci.node.26.trixie"]
mode = "single"
constraint = ">=26.9.0,<27"

[versions.targets."oci.node.26.trixie".oci]
image = "docker.io/library/node"
tag = "{version}-trixie"
