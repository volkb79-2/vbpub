schema_version = 1

[runtime]
kind = "none"

[env]
# The candidate the `contract` lane tests: built by the `prepare` step below.
TESTER_BASE_IMAGE = "tester-base:local"
BUILDX_BUILDER = "mdt-managed"
BUILDKIT_HOST = "unix:///run/mdt-buildkitd/buildkitd.sock"

[project]
id = "tester-base"
description = "Minimal gate base image: python 3.14 + docker client + minisign + shellcheck."
template_revision = 5
prefix = "tester-base-v"
artifacts = ["oci-image"]

[project.version]
strategy = "file:VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = []

# ONE build (R1), versioned late (V1). cmru runs prepare -> gate -> (VERSION written, committed,
# tagged) -> build_step -> push, so `prepare` cannot know the release version. It builds the image as
# tester-base:local and records its id; the gate tests that image; `build` (the first step after the
# version exists) reads VERSION, re-verifies the id and gives the SAME image its registry names with
# `docker tag`; `push` logs in with the step's credentials (stdin, isolated config), refuses an
# existing version tag, pushes :latest and then :<VERSION> last, and checks the served digests.
# The `oci-image-*` handlers are not used (see handoff/CMRU-GAPS-2026-10-19.md).
[steps.prepare]
quiet = true
commands = [
  { label = "tester-base: build the image once (tester-base:local)", argv = ["docker", "buildx", "bake", "-f", "docker-bake.hcl", "tester-base-local", "--load"], cwd = "." },
  { label = "tester-base: record the tested image id", argv = ["python3", "scripts/release_image.py", "record"], cwd = "." },
]

[steps.run-tests]
quiet = true
commands = [
  { label = "tester-base: run-gate contract lane", argv = ["./run-gate.py", "contract"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "tester-base: give the tested image its version and latest names", argv = ["python3", "scripts/release_image.py", "tag"], cwd = "." },
]

[steps.push]
quiet = true
required_env = ["GITHUB_USERNAME", "GITHUB_PUSH_PAT"]
commands = [
  { label = "tester-base: log in, push the tested image, verify the served digests", argv = ["python3", "scripts/release_image.py", "push"], cwd = "." },
]

