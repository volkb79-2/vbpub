# =============================================================================
# shared-ramdisk-depot-manager project gate lanes — parsed ONLY by Run-Gate CLI
# (one parser, D-110). tools/gate.sh owns its own container mechanics (its
# srdm-gate image, cgroup verification via tools/cgroup-parent.sh, detached
# run + separate verdict read); run-gate owns uniform invocation only — same
# split as assay's self-hosting driver. Bare-host lanes.
#
# environment = "bare-host", not "host" (run-gate RG-43 estate-wide sweep,
# 2026-09-03): as of rev 36, plain "host" is a CONTAINER default with no
# docker-socket mount (verified live via --dry-run) — gate.sh needs real
# docker access to launch its own nested srdm-gate container, the same trap
# assay's own self-hosting driver hit and was fixed the same way
# (assay/run-gate.toml).
# See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.unit]
kind = "command"
environment = "bare-host"
# Meaningful on a dirty tree BY DESIGN (gate.sh's own contract), hence
# clean_tree=false with that written reason.
argv = ["bash", "{worktree}/shared-ramdisk-depot-manager/tools/gate.sh", "{worktree}", "unit"]
clean_tree = false
budget = "20m"
stall_timeout = "20m"
# RG-320/H1: SILENT BY CONSTRUCTION. tools/gate.sh:197-211 runs the suite
# DETACHED (`docker run -d` -> `docker wait` -> `docker logs`): the verdict
# comes from `docker wait`, so the lane's stdout carries nothing at all until
# the suite is over. Declared EQUAL to this lane's budget, so a slow suite
# cannot be reported STALLED. No silence bound has been measured yet; RG-326
# tracks a real progress signal for it.

# Changed-line coverage against $SRDM_COVERAGE_BASE (default main) — needs a
# committed tree; gate.sh exits 3 (NO MEASUREMENT) rather than report a
# vacuous percentage when the diff cannot see the work.
[lanes.coverage]
kind = "command"
environment = "bare-host"
argv = ["bash", "{worktree}/shared-ramdisk-depot-manager/tools/gate.sh", "{worktree}", "coverage"]
budget = "20m"
stall_timeout = "20m"
# RG-320/H1: SILENT BY CONSTRUCTION — the same detached `docker run -d` ->
# `docker wait` -> `docker logs` shape as `unit` above (tools/gate.sh:197-211),
# with the go coverage run inside it writing nothing to this lane's stdout.
# Declared EQUAL to this lane's budget. No silence bound measured yet; RG-326.

[lanes.e2e]
kind = "command"
environment = "bare-host"
argv = ["bash", "{worktree}/shared-ramdisk-depot-manager/tools/gate.sh", "{worktree}", "e2e"]
clean_tree = false
budget = "60m"
# RG-320/RG-326: SILENT BY CONSTRUCTION while gate.sh runs the detached e2e
# container and waits for its verdict; no <=300s stdout cadence; see RG-326.
stall_timeout = "60m"
