# nyxloom project config — assay.
#
# Created as a CONTROLLER CHORE, not by a package: P01's oracles must name a
# gate that already exists, and a package cannot bootstrap the gate that judges
# it (open item A-O01, closed here).
#
# NOTE ON WHAT THE ORDINARY RELEASE GATE CLAIMS. `tester-unified` below remains
# the R0-only self-hosted release lane (A-133, superseded only by B105/A-462's
# separate qualification gate). `self-qualification` is a separately invoked
# full-source R0-R3 gate; it does not silently add mutation cost to releases.
# P14's self-hosting proof still establishes that the ordinary release gate
# runs the built wheel's own tests rather than importing a source-tree shortcut.
# See docs/DESIGN-GUIDE.md §9.

[project]
id = "assay"
default_branch = "main"
trove = "nyxloom-trove"

# assay is a subdir of the vbpub monorepo; git ops resolve upward to vbpub.
worktree_root = "../.worktrees"

# Narrowed from "nyxloom-trove/handoffs/*.md" (A-133): that broader glob also
# matched nyxloom-trove/handoffs/README.md -- a prose file with no frontmatter
# -- and tripped a real `L1 error: missing leading '---'` lint failure. This
# glob names only assay's own handoffs, which all carry the required
# frontmatter.
handoff_globs = ["nyxloom-trove/handoffs/assay-*.md"]

reports_dir          = "nyxloom-trove/reports"
decisions_inbox      = "nyxloom-trove/decisions.md"
archive_dir          = "nyxloom-trove/archive"
archive_keep_visible = 10
agent_logs           = "nyxloom-trove/agent-logs"

# The `roadmap` / `backlog` keys are deliberately absent, matching srdm: they
# opt a project into the numeric-prefixed direction spine that lint rules S1-S4
# then enforce. assay's direction lives in docs/DESIGN-GUIDE.md and the carved
# series; adopt the spine deliberately if it is ever wanted, not as a side
# effect of a bootstrap.

[refs]
design_guide = "docs/DESIGN-GUIDE.md"
decisions    = "nyxloom-trove/decisions.md"
series       = "nyxloom-trove/handoffs/README.md"

# --- gates -------------------------------------------------------------------
#
# assay uses vbpub's shared `tester-unified` container unchanged. Verified
# 2026-08-06 that it already carries the whole closure (python 3.14.6, pytest
# 9.1.1, pytest-cov, coverage 7.15.2, and the stdlib modules assay uses), which
# it does because assay has ZERO runtime dependencies by design (decision
# A-005). So no image rebuild is needed and the gate of ciu, cmru, topos and
# nyxloom is not re-risked -- open item A-O02, closed.
#
# P14 (A-130): SELF-HOSTING. Code no longer reaches the running process
# through a bind-mounted-source-plus-PYTHONPATH shortcut -- the script below
# builds and installs a REAL assay wheel from {worktree}/assay's own checkout
# before running `assay run tester-unified` through THAT wheel-installed
# `assay` -- never an ambient/source-tree copy.
#
# P24 (A-198-A-201): the wheel is no longer built from the ambient interpreter's
# own setuptools reached via a PYTHONPATH shim, and no longer built in place
# from the bind-mounted worktree. It is built from a private, exact-OID,
# `--no-local` sparse clone of `{worktree}` (so ignored build/egg-info/pycache
# residue from the caller's worktree can never enter the wheel, and the clone's
# own HEAD is required to equal the recorded source OID) using a hash-checked,
# `--no-index --require-hashes` offline install of the exact five-wheel closure
# (`setuptools==84.0.0`, `wheel==0.47.0`, `setuptools-scm==10.0.5`,
# `packaging==26.3`, `vcs-versioning==2.2.4`; see `gate/distribution/`) into
# its own `build-venv`. That closure is queried back through
# `importlib.metadata` before building, so a missing/mismatched pin fails
# loudly rather than silently falling through to whatever the ambient
# interpreter happens to have. The built wheel's filename/METADATA version is
# then required to agree and to be neither `0.0.0` nor `0+unknown` -- the old
# placeholder this same image silently produced when `setuptools-scm` was
# absent from the build environment (A-069) is now a hard gate failure, not an
# accepted gap. The resulting wheel installs `--no-index --no-deps` into a
# SEPARATE `run-venv`; the build closure never enters `run-venv`, and neither
# venv ever sees the caller's worktree as an importable source path. `docker
# run` also passes `--network=none`: nothing above can legally reach the
# network, so isolation is enforced at the container boundary too, not only by
# each pip invocation's own flags.
#
# `setuptools` itself is NOT importable from `/opt/tester-venv/bin/python`
# directly (confirmed empirically), which is exactly why the build closure is
# installed into its own fresh `build-venv` rather than relied upon ambiently;
# `conftest.py`'s own `_build_backend_home()` fallback (try the ambient
# interpreter, fall back to its `sys.base_prefix`'s own `python3`) is reused
# only to locate that `sys.base_prefix` interpreter for CREATING `build-venv`
# and `run-venv` -- never to borrow its setuptools. Both venvs are created via
# `/opt/tester-venv/bin/python`'s own `sys.base_prefix`, never `/opt/tester-
# venv`'s pip directly, for the same reason P14 already established: a venv
# created FROM a venv resolves "system site packages" to the ORIGINAL venv's
# own `sys.base_prefix`, not the immediate parent, so pytest/coverage/
# pytest-cov (which live only in `/opt/tester-venv`'s own site-packages) would
# stay invisible to it. Nor can the wheel be installed directly INTO
# `/opt/tester-venv` -- confirmed empirically that its site-packages is not
# writable by the container's own run-uid (`PermissionError`). The fix: a
# `.pth` file (`tester_unified_site.pth`) written into `run-venv`'s OWN
# site-packages, naming `/opt/tester-venv`'s site-packages directory --
# `site.py` appends any path named this way to `sys.path` at interpreter
# startup, which is exactly what `--system-site-packages` was meant to do
# here and does not, in this image, achieve on its own.
# `--override-ini=pythonpath=` on assay.toml's own declared `tester-unified`
# argv (not repeated here) cancels pyproject.toml's `[tool.pytest.ini_options]
# pythonpath = ["src", "analysis/src"]` for this run only (the B105 lanes carry
# no override: they take that pyproject value as it stands) -- confirmed empirically that this
# ini option inserts "src" at sys.path[0] regardless of PATH/PYTHONPATH,
# which would otherwise silently re-shadow the installed wheel with the
# source tree and defeat self-hosting's entire point even after
# `assay.toml`'s own `env` table drops `PYTHONPATH`.
#
# Before self-hosting, the script independently requires (against `run-venv`
# alone): `importlib.metadata.version("assay")` agrees with the wheel's own
# METADATA version and with `assay.__version__`; `importlib.metadata.
# requires("assay")` has no unconditional (non-`extra`-guarded) entry, i.e.
# zero runtime dependencies (A-005); and `assay.__file__` resolves under
# `run-venv` and never under `/workspaces/vbpub` -- so a source-tree shadow or
# a deleted/uninstalled wheel is caught here, before it could otherwise be
# masked by a lucky `sys.path` order downstream. The self-hosted run itself
# still runs against `{worktree}/assay` (the ORIGINAL, reviewed worktree, not
# the private clone) exactly as before; its own emitted `assay_version` is
# then required to equal the version just installed into `run-venv`.
#
# A SEPARATE, second pytest invocation then runs `gate/tests/test_self_hosting.py`
# via tester-unified's OWN ambient `/opt/tester-venv/bin/python` (never
# `run-venv`) -- this is O3's real, independent oracle, not `assay verify`.
# `tests/conftest.py` itself does `from assay.config import ...` at module
# level, so THIS interpreter also needs `assay` importable for collection to
# succeed at all; `PYTHONPATH` is pointed at `run-venv`'s own site-packages
# (the WHEEL's installed location, confirmed empirically to import the wheel
# rather than re-shadowing with source) for this one invocation only, and the
# SAME `--override-ini=pythonpath=` is needed again here for the identical
# reason. `ASSAY_SELF_HOSTING_VERDICT` tells `gate/tests/test_self_hosting.py`
# where the first step's own real verdict landed; unset, that one check skips
# (documented in the test itself) rather than failing a bare developer
# `pytest` run that has no such artifact. `gate/tests/test_self_hosting.py` is
# excluded from the FIRST (self-hosted) collection by assay.toml's own
# `--ignore` flag, so this run is never recursive.
#
# Code otherwise still reaches the container through the BOUND worktree, never
# a baked copy, exactly as the other four Python projects do -- the private
# clone above is made INSIDE the container from that bind mount, not a second
# host-side copy. The registered argv delegates to `tools/tester-unified-
# gate.sh`: it derives the host bind source from this devcontainer's Docker
# mount (or reads the explicit ASSAY_GATE_HOST_REPO_ROOT override), uses
# fail-loud `--mount` rather than Docker's directory-inventing `-v`, disables
# the container's network entirely (`--network=none`), and emits seven inner
# phase markers plus a final host-side marker only after Docker itself returns
# zero. The controller preserves that log/digest; the disposable `--rm`
# container is not evidence.
#
# B123 (S1): after a green container, and only if HEAD and its tree are
# unchanged, the host script writes `assay/.assay/registered-gate/
# tester-unified.json` and prints `ASSAY_REGISTERED_GATE_RECEIPT=<path>` before
# the final marker. The receipt is removed at every launch, and the full
# `self-qualification` lane refuses to start without one for its own commit and
# tree. A host with another `run-gate-*` container running makes the gate exit 3
# (`ASSAY_GATE_INCONCLUSIVE=host busy`), which always means "rerun".
#
# `tools/cgroup-parent.sh` reads CGROUP_PARENT_DEV_GATES and verifies the
# named unit against the host cgroup tree before Docker sees it. An unset
# variable or a missing/unconfigured slice refuses the launch; there is no
# hardcoded fallback to Docker's unconfined default. Preserved EXACTLY as
# before -- the single easiest thing to break while restructuring the rest of
# this script (O4).
#
# The Topos qualification phase is retired (A-475). The registered tester gate
# now includes the SQL witness after the sequential 60m tester and analysis
# lanes. run-gate's 5h execution budget starts after admission; this 6h
# controller timeout also leaves 1h for admission and startup.

[gates.tester-unified]
# SSOT pointer (D-110/D-111): the lane lives in assay/run-gate.toml (host lane
# invoking tools/tester-unified-gate.sh, which owns its own container
# mechanics — exact-OID clone, pinned build closure, detached run).
argv = ["bash", "-c", "cd {worktree}/assay && exec ./run-gate.py --worktree {worktree} tester-unified"]
phase = "implementation"
asserts = ["tests-pass"]
timeout_seconds = 21600
environment = "tester-unified"

[gates.self-qualification]
# B105's deliberately invoked full-source R0-R3 campaign is separate from the
# ordinary R0 release gate above. run-gate places it in tester-unified and the
# inner driver verifies the exact verdict before reporting success.
# The in-container B105 driver command has a 7h30m timeout, which excludes
# run-gate/container startup and outer evidence collection. Assay's 5-hour
# lane budget follows its separate 60-minute preflight. Nyxloom's 8-hour
# controller timeout is an outer failsafe, not a campaign-wide deadline.
# Expiry is incomplete, never a candidate outcome or qualification pass.
argv = ["bash", "-c", "cd {worktree}/assay && exec ./run-gate.py --worktree {worktree} self-qualification"]
phase = "implementation"
asserts = ["tests-pass"]
timeout_seconds = 28800
environment = "tester-unified"

[gates.self-qualification-preflight]
# R0/R1-only diagnosis of the exact source inventory and branch floor. The
# full B105 gate runs this first and does not begin native mutation if the
# baseline suite or whole-source coverage is red.
argv = ["bash", "-c", "cd {worktree}/assay && exec ./run-gate.py --worktree {worktree} self-qualification-preflight"]
phase = "implementation"
asserts = ["tests-pass"]
timeout_seconds = 3600
environment = "tester-unified"

[mutexes.merge-lane]
scope = "project"
capacity = 1

[policy]
max_active_tasks = 1
ready_queue_target = 2
carve_ahead_target = 0
max_attempts_per_task = 3
merge_mode = "manual"
retention_days = 60
reconcile_interval_seconds = 30
