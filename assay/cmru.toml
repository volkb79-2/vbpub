schema_version = 1

[runtime]
kind = "none"

[env]
ASSAY_RELEASE_NOTES = "## assay wheel + zipapp\n\nDeclared test lanes and machine-readable verdicts for a commit.\n\n**Install (wheel)**\n```bash\npipx install assay-*.whl\n```\n\n**No package manager? Use the zipapp**\n```bash\nchmod +x assay-*.pyz && ./assay-*.pyz --help\n```"

[project]
id = "assay"
description = "Reproducible, lane-aware software testing and evidence tool."
template_revision = 4
prefix = "assay-v"
artifacts = ["wheel"]
scm_dist = "assay"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  { label = "assay: registered self-hosted gate", argv = ["bash", "tools/tester-unified-gate.sh", ".."], cwd = "." },
  # B169/B170 (operator decision 2026-10-27): R0, R1 over all of src/assay and the
  # R3 canary, with R2 explicitly postponed (records .assay/mutation-postponed-assay.json;
  # valid only below assay 10.1.0, the full `self-qualification` lane is unchanged).
  { label = "assay: provisional full-source qualification (R0, R1, R3; R2 postponed)", argv = ["run-gate", "self-qualification-provisional"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "assay: hash-bound wheel and zipapp build", argv = ["python3", "gate/distribution/build_release.py", "--repo", "..", "--outdir", "dist"], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "assay: publish wheel, zipapp, and manifest", argv = ["cmru", "handler", "wheel-publish", "--prefix", "assay", "--cwd", ".", "--notes-env", "ASSAY_RELEASE_NOTES", "--extra-asset", "dist/assay-*.pyz", "--extra-asset", "dist/assay-*.pyz.sha256", "--extra-asset", "dist/release-manifest.json", "--extra-asset", "dist/release-manifest.json.sha256"], cwd = "." },
]
