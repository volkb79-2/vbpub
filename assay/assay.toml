# assay's own lane declaration.
#
# A-046 — a lane file declares WHAT EXISTS, not a target architecture. assay's
# subject matter is changed-line coverage, canaries and mutation, and it has
# none of them yet. Declaring R1/R2/R3 here today would be the
# lane-table-implies-capability failure this project exists to remove, committed
# in assay's own config on day one. So: R0 only, and therefore NO [judge] table
# at all, which is exactly what A-048 says an R0-only lane looks like.
#
# The ordinary release lane stays R0-only (A-133, superseded only for the
# separate B105 qualification lane by A-462). Self-qualification is explicit,
# expensive, full-source R0-R3 evidence; it does not change the release lane's
# default cost or release semantics. Both declarations run in tester-unified.

schema_version = 2

[lanes.tester-unified]
scope = "S1"
rigor = ["R0"]
enforcement = "gate"

# The command the gate runs. The INTERPRETER path used in the container
# (/opt/tester-venv/bin/python) is a fact of WHERE and lives in
# nyxloom-trove/nyxloom.toml, not here (A-015).
#
# A-130: `argv[0]="python"` resolves, via env_passthrough's PATH below, to
# whichever interpreter nyxloom-trove/nyxloom.toml's gate script put first on
# PATH -- the scratch venv the gate builds+installs assay's OWN wheel into,
# never a source-tree PYTHONPATH shadow (see the `env` table's own comment).
# `--override-ini=pythonpath=` cancels pyproject.toml's OWN
# `[tool.pytest.ini_options] pythonpath = ["src"]` (a developer convenience,
# DESIGN-GUIDE §9's last paragraph) for exactly this run -- confirmed
# empirically that ini option inserts "src" at sys.path[0] regardless of
# PATH/PYTHONPATH, which would silently re-shadow the installed wheel with
# the source tree and defeat self-hosting's whole point even after `env`
# below drops PYTHONPATH. `--ignore=tests/test_self_hosting.py` excludes
# assay's OWN self-hosting conformance proof from this collection: that
# module both reads the artifact THIS run is about to emit (a file that does
# not exist yet while this run is still in progress) and independently
# invokes `assay run tester-unified` again for A-131's own producer-mutation
# proof -- without this exclusion, either would make a self-hosted run
# collect and (in the mutation case) recursively re-run part of itself one
# further level deep.
argv = ["python", "-m", "pytest", "tests", "-q", "--ignore=tests/test_self_hosting.py", "--override-ini=pythonpath="]

# A-019: declared-only, never "augment the ambient environment". `PYTHONPATH`
# is GONE (A-130): keeping it would put the source tree back on sys.path
# ahead of the scratch venv's site-packages, re-shadowing the just-built
# wheel and making every "self-hosted" run secretly import from source again
# -- defeating the entire point of this package. Code now reaches the running
# process through the WHEEL nyxloom-trove/nyxloom.toml's gate script builds
# and installs, never a bind-mounted source copy.
env = {}
env_passthrough = ["PATH"]

# Read from the gate's own timeout_seconds = 3600 in nyxloom-trove/nyxloom.toml
# rather than invented. P25 widened that gate timeout (the topos-qualified
# phase adds the full 2,923-test pinned Topos suite, and this lane's own
# `pytest tests` now also runs the harness's real full-pipeline tests), so this
# budget moves with it -- test_self_lane.py asserts the two never drift apart.
budget = "60m"

allow_argv_append = false

# B105: explicitly invoked full-source self-qualification. The test module
# test_self_hosting.py is excluded because it recursively runs assay lanes and
# reads this run's not-yet-written verdict; the ordinary tester-unified release
# lane independently runs that self-hosting proof. Every production source file
# is named literally below: whole_target does not expand directories.
#
# Unlike the R0 wheel lane above, these snapshot commands must import
# `src/assay` from the exact baseline/mutant snapshot so coverage and R2 judge
# the tree being measured. The project-root history is also required by tests
# that read pinned commits, so snapshot_history is full. Snapshots deliberately
# do not carry refs/tags; the two release-tag audit tests are therefore named
# as explicit deselections here and still run in the ordinary checkout-based
# release gate.
[lanes.self-qualification]
scope = "S1"
rigor = ["R0", "R1", "R2", "R3"]
enforcement = "gate"
argv = [
  "python", "-m", "pytest", "tests", "-q",
  "--ignore=tests/test_self_hosting.py",
  "--deselect=tests/test_runner_snapshot_selection.py::test_every_release_since_wi1_landed_carries_wi4s_policy_record",
  "--deselect=tests/test_runner_snapshot_selection.py::test_wi1s_own_landing_commit_is_the_state_the_embargo_forbids",
  "--override-ini=pythonpath=src",
  "--cov=src/assay", "--cov-branch",
  "--cov-report=json:.assay/coverage-self-qualification.json",
]
env = {}
env_passthrough = ["PATH", "ASSAY_B105_COVERAGE_SOURCE", "ASSAY_B105_COVERAGE_ARCHIVE"]
budget = "unbounded"
allow_argv_append = false

[lanes.self-qualification.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
snapshot_history = "full"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.self-qualification.judge]
language = "python"
source_roots = ["src/assay"]
mode = "whole_target"
targets = [
  "src/assay/__init__.py",
  "src/assay/adapters/__init__.py",
  "src/assay/adapters/base.py",
  "src/assay/adapters/go.py",
  "src/assay/adapters/go_modfile.py",
  "src/assay/adapters/go_stmtpos.py",
  "src/assay/adapters/javascript.py",
  "src/assay/adapters/python.py",
  "src/assay/adapters/sql.py",
  "src/assay/adapters/sql_lex.py",
  "src/assay/adjudication.py",
  "src/assay/analysis.py",
  "src/assay/attestation.py",
  "src/assay/canary.py",
  "src/assay/candidate_identity.py",
  "src/assay/cli.py",
  "src/assay/config.py",
  "src/assay/coverage.py",
  "src/assay/coverage_parsers/__init__.py",
  "src/assay/coverage_parsers/cobertura.py",
  "src/assay/coverage_parsers/coverage_istanbul_json.py",
  "src/assay/coverage_parsers/coverage_py_json.py",
  "src/assay/coverage_parsers/go_cover.py",
  "src/assay/coverage_parsers/lcov.py",
  "src/assay/coverage_parsers/model.py",
  "src/assay/diff.py",
  "src/assay/errors.py",
  "src/assay/evaluate.py",
  "src/assay/git.py",
  "src/assay/isolation.py",
  "src/assay/liveness.py",
  "src/assay/measurability.py",
  "src/assay/mutation.py",
  "src/assay/mutation_parsers/__init__.py",
  "src/assay/mutation_parsers/model.py",
  "src/assay/mutation_parsers/mutation_report_json.py",
  "src/assay/mutation_witness.py",
  "src/assay/output.py",
  "src/assay/provenance.py",
  "src/assay/registry.py",
  "src/assay/result_reports/__init__.py",
  "src/assay/result_reports/model.py",
  "src/assay/result_reports/vitest_json.py",
  "src/assay/reuse.py",
  "src/assay/runner.py",
  "src/assay/safeio.py",
  "src/assay/statement_attribution.py",
  "src/assay/verdict.py",
  "src/assay/verify.py",
  "src/assay/vocabulary.py",
]
fail_under = 100.0
allow_excluded = false
require_branch = true

[lanes.self-qualification.judge.coverage]
format = "coverage-py-json"
artifact = ".assay/coverage-self-qualification.json"

[lanes.self-qualification.judge.mutation]
jobs = 1
max_mutants = 10000
operators = ["python:compare-swap", "python:boolop-swap", "python:bool-const-flip", "python:falsy-swap"]
budget_per_candidate = "auto"
liveness = true

[lanes.self-qualification.judge.canary]
mechanism = "import-break"
target = "src/assay/cli.py"
budget_per_attempt = "30m"

# B105: R0/R1 coverage preflight, also used by the full qualification gate.
[lanes.self-qualification-preflight]
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = [
  "python", "-m", "pytest", "tests", "-q",
  "--ignore=tests/test_self_hosting.py",
  "--deselect=tests/test_runner_snapshot_selection.py::test_every_release_since_wi1_landed_carries_wi4s_policy_record",
  "--deselect=tests/test_runner_snapshot_selection.py::test_wi1s_own_landing_commit_is_the_state_the_embargo_forbids",
  "--override-ini=pythonpath=src",
  "--cov=src/assay", "--cov-branch",
  "--cov-report=json:.assay/coverage-self-qualification-preflight.json",
]
env = {}
env_passthrough = ["PATH", "ASSAY_B105_COVERAGE_SOURCE", "ASSAY_B105_COVERAGE_ARCHIVE"]
budget = "60m"
allow_argv_append = false

[lanes.self-qualification-preflight.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
snapshot_history = "full"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.self-qualification-preflight.judge]
