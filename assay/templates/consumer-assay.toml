# Assay consumer template — copy to <your-project>/assay.toml, then replace every fact.
# A lane declares exactly what it can prove; do not claim R1/R2/R3 until the
# required coverage/mutation/canary contract and its dedicated gate are real.
schema_version = 1

[lanes.unit]
scope = "S1"
rigor = ["R0"]
enforcement = "gate"
argv = ["/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q"]
env = {}
env_passthrough = []
budget = "20m"
allow_argv_append = false

