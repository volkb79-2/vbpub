# Build toolchain pinned exactly, matching ciu/cmru/nyxloom/topos, so wheel
# builds are reproducible (same toolchain + SOURCE_DATE_EPOCH -> identical
# sha256).
[build-system]
requires = [
    "setuptools==84.0.0",
    "wheel==0.47.0",
    "setuptools-scm==10.0.5",
    "packaging==26.3",
    "vcs-versioning==2.2.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
dynamic = ["version"]
description = "assay — how to judge a change: declared lanes, declared rigor, one machine-readable verdict"
requires-python = ">=3.11"

# ZERO RUNTIME DEPENDENCIES (decision A-005). stdlib only. This list staying
# empty is what makes the standalone claim near-unfalsifiable and the
# scratch-venv test in tests/test_dependency_purity.py trivially offline. assay
# consumes coverage.py's *output*; it never imports coverage.py or pytest.
dependencies = []

[project.optional-dependencies]
# tester-unified SoT: assay's test closure lives here. A-005 constrains RUNTIME
# dependencies only, so a validator is legitimate here (A-056) — jsonschema is
# what P01b's schema tests validate against, and hand-rolling one would prove
# the hand-rolled checker rather than the schema.
test = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4"]

[project.scripts]
assay = "assay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# A-029: consumers validate an artifact against a JSON Schema shipped AS DATA,
# without importing assay. Without this stanza the schema exists in the source
# tree and VANISHES on install — every in-tree test stays green while every
# installed consumer gets nothing. Verified in the gate image: with it the wheel
# carries `assay/schemas/verdict.schema.json`; without it the wheel carries only
# `assay/__init__.py`. tests/test_verdict_schema_is_packaged.py proves both
# sides.
[tool.setuptools.package-data]
# The Go statement-position oracle (B047 item 1, A-217) ships as SOURCE inside
# the wheel and is invoked with `go run` -- B047's recommended option (a) over
# option (b), a separately built binary, because the source is then covered by
# `judge_provenance` and needs no second artifact to pin.
#
# MEASURED, not assumed (A-396): these patterns are currently INERT. Built with
# this whole stanza deleted, the wheel still carries
# `assay/helpers/go/stmtpos/{stmtpos.go,go.mod}` AND
# `assay/schemas/verdict.schema.json`, because `setuptools_scm` (below)
# installs a git file finder and setuptools' `include_package_data` defaults to
# true under pyproject metadata, so every GIT-TRACKED file under the package
# directory ships already.
#
# They are declared anyway, for the one scenario this project's own config
# anticipates: `[tool.setuptools_scm]` sets `fallback_version`, which is
# reachable only when git metadata is absent -- and in that build the file
# finder returns nothing and package data is the only thing left declaring
# what ships. Declaring it also makes wheel contents a stated fact rather than
# a consequence of git tracking. What actually PROVES the helper ships, under
# whichever mechanism, is `tests/test_go_helper_is_packaged.py`, which reads
# the built wheel's own namelist.
assay = [
    "schemas/*.json",
    "helpers/go/stmtpos/*.go",
    "helpers/go/stmtpos/go.mod",
]

# Version is derived from git tags by setuptools-scm (no clock, no manual bump),
# matching the estate's other wheel projects. `root = ".."` because the git root
# is one level up (the vbpub monorepo), same as ciu/nyxloom/topos.
#
# fallback_version is REQUIRED here, not decoration (A-057): there is no
# `assay-v*` tag in the repo, so with `root = ".."` a build from a copied tree
# fails with `LookupError: setuptools-scm was unable to detect version`.
# Verified empirically in the gate image.
[tool.setuptools_scm]
root = ".."
tag_regex = "^assay-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "assay-v*"]
fallback_version = "0.1.0"

# Developer convenience only. Per A-040 a bare-pytest green is explicitly NOT a
# ship signal; the gate is `tester-unified` and nothing else.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
