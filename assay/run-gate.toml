# =============================================================================
# assay project gate lanes — parsed ONLY by Run-Gate CLI (one parser, D-110).
# The self-hosting driver (tools/tester-unified-gate.sh) owns its own
# container mechanics: exact-OID private clone, hash-pinned offline build
# closure, two-venv install, detached run with verified cgroup placement, and
# a cgroup-visible SQL qualification runner with a phase-scoped Docker socket.
# run-gate owns uniform invocation only; putting that driver INSIDE an
# ephemeral container would be wrong (it launches its own). Host lane.
# Judgment policy stays in assay.toml. `tester-unified` remains the ordinary
# R0 release lane; the B105 lanes are separately invoked full-source R0-R3
# qualification, while B110's registered modes measure a bounded pilot or
# complete survivor screen. The bare-host Assay wrapper launches a bounded,
# cgroup-visible tester-unified container because the generic run-gate
# container has a private cgroup namespace.
# Bare-host command lanes do not receive run-gate's container RAM admission or
# Docker caps; the B105 wrapper verifies 2 GiB of point-in-time host-slice
# headroom, then enforces 3 CPUs, 2 GiB RAM, and 8 GiB RAM+swap on its child.
# `resources.shared` serializes these Assay lanes in one run-gate namespace; a
# separate Git-common-dir flock serializes B105 callers across container /tmp
# namespaces. Cross-project gates may run concurrently; R0 and R3 attribute
# failed commands to their own cgroup evidence, while R2 keeps its existing
# candidate-local counters and pressure-aware liveness.
#
# environment = "bare-host", not "host" (run-gate RG-43 estate-wide sweep,
# 2026-09-03): as of rev 36, plain "host" is a CONTAINER default with no
# docker-socket mount (verified live via --dry-run: its own `docker run`
# argv carries no `-v /var/run/docker.sock:...`) — this driver needs REAL
# docker access to launch its own nested build and SQL qualification
# containers, the same trap debian-install-v2's r1-vm-real-commit/gate lanes
# hit and were fixed the same way (scripts/debian-install-v2/run-gate.toml).
# =============================================================================
schema_version = 1

[lanes.tester-unified]
kind = "command"
environment = "bare-host"
argv = ["bash", "{worktree}/assay/tools/tester-unified-gate.sh", "{worktree}"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
# clean_tree=false WITH reason: the driver builds from an exact-OID clone of
# HEAD, so caller scratch cannot enter the judged build — a dirty worktree is
# not evidence contamination on this path. (The doctrine default returns with
# any future in-container assay lane.)
clean_tree = false
# This outer bound covers the two sequential 60m assay lanes, B145's explicit
# launch/wait/log/removal bounds, and the SQL runner's bounded wait. Keep a
# further 20m for clone/startup/cleanup; test_self_lane.py derives these bounds.
budget = "5h"

# Pre-merge verification for tooling, lane-table and waiver-document changes.
# It includes the three groups that escaped the 12.1.0 pre-merge set (the B105
# checker, release-gate HOME handling, and the docs R2-window binding). This is
# a tester-unified command lane, not an Assay qualification or release receipt.
# The fixed files are the release-attempt failure groups plus the cross-cutting
# contract tests a behaviour change in one module can break in another: the
# shared termination table and its three consumers, the verify import trust
# boundary, the reviewed dataclass contract and the B105 exclusion fixture
# (assay 12.2.0 release attempt cd77603bb, B533). They run in seconds.
[lanes.tooling-tests]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/assay
export PYTHONDONTWRITEBYTECODE=1
tooling_tmp="$(mktemp -d /tmp/assay-tooling-tests.XXXXXXXX)"
trap 'rm -rf "$tooling_tmp"' EXIT
/opt/tester-venv/bin/python3 -m venv "$tooling_tmp/venv"
tester_site="$(/opt/tester-venv/bin/python3 -c 'import site; print(site.getsitepackages()[0])')"
venv_site="$("$tooling_tmp/venv/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
printf '%s\n' "$tester_site" >"$venv_site/tester-site.pth"
PYTHONPATH="$tester_site" \
  "$tooling_tmp/venv/bin/python" -m pip install \
  --quiet --no-build-isolation --no-deps -e {worktree}/assay
export PYTHONPATH="analysis/src:{worktree}/libraries/cowtree/src"
"$tooling_tmp/venv/bin/python" -m pytest -q -p no:cacheprovider \
  gate/tests/test_b105_report_check.py \
  gate/tests/test_distribution_gate.py \
  gate/tests/test_release_gate.py \
  gate/tests/test_self_qualification_container.py \
  tests/core/test_docs_examples_and_vocabulary.py \
  tests/core/test_termination.py \
  tests/core/test_termination_alignment.py \
  tests/core/test_canary_receipt.py \
  tests/core/test_trust_boundary.py \
  tests/core/test_dataclass_contract.py \
  tests/core/test_b105_source_coverage_controls.py "$@"''',
  "tooling-tests",
]
accepts_args = true
clean_tree = false
budget = "30m"

[lanes.tooling-tests.resources]
memory = "1g"

# Re-run only the contention-sensitive hung Docker client test while a sibling
# CPU burner runs in the same tester-unified container. This measures the test
# fixture's handshake, not Assay qualification.
[lanes.hang-test-contention]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/assay
export PYTHONPATH="src:analysis/src:{worktree}/libraries/cowtree/src"
export PYTHONDONTWRITEBYTECODE=1
/usr/bin/yes >/dev/null &
burner=$!
trap 'kill "$burner" 2>/dev/null || true; wait "$burner" 2>/dev/null || true' EXIT
for iteration in {1..20}; do
  printf '%s\n' "hung Docker fixture run $iteration/20"
  nice -n 10 /opt/tester-venv/bin/python3 -m pytest -q -p no:cacheprovider \
    gate/tests/test_self_qualification_container.py::test_hung_docker_client_is_bounded_and_cleanup_is_conservative
done''',
]
clean_tree = false
budget = "10m"

[lanes.hang-test-contention.resources]
memory = "1g"

[lanes.self-qualification]
kind = "command"
environment = "bare-host"
argv = ["bash", "{worktree}/assay/tools/self-qualification-container.sh", "{worktree}", "self-qualification"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
clean_tree = true
# The persisted B117 campaign deadline bounds preflight and full qualification
# together. Assay still caps preflight at 60m and the full lane at 5h. This
# 7h30m timeout and nyxloom's 8h watchdog are failsafes only; if either fires,
# the run fails and any verdict is untrusted. The timeout starts inside
# tester-unified, so it excludes run-gate/container startup.
budget = "8h"
artifacts = [
  ".assay/verdict-self-qualification.json",
  ".assay/progress-self-qualification.jsonl",
  ".assay/verdict-self-qualification-preflight.json",
  ".assay/progress-self-qualification-preflight.jsonl",
  ".assay/coverage-self-qualification-preflight-snapshots",
  ".assay/r2-manifest-self-qualification.txt",
]

[lanes.self-qualification-preflight]
kind = "command"
environment = "bare-host"
argv = ["bash", "{worktree}/assay/tools/self-qualification-container.sh", "{worktree}", "self-qualification-preflight"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
clean_tree = true
budget = "75m"
# This standalone preflight creates its own b105-pre-* campaign deadline.
artifacts = [
  ".assay/verdict-self-qualification-preflight.json",
  ".assay/progress-self-qualification-preflight.jsonl",
  ".assay/coverage-self-qualification-preflight-snapshots",
]

# B169/B170 (operator decision 2026-10-27, extended 2026-10-31): full
# qualification minus R2.
# R0, R1 (whole-target line and branch over src/assay) and the R3 canary run;
# R2 mutation is explicitly postponed and the run records
# .assay/mutation-postponed-assay.json (deferral evidence, never an R2 pass).
# Valid only below assay 12.2.0 (extended 2026-11-08 for the E4 env-only
# launchers and delegated release-gate changes; R2 runs later on the latest
# release); the full `self-qualification` lane is unchanged
# and clears the marker. The campaign deadline is its own b105-prov-* file.
[lanes.self-qualification-provisional]
kind = "command"
environment = "bare-host"
argv = ["bash", "{worktree}/assay/tools/self-qualification-container.sh", "{worktree}", "self-qualification-provisional"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
clean_tree = true
budget = "210m"
artifacts = [
  ".assay/verdict-self-qualification-provisional.json",
  ".assay/progress-self-qualification-provisional.jsonl",
  ".assay/mutation-postponed-assay.json",
]

# A-474 / B110 P7: the bounded pilot is a non-qualifying measurement. Campaign
# init happens after clone/build/venv setup and before plan/selection. Campaign
# init, planning, selection and Assay execution share one hard 90m
# per-invocation cap; planning and selection are also bounded at each stage by
# the remaining 2h campaign deadline. Assay execution uses only the remaining
# cap, followed by at most 30s for termination. The persisted campaign deadline
# remains the absolute retry bound. The 2h15m docker wait includes a planned
# <=10m setup allowance, the 2h campaign and 5m for log/cleanup; the 2h20m
# command timeout adds outer run-gate margin. The gate report must measure and
# confirm setup time. The
# launcher owns the cgroup-visible child.
[lanes.b110-pilot]
kind = "command"
environment = "bare-host"
argv = ["timeout", "--verbose", "--signal=TERM", "--kill-after=30s", "8400s", "bash", "{worktree}/assay/tools/self-qualification-container.sh", "{worktree}", "b110-pilot"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
clean_tree = true
budget = "140m"
artifacts = [
  ".assay",
  ".assay/b110-pilot-plan.json",
  ".assay/b110-pilot-candidates.txt",
  ".assay/b110-pilot-selection.json",
  ".assay/b110-pilot-summary.json",
  ".assay/b110-pilot-run.log",
  ".assay/r2-manifest-b110-pilot.txt",
  ".assay/b110-pilot-attempt-window.json",
  ".assay/b110-pilot-attempt.log",
  ".assay/b110-pilot-artifacts.sha256",
  ".assay/b110-pilot-evidence",
  ".assay/b110-pilot-evidence.receipt.json",
  ".assay/b110-pilot-evidence.attestation.json",
  ".assay/b110-pilot-evidence.pending.json",
  ".assay/b110-pilot-evidence-archive",
  ".assay/b110-pilot-evidence-incomplete",
  ".assay/b110-pilot-evidence-unverified",
  ".assay/b110-pilot-state",
  ".assay/progress-b110-pilot.jsonl",
]

# B131 measures analysis-package R2 independently from B105. The selector,
# state store and report checker bind the bounded sample to the exact plan,
# commit, tree, wheel, campaign deadline, collected test manifest,
# cold-witness/resource evidence and per-candidate measurements.
# The campaign deadline filename includes the judged commit. The registered
# host runner emits its resolved path in the lane output; `.assay` remains the
# containing state-directory artifact, not a substitute for naming that file.
# The resumable B131 state directory is commit-scoped and is captured by the
# `.assay` artifact above.
[lanes.analysis-r2-pilot]
kind = "command"
environment = "bare-host"
argv = ["timeout", "--verbose", "--signal=TERM", "--kill-after=30s", "8400s", "bash", "{worktree}/assay/tools/self-qualification-container.sh", "{worktree}", "analysis-r2-pilot"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
clean_tree = true
budget = "140m"
artifacts = [
  ".assay",
  ".assay/analysis-r2-pilot-plan.json",
  ".assay/analysis-r2-pilot-candidates.txt",
  ".assay/analysis-r2-pilot-selection.json",
  ".assay/analysis-r2-pilot-summary.json",
  ".assay/analysis-r2-pilot-run.log",
  ".assay/analysis-r2-pilot-attestation.json",
  ".assay/r2-manifest-analysis-r2-pilot.txt",
  ".assay/progress-analysis-r2-pilot.jsonl",
]

# Non-qualifying survivor screen (B110 plan §9.1). It is never B105 evidence
# except through the B119 import path; use for pre-deadline records awaits the
# operator's D7 answer (C8). The Assay lane itself has a 5h budget; the 7h10m
# inner timeout, 7h15m container wait and 7h30m command timeout are failure
# failsafes and leave cleanup time under the 8h run-gate budget. The launcher
# owns the cgroup-visible child.
[lanes.b110-screen]
kind = "command"
environment = "bare-host"
argv = ["timeout", "--verbose", "--signal=TERM", "--kill-after=30s", "27000s", "bash", "{worktree}/assay/tools/self-qualification-container.sh", "{worktree}", "b110-screen"]
exit_map = { "3" = "ERROR" }
resources = { shared = ["assay-self-qualification"] }
clean_tree = true
budget = "8h"
artifacts = [
  ".assay/b110-screen-plan.json",
  ".assay/verdict-b110-screen.json",
  ".assay/b110-screen-run.log",
  ".assay/progress-b110-screen.jsonl",
]
