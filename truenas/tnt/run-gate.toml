# tnt's executable gate matrix. M1/M2 and pre-It1 work use r0-r1 (unit tests; the mutation lane is It4: TNT-30).
# No test touches a real host: the live lane is a separate, operator-run lane (docs/DESIGN.md section 9).
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 setuptools_scm==10.0.5 && SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+gate.test /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest tests -q -p no:xdist --cov=tnt --cov-branch --cov-fail-under=97 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "20m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"

[lanes.ux-focused]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 setuptools_scm==10.0.5 && SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+gate.test /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest -q -p no:xdist tests/test_management_core_views.py tests/test_tui.py tests/test_tui_hosts.py tests/test_tui_ux.py tests/test_tui_tmux.py",
]
clean_tree = false
budget = "10m"

[lanes.ux-focused.resources]
memory = "1g"

# The opt-in live lane runs inside tester-unified as well. Keep these host
# inputs explicit and forward only the private file paths and test parameters
# needed by the test process. The caller supplies RUN_GATE_EXTRA_MOUNTS for
# the out-of-repository scratch directory containing tnt.toml and
# tnt.secrets.toml. The left side must be the Docker host's physical path; the
# right side is where the tester sees it and must match the forwarded paths.
[environments.tnt-live]
mode = "ephemeral"
image = "tester-unified:local"
image_env = "RUN_GATE_TESTER_UNIFIED_IMAGE"
cgroup_slice_env = "CGROUP_PARENT_DEV_GATES"
forward_env = [
  "CGROUP_PARENT_DEV_BACKGROUND",
  "RUN_GATE_RELEASE_WHEEL_RECEIPT",
  "TNT_CONFIG",
  "TNT_SECRETS",
  "TNT_LIVE",
  "TNT_LIVE_PROFILE",
  "TNT_LIVE_POOL",
  "TNT_LIVE_GROUP_ID",
  "TNT_LIVE_CONTAINER_IMAGE_NAME",
  "TNT_LIVE_CONTAINER_IMAGE_VERSION",
  "TNT_LIVE_VM_MEMORY_MIB",
  "TNT_LIVE_VM_DISK_BYTES",
  "TNT_LIVE_INSECURE",
]

[environments.tnt-live.resources]
cpus = "3"

[lanes.live-v27]
kind = "command"
environment = "tnt-live"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 setuptools_scm==10.0.5 && SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+gate.test /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest -q -p no:xdist -m live tests/live",
]
required_env = [
  "TNT_CONFIG",
  "TNT_SECRETS",
  "TNT_LIVE",
  "TNT_LIVE_PROFILE",
  "TNT_LIVE_POOL",
  "TNT_LIVE_GROUP_ID",
  "TNT_LIVE_CONTAINER_IMAGE_NAME",
  "TNT_LIVE_CONTAINER_IMAGE_VERSION",
  "TNT_LIVE_VM_MEMORY_MIB",
  "TNT_LIVE_VM_DISK_BYTES",
]
clean_tree = false
budget = "60m"
stall_timeout = "15m"

[lanes.live-v27.resources]
memory = "1g"
