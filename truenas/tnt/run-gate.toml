# tnt's executable gate matrix. CMRU release gates run r0-r1 and ux-focused.
# tester-unified installs tmux (TNT-54); the r0-r1, ux-focused and R2 suites
# require it, and fail if it is missing. The local-development skip is disabled
# in each registered gate.
# No test touches a real host: live-v27 is a separate, operator-run lane (docs/DESIGN.md section 9).
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && unset TNT_TEST_ALLOW_MISSING_TMUX_FOR_LOCAL_DEV && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest tests -q -p no:xdist --cov=tnt --cov-branch --cov-fail-under=97 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "20m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"

[lanes.ux-focused]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && unset TNT_TEST_ALLOW_MISSING_TMUX_FOR_LOCAL_DEV && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest -q -p no:xdist tests/test_management_core_views.py tests/test_tui.py tests/test_tui_hosts.py tests/test_tui_ux.py tests/test_tui_tmux.py",
]
clean_tree = false
budget = "10m"

[lanes.ux-focused.resources]
memory = "1g"

# R2 (mutation) lane. Command lane, modelled on libraries/cli-extended/run-gate.toml
# [lanes.r2]: the tester venv lacks truenas_api_client, so the pinned client and tnt
# are installed once here, then the worktree's Assay judges the `tnt` lane declared in
# assay.toml (resumable; verdict in .assay/verdict-r2.json). NOT part of the cmru
# release gate (cmru.toml runs r0-r1 and ux-focused only); start it after R0/R1/R3 and
# review pass, from a committed clean worktree. The operator starts every attempt:
#   run-gate r2 --worktree <same committed worktree>
# After each BUDGET_EXCEEDED result, run that command again against the same
# worktree and commit. Assay resumes completed candidates from
# .assay/mutation-state-r2; a budget-ended attempt is incomplete, not a verdict.
# There is no --campaign-deadline, so there is no campaign-wide clock. Assay's
# 24h budget applies to each invocation; Run-Gate's 25h budget includes setup.
# At the measured rate, the ~64h campaign needs about three invocations.
# --jobs 3 equals judge.mutation.jobs_max and the lane's 3 CPUs.
[lanes.r2]
kind = "command"
resource_observer = "cgprofile"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && export PYTHONPATH={worktree}/assay/src:{worktree}/libraries/cowtree/src && mkdir -p .assay && exec /opt/tester-venv/bin/python3 -m assay.cli run tnt --file assay.toml --jobs 3 --resume --state-dir .assay/mutation-state-r2 --progress .assay/progress-r2.jsonl --verdict-json .assay/verdict-r2.json",
]
clean_tree = true
budget = "25h"
artifacts = [".assay/verdict-r2.json", ".assay/progress-r2.jsonl"]

[lanes.r2.resources]
memory = "3g"
pids = 8192
cpus = "3"

# The opt-in live lane runs inside tester-unified as well. Keep these host
# inputs explicit and forward only the private file paths and test parameters
# needed by the test process. The caller supplies RUN_GATE_EXTRA_MOUNTS for
# the out-of-repository scratch directory containing tnt.toml and
# tnt.secrets.toml. The left side must be the Docker host's physical path; the
# right side is where the tester sees it and must match the forwarded paths.
[environments.tnt-live]
mode = "ephemeral"
image = "tester-unified:local"
image_env = "RUN_GATE_TESTER_UNIFIED_IMAGE"
cgroup_slice_env = "CGROUP_PARENT_DEV_GATES"
forward_env = [
  "CGROUP_PARENT_DEV_BACKGROUND",
  "RUN_GATE_RELEASE_WHEEL_RECEIPT",
  "TNT_CONFIG",
  "TNT_SECRETS",
  "TNT_LIVE",
  "TNT_LIVE_PROFILE",
  "TNT_LIVE_POOL",
  "TNT_LIVE_GROUP_ID",
  "TNT_LIVE_CONTAINER_IMAGE_NAME",
  "TNT_LIVE_CONTAINER_IMAGE_VERSION",
  "TNT_LIVE_VM_MEMORY_MIB",
  "TNT_LIVE_VM_DISK_BYTES",
  "TNT_LIVE_INSECURE",
  "TNT_LIVE_ALLOW_SYSTEM",
  "TNT_LIVE_UPDATE_PHASE",
  "TNT_LIVE_UPDATE_SOURCE_VERSION",
  "TNT_LIVE_UPDATE_TARGET_PROFILE",
  "TNT_LIVE_UPDATE_TARGET_VERSION",
  "TNT_LIVE_UPDATE_TARGET_TRAIN",
  "TNT_LIVE_UPDATE_DATASET",
  "TNT_LIVE_UPDATE_SNAPSHOT",
  "TNT_LIVE_UPDATE_CANONICAL_SHA256",
]

[environments.tnt-live.resources]
cpus = "3"

[lanes.live-v27]
kind = "command"
environment = "tnt-live"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest -q -p no:xdist -m live tests/live",
]
required_env = [
  "TNT_CONFIG",
  "TNT_SECRETS",
  "TNT_LIVE",
  "TNT_LIVE_PROFILE",
  "TNT_LIVE_POOL",
  "TNT_LIVE_GROUP_ID",
  "TNT_LIVE_CONTAINER_IMAGE_NAME",
  "TNT_LIVE_CONTAINER_IMAGE_VERSION",
  "TNT_LIVE_VM_MEMORY_MIB",
  "TNT_LIVE_VM_DISK_BYTES",
]
clean_tree = false
budget = "60m"
stall_timeout = "15m"

[lanes.live-v27.resources]
memory = "1g"

[lanes.live-update]
kind = "command"
environment = "tnt-live"
argv = [
  "bash", "-c",
  "cd {worktree}/truenas/tnt && /opt/tester-venv/bin/python3 -m pip install --no-deps setuptools==82.0.1 wheel==0.47.0 websocket-client==1.8.0 && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation -e . && /opt/tester-venv/bin/python3 -m pip install --no-deps --no-build-isolation 'truenas_api_client @ git+https://github.com/truenas/api_client.git@2a04491953d38c13f13f40729d2a4966a77c6297' && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 nice /opt/tester-venv/bin/python3 -m pytest -q -p no:xdist -m live tests/live/test_update_survival.py",
]
required_env = [
  "TNT_CONFIG",
  "TNT_SECRETS",
  "TNT_LIVE",
  "TNT_LIVE_PROFILE",
  "TNT_LIVE_ALLOW_SYSTEM",
  "TNT_LIVE_UPDATE_PHASE",
]
clean_tree = false
budget = "60m"
stall_timeout = "15m"

[lanes.live-update.resources]
memory = "1g"
