# tnt release contract -- parsed ONLY by cmru. Tags `tnt-v*`; the wheel and its sha256 go to a
# matching GitHub Release, with CMRU's moving `tnt-latest` release, never PyPI. VERSION seeds 0.1.0.
schema_version = 1

[runtime]
kind = "none"

[env]
TNT_RELEASE_NOTES = """## tnt 0.1.0 wheel

First release of the keyboard-driven TUI and scriptable CLI for vanilla TrueNAS v27 over its JSON-RPC API. See `truenas/tnt/CHANGES.md` for the release history.

The `tnt` wheel requires `cli-extended>=0.4.0` and the pinned `truenas_api_client` Git dependency declared in `pyproject.toml`. The `tui` extra adds `textual>=8.0`.

**Install** (download this wheel and a `cli-extended>=0.4.0` wheel from their GitHub Releases into one directory)
```bash
python -m pip install --no-index --find-links . 'cli-extended>=0.4.0'
python -m pip install './tnt-0.1.0-py3-none-any.whl[tui]'
```"""

[project]
id = "tnt"
description = "tnt -- TrueNAS terminal UI and CLI"
template_revision = 5
prefix = "tnt-v"
artifacts = ["wheel"]

[project.version]
strategy = "file:VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]
evidence_paths = ["coverage.json"]

[steps.run-tests]
quiet = true
commands = [
  { label = "tnt: r0-r1 (unit + branch coverage)", argv = ["run-gate", "r0-r1"], cwd = "." },
  { label = "tnt: ux-focused (TUI and terminal UX)", argv = ["run-gate", "ux-focused"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "tnt: build wheel", argv = ["cmru", "handler", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "tnt: publish wheel", argv = ["cmru", "handler", "wheel-publish", "--prefix", "tnt", "--cwd", ".", "--notes-env", "TNT_RELEASE_NOTES"], cwd = "." },
]
