schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"
token_source = "gh"

[targets]
host = "github"
registry = ["ghcr.io"]

# Estate-only coordination. Every project owns its own release/build/test
# contract in <project>/cmru.toml and remains runnable after being moved into a
# fresh repository root. The graph records artifact and gate prerequisites;
# invoking the source-bootstrapped CMRU controller is not an artifact edge.
# BEGIN CMRU GENERATED DEPENDENCY GRAPH
# Generated by: cmru dependencies --write
# CMRU PROJECT DEPENDENCY GRAPH
#
#   cli-extended <- none  (declared release order)
#   cgroup-profiler <- none  (declared release order)
#   run-gate-project <- cgroup-profiler  (declared release order)
#   cmru <- cli-extended, run-gate-project  (declared release order)
#   ciu <- none  (declared release order)
#   assay <- none  (declared release order)
#   topos <- none  (declared release order)
#   nyxloom <- cli-extended  (declared release order)
#   pwmcp <- cli-extended  (declared release order)
#   tls-edge <- none  (declared release order)
#   modern-debian-tools-python-debug <- cli-extended, ciu, cmru, pwmcp, topos, nyxloom  (declared release order)
#     consumes first-party wheels: cli-extended, ciu, cmru, topos, nyxloom
#   mdt-cockpit <- cli-extended, ciu, cmru, pwmcp, topos, nyxloom  (declared release order)
#     consumes first-party wheels: cli-extended, ciu, cmru, topos, nyxloom
#   tester-base <- none  (declared release order)
#
# LEVELS (a project releases after every project on a lower level; longest declared chain)
#   L0: cli-extended, cgroup-profiler, ciu, assay, topos, tls-edge, tester-base
#   L1: run-gate-project, nyxloom, pwmcp
#   L2: cmru
#   L3: modern-debian-tools-python-debug, mdt-cockpit
#
# PREFLIGHT: PASS
# END CMRU GENERATED DEPENDENCY GRAPH
[orchestration]
# The generated dependency graph above is the current level table; do not keep
# a second manually-maintained level summary here.
# CMRU requires cli-extended at runtime and a published Run-Gate release for its gate.
# Run-Gate's full R2 qualification requires the released CGProfile observer.
# project_order must be a topological order of every level; the preflight enforces it.
project_order = ["cli-extended", "cgroup-profiler", "run-gate-project", "cmru", "ciu", "assay", "topos", "nyxloom", "pwmcp", "tls-edge", "modern-debian-tools-python-debug", "mdt-cockpit", "tester-base"]
default_steps = ["run-tests", "build", "push"]
execution_mode = "project-first"
# Repository credentials live in gitignored root cmru.secret.toml. A project may
# explicitly override it with its own gitignored <project>/cmru.secret.toml.

# Estate policy for common gate/build inputs. Project [env] may override a
# value only where it has a genuinely different requirement (for example,
# modern-debian-tools-python-debug's Docker-in-Docker image).
[orchestration.defaults.env]
# ---------------------------------------------------------------------------
# Values here are inherited by EVERY project's steps; a project's own
# cmru.toml [env] may OVERRIDE any of them for a genuine per-project need
# (precedence: step env > project env > these defaults).
#
# ${NAME} / ${NAME:-default} references are expanded by cmru at LOAD time:
#   ${NAME}            -> the env var's value; UNSET is a load error naming
#                         the key (fail loudly, never silently empty)
#   ${NAME:-fallback}  -> the env var's value, or `fallback` when unset
# The expanded result is what every runner manifest records.
# ---------------------------------------------------------------------------

# Images (built in this repo; see each project's build step).
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_TESTER_UNIFIED_IMAGE = "tester-unified:local"

# The BuildKit endpoint every image build goes through. The host governs builds (a worker a
# build starts itself may be terminated), so the Buildx builder is a `remote` node on a
# host-managed socket, set up by the devcontainer/host, never created by a build or a test.
# Declared ONCE here for the estate; a project whose build is not governed this way (or that
# builds into the local image store) overrides both in its own cmru.toml [env].
#   BUILDX_BUILDER = name of the remote Buildx builder
#   BUILDKIT_HOST  = its unix:/// endpoint (consumers mount the socket's directory at the same path)
# The ENVIRONMENT wins (cmru expands ${NAME:-default} at load; a set-but-empty value counts as
# set). A system without the host-managed BuildKit service sets them once, in the devcontainer
# or shell, e.g. BUILDX_BUILDER=default and BUILDKIT_HOST= (empty): generic projects then build
# through that builder and nothing here is mdt-specific. Only mdt-cockpit itself requires the
# managed endpoint.
BUILDX_BUILDER = "${BUILDX_BUILDER:-mdt-managed}"
BUILDKIT_HOST = "${BUILDKIT_HOST:-unix:///run/mdt-buildkitd/buildkitd.sock}"

# RAM / swap for each gate container (docker --memory / --memory-swap):
#   CMRU_TESTER_MEMORY       = hard cap on the container's USER-SPACE MEMORY
#                              (RSS + page cache charged to the cgroup — not
#                              only anon RAM). Hitting it => OOM-kill.
#   CMRU_TESTER_MEMORY_SWAP  = the COMBINED ram+swap total (Docker semantics,
#                              not swap alone). Swap headroom is therefore
#                              MEMORY_SWAP minus MEMORY (= 13g here).
# These are flat PER-CONTAINER bounds, independent of how many gates run in
# parallel and on top of whatever the slice tier caps in aggregate.
CMRU_TESTER_MEMORY = "1g"
CMRU_TESTER_MEMORY_SWAP = "16g"

# CPU ceiling per gate container (docker --cpus), same per-container rule.
CMRU_TESTER_CPUS = "2.5"

# Process ceiling per gate container (docker --pids-limit). Required, no code
# default: without it the ceiling is systemd's DefaultTasksMax (~19k here), a
# host-wide default shared with the production game server (2026-10-05: 19,108
# zombies exhausted it). The gate also runs under --init and fails with exit 3
# if the in-container pids.events 'max' counter is non-zero afterwards.
CMRU_TESTER_PIDS_LIMIT = "4096"

# Minimal image for the HOST-systemd preflight probes below (needs nsenter;
# deliberately NOT tester-unified). tester-gate runs it --privileged
# --pid=host and nsenters PID 1 to ask the real host systemd/kernel:
#   - slice check: LoadState=loaded AND non-empty FragmentPath (systemd
#     auto-vivifies any .slice name; only FragmentPath distinguishes a real
#     unit from Docker's fail-open transient), and
#   - IO check: cgroup v2 with the io controller delegated (required before
#     any --device-* cap is passed).
# Runs --privileged --pid=host with --pull=never, so it MUST be digest-pinned
# and already present locally (tester-gate refuses a non-@sha256 reference).
# Digest = `docker image inspect --format '{{index .RepoDigests 0}}' debian:trixie-slim`
# read 2026-10-05.
CMRU_TESTER_CGROUP_PROBE_IMAGE = "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"

# GOVERNANCE SLICE for gate containers. Gate/lane containers belong to the
# dedicated admission tier, not the long-running background tier. The value
# is declared and resolved once at load time; an absent variable is an error
# rather than a silent fall-through to Docker's unconfined default.
CMRU_TESTER_CGROUP_PARENT = "${CGROUP_PARENT_DEV_GATES}"

# Forward both host-tier facts into the gate container. CMRU's tester-gate
# itself is placed in dev-gates.slice, while tests that start a long-running
# application stack still need to see the background tier explicitly.
# Optional: only needed when a gate test starts a long-running application
# stack. An absent background tier must not prevent the gate itself from
# launching in its required gates tier.
CMRU_TESTER_CGROUP_FORWARD_VAR = "${CGROUP_PARENT_DEV_BACKGROUND:-}"
CMRU_TESTER_CGROUP_FORWARD_GATES_VAR = "${CGROUP_PARENT_DEV_GATES}"

# ---------------------------------------------------------------------------
# Per-container IO caps (docker --device-read/write-bps / -iops). OPTIONAL —
# commented out by default because the values are DEVICE-SPECIFIC: each entry
# is Docker's "<device>:<rate>" syntax against the HOST's real disk (lsblk).
# When any of these is set, tester-gate first probes the host for cgroup v2 +
# the io controller and REFUSES if absent; empty = rely on the slice tier's
# own aggregate IO ceiling.
# ---------------------------------------------------------------------------
# CMRU_TESTER_DEVICE_READ_BPS  = "/dev/vda:50mb"
# CMRU_TESTER_DEVICE_WRITE_BPS = "/dev/vda:30mb"
# CMRU_TESTER_DEVICE_READ_IOPS = "/dev/vda:1000"
# CMRU_TESTER_DEVICE_WRITE_IOPS = "/dev/vda:600"

# Shared CLI contract wheel. Released first: every vbpub CLI depends on it
# (cli-extended unified-adoption program CX-D1); it consumes nothing
# first-party itself (stdlib-only).
[orchestration.project.cli-extended]
config = "libraries/cli-extended/cmru.toml"
depends_on = []

# CMRU's release command is bootstrapped from this repository's source; using
# the controller to release a project does not make the published CMRU wheel a
# provider edge. CMRU's real runtime dependency is cli-extended. Its release
# gate also requires an already-published Run-Gate wheel and matching tester
# image, so Run-Gate is an explicit release-order edge as well. Run-Gate itself
# has no CMRU artifact dependency and can be released with the source-built
# controller. Run-Gate's qualification prerequisite on CGProfile is a gate
# edge, not a runtime import. The source bootstrap breaks the apparent
# controller cycle while preserving the actual release order.
[orchestration.project.cmru]
config = "cmru/cmru.toml"
depends_on = ["cli-extended", "run-gate-project"]

# These project release steps use the source-bootstrapped cmru controller, not
# the published cmru wheel as a package. Their build/gate tooling is therefore
# not a release dependency edge.
[orchestration.project.ciu]
config = "ciu/cmru.toml"
depends_on = []

[orchestration.project.assay]
config = "assay/cmru.toml"
depends_on = []

[orchestration.project.topos]
config = "topos/cmru.toml"
depends_on = []

[orchestration.project.nyxloom]
config = "nyxloom/cmru.toml"
# cli-extended: nyxloom's wheel requires it (NYX-CLIX, CX-D1), so the release preflight demands the declaration.
depends_on = ["cli-extended"]

[orchestration.project.modern-debian-tools-python-debug]
config = "modern-debian-tools-python-debug/cmru.toml"
# cli-extended: cmru's wheel requires it and the image install is `pip --no-index`
# (pip/wheels.list stages it). PWMCP is also released first so the image can install
# its exact CIU root and client CLI through the generated CMRU get.py.
depends_on = ["cli-extended", "ciu", "cmru", "pwmcp", "topos", "nyxloom"]

[orchestration.project.mdt-cockpit]
config = "mdt-cockpit/cmru.toml"
# The fork uses the same first-party CIU and CLI tooling in its image.
depends_on = ["cli-extended", "ciu", "cmru", "pwmcp", "topos", "nyxloom"]

# Leaf image project (python:3.14-trixie digest + docker client + minisign + shellcheck): no
# first-party dependency. cmru is its release tooling, an installed tool and not a build edge
# (the same rule the generated graph applies to every other project).
[orchestration.project.tester-base]
config = "tester-base/cmru.toml"
depends_on = []

[orchestration.project.pwmcp]
config = "pwmcp/cmru.toml"
# cli-extended: the pwmcp-client wheel requires it (PWMCP-02, CX-D1) and the release scripts
# import it, so the release preflight demands the declaration. cmru is an installed tool, not
# a build edge (see the generated graph above).
depends_on = ["cli-extended"]

[orchestration.project.tls-edge]
config = "tls-edge/cmru.toml"
depends_on = []

# Consumes no first-party package (stdlib-only wheel); cmru is the source-built
# release controller, not a published artifact dependency. id == directory name is a cmru
# change-detection invariant — see run-gate-project/cmru.toml.
[orchestration.project.run-gate-project]
config = "run-gate-project/cmru.toml"
# Run-Gate's R2 qualification consumes contract-2 resource observations from
# the deployed CGProfile host daemon. A local source-built Run-Gate candidate
# is used to qualify CGProfile first; publishing Run-Gate follows CGProfile.
depends_on = ["cgroup-profiler"]

# RG-55 daemon image release. Its lifecycle is CIU-owned; CMRU builds and
# publishes the tagged image, while the controller deploys it via `ciu up`.
# The release uses the source-built CMRU controller and has no CMRU wheel edge.
[orchestration.project.cgroup-profiler]
config = "scripts/cgroup-profiler/cmru.toml"
depends_on = []

[cleanup]
release_tag_prefixes = ["*"]
keep_release_tags = ["ciu-latest", "cmru-latest", "pwmcp-latest"]
ghcr_packages = ["*"]
ghcr_delete_packages = ["modern-debian-tools-python-debug-vsc-devcontainer-dev"]

[versions]
age_window_days = 14

[versions.discovery]
scope = "shipped"
