# Column order and priority for the single main view.
#
# File order = display order (left to right). `pri` 1 is kept longest: when the terminal
# narrows, the highest `pri` numbers disappear first and the columns that remain keep this
# order. Columns are never clipped at the right edge. `width` and `head` are optional
# overrides of the built-in defaults. `name` must come first.
#
# Looked up as: --config FILE, then topos-columns.toml next to the binary, then this
# file as embedded at build time.
#
# Available ids:
#   name cpu thr ram_ceil prot zsw rf_d rf_f psi_m psi_i psi_c psi_mf psi_if psi_cf io_r io_w
#   iops_r iops_w stall blk net_rx net_tx pids anon file shmem swap pgscan pgsteal iocost origin
#   drift cpu_wt quota mem_min mem_low mem_high mem_max eff_min io_wt pids_max drift_list warn
#   ev_high ev_max ev_oom
# (blk is synthetic demo data in this PoC: the recording has no D-state counts.)

# ---- usage ----
[[column]]
id = "name"
pri = 1
[[column]]
id = "cpu"
pri = 1
[[column]]
id = "thr"
pri = 4
[[column]]
id = "ram_ceil"
pri = 1
