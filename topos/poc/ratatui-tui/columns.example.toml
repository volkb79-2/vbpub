# Column order and priority for the single main view.
#
# File order = display order (left to right). `pri` 1 is kept longest: when the terminal
# narrows, the highest `pri` numbers disappear first and the columns that remain keep this
# order. Columns are never clipped at the right edge. `width` and `head` are optional
# overrides of the built-in defaults. `name` must come first.
#
# Looked up as: --config FILE, then topos-columns.toml next to the binary, then this
# file as embedded at build time.
#
# Available ids:
#   name cpu thr ram_ceil prot zsw ratio rf_d rf_z rf_f maj psi_m psi_i psi_c psi_mf psi_if psi_cf
#   io_r io_w iops_r iops_w io_max stall blk net_rx net_tx pids anon file shmem swap swap_max
#   pgscan pgsteal iocost origin drift cpu_wt quota mem_min mem_low mem_high mem_max eff_min
#   io_wt pids_max drift_list warn ev_high ev_max ev_oom
# This is a superset of the ids of the Textual view's assets/columns.toml: one file drives both
# views. The Textual loader ignores the `[ui]` table below (it keeps pane_width in its own
# `[ui]` config, same key names).
# In a recording blk is synthetic demo data (magenta, BLK~); with --socket it is the sampler's
# D-state count. iocost has no source yet and prints n/a; origin/drift columns are n/a live
# because the sampler does not report who set a limit.

# Side pane: this many columns at any terminal width (never more than half the screen); it shows
# by itself from pane_auto_min_width. proc_cap: hot or blocked process rows kept under a
# collapsed cgroup (an expanded cgroup shows every process the sampler sent).
[ui]
pane_width = 46
pane_auto_min_width = 140
proc_cap = 3

