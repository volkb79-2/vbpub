# Every key is required: the sampler has no built-in defaults. Tier values are D-025.
[sampler]
tick_ms = 1000              # sampling period
slow_every_s = 60           # cadence of the limit files (spread across cgroups by serial)
cgroup_root = "/sys/fs/cgroup"
proc_root = "/proc"
sys_root = "/sys"
socket_path = "/run/topos/sampler.sock"
socket_mode = "0600"        # optional, "0600" (default) or "0660": 0660 lets the unit's Group= connect (e.g. docker on mdt hosts)
duration_s = 0              # 0 = run until killed
stats_path = ""             # benchmark summary written at exit; empty = none

[process]
scan = true
top_cpu = 20
top_io = 20
cap = 64                    # hard cap of the enriched union (D state + top CPU + top IO)
full_sweep_every_s = 10     # io/schedstat for ALL pids this often; between sweeps only for candidates
cmdline_max = 256
cmdline_backoff_ms = 30000  # a pid whose command-line read failed or timed out waits this long before the next ask

[events]
psi_cpu_some_avg10 = 25.0   # percent; crossing up or down is a hard event
psi_memory_some_avg10 = 10.0
psi_io_some_avg10 = 25.0
events_path = "/var/lib/topos/events.jsonl"
max_bytes = 4194304         # rotated to <path>.1 above this size

[protocol]
max_request_bytes = 4096
max_response_bytes = 4194304
max_clients = 8
client_idle_ms = 300000     # idle connections are closed
client_write_ms = 5000      # a client that does not read is dropped after this

[store]
enabled = true
# Both directories must be real directories (never symlinks) owned by the user running the sampler,
# not group- or world-writable, with a parent that is root-owned and not group/world-writable (or
# owned by the same user). A missing leaf is created with mode 0700. Anything else: exit 2.
tmpfs_dir = "/run/topos/tiers"       # must be tmpfs in production; hot and warm live here
cold_dir = "/var/lib/topos"          # disk; zstd segments, canonical dictionary
cold_cap_bytes = 1073741824
require_tmpfs = true                 # refuse to start when tmpfs_dir is not tmpfs (false = warn in status and on stderr)
writer_queue_bytes = 8388608         # the writer queue holds at most this much; the oldest frames are dropped and counted

[[tier]]
name = "hot"
step_s = 1
keep_s = 60
segment_s = 10
medium = "tmpfs"

[[tier]]
name = "warm"
step_s = 5
keep_s = 300
segment_s = 60
medium = "tmpfs"

[[tier]]
name = "cold"
step_s = 60
keep_s = 86400
segment_s = 3600
medium = "disk"
