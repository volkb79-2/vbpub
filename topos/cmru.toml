schema_version = 1

[runtime]
kind = "none"

[env]
CMRU_RELEASE_NOTES = "## topos wheel\n\nHost pressure inspector and cgroup forensics console.\n\n**Install**\n```bash\npipx install topos-*.whl\n```"

[project]
id = "topos"
description = "Host pressure inspector and cgroup forensics console."
template_revision = 4
prefix = "topos-v"
artifacts = ["wheel"]
scm_dist = "topos"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  { label = "topos: tester-unified parallel suite", argv = ["cmru", "tester-gate", "--cwd", ".", "--", "bash", "-c", "set -euo pipefail; export PYTHONPATH=src:. ; /opt/tester-venv/bin/python -m pytest tests -q -n auto"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "topos: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "topos: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "topos", "--cwd", ".", "--notes-env", "TOPOS_RELEASE_NOTES"], cwd = "." },
]

[versions]

[versions.discovery]
pypi_extras = ["zstandard", "mcp"]

[versions.targets]

[versions.targets."pypi.textual"]
mode = "single"
constraint = ">=8.2.8"

[versions.targets."pypi.textual".pypi]
name = "textual"
registry = "https://pypi.org"

[versions.targets."pypi.zstandard"]
mode = "single"
constraint = ">=0.22"

[versions.targets."pypi.zstandard".pypi]
name = "zstandard"
registry = "https://pypi.org"

[versions.targets."pypi.mcp"]
mode = "single"
constraint = ">=1.28.0,<2.0.0"

[versions.targets."pypi.mcp".pypi]
name = "mcp"
registry = "https://pypi.org"

[versions.targets."oci.pwmcp"]
mode = "single"
constraint = ">=1.61.0-r6,<2.0.0"

[versions.targets."oci.pwmcp".oci]
image = "ghcr.io/volkb79-2/pwmcp"
tag = "{version}"
