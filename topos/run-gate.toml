# =============================================================================
# topos project gate lanes — parsed ONLY by Run-Gate CLI (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.root.toml. The
# topos-suite argv is the pre-adoption nyxloom gate mechanics VERBATIM (only
# re-homed) — including its hardcoded-slice removal: the central environment
# resolves the slice from the root policy's $CGROUP_PARENT_DEV_GATES binding
# instead of the old `--cgroup-parent=nyxloom-gates.slice` literal. See
# run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.topos-suite]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree} && export PYTHONPATH=topos/src:topos && /opt/tester-venv/bin/python -m pytest topos/tests -q -n auto --cov=topos/src/topos --cov-branch --cov-report=json:/tmp/topos-coverage.json && /opt/tester-venv/bin/python topos/tools/coverage_gate.py --repo . --base main --coverage-json /tmp/topos-coverage.json --source topos/src/topos"]
budget = "30m"

# topos-sampler (Rust, D-026): one BuildKit build of `sampler/Dockerfile` target `gate`, which runs
# `cargo test` and the conformance test (release binary against the Python collector) in parallel
# stages. The build is the whole check, so nothing runs in a gate container: the tester-unified
# container has no buildx and no Docker socket (first real run, 2026-11-05). `bare-host` runs the
# docker CLI where run-gate is invoked; on an mdt cockpit that is the mdt-managed buildkitd, which
# carries the resource placement (as mdt-cockpit's `oci-push` lane). The build fetches the Rust and
# Python base images, crates.io and PyPI.
[lanes.topos-sampler]
kind = "command"
environment = "bare-host"
# --no-cache-filter: a verdict comes from tests run now, never from a cached layer of an earlier build
argv = ["bash", "-c", "cd {worktree}/topos && docker buildx build -f sampler/Dockerfile --target gate --no-cache-filter test,conformance --progress=plain ."]
clean_tree = true
budget = "20m"

[lanes.py-compile]
kind = "command"
# tester-unified, not `host`: this lane writes __pycache__ into the bind-mounted worktree, so it must
# run as the worktree owner with a full identity (passwd, group, HOME, XDG). The `host` environment
# is tester-base, which runs as root and has no user (MDTC-02 D-002).
environment = "tester-unified"
# P96: fail-closed NUL-delimited argv over changed .py files; no changes → OK. Deleted files are
# excluded (--diff-filter=d): py_compile of a path the branch removed is a false failure (seen when
# Run-Gate 24 retired the run-gate.py symlinks).
argv = ["bash", "-c", "cd {worktree} && set -o pipefail && git diff --name-only -z --diff-filter=d main...HEAD -- '*.py' | xargs -0 -r python3 -m py_compile && echo 'py-compile: OK' || { rc=$?; echo \"py-compile: FAILED (exit $rc)\" 1>&2; exit $rc; }"]
budget = "2m"
