# =============================================================================
# topos project gate lanes — parsed ONLY by Run-Gate CLI (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.root.toml. The
# topos-suite argv is the pre-adoption nyxloom gate mechanics VERBATIM (only
# re-homed) — including its hardcoded-slice removal: the central environment
# resolves the slice from the root policy's $CGROUP_PARENT_DEV_GATES binding
# instead of the old `--cgroup-parent=nyxloom-gates.slice` literal. See
# run-gate-project/SPEC.md. PYTHONPATH carries the in-repo cli-extended and
# augeaswrap because tester-unified does not supply the current worktree versions.
# =============================================================================
schema_version = 1

[lanes.topos-suite]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree} && export PYTHONPATH=topos/src:topos:augeaswrap/src:libraries/cli-extended/src && /opt/tester-venv/bin/python -m pytest topos/tests -q -n auto --cov=topos/src/topos --cov-branch --cov-report=json:/tmp/topos-coverage.json && /opt/tester-venv/bin/python topos/tools/coverage_gate.py --repo . --base main --coverage-json /tmp/topos-coverage.json --source topos/src/topos"]
budget = "30m"

[lanes.py-compile]
kind = "command"
# tester-unified, not `host`: this lane writes __pycache__ into the bind-mounted worktree, so it must
# run as the worktree owner with a full identity (passwd, group, HOME, XDG). The `host` environment
# is tester-base, which runs as root and has no user (MDTC-02 D-002).
environment = "tester-unified"
# P96: fail-closed NUL-delimited argv over changed .py files; no changes → OK. Deleted files are
# excluded (--diff-filter=d): py_compile of a path the branch removed is a false failure (seen when
# Run-Gate 24 retired the run-gate.py symlinks).
argv = ["bash", "-c", "cd {worktree} && set -o pipefail && git diff --name-only -z --diff-filter=d main...HEAD -- '*.py' | xargs -0 -r python3 -m py_compile && echo 'py-compile: OK' || { rc=$?; echo \"py-compile: FAILED (exit $rc)\" 1>&2; exit $rc; }"]
budget = "2m"

[lanes.e2-endpoints]
kind = "command"
environment = "tester-unified"
# Serial boundary suite for E2 order, endpoint, client-resolution, and docs
# contracts. The topos-suite lane remains the coverage-floor gate.
accepts_args = true
argv = [
  "bash",
  "-c",
  '''
set -euo pipefail
cd {worktree}
export PYTHONPATH=topos/src:topos:augeaswrap/src:libraries/cli-extended/src
if [ "$#" -eq 0 ]; then
    set -- \
      topos/tests/test_observe_socket.py \
      topos/tests/test_endpoint_docs.py \
      topos/tests/test_service_install.py \
      topos/tests/test_service_doctor.py \
      topos/tests/test_attach_cli.py \
      topos/tests/test_cli_command_parsers.py \
      topos/tests/test_daemon_status.py
fi
exec /opt/tester-venv/bin/python -m pytest -q "$@"
''',
  "--",
]
budget = "30m"
