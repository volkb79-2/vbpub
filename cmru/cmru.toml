schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"

[targets]
host = "github"
registry = ["ghcr.io"]

[env]
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_RELEASE_NOTES = "## cmru wheel\n\nBuild, publish, and release orchestration for portable CMRU projects.\n\n**Install**\n```bash\npipx install cmru-*.whl\n```"
PYTHONPATH = "src"

[project]
id = "cmru"
description = "Configurable Multi Release Utility."
template_revision = 4
prefix = "cmru-v"
artifacts = ["wheel"]
scm_dist = "cmru"

# S15: a first-party artifact cmru's OWN tests/tooling consume, distinct from
# orchestration.project.<id>.depends_on (release ORDER). assay already depends_on
# cmru, so declaring the reverse edge here would be a cycle -- resolved by vendoring
# a pinned artifact instead of by ordering. `cmru tool-deps` verifies this pin at
# release time and on demand; it never runs during `pytest` (see docs/SPEC.md S15).
[[project.tool_dependencies]]
project = "assay"
version = "2.1.0"
path    = "tools/assay/assay-2.1.0.pyz"
sha256  = "f2f13021a1bb781cacb0af5f370b78d172cde909ea485293fda2f35fb812806d"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  # SSOT pointer (D-110/D-111): every test definition — pinned-assay verify,
  # 100% line+branch coverage, the changed-source mutation campaign (base =
  # nearest ancestor cmru-v* tag, KI-18), and the cause-sensitive coverage
  # canary — lives in cmru/run-gate.toml. This step owns no test logic; it
  # runs the `gate` conjunction, whose sub-lanes launch their own gated
  # tester-unified containers via run-gate.
  { label = "cmru: run-gate gate conjunction", argv = ["bash", "-c", "cd cmru && exec ./run-gate.py gate"], cwd = "." },
]

# Initial standalone build (before cmru is installed):
# ./cmru/build-initial-standalone.sh
[steps.build]
quiet = true
commands = [
  { label = "cmru: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "cmru: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "cmru", "--cwd", ".", "--notes-env", "CMRU_RELEASE_NOTES"], cwd = "." },
]
