schema_version = 1

[runtime]
kind = "none"

[env]
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_RELEASE_NOTES = "## cmru wheel\n\nBuild, publish, and release orchestration for portable CMRU projects.\n\n**Install**\n```bash\npipx install cmru-*.whl\n```"
# Keep the `worktree` library root: a bare "src" would replace the transaction
# child's PYTHONPATH and drop the candidate's packaged `worktree` (BG-04).
# cli_extended is NOT listed: it is a real wheel dependency, imported from the
# installed release (CX-D1), never from a source root.
PYTHONPATH = "src:../libraries/worktree/src"

[project]
id = "cmru"
description = "Configurable Multi Release Utility."
template_revision = 5
prefix = "cmru-v"
artifacts = ["wheel"]
scm_dist = "cmru"

# Assay is an internal source dependency: cmru's run-gate lanes install the
# assay package from the selected vbpub worktree and record its runtime
# version/source in the verdict. It is intentionally not an S15 artifact pin.

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]
# Release-gate outputs retained under evidence/cmru-release/<tag> with hashes.
evidence_paths = ["coverage.json", ".assay"]

[steps.run-tests]
quiet = true
commands = [
  # SSOT pointer (D-110/D-111): every test definition lives in
  # cmru/run-gate.toml. This release uses the operator-approved provisional
  # gate: all lanes run except the long R2 mutation campaign, whose deferral is
  # retained as .assay/mutation-postponed-cmru.json under KI-79. The full
  # `gate` lane remains available for the post-release R2 run. Steps execute
  # with project_root as cwd.
  { label = "cmru: provisional release gate (R2 deferred, KI-79)", argv = ["run-gate", "gate-provisional"], cwd = "." },
]

# Initial standalone build (before cmru is installed):
# ./cmru/build-initial-standalone.sh
[steps.build]
quiet = true
commands = [
  { label = "cmru: build wheel", argv = ["cmru", "handler", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "cmru: publish wheel", argv = ["cmru", "handler", "wheel-publish", "--prefix", "cmru", "--cwd", ".", "--notes-env", "CMRU_RELEASE_NOTES"], cwd = "." },
]

[versions]

[versions.discovery]
pypi_extras = ["versions-templates"]

[versions.targets]

[versions.targets."pypi.jinja2"]
mode = "single"
constraint = ">=3.1,<4"

[versions.targets."pypi.jinja2".pypi]
name = "jinja2"
registry = "https://pypi.org"
