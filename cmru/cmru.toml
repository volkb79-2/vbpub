schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"

[targets]
host = "github"
registry = ["ghcr.io"]

[env]
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_RELEASE_NOTES = "## cmru wheel\n\nBuild, publish, and release orchestration for portable CMRU projects.\n\n**Install**\n```bash\npipx install cmru-*.whl\n```"
PYTHONPATH = "src"

[project]
id = "cmru"
description = "Configurable Multi Release Utility."
template_revision = 4
prefix = "cmru-v"
artifacts = ["wheel"]
scm_dist = "cmru"

# S15: a first-party artifact cmru's OWN tests/tooling consume, distinct from
# orchestration.project.<id>.depends_on (release ORDER). assay already depends_on
# cmru, so declaring the reverse edge here would be a cycle -- resolved by vendoring
# a pinned artifact instead of by ordering. `cmru tool-deps` verifies this pin at
# release time and on demand; it never runs during `pytest` (see docs/SPEC.md S15).
[[project.tool_dependencies]]
project = "assay"
version = "2.1.0"
path    = "tools/assay/assay-2.1.0.pyz"
sha256  = "f2f13021a1bb781cacb0af5f370b78d172cde909ea485293fda2f35fb812806d"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  # The consumer-owned, hash-pinned zipapp makes the rigor claim explicit.
  # tester-unified deliberately does not bake an ambient Assay version.
  { label = "cmru: verify pinned Assay", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/bin/sh", "-ec", "cd tools/assay && /usr/bin/sha256sum -c assay-2.1.0.pyz.sha256"], cwd = ".." },
  { label = "cmru: whole-source line and branch coverage", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q", "--cov=src/cmru", "--cov-branch", "--cov-fail-under=100", "--cov-report=json:coverage.json"], cwd = ".." },
  { label = "cmru: Assay R0 in tester-unified", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/bin/sh", "-ec", "mkdir -p .assay && exec /opt/tester-venv/bin/python tools/assay/assay-2.1.0.pyz run cmru --file assay.toml --verdict-json .assay/verdict-cmru.json"], cwd = ".." },
  # Mutation base = the PREVIOUS cmru release tag, resolved at gate time -- NOT
  # `origin/main` (KI-18). At release time cmru snapshots origin/main, so a base
  # of origin/main makes `git diff base..HEAD` empty of source and the campaign
  # fails `--require-candidates` ("no mutation candidates"). `git describe
  # --match 'cmru-v*'` returns the nearest ancestor release tag (cmru-v4.0.1
  # today), so the campaign mutates every source line changed since the last
  # release -- exactly what a release must verify. Falls back to origin/main
  # only when no cmru-v* tag exists yet (first-ever/bootstrap release).
  { label = "cmru: complete changed-source mutation campaign", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/bin/sh", "-ec", "mkdir -p .assay && exec /opt/tester-venv/bin/python tools/mutation_campaign.py --assay-zipapp tools/assay/assay-2.1.0.pyz --repo-root .. --project-root . --base $(git describe --tags --abbrev=0 --match 'cmru-v*' 2>/dev/null || echo origin/main) --max-mutants 10000 --evidence .assay/mutation-cmru.json --require-candidates -- /opt/tester-venv/bin/python -m pytest tests -q --cov=src/cmru --cov-branch --cov-fail-under=100 --cov-report=json:coverage.json"], cwd = ".." },
  { label = "cmru: cause-sensitive coverage canary", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/bin/sh", "-ec", "mkdir -p .assay && exec /opt/tester-venv/bin/python tools/coverage_canary.py --repo-root .. --project-root . --target src/cmru/config.py --evidence .assay/coverage-canary-cmru.json -- /opt/tester-venv/bin/python -m pytest tests -q --cov=src/cmru --cov-branch --cov-fail-under=100 --cov-report=json:coverage.json"], cwd = ".." },
]

# Initial standalone build (before cmru is installed):
# ./cmru/build-initial-standalone.sh
[steps.build]
quiet = true
commands = [
  { label = "cmru: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "cmru: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "cmru", "--cwd", ".", "--notes-env", "CMRU_RELEASE_NOTES"], cwd = "." },
]
