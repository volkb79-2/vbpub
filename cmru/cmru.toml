schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"

[targets]
host = "github"
registry = ["ghcr.io"]

[env]
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_RELEASE_NOTES = "## cmru wheel\n\nBuild, publish, and release orchestration for portable CMRU projects.\n\n**Install**\n```bash\npipx install cmru-*.whl\n```"
PYTHONPATH = "src"

[project]
id = "cmru"
description = "Configurable Multi Release Utility."
template_revision = 4
prefix = "cmru-v"
artifacts = ["wheel"]
scm_dist = "cmru"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  # The consumer-owned, hash-pinned zipapp makes the rigor claim explicit.
  # tester-unified deliberately does not bake an ambient Assay version.
  { label = "cmru: verify pinned Assay", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/usr/bin/sha256sum", "-c", "tools/assay/assay-1.0.0.pyz.sha256"], cwd = ".." },
  { label = "cmru: Assay R0 in tester-unified", argv = ["cmru", "tester-gate", "--cwd", "cmru", "--", "/opt/tester-venv/bin/python", "tools/assay/assay-1.0.0.pyz", "run", "cmru", "--file", "assay.toml", "--verdict-json", ".assay/verdict-cmru.json"], cwd = ".." },
]

# Initial standalone build (before cmru is installed):
# ./cmru/build-initial-standalone.sh
[steps.build]
quiet = true
commands = [
  { label = "cmru: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "cmru: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "cmru", "--cwd", ".", "--notes-env", "CMRU_RELEASE_NOTES"], cwd = "." },
]
