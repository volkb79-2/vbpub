expected_stderr_contains = "cannot inspect CMRU release worktrees"
effects = ["Outside a git repository discovery refuses (exit 2); with a repository it would list candidates and require confirmation before any deletion."]
test_ids = ["tests/test_cli_review_cases.py::test_reviewed_case[abandon/minimum]"]

