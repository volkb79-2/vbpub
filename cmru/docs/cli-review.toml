schema_version = 1
cli_id = "cmru"

# Reviewed semantic catalog for the single `cmru` CLI (root + mounted delegates; `python -m
# cmru.handlers` builds the same registry). Every row is verified against the REAL registry by
# tests/test_cli_review_cases.py::test_reviewed_case, which runs the row's `invocation` in a
# sandbox (empty non-repository cwd, tmp HOME, stub docker/gh, no credentials, no network) and
# asserts the exit status and the stdout/stderr fragments recorded here. The sandbox has no cmru
# configuration, so a verb that accepts its arguments stops at configuration discovery (exit 2,
# "config file not found"): the rows pin the SPELLING, the accepted value shape and the early
# refusal. Behaviour past that point is pinned by the verb's own test modules, named in the
# docs/SPEC.md "Verb semantics not expressible in the catalog" section.

[[cases]]
id = "case:route:entrypoint:cmru/abandon/argument-shape/argument:route:entrypoint:cmru/abandon/branch"
state = "active"
decision = "accept"
reviewed_signature = "sha256:0ef720c8e01109b560a2a45d0ccfe1ccb34ea7faeabad1b1be5fe9099338b734"
rationale = "The optional branch names exactly one managed release or build branch (or its worktree path). A value is accepted by the parser; resolution against the retained worktrees happens after discovery."
invocation = ["abandon", "demo-branch"]
expected_exit_status = 2
expected_stdout_contains = ""
expected_stderr_contains = "cannot inspect CMRU release worktrees"
effects = ["Outside a git repository discovery refuses (exit 2) before any branch lookup; nothing is read from the network and nothing is changed."]
test_ids = ["tests/test_cli_review_cases.py::test_reviewed_case[abandon/argument-shape/branch]"]

[[cases]]
