# CMRU's release-gate test claim.  The outer command in cmru.toml invokes the
# pinned Assay zipapp in tester-unified; this lane's command is deliberately
# the existing project test command, rather than recursively invoking CMRU's
# tester-gate wrapper.
#
# R0 is the only honest Assay declaration in this monorepo today.  The
# published R1+ snapshot substrate deliberately refuses Topos's tracked
# absolute-symlink security fixtures before it can run CMRU's isolated
# snapshot.  A project-scoped snapshot is a versioned Assay product decision,
# not a consumer-side bypass.  CMRU's outer tester-unified gate separately
# enforces whole-source line and branch coverage at 100% until that capability
# is released and pinned here.
schema_version = 1

[lanes.cmru]
scope = "S1"
rigor = ["R0"]
enforcement = "gate"
argv = ["/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q"]
# These are project test facts, not ambient conveniences: pytest must import
# the source snapshot it is judging, and it must not create bytecode there.
env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = []
budget = "20m"
allow_argv_append = false
