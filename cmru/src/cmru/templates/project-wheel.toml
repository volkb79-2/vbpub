# Project CMRU contract — generated by `cmru init` (@@GENERATED_BY@@).
# Travels with the project: its complete release/build/test/publish contract.
# Secrets never belong here (gitignored cmru.secret.toml overlays supply them).
schema_version = 1

[github]
owner = "@@OWNER@@"
repo = "@@REPO@@"
owner_type = "@@OWNER_TYPE@@"

[targets]
host = "github"
registry = ["ghcr.io"]

[env]
@@NOTES_ENV_KEY@@ = "## @@PROJECT_ID@@ wheel\n\n<release notes markdown>"

[project]
id = "@@PROJECT_ID@@"
description = "@@DESCRIPTION@@"
template_revision = 4
prefix = "@@PROJECT_ID@@-v"
artifacts = ["wheel"]
scm_dist = "@@SCM_DIST@@"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[steps.run-tests]
quiet = true
commands = [
  { label = "@@PROJECT_ID@@: tester-unified parallel suite", argv = ["cmru", "tester-gate", "--cwd", ".", "--", "bash", "-c", "set -euo pipefail; export PYTHONPATH=src:. ; /opt/tester-venv/bin/python -m pytest tests -q -n auto"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "@@PROJECT_ID@@: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "@@PROJECT_ID@@: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "@@PROJECT_ID@@", "--cwd", ".", "--notes-env", "@@NOTES_ENV_KEY@@"], cwd = "." },
]
