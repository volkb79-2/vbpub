# Estate coordination — generated by `cmru init` (@@GENERATED_BY@@).
# Save as <repository-root>/cmru.orchestration.toml. Project commands and
# release facts are FORBIDDEN here; each entry points to a portable
# project-local cmru.toml. Estate-wide gate/build policy belongs in
# [orchestration.defaults.env] and is resolved BEFORE a project override.
schema_version = 1

[orchestration]
project_order = [@@PROJECT_ORDER@@]
default_projects = [@@PROJECT_ORDER@@]
default_steps = ["run-tests", "build", "push"]
execution_mode = "project-first"
# Repository credentials live in the gitignored root cmru.secret.toml; an
# individual project may overlay it from <project>/cmru.secret.toml.

[orchestration.defaults.env]
# ---------------------------------------------------------------------------
# Estate policy for common gate/build inputs. A project's own cmru.toml [env]
# may OVERRIDE any value for a genuine per-project need.
#
# ${NAME} / ${NAME:-default} references are expanded by cmru at LOAD time:
#   ${NAME}            -> env var value; UNSET is a load error naming the key
#   ${NAME:-fallback}  -> env var value, or `fallback` when unset
# ---------------------------------------------------------------------------

# Images (built by their own projects' push steps).
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"
CMRU_TESTER_UNIFIED_IMAGE = "tester-unified:local"

# Per-gate-container resource caps (docker --memory/--memory-swap/--cpus):
#   MEMORY       hard cap on user-space memory (RSS + page cache; not only
#                anon RAM). Hitting it => OOM-kill.
#   MEMORY_SWAP  the COMBINED ram+swap total (Docker semantics) — swap
#                headroom is MEMORY_SWAP minus MEMORY.
#   CPUS         cpu ceiling. All three are flat PER-CONTAINER bounds,
#                independent of slice-tier aggregates and of concurrency.
CMRU_TESTER_MEMORY = "3g"
CMRU_TESTER_MEMORY_SWAP = "16g"
CMRU_TESTER_CPUS = "1.5"

# Minimal image for tester-gate's HOST-systemd preflight probes (needs
# nsenter; deliberately NOT tester-unified). It verifies, before launch:
#   - slice: LoadState=loaded AND non-empty FragmentPath (systemd
#     auto-vivifies any .slice name; FragmentPath separates a real unit from
#     Docker's fail-open transient), and
#   - IO: cgroup v2 with the io controller delegated (required for any
#     --device-* cap below).
CMRU_TESTER_CGROUP_PROBE_IMAGE = "debian:trixie-slim"

# GOVERNANCE SLICE for gate containers — declared, never ambient. References
# the devcontainer-injected var with a bare-host default; resolves ONCE at
# load. Empty result = NO slice tier ON PURPOSE (announced unscoped launch;
# per-container caps still apply). A project overrides via its own cmru.toml
# [env]. Whatever resolves is verified against the host systemd before launch.
CMRU_TESTER_CGROUP_PARENT = "${CGROUP_PARENT_DEV_BACKGROUND:-dev-background.slice}"

# Forwarded INTO the gate container as $CGROUP_PARENT_DEV_BACKGROUND for
# consumers whose own governance reads it there (e.g. ciu's resolver tests).
CMRU_TESTER_CGROUP_FORWARD_VAR = "${CGROUP_PARENT_DEV_BACKGROUND:-}"

# ---------------------------------------------------------------------------
# Per-container IO caps (docker --device-read/write-bps / -iops). OPTIONAL —
# commented out because values are DEVICE-SPECIFIC ("<device>:<rate>" against
# the HOST's real disk, see lsblk). Setting any triggers the IO preflight;
# empty = rely on the slice tier's aggregate ceiling.
# ---------------------------------------------------------------------------
# CMRU_TESTER_DEVICE_READ_BPS   = "/dev/vda:50mb"
# CMRU_TESTER_DEVICE_WRITE_BPS  = "/dev/vda:30mb"
# CMRU_TESTER_DEVICE_READ_IOPS  = "/dev/vda:1000"
# CMRU_TESTER_DEVICE_WRITE_IOPS = "/dev/vda:600"


@@PROJECT_ENTRIES@@

[cleanup]
# Tags/packages this estate's `cmru cleanup` may manage. `*` scopes to the
# projects declared above; tighten to explicit prefixes on shared registries.
release_tag_prefixes = ["*"]
keep_release_tags = ["latest"]
ghcr_packages = ["*"]
ghcr_delete_packages = []
