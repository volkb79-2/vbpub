# =============================================================================
# cmru project gate lanes — parsed ONLY by the installed run-gate CLI (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.root.toml; judgment
# Assay owns R0/R1/R3 in assay.toml [lanes.cmru]; the release-specific
# mutation lane owns R2 using a published cmru-v* tag in the candidate's
# full ancestry as its base.
# If no stable CMRU tag exists, the protected provisional release gate instead
# selects `assay-first-release` and records `assay-first-release-r2` as its
# whole-source post-release follow-up; an unavailable origin query is an error.
# The release-gate conjunction is lane `gate`; cmru.toml [steps.run-tests]
# currently points at `gate-provisional` (KI-79: the same conjunction minus the
# deferred R2 lane) and owns NO test logic itself.
# The lanes use a 2g hard ceiling and ample swap for mutation campaigns. The
# current run-gate revision has no cgroup-v2 memory.high placement actuator;
# this file therefore records only limits it can actually pass and verify.
# See run-gate-project/SPEC.md.
#
# RG-20 resources: every container lane declares its RAM so gate admission
# can sum concurrent gates against the dev-tier slice budget. The 2g hard cap
# leaves room for the mutation campaign while 16g of swap absorbs transients
# without OOM kills.
# =============================================================================
schema_version = 1

[lanes.assay]
kind = "assay"
assay_lane = "cmru"                 # -> assay.toml [lanes.cmru]
environment = "tester-unified"
# 60m (was 20m, 2026-10-21): the outer bound of the lane container. The binding deadline is assay.toml
# [lanes.cmru] budget (50m, baseline + canary). Rule: outer >= assay lane budget + 10m, for the container
# start and the editable assay install (tests/test_gate_budgets.py enforces at least +5m).
budget = "60m"
# Internal vbpub lanes omit assay_command and pins deliberately. run-gate
# installs assay from the selected worktree in the lane environment; the
# verdict records the exact runtime assay version and source commit.

[lanes.assay.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# T1's R0/R1 member; the public composite below runs release-preconditions first.
[lanes.assay-r0-r1]
kind = "assay"
assay_lane = "cmru-r0-r1"
environment = "tester-unified"
budget = "60m"

[lanes.assay-r0-r1.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# Used only when the authenticated origin query succeeds and finds no stable
# CMRU release tag. Assay's matching lane covers every tracked production
# module under whole_target mode, so the first release does not invent a diff
# base or borrow another project's tag.
[lanes.assay-first-release]
kind = "assay"
assay_lane = "cmru-first-release"
environment = "tester-unified"
# Same rule as [lanes.assay]: outer >= assay.toml [lanes.cmru-first-release] budget (50m) + 10m.
budget = "60m"

[lanes.assay-first-release.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# Explicit whole-source mutation follow-up for the first release. This does
# not use the ordinary tag-based mutation lane, whose changed-source baseline
# cannot exist until after the first release. Run asynchronously when its
# duration exceeds the operator's interactive window.
[lanes.assay-first-release-r2]
kind = "assay"
assay_lane = "cmru-first-release-r2"
environment = "tester-unified"
resource_observer = "cgprofile"
clean_tree = true
budget = "7h"
# CPU- and memory-bound suite (~85% of a core, 1-1.75 GiB per candidate):
# auto settles on 2 workers under the 4g container below.
jobs = "auto"

[lanes.assay-first-release-r2.resources]
memory = "4g"
memory_swap = "16g"
candidate_ram = "1536m"
pids = 8192
cpus = "3"

# KI-26: an installed-wheel probe builds the actual distribution, installs it
# into a fresh venv with no system packages, and runs its cmru console script
# from outside the source checkout. This proves both packaged cli-extended
# imports and the importlib.resources get.py template.
# Runnable directly as a component lane. A direct run bypasses the aggregate
# gate's secret boundary (the checkout it mounts is whatever you point it at),
# so use a secret-free checkout; only `installed-wheel-live` below proves the
# exact-HEAD snapshot boundary.
[lanes.installed-wheel]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/cmru && exec /opt/tester-venv/bin/python tools/installed_wheel_smoke.py"]
budget = "10m"

[lanes.installed-wheel.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# The aggregate gate's variant of the lane above: the same acceptance plus the
# live-snapshot proof. It refuses unless the checkout it runs in is the CURRENT
# gate's snapshot (fresh manifest bound to that checkout, host canary invisible),
# so a retained manifest from a killed gate cannot satisfy it. Not for direct use.
[lanes.installed-wheel-live]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/cmru && exec /opt/tester-venv/bin/python tools/installed_wheel_smoke.py --require-live-snapshot"]
budget = "10m"

[lanes.installed-wheel-live.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# Live acceptance probe for the aggregate gate's protected-ref check: from inside
# the real tester container this writes a ref in the gate-owned
# `refs/cmru-gate/<id>/` namespace, and the gate must DETECT it (then removes
# it). It refuses to run in any checkout that is not a gate snapshot branch.
[lanes.ref-probe]
kind = "command"
environment = "tester-unified"
argv = [
  "bash",
  "-c",
  '''
set -euo pipefail
cd {worktree}
branch=$(git symbolic-ref --short HEAD)
case "$branch" in
  cmru-gate-*) ;;
  *) echo "ref-probe runs only inside a CMRU gate snapshot (branch: $branch)" >&2; exit 2 ;;
esac
exec git update-ref "refs/cmru-gate/${branch#cmru-gate-}/ref-probe" HEAD
''',
]
budget = "5m"

[lanes.ref-probe.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# Fast regression slice for CMRU's release gate policy and its precondition
# report.
[lanes.release-preconditions]
kind = "command"
environment = "tester-unified"
argv = [
  "bash",
  "-c",
  '''
set -euo pipefail
cd {worktree}/cmru
exec /opt/tester-venv/bin/python -m pytest \
  tests/test_w3_prep_changelog_preflight.py \
  tests/test_release_gate.py \
  tests/test_release_gate_preconditions.py \
  tests/test_release_gate_provisional.py \
  tests/test_project_fixture.py \
  tools/test_mutation_campaign.py -q --cli-case-partial
''',
]
budget = "10m"

[lanes.release-preconditions.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# CMRU's T1 mapping keeps the moved release-start guards first.
[lanes.r0-r1]
kind = "sequence"
lanes = ["release-preconditions", "assay-r0-r1"]

# Focused tester-unified lane for R2 survivor regressions and Assay target
# inventory. Optional selectors after `--` let closeout probes run one oracle.
[lanes.survivor-regressions]
kind = "command"
environment = "tester-unified"
description = "Run focused CMRU survivor regression oracles."
accepts_args = true
argv = [
  "bash",
  "-c",
  '''
set -euo pipefail
cd {worktree}/cmru
/opt/tester-venv/bin/python -m pip install --quiet --disable-pip-version-check --no-input --no-deps --no-build-isolation --editable ../assay
export PYTHONPATH="src:../libraries/worktree/src"
export PYTHONDONTWRITEBYTECODE=1
if [ "$#" -eq 0 ]; then
    set -- tests/test_assay_lane_inventory.py tests/test_assay_baseline_gate.py \
        tests/test_docs_config_examples.py tests/test_r2_survivors_s*.py \
        tools/test_mutation_campaign.py
fi
exec nice -n 10 /opt/tester-venv/bin/python -m pytest -q --cli-case-partial "$@"
''',
  "--",
]
budget = "10m"

# Dedicated ephemeral environment for CMRU's mutation lane. Project environment
# tables replace central ones as a whole, so this repeats the tester image and
# cgroup facts and owns its own io_sync policy.
[environments.cmru-mutation]
mode = "ephemeral"
image = "tester-unified:local"
image_env = "RUN_GATE_TESTER_UNIFIED_IMAGE"
cgroup_slice_env = "CGROUP_PARENT_DEV_GATES"
forward_env = ["CGROUP_PARENT_DEV_BACKGROUND", "CMRU_ASSAY_BASELINE_FACTS"]

[environments.cmru-mutation.resources]
cpus = "3"
io_sync = "relaxed"

# The mutation lane receives token-free remote facts generated immediately
# before it starts. CMRU's host-side gate uses its configured secret through
# CMRU's scoped Git transport; the tester container receives tag names and
# commit IDs only, never publisher credentials.
# The aggregate mutation path defaults to the highest-version published
# previous cmru release tag in the candidate's full ancestry. Whole-target R1
# does not need a diff base. The standalone T3 `r2` lane receives an explicit
# controller-selected R2-covered tag, which may be older. Host facts include
# every published CMRU tag and its commit so the tester can verify the selected
# base through Assay's sanitized ancestry API. Run the registered `gate` lane
# to prepare one-shot origin facts before its aggregate mutation campaign.
# An empty source diff writes skip evidence bound to candidate HEAD and emits
# no tag; otherwise only an older skip record is removed before emitting it.
# The 2026-11-12 R2 rehearsal measured full-suite controls from 368 to 825 s
# under concurrent lanes (CPU PSI 20-43). The 1800 s control ceiling is 2.18x
# the longest observed run; it is also the candidate-timeout floor, while
# candidate_timeout_seconds scales further from the measured control.
[lanes.mutation]
kind = "command"
environment = "cmru-mutation"
resource_observer = "cgprofile"
required_env = ["CMRU_ASSAY_BASELINE_FACTS"]
argv = [
  "bash",
  "-c",
  '''
set -euo pipefail
cd {worktree}/cmru
/opt/tester-venv/bin/python tools/check_assay_source.py --assay-source ../assay
/opt/tester-venv/bin/python -m pip install --quiet --disable-pip-version-check --no-input --no-deps --no-build-isolation --editable ../assay
/opt/tester-venv/bin/python -m pytest tools/test_mutation_campaign.py -q
BASE=$(/opt/tester-venv/bin/python tools/check_assay_baseline.py --skip-evidence)
if [ -z "$BASE" ]; then
    echo "mutation: no changed source — explicit skip evidence recorded"
    exit 0
fi
mkdir -p .assay
exec /opt/tester-venv/bin/python tools/mutation_campaign.py \
    --assay-source {worktree}/assay --repo-root {worktree} --project-root . \
    --base "$BASE" --max-mutants 10000 --timeout-seconds 1800 \
    --evidence .assay/mutation-cmru.json \
    --progress .assay/progress-mutation-cmru.jsonl \
    --require-candidates --resume -- \
    env PYTHONPATH=src:../libraries/worktree/src PYTHONDONTWRITEBYTECODE=1 \
    /opt/tester-venv/bin/python -m pytest tests -q --maxfail=1
''',
]
budget = "7h"
artifacts = [".assay/mutation-cmru.json"]

[lanes.mutation.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# T3 R2 entrypoint for the host controller's persistent per-commit checkout.
# The bundle contains local CMRU release tags already verified as published by
# that controller; this lane receives the chosen base explicitly and derives
# the token-free fact document from the bundled refs. Keep the aggregate
# `mutation` lane above until the controller's resume rehearsal is recorded.
[lanes.r2]
kind = "command"
environment = "cmru-mutation"
resource_observer = "cgprofile"
clean_tree = true
argv = [
  "bash",
  "-c",
  '''
set -euo pipefail
cd {worktree}/cmru
BASE="{base}"
/opt/tester-venv/bin/python tools/check_assay_source.py --assay-source ../assay
/opt/tester-venv/bin/python -m pip install --quiet --disable-pip-version-check --no-input --no-deps --no-build-isolation --editable ../assay
/opt/tester-venv/bin/python -m pytest tools/test_mutation_campaign.py -q
CMRU_ASSAY_BASELINE_FACTS=$(/opt/tester-venv/bin/python tools/local_baseline_facts.py --base "$BASE")
export CMRU_ASSAY_BASELINE_FACTS
BASE=$(/opt/tester-venv/bin/python tools/check_assay_baseline.py --base "$BASE" --skip-evidence)
if [ -z "$BASE" ]; then
    echo "r2: no changed source — explicit skip evidence recorded"
    exit 0
fi
mkdir -p .assay
exec /opt/tester-venv/bin/python tools/mutation_campaign.py --assay-source {worktree}/assay --repo-root {worktree} --project-root . --base "$BASE" --max-mutants 10000 --timeout-seconds 1800 --evidence .assay/mutation-cmru.json --progress .assay/progress-mutation-cmru.jsonl --require-candidates --resume -- env PYTHONPATH=src:../libraries/worktree/src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python -m pytest tests -q --maxfail=1
''',
  "--",
]
budget = "7h"
artifacts = [".assay/mutation-cmru.json"]

[lanes.r2.resources]
pids = 8192
memory = "2g"
memory_swap = "16g"

# The former [lanes.enroll] (KI-25: get.py enroll's container oracles O2/O3) moved
# to ciu/run-gate.toml [lanes.enroll] with the enrollment code itself (cmru
# program 2026-10, W1-CIU-ENROLL / O4): `get.py enroll` is ciu-owned now.

# The full implementation gate includes R2. The release step may select the
# explicit provisional sibling below when the operator postpones that long
# campaign; the marker is retained with release evidence. Both lanes run the
# same ref-probe, installed-wheel, and Assay R0/R1/R3 checks.
# Bare-host,
# not "host" (run-gate RG-43 estate-wide sweep, 2026-09-03): as of rev 36,
# plain "host" is a CONTAINER default with no docker-socket mount (verified
# live via --dry-run), and each sub-lane below launches its OWN gated
# tester-unified container via the installed `run-gate <lane>` CLI — this
# orchestrator needs real docker access to start those, the same trap
# debian-install-v2's own [lanes.gate] hit and was fixed the same way
# (scripts/debian-install-v2/run-gate.toml). RG-1: every sub-invocation
# carries `--worktree {worktree}` explicitly — an override given to `gate`
# must reach every sub-lane (run-gate refuses container lanes whose argv
# drops it; here we simply never drop it).
# `python3` below is whatever the host PATH names, which need not hold CMRU's
# declared dependencies (KI-81). The controller itself switches, once and
# loudly, to the interpreter of the installed `cmru` launcher when its own
# cannot import them, so no interpreter path is written here.
[lanes.gate]
kind = "command"
environment = "bare-host"
argv = ["python3", "-I", "-B", "{worktree}/cmru/tools/run_release_gate.py", "--worktree", "{worktree}"]
clean_tree = false   # sub-lanes each enforce their own clean-tree check
# The conjunction includes the Assay R0/R1/R3 lane (budget: [lanes.assay])
# plus the 7h tag-based R2 mutation.
budget = "14h"

# Operator-approved provisional release gate (KI-79): skips ONLY the long R2
# mutation lane; every other full-gate lane still runs. The run records the
# tracking id, reason, commit and timestamp under .assay and emits one WARN.
# The ordinary `gate` lane remains available for the post-release R2 campaign.
[lanes.gate-provisional]
kind = "command"
environment = "bare-host"
argv = [
  "python3", "-I", "-B", "{worktree}/cmru/tools/run_release_gate.py",
  "--worktree", "{worktree}", "--postpone-mutation", "KI-79",
]
clean_tree = false
budget = "3h"
