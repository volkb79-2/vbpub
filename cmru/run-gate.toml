# =============================================================================
# cmru project gate lanes — parsed ONLY by run-gate.py (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.toml; judgment
# policy lives in assay.toml [lanes.cmru] (R0 — see that file for why higher
# rigor is not yet declared here). The release-gate conjunction is lane
# `gate`; cmru.toml [steps.test] points at it and owns NO test logic itself.
# See run-gate-project/SPEC.md.
#
# RG-20 resources: every container lane declares its RAM so gate admission
# can sum concurrent gates against the dev-tier slice budget. Values mirror
# the proven CMRU_TESTER_MEMORY=1g / _MEMORY_SWAP=16g pattern: a tight RAM
# cap keeps bursts from cascading into co-resident live services, ample swap
# absorbs transients without OOM kills.
# =============================================================================
schema_version = 1

[lanes.assay]
kind = "assay"
assay_lane = "cmru"                 # -> assay.toml [lanes.cmru]
environment = "tester-unified"
assay_command = ["/opt/tester-venv/bin/python", "tools/assay/assay-6.1.1.pyz"]
budget = "20m"

# Re-pinned 6.1.0 -> 6.1.1 on 2026-09-11 via `cmru tool-deps --refresh assay`
# (assay B088: --resume no longer replays a stale mutation verdict after a
# test-only fix -- additive, no schema change, byte-identical for this
# project's native R0 lane). KI-27: --refresh does not itself rewrite this
# file's own pin/argv -- manual follow-up here, same recurring gap.
# GitHub asset digest verified against tools/assay/assay-6.1.1.pyz.sha256.
[lanes.assay.pins.assay]
version = "6.1.1"
sha256 = "tools/assay/assay-6.1.1.pyz.sha256"

[lanes.assay.resources]
memory = "1g"
memory_swap = "16g"

[lanes.coverage]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/cmru && exec /opt/tester-venv/bin/python -m pytest tests -q --cov=src/cmru --cov-branch --cov-fail-under=100 --cov-report=json:coverage.json"]
budget = "20m"
artifacts = ["coverage.json"]       # disclosed after every run (RG-10)

[lanes.coverage.resources]
memory = "1g"
memory_swap = "16g"

# Mutation base = the PREVIOUS cmru release tag, resolved at gate time — NOT
# origin/main (KI-18): at release time the tree IS origin/main, so a base of
# origin/main leaves zero candidates and the campaign fails
# --require-candidates. git describe returns the nearest ancestor cmru-v* tag,
# so every source line changed since the last release gets mutated. When the
# source diff against that verified-ancestor tag is genuinely EMPTY (a
# release that changes no src/ lines), the lane skips with a notice instead
# of failing — describe can only return an ancestor, so an empty diff here is
# a true "nothing to mutate", never a misresolved base.
[lanes.mutation]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/cmru && BASE=$(git describe --tags --abbrev=0 --match 'cmru-v*' 2>/dev/null || echo origin/main) && if git diff --quiet \"$BASE\"..HEAD -- src; then echo \"mutation: no changed source since $BASE — nothing to mutate, skipping\"; mkdir -p .assay; printf '{\"status\": \"skipped\", \"reason\": \"no-changed-source\", \"base\": \"%s\"}\\n' \"$BASE\" > .assay/mutation-cmru.json; exit 0; fi && mkdir -p .assay && exec /opt/tester-venv/bin/python tools/mutation_campaign.py --assay-zipapp tools/assay/assay-6.1.1.pyz --repo-root {worktree} --project-root . --base \"$BASE\" --max-mutants 10000 --evidence .assay/mutation-cmru.json --require-candidates -- /opt/tester-venv/bin/python -m pytest tests -q --cov=src/cmru --cov-branch --cov-fail-under=100 --cov-report=json:coverage.json"]
budget = "4h"
artifacts = [".assay/mutation-cmru.json"]

[lanes.mutation.resources]
memory = "1g"
memory_swap = "16g"

[lanes.canary]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/cmru && mkdir -p .assay && exec /opt/tester-venv/bin/python tools/coverage_canary.py --repo-root {worktree} --project-root . --target src/cmru/config.py --evidence .assay/coverage-canary-cmru.json -- /opt/tester-venv/bin/python -m pytest tests -q --cov=src/cmru --cov-branch --cov-fail-under=100 --cov-report=json:coverage.json"]
budget = "20m"
artifacts = [".assay/coverage-canary-cmru.json"]

[lanes.canary.resources]
memory = "1g"
memory_swap = "16g"

# KI-25: get.py enroll's security-critical container oracles (O2/O3) -- real
# user creation, authorized_keys writes, file permissions/ownership, a
# fingerprint cross-check against a REAL sshd -- spin up their own
# disposable docker containers from inside the test process itself
# (tests/test_installer.py TestEnrollAgainstRealSystem / _enroll_container).
# tester-unified has no docker-socket mount (the same RG-43-class gap
# already fixed elsewhere for other docker-launching lanes), so this runs
# bare-host, same reasoning as [lanes.gate] below: real docker access, on
# this invoking shell's own python/pytest -- no /opt/tester-venv/ path
# here, that venv exists only inside the tester-unified image. The fixture
# chain self-skips (not errors) when docker or CGROUP_PARENT_DEV_BACKGROUND
# are genuinely unavailable (_docker_unavailable_reason); on the real
# bare-host gate environment both are present, so this lane actually
# EXERCISES O2/O3 instead of skipping past them -- closing the gap the
# other, tester-unified-scoped sub-lanes above could never close on their
# own. No [lanes.enroll.resources]: the containers this spawns are
# self-capped by the test fixture itself (--cgroup-parent/--cpus/--memory),
# the same reason [lanes.gate] itself declares none.
[lanes.enroll]
kind = "command"
environment = "bare-host"
argv = ["bash", "-c", "cd {worktree}/cmru && exec python3 -m pytest tests/test_installer.py -k TestEnrollAgainstRealSystem -q"]
budget = "20m"

# The implementation/release gate: every consumer (cmru release steps, agents,
# humans) runs THIS lane; none duplicates the sub-lane sequence. Bare-host,
# not "host" (run-gate RG-43 estate-wide sweep, 2026-09-03): as of rev 36,
# plain "host" is a CONTAINER default with no docker-socket mount (verified
# live via --dry-run), and each sub-lane below launches its OWN gated
# tester-unified container via a nested `./run-gate.py <lane>` — this
# orchestrator needs real docker access to start those, the same trap
# debian-install-v2's own [lanes.gate] hit and was fixed the same way
# (scripts/debian-install-v2/run-gate.toml). RG-1: every sub-invocation
# carries `--worktree {worktree}` explicitly — an override given to `gate`
# must reach every sub-lane (run-gate refuses container lanes whose argv
# drops it; here we simply never drop it).
[lanes.gate]
kind = "command"
environment = "bare-host"
argv = ["bash", "-c", "cd {worktree}/cmru && ./run-gate.py --worktree {worktree} assay && ./run-gate.py --worktree {worktree} coverage && ./run-gate.py --worktree {worktree} mutation && ./run-gate.py --worktree {worktree} canary && ./run-gate.py --worktree {worktree} enroll"]
clean_tree = false   # sub-lanes each enforce their own clean-tree check
budget = "5h"
