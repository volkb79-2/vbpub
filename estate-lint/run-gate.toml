# =============================================================================
# estate-lint's gate: TWO steps, both mandatory (set -e).
#
# 1. the estate-wide tests: the real dependency graph and the bootstrap doc's
#    `project-order` block. They read `cmru.orchestration.toml` and every
#    project's `pyproject.toml`, which is why they are not cmru's tests
#    (P-core-12, KI-194).
# 2. `run-gate lanes --check --all --strict` over the whole estate: the lane
#    budgets Run-Gate enforces. `--strict` promotes the "outer >= inner + 5m"
#    margin from a warning to a failure, which is the rule these tests used to
#    restate in cmru (cmru/tests/test_gate_budgets.py).
#
# The image bakes a copy of cmru; the lane must judge the WORKTREE's cmru and
# `worktree` library, so both source trees are on PYTHONPATH.
# =============================================================================
schema_version = 1

[lanes.suite]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "set -eu; cd {worktree}/estate-lint && PYTHONPATH={worktree}/cmru/src:{worktree}/libraries/worktree/src:$PYTHONPATH PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q; cd {worktree} && run-gate lanes --check --all --strict",
]
clean_tree = false
# Unmeasured at first release: a handful of config reads plus one `lanes --check`
# pass over the estate. The controller measures it on the first gate.
budget = "10m"

[lanes.suite.resources]
memory = "1g"
io_sync = "durable"
