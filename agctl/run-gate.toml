# agctl's executable gate matrix. The single declared lane is `tests`: pytest inside
# tester-unified, no cockpit run. The suite reads temp trees, fake source directories and
# recorded git porcelain text only; it never reads the live estate, a run stream, a
# credential or a session transcript, so the verdict cannot depend on host load.
#
# cli-extended is a REAL wheel dependency (CX-D1) and is not yet in tester-unified (DESIGN
# section 2: "until T2 P7.0b ... the lane and shims set PYTHONPATH=libraries/cli-extended/src").
# That path is put on PYTHONPATH here rather than into a vendored copy of the library.
#
# The coverage floor is 100 % line+branch, the estate's target for a brand-new pure-Python
# package (the same floor libraries/test-policy declares); it is a regression guard from the
# first commit, not an aspiration, because every line of this package is a decision about
# what an unknown estate may print.
schema_version = 1

[lanes.tests]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/agctl && PYTHONPATH=src:{worktree}/libraries/cli-extended/src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=agctl --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "10m"
# RG-320/RG-326: SILENT BY CONSTRUCTION while pytest runs; no output cadence
# of 300s or less is guaranteed by the test suite; no bound is measured; see RG-326.
stall_timeout = "10m"
artifacts = ["coverage.json"]

[lanes.tests.resources]
memory = "1g"
io_sync = "durable"
