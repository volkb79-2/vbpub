[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "agctl"
description = "Controller identity, run registry and estate-state readers for vbpub agent runs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
# Stdlib apart from the CLI shell: cli-extended is a REAL wheel dependency (unified
# adoption CX-D1), never vendored. Until the wheel is in tester-unified the lane puts
# libraries/cli-extended/src on PYTHONPATH (DESIGN section 2); there is no copied source tree.
dependencies = ["cli-extended>=0.8.0"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
agctl = "agctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version from the git tag `agctl-vX.Y.Z` minted by the release contract in cmru.toml; no
# fallback_version, so a build without git metadata fails instead of inventing a number
# (AGENTS.md "Defaults and fallbacks are hazards").
[tool.setuptools_scm]
root = ".."
tag_regex = "^agctl-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "agctl-v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
