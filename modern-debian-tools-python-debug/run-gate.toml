# =============================================================================
# modern-debian-tools-python-debug gate lanes — parsed ONLY by run-gate.py
# (one parser, D-110). Image-build tooling: no unit suite exists, so the lane
# is a syntax smoke over every tracked Python file, plus (RG-55 P8)
# host-setup/'s own renderer test (renders every units/*.in template from
# host-setup.env.example's shipped defaults, asserts no unresolved @VAR@
# tokens survive, and bash -n/shellcheck-checks every shell script that
# package touches — see host-setup/tests/test-render.sh). The image builds
# themselves belong to the cmru image-bake dependency chain (D-110.2), not a
# per-commit gate. Host lane.
# See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.smoke]
kind = "command"
environment = "host"
argv = ["bash", "-c", "cd {worktree}/modern-debian-tools-python-debug && find . -name '*.py' -print0 | xargs -0 -r python3 -m py_compile && bash host-setup/tests/test-render.sh && echo 'smoke: OK'"]
budget = "2m"
