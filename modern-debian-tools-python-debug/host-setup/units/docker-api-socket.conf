# mdt host-setup — docker.socket drop-in: an ADDITIONAL, directory-mountable
# Docker API socket alongside the default /run/docker.sock.
#
# Why: a devcontainer's docker-outside-of-docker mount is normally
# `-v /var/run/docker.sock:/var/run/docker.sock` — a FILE-level bind mount,
# which pins ONE socket inode. When dockerd restarts (an unrelated `apt
# upgrade` is enough — verified live), it unlinks and recreates that file;
# every already-running container's bind mount is now a dangling reference
# to the old, deleted inode, and Docker access inside it is unrecoverable
# short of surgically re-mounting via /proc/<pid>/root/ from the host (or a
# full devcontainer rebuild). A DIRECTORY-level bind mount doesn't have this
# failure mode: a new file created inside an already-bind-mounted directory
# becomes visible to every container bind-mounting it immediately, no
# remount needed. See the devcontainer template's matching mount + DOCKER_HOST
# for the consumer side.
#
# Why a docker.socket drop-in and not `daemon.json`'s "hosts" key: this
# host's docker.service is started via systemd socket activation
# (`ExecStart=/usr/bin/dockerd -H fd://`, `Requires=docker.socket`) —
# dockerd refuses to start if listen addresses are given BOTH as `-H fd://`
# and via daemon.json's "hosts", so the extra listener has to come from
# systemd's own socket unit instead. ListenStream=/SocketMode=/SocketUser=/
# SocketGroup= are "append" directives across a unit + its drop-ins, so this
# ADDS a second listening socket without touching docker.socket's own
# existing ListenStream=/run/docker.sock.
#
# /run is tmpfs (wiped every boot) — ExecStartPre= (which for a .socket unit
# runs BEFORE its listening sockets are created/bound, unlike a .service
# unit's ExecStartPre) recreates the directory every start, matching the
# RuntimeDirectory= fix applied to mdt-buildkitd.service for the identical
# class of problem (a rootless-vs-root ownership mismatch there; a
# wiped-on-boot directory here).
#
# Cleanup logic: ExecStartPre runs in sequence and stops on first failure.
# We use shell -c to atomically:
#   1. Unmount any stale tmpfs mounts on /run/docker.sock (can happen if
#      a prior restart attempt failed partway through and left bind mounts)
#   2. Remove stale socket files that systemd can't overwrite
#   3. Unmount any stale mounts on /run/docker-api/docker.sock itself
#   4. Create the directory with correct ownership
# Failures here are non-fatal (exit 0) — if a socket file doesn't exist,
# umount/rm will fail, but we continue anyway. Only bind failures below matter.
#
# ACTIVATION: like the daemon.json cgroup-parent merge below in install.sh,
# writing this file is NOT enough on its own — dockerd already holds its
# original fds from whenever it last started, so picking up this new socket
# needs the daemon restarted, not just reloaded. install.sh only renders and
# `daemon-reload`s; the restart is a deliberate, scheduled, operator-run step
# (see its end-of-run REMINDER) exactly like the existing cgroup-parent one.
[Socket]
ListenStream=/run/docker-api/docker.sock
SocketMode=0660
SocketUser=root
SocketGroup=docker
ExecStartPre=/bin/sh -c 'umount -l /run/docker.sock 2>/dev/null; rm -f /run/docker.sock; umount -l /run/docker-api/docker.sock 2>/dev/null; exit 0'
ExecStartPre=/bin/mkdir -p /run/docker-api
ExecStartPre=/bin/chown root:docker /run/docker-api
ExecStartPre=/bin/chmod 0750 /run/docker-api
