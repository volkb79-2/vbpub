# Keep the optional kernel-wide DAMON_STAT monitor disabled so the host's
# cgroup-profiler daemon can use generic DAMON sysfs sessions. Installed only
# when the host operator chooses DAMON_STAT_DISABLE_DEFAULT=yes in the MDT
# host-setup wizard. systemd-tmpfiles applies this at boot; install.sh also
# applies it immediately when the parameter exists.
w /sys/module/damon_stat/parameters/enabled - - - - N
