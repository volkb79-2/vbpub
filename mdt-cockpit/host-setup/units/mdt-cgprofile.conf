# mdt host-setup tmpfiles entry for the cgprofile control socket.
#
# The control socket remains in /run/cgprofile with docker-group access.
# The read-only observer directory has a separate rule in
# mdt-cgprofile-observer.conf. Consumers use Docker --mount, which refuses a
# missing source instead of inventing it.
#
# The daemon owns only the observer socket entry. This host-owned directory
# survives daemon restarts, so directory bind mounts see the newly bound
# socket inode without restarting a long-running gate container.
d /run/cgprofile 0770 root docker -
