# mdt host-setup — tmpfiles.d entry: /run/cgprofile, the directory the
# devcontainer template bind-mounts to reach the cgroup-profiler daemon's
# control socket (RG-55 A2/D-30, run-gate-project/nyxloom-trove/
# DESIGN-2026-09-12-liveness-placement-admission.md).
#
# Why tmpfiles.d and not a `mkdir` somewhere in install.sh: /run is tmpfs,
# wiped every boot (same class of problem docker-api-socket.conf's own
# ExecStartPre= solves for a systemd .socket unit — this is the declarative,
# `d` (ensure-directory) form of the identical fix, appropriate here because
# nothing else owns this directory's own startup ordering the way a .socket
# unit owns its listener's). systemd re-applies every `/etc/tmpfiles.d/*.conf`
# on every boot automatically (`systemd-tmpfiles-setup.service`), so the
# directory, its mode and its owner survive a reboot without any code of
# ours running again.
#
# Why this directory must exist BEFORE the daemon (or a probe container)
# ever runs: `templates/devcontainer.json`'s `mounts` entries are Docker
# `--mount` (not `-v`), and `--mount` REFUSES to bind a source path that
# does not exist on the host — unlike `-v`, which would silently create an
# empty directory owned by root:root, the wrong owner/mode for this
# purpose. install.sh installs this file and runs
# `systemd-tmpfiles --create` once at install time so the directory exists
# immediately, not only after the next reboot.
#
# 0770 root:docker: matches the daemon's own listener socket permissions
# (root:docker 0660, D-30) — any principal that can reach the docker group
# (the same set that can `docker exec`) can also traverse this directory to
# reach the socket inside it. No `docker run --user`-based rider needed on
# the devcontainer side: the existing `--group-add ${localEnv:DOCKER_GID}`
# runArg already puts every user of this template in that same group.
#
# The daemon package (P6) re-asserts the SOCKET's own owner/mode at its own
# start (belt-and-braces) — this entry only owns the DIRECTORY, and only
# ever needs to run once per boot, before anything tries to bind-mount it.
d /run/cgprofile 0770 root docker -
