# mdt host-setup drop-in for topos.service, inert until that unit is installed.
#
# Group=docker: systemd re-owns RuntimeDirectory= at every service start, so without
# this /run/topos becomes root:topos and the devcontainer's --group-add DOCKER_GID
# cannot reach the socket.
# RuntimeDirectoryPreserve=yes: without it systemd removes /run/topos on stop, which
# detaches the directory bind in running devcontainers until they are recreated.
[Service]
Group=docker
RuntimeDirectoryPreserve=yes
