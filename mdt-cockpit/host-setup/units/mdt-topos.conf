# mdt host-setup tmpfiles entry for the topos daemon socket directory.
#
# Directory rule only: host-setup installs and starts no topos service. The
# devcontainer templates bind /run/topos read-only with `-v` (auto-creates a
# missing source, so a host without this file still starts its devcontainer).
# The daemon's socket must be root:docker (daemon Group=docker) so the
# container's --group-add DOCKER_GID reaches it. 0750: the group only needs
# traversal, and the mount is read-only; the daemon runs as root.
# A directory (not a socket file) survives daemon restarts. Sorts before the
# package's own topos.conf, so this rule is the one tmpfiles applies on mdt hosts.
d /run/topos 0750 root docker -
