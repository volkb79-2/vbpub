# Keep the optional kernel-wide DAMON_STAT monitor disabled so the host's
# cgroup-profiler daemon can use generic DAMON sysfs sessions. Installed by
# default (DAMON_STAT_DISABLE_DEFAULT="yes", operator decision 2026-10-20) and
# removed when DAMON_STAT_DISABLE_DEFAULT=no. systemd-tmpfiles applies this at
# boot; install.sh also applies it immediately when the parameter exists.
w /sys/module/damon_stat/parameters/enabled - - - - N
