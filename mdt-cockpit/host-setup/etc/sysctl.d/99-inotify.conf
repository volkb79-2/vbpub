# https://code.visualstudio.com/docs/setup/linux#_visual-studio-code-is-unable-to-watch-for-file-changes-in-this-large-workspace-error-enospc
# need more open file descriptors for vscode with larger repo(s)
# Each watch costs roughly half a kilobyte of kernel memory, so 1M is the ceiling.
# The limit is kernel-wide per uid: every VS Code server of that user (several devcontainers) shares it.
fs.inotify.max_user_watches = 1048576

