[components.cowtree_source]
kind = "source-library"
applies_to = "both"
requires = []
provides = ["cowtree.copy-or-cow-backend"]
minimum_version = "current checkout; host CoW cache is optional"
required = true
fix = "Use the embedded `libraries/cowtree` source from the selected checkout. A missing shared host cache is supported and selects the private copy backend; configure one only against the documented host contract."
owner = "libraries/cowtree"
doc = "../../libraries/cowtree/HOST-CONTRACT.md"

[components.cowtree_source.verify]
command = "test -f \"$ESTATE_REPO_ROOT/libraries/cowtree/src/cowtree/__init__.py\" && test -d \"$ESTATE_REPO_ROOT/libraries/cowtree/src/cowtree\" && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.iobench_source]
kind = "source-library"
applies_to = "both"
requires = []
provides = ["host.io-baseline-calibration-source"]
minimum_version = "current checkout; host calibration is role-dependent"
required = true
fix = "Use `libraries/iobench` from the selected checkout. If host-setup is configured for a measured dedicated-dev profile, follow iobench's consumer guide and verify the configured baseline; do not infer a target device or baseline path."
owner = "libraries/iobench"
doc = "../../libraries/iobench/docs/CONSUMERS.md"

[components.iobench_source.verify]
command = "test -f \"$ESTATE_REPO_ROOT/libraries/iobench/pyproject.toml\" && test -d \"$ESTATE_REPO_ROOT/libraries/iobench/src/iobench\" && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.iobench_host_calibration]
kind = "role-dependent-host-calibration"
applies_to = "both"
requires = ["iobench_source"]
provides = ["mdt.dedicated-dev-io-caps"]
minimum_version = "result schema 1 with complete plausible run and matching disk identity; required only when role policy needs it"
required = false
fix = "For `HOST_ROLE=dedicated-dev`, every unpinned `DEV_IO_*_MAX` needs a usable iobench result with matching root-disk identity; use the read-only `sudo mdt-host-check.sh` to see whether the current result is accepted. On `shared-prod`, the static fallback remains available. Run calibration only in the documented quiet window and only through the host operator."
owner = "mdt-cockpit"
doc = "../host-setup/README.md#host-role-shared-prod-or-dedicated-dev-mdt-testhost-io"

[components.iobench_host_calibration.verify.controller]
command = "test -r /etc/mdt/host-setup.env || exit 125; source \"$ESTATE_REPO_ROOT/mdt-cockpit/host-setup/scripts/mdt-container-io-caps.lib.sh\"; node=$(_mdt_root_disk_node) || exit 125; majmin=$(_mdt_root_disk_majmin) || exit 125; args=(--devno \"$majmin\"); while IFS='=' read -r key value; do case \"$key\" in model|serial|wwn) test -z \"$value\" || args+=(\"--$key\" \"$value\") ;; size_bytes) test -z \"$value\" || args+=(--size-bytes \"$value\") ;; esac; done < <(_mdt_io_disk_identity \"${node#/dev/}\"); test -z \"${IOBENCH_RESULT:-}\" || args+=(--result \"$IOBENCH_RESULT\"); python3 \"$ESTATE_REPO_ROOT/mdt-cockpit/host-setup/scripts/mdt_iobench_caps.py\" \"${args[@]}\" >/dev/null && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.iobench_host_calibration.verify.test-host]
command = "test -r /etc/mdt/host-setup.env || exit 125; source \"$ESTATE_REPO_ROOT/mdt-cockpit/host-setup/scripts/mdt-container-io-caps.lib.sh\"; node=$(_mdt_root_disk_node) || exit 125; majmin=$(_mdt_root_disk_majmin) || exit 125; args=(--devno \"$majmin\"); while IFS='=' read -r key value; do case \"$key\" in model|serial|wwn) test -z \"$value\" || args+=(\"--$key\" \"$value\") ;; size_bytes) test -z \"$value\" || args+=(--size-bytes \"$value\") ;; esac; done < <(_mdt_io_disk_identity \"${node#/dev/}\"); test -z \"${IOBENCH_RESULT:-}\" || args+=(--result \"$IOBENCH_RESULT\"); python3 \"$ESTATE_REPO_ROOT/mdt-cockpit/host-setup/scripts/mdt_iobench_caps.py\" \"${args[@]}\" >/dev/null && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

