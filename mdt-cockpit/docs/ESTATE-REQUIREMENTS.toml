fix = "No change is required when the cache is disabled; consumers use private copies. When enabled, follow the dedicated-dev shared tree-cache section of `host-setup/README.md` and `libraries/cowtree/HOST-CONTRACT.md`."
owner = "mdt-cockpit"
doc = "../host-setup/README.md"

[components.mdt_cgroup_environment]
kind = "session-environment"
applies_to = "both"
requires = ["systemd_slices"]
provides = ["CGROUP_PARENT_DEV_INTERACTIVE", "CGROUP_PARENT_DEV_BACKGROUND", "CGROUP_PARENT_DEV_GATES"]
minimum_version = "the three declared MDT slice names"
required = true
fix = "Use the MDT devcontainer template's declared values and the host-setup installed slice units. Recreate the cockpit after any `containerEnv` change so tools inherit the current values; do not fall back to another tier."
owner = "mdt-cockpit"
doc = "../host-setup/README.md#tiering-model"

[components.mdt_cgroup_environment.verify.controller]
command = "test \"${CGROUP_PARENT_DEV_INTERACTIVE:-}\" = dev-interactive.slice && test \"${CGROUP_PARENT_DEV_BACKGROUND:-}\" = dev-background.slice && test \"${CGROUP_PARENT_DEV_GATES:-}\" = dev-gates.slice && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.mdt_cgroup_environment.verify.test-host]
command = "docker exec -u vscode \"$ESTATE_COCKPIT\" /bin/bash -c 'test \"${CGROUP_PARENT_DEV_INTERACTIVE:-}\" = dev-interactive.slice && test \"${CGROUP_PARENT_DEV_BACKGROUND:-}\" = dev-background.slice && test \"${CGROUP_PARENT_DEV_GATES:-}\" = dev-gates.slice && printf PASS'"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.shared_tree_cache.verify.controller]
command = "systemctl show dev-cache.slice -p LoadState --value >/dev/null 2>&1 || exit 125; test \"$(systemctl show dev-cache.slice -p LoadState --value)\" = loaded && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.shared_tree_cache.verify.test-host]
command = "systemctl show dev-cache.slice -p LoadState --value >/dev/null 2>&1 || exit 125; test \"$(systemctl show dev-cache.slice -p LoadState --value)\" = loaded && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

