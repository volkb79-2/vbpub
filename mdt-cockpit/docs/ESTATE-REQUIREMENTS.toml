[components.cmru_tester_environment]
kind = "workflow-environment"
applies_to = "both"
requires = ["cmru_source", "tester_unified_image"]
provides = ["CMRU_TESTER_MEMORY", "CMRU_TESTER_MEMORY_SWAP", "CMRU_TESTER_CPUS", "CMRU_TESTER_PIDS_LIMIT", "CMRU_TESTER_CGROUP_PARENT"]
minimum_version = "all required settings declared; no consumer fallback"
required = true
fix = "Set the required finite memory, swap, CPU, PID, probe-image and gates-parent values in `cmru.orchestration.toml` or the authorized invocation environment, then run CMRU's tester-gate preflight."
owner = "cmru"
doc = "../../cmru/docs/CONSUMERS.md"

[components.cmru_tester_environment.verify]
command = "python3 -c 'import os,tomllib; from pathlib import Path; p=Path(os.environ[\"ESTATE_REPO_ROOT\"]); d=tomllib.loads((p/\"cmru.orchestration.toml\").read_text()); e=d[\"orchestration\"][\"defaults\"][\"env\"]; keys=(\"CMRU_TESTER_UNIFIED_IMAGE\",\"CMRU_TESTER_MEMORY\",\"CMRU_TESTER_MEMORY_SWAP\",\"CMRU_TESTER_CPUS\",\"CMRU_TESTER_PIDS_LIMIT\",\"CMRU_TESTER_CGROUP_PROBE_IMAGE\",\"CMRU_TESTER_CGROUP_PARENT\"); assert all(e.get(k) for k in keys); print(\"PASS\")'"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.runner_identity_and_directories]
kind = "runner-user-and-dirs"
applies_to = "test-host"
requires = ["docker_engine"]
provides = ["runner.uid-1003", "runner.checkouts", "runner.jobs", "runner.tools"]
minimum_version = "uid 1003; configured runner home; required directories"
required = true
fix = "Use `scripts/netcup/runner/provision-runner.sh` and the operator-owned `runner.env`; then verify the runner identity and directories with `scripts/netcup/runner/README.md`. Do not copy host-specific values into this repository."
owner = "scripts/netcup/runner"
doc = "../../scripts/netcup/runner/README.md"

[components.runner_identity_and_directories.verify.test-host]
command = "test \"$(id -u)\" = 1003 && for d in \"$HOME/checkouts\" \"$HOME/jobs\" \"$HOME/runner-scripts\" \"$HOME/venvs\" \"$HOME/cache\"; do test -d \"$d\" || exit 1; done && test -s /etc/vbpub/server-id && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.systemd_slices]
kind = "systemd-slices"
applies_to = "both"
requires = []
provides = ["dev.slice", "dev-interactive.slice", "dev-background.slice", "dev-gates.slice", "dev-buildkitd.slice"]
minimum_version = "systemd with loaded installed units; MemoryZSwapWriteback is native from systemd 256"
required = true
fix = "Run the authorized MDT host-setup install and checker from `host-setup/README.md`; verify each required slice is loaded from an installed unit. Keep `dev-cache.slice` optional and enabled only with the shared tree-cache configuration."
owner = "mdt-cockpit"
doc = "../host-setup/README.md"

[components.systemd_slices.verify.controller]
command = "systemctl show dev.slice -p LoadState --value >/dev/null 2>&1 || exit 125; for u in dev.slice dev-interactive.slice dev-background.slice dev-gates.slice dev-buildkitd.slice; do test \"$(systemctl show \"$u\" -p LoadState --value)\" = loaded && test -n \"$(systemctl show \"$u\" -p FragmentPath --value)\" || exit 1; done; printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.systemd_slices.verify.test-host]
command = "for u in dev.slice dev-interactive.slice dev-background.slice dev-gates.slice dev-buildkitd.slice; do test \"$(systemctl show \"$u\" -p LoadState --value)\" = loaded && test -n \"$(systemctl show \"$u\" -p FragmentPath --value)\" || exit 1; done; printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.shared_tree_cache]
kind = "optional-host-capability"
