# Cross-project host and cockpit prerequisites owned by mdt-cockpit.
# Probes must stay read-only. A verifier exits 0 and prints its declared
# expected result on success; exit 125 means this context cannot observe it.
schema_version = 1
owner = "mdt-cockpit"
host_kinds = ["controller", "test-host"]

[components.host_endpoint_record]
kind = "host-env-record"
applies_to = "both"
requires = []
provides = ["/etc/host-endpoints.env", "CGPROFILE_CONTROL_SOCKET", "CGPROFILE_CONTROL_SOCKET_DIR", "CGPROFILE_CONTROL_GID", "CGPROFILE_OBSERVER_SOCKET", "CGPROFILE_OBSERVER_SOCKET_DIR", "CGPROFILE_OBSERVER_GID", "TOPOS_OBSERVE_SOCKET", "TOPOS_OBSERVE_SOCKET_DIR", "TOPOS_OBSERVE_GID", "MDT_HOST_DOCKER_GID", "MDT_DOCKER_API_SOCKET", "MDT_BUILDKIT_SOCKET", "MDT_BUILDKIT_GID", "BUILDX_BUILDER", "BUILDKIT_HOST"]
minimum_version = "not established"
required = true
fix = "On the host, use each service owner's installer, then run `sudo augeaswrap endpoints check --json`. For cgprofile use `sudo cgprofiled install` and `sudo /opt/cgprofile/current/venv/bin/cgprofiled doctor --json`. Never edit `/etc/host-endpoints.env` or the managed environment block by hand."
owner = "mdt-cockpit"
doc = "CONSUMERS.md"

[components.host_endpoint_record.verify.controller]
command = "test -r /etc/host-endpoints.env || exit 125; python3 -c 'from pathlib import Path; import re,stat; p=Path(\"/etc/host-endpoints.env\"); s=p.lstat(); assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and not (s.st_mode & 0o022); d=dict(line.split(\"=\",1) for line in p.read_text().splitlines() if line and not line.startswith(\"#\")); keys=(\"CGPROFILE_CONTROL_SOCKET\",\"CGPROFILE_CONTROL_SOCKET_DIR\",\"CGPROFILE_CONTROL_GID\",\"CGPROFILE_OBSERVER_SOCKET\",\"CGPROFILE_OBSERVER_SOCKET_DIR\",\"CGPROFILE_OBSERVER_GID\",\"MDT_HOST_DOCKER_GID\",\"MDT_DOCKER_API_SOCKET\",\"MDT_BUILDKIT_SOCKET\",\"MDT_BUILDKIT_GID\",\"BUILDX_BUILDER\",\"BUILDKIT_HOST\"); assert all(d.get(k) for k in keys); assert all(re.fullmatch(r\"[1-9][0-9]*\",d[k]) for k in (\"CGPROFILE_CONTROL_GID\",\"CGPROFILE_OBSERVER_GID\",\"MDT_HOST_DOCKER_GID\",\"MDT_BUILDKIT_GID\")); print(\"PASS\")'"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.host_endpoint_record.verify.test-host]
command = "python3 -c 'from pathlib import Path; import os,re,stat; p=Path(\"/etc/host-endpoints.env\"); s=p.lstat(); assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and not (s.st_mode & 0o022); d=dict(line.split(\"=\",1) for line in p.read_text().splitlines() if line and not line.startswith(\"#\")); keys=(\"CGPROFILE_CONTROL_SOCKET\",\"CGPROFILE_CONTROL_SOCKET_DIR\",\"CGPROFILE_CONTROL_GID\",\"CGPROFILE_OBSERVER_SOCKET\",\"CGPROFILE_OBSERVER_SOCKET_DIR\",\"CGPROFILE_OBSERVER_GID\",\"MDT_HOST_DOCKER_GID\",\"MDT_DOCKER_API_SOCKET\",\"MDT_DOCKER_API_SOCKET_DIR\",\"MDT_BUILDKIT_SOCKET\",\"MDT_BUILDKIT_SOCKET_DIR\",\"MDT_BUILDKIT_GID\",\"BUILDX_BUILDER\",\"BUILDKIT_HOST\"); assert all(d.get(k) for k in keys); assert all(re.fullmatch(r\"[1-9][0-9]*\",d[k]) for k in (\"CGPROFILE_CONTROL_GID\",\"CGPROFILE_OBSERVER_GID\",\"MDT_HOST_DOCKER_GID\",\"MDT_BUILDKIT_GID\")); assert all(os.path.isabs(d[k]) for k in (\"CGPROFILE_CONTROL_SOCKET\",\"CGPROFILE_CONTROL_SOCKET_DIR\",\"CGPROFILE_OBSERVER_SOCKET\",\"CGPROFILE_OBSERVER_SOCKET_DIR\",\"MDT_DOCKER_API_SOCKET\",\"MDT_DOCKER_API_SOCKET_DIR\",\"MDT_BUILDKIT_SOCKET\",\"MDT_BUILDKIT_SOCKET_DIR\")); print(\"PASS\")'"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.cgprofile_daemon]
kind = "host-service"
applies_to = "both"
requires = ["host_endpoint_record"]
provides = ["cgprofile.control-v2", "cgprofile.observer-v2"]
minimum_version = "3.0.0"
required = true
fix = "On an authorized host, deploy cgprofile 3.0.0 or newer with the native install flow, then run `sudo /opt/cgprofile/current/venv/bin/cgprofiled doctor --json` and `sudo cgprofilectl doctor --json`. The controller host also runs a production game server; agents must not change its host services or restart/rebuild its cockpit without the operator."
owner = "cgprofile"
doc = "../../cgprofile/docs/NATIVE-DEPLOYMENT.md"

[components.cgprofile_daemon.verify.controller]
command = "python3 -c 'import json,os,socket,sys; p=os.environ.get(\"CGPROFILE_CONTROL_SOCKET\"); (print(\"CGPROFILE_CONTROL_SOCKET unset\"),sys.exit(125)) if not p else None; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect(p); s.sendall(b\"{\\\"verb\\\":\\\"version\\\",\\\"args\\\":{},\\\"contract\\\":2}\\n\"); d=json.loads(s.makefile(\"rb\").readline()); print(d[\"daemon\"][\"version\"])'"
expected_regex = '^\\d+\\.\\d+\\.\\d+'
version_pattern = '^(\\d+\\.\\d+\\.\\d+)'
failure_evidence_regex = "^CGPROFILE_CONTROL_SOCKET unset$"
timeout_seconds = 5

[components.cgprofile_daemon.verify.test-host]
command = "docker exec -u vscode \"$ESTATE_COCKPIT\" python3 -c 'import json,os,socket,sys; p=os.environ.get(\"CGPROFILE_CONTROL_SOCKET\"); (print(\"CGPROFILE_CONTROL_SOCKET unset\"),sys.exit(125)) if not p else None; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect(p); s.sendall(b\"{\\\"verb\\\":\\\"version\\\",\\\"args\\\":{},\\\"contract\\\":2}\\n\"); d=json.loads(s.makefile(\"rb\").readline()); print(d[\"daemon\"][\"version\"])'"
expected_regex = '^\\d+\\.\\d+\\.\\d+'
version_pattern = '^(\\d+\\.\\d+\\.\\d+)'
failure_evidence_regex = "^CGPROFILE_CONTROL_SOCKET unset$"
timeout_seconds = 10

[components.cgprofile_session_delivery]
kind = "cockpit-environment"
applies_to = "both"
requires = []
provides = ["CGPROFILE_CONTROL_SOCKET", "CGPROFILE_CONTROL_SOCKET_DIR", "CGPROFILE_CONTROL_GID", "CGPROFILE_OBSERVER_SOCKET", "CGPROFILE_OBSERVER_SOCKET_DIR", "CGPROFILE_OBSERVER_GID", "MDT_HOST_DOCKER_GID", "cgprofile control/observer socket mounts", "cgprofile control/observer supplementary groups"]
minimum_version = "published endpoint record and a fresh session"
required = true
fix = "The host record is published by `cgprofiled install`; new login sessions receive its environment, while existing sessions keep their old environment. Complete the MDT-086 consumer cutover, then create a fresh session. Workaround only for the current controller session: cgprofile 1.1.0 exposes `/run/cgprofile/ctl.sock` while Run-Gate 25.5.0 requires the variable; run `export CGPROFILE_CONTROL_SOCKET=/run/cgprofile/ctl.sock` before `run-gate`. This per-process export does not fix template/session delivery or supply observer/group facts. The controller host also runs a production game server; agents must not restart/rebuild its cockpit or change host services without the operator."
owner = "mdt-cockpit"
doc = "DEVCONTAINER-MECHANISMS.md"

[components.cgprofile_session_delivery.verify.controller]
command = "test -n \"${CGPROFILE_CONTROL_SOCKET:-}\" || { printf 'CGPROFILE_CONTROL_SOCKET unset'; exit 1; }; test -n \"${CGPROFILE_OBSERVER_SOCKET:-}\" && test -n \"${CGPROFILE_CONTROL_GID:-}\" && test -n \"${CGPROFILE_OBSERVER_GID:-}\" && test -n \"${MDT_HOST_DOCKER_GID:-}\" && test -S \"$CGPROFILE_CONTROL_SOCKET\" && test -S \"$CGPROFILE_OBSERVER_SOCKET\" && test \"$(stat -c %g \"$CGPROFILE_CONTROL_SOCKET\")\" = \"$CGPROFILE_CONTROL_GID\" && test \"$(stat -c %g \"$CGPROFILE_OBSERVER_SOCKET\")\" = \"$CGPROFILE_OBSERVER_GID\" && for gid in \"$CGPROFILE_CONTROL_GID\" \"$CGPROFILE_OBSERVER_GID\"; do id -G | tr ' ' '\\n' | grep -qx \"$gid\" || exit 1; done && printf PASS"
expected_regex = '^PASS$'
failure_evidence_regex = "^CGPROFILE_CONTROL_SOCKET unset$"
timeout_seconds = 5

[components.cgprofile_session_delivery.verify.test-host]
command = "docker exec -u vscode \"$ESTATE_COCKPIT\" python3 -c 'import os,sys; p=os.environ.get(\"CGPROFILE_CONTROL_SOCKET\"); (print(\"CGPROFILE_CONTROL_SOCKET unset\"),sys.exit(1)) if not p else None' && docker exec -u vscode \"$ESTATE_COCKPIT\" /bin/bash -c 'test -n \"${CGPROFILE_CONTROL_SOCKET:-}\" && test -n \"${CGPROFILE_OBSERVER_SOCKET:-}\" && test -n \"${CGPROFILE_CONTROL_GID:-}\" && test -n \"${CGPROFILE_OBSERVER_GID:-}\" && test -n \"${MDT_HOST_DOCKER_GID:-}\" && test -S \"$CGPROFILE_CONTROL_SOCKET\" && test -S \"$CGPROFILE_OBSERVER_SOCKET\" && test \"$(stat -c %g \"$CGPROFILE_CONTROL_SOCKET\")\" = \"$CGPROFILE_CONTROL_GID\" && test \"$(stat -c %g \"$CGPROFILE_OBSERVER_SOCKET\")\" = \"$CGPROFILE_OBSERVER_GID\" && for gid in \"$CGPROFILE_CONTROL_GID\" \"$CGPROFILE_OBSERVER_GID\"; do id -G | tr \" \" \"\\\\n\" | grep -qx \"$gid\" || exit 1; done && printf PASS'"
expected_regex = '^PASS$'
failure_evidence_regex = "^CGPROFILE_CONTROL_SOCKET unset$"
timeout_seconds = 10

[components.topos_session_delivery]
kind = "host-service-and-session-socket"
applies_to = "both"
requires = ["host_endpoint_record"]
provides = ["topos.observe-socket", "TOPOS_OBSERVE_SOCKET", "TOPOS_OBSERVE_GID"]
minimum_version = "published endpoint record; daemon version floor not established"
required = false
fix = "Use `sudo toposd install` and `sudo toposd doctor --json`, then `sudo augeaswrap endpoints check --json`. A fresh login gets the aggregate record; the standard template currently mounts `/run/topos` but does not forward TOPOS endpoint variables or its numeric GID. Complete the MDT-086 consumer cutover before relying on it in a generic cockpit."
owner = "topos"
doc = "../../topos/docs/CONSUMERS.md"

[components.topos_session_delivery.verify.controller]
command = "test -n \"${TOPOS_OBSERVE_SOCKET:-}\" && test -n \"${TOPOS_OBSERVE_GID:-}\" && test -S \"$TOPOS_OBSERVE_SOCKET\" && id -G | tr ' ' '\\n' | grep -qx \"$TOPOS_OBSERVE_GID\" && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.topos_session_delivery.verify.test-host]
command = "docker exec -u vscode \"$ESTATE_COCKPIT\" /bin/bash -c 'test -n \"${TOPOS_OBSERVE_SOCKET:-}\" && test -n \"${TOPOS_OBSERVE_GID:-}\" && test -S \"$TOPOS_OBSERVE_SOCKET\" && test \"$(id -G | tr \" \" \"\\\\n\" | grep -cx \"$TOPOS_OBSERVE_GID\")\" -ge 1 && printf PASS'"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.topos_source]
kind = "source-tool"
applies_to = "both"
requires = []
provides = ["topos.daemon-and-client-sources"]
minimum_version = "current checkout; installed daemon floor not established"
required = true
fix = "Use the selected checkout's topos sources and follow `topos/docs/CONSUMERS.md` for pinned daemon installation and endpoint publication."
owner = "topos"
doc = "../../topos/docs/CONSUMERS.md"

[components.topos_source.verify]
command = "test -f \"$ESTATE_REPO_ROOT/topos/pyproject.toml\" && test -d \"$ESTATE_REPO_ROOT/topos/src/topos\" && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 5

[components.assay_observer_identity]
kind = "socket-identity"
applies_to = "both"
requires = ["cgprofile_session_delivery"]
provides = ["assay.observer-group-identity"]
minimum_version = "observer contract 2; dedicated non-docker group"
required = true
fix = "Use the observer socket directory and GID published by cgprofile; make the directory root:root, group-searchable and not group/other writable, and the socket root-owned, group-connectable, not accessible to others, with a dedicated GID different from the host Docker GID. Then run `sudo cgprofiled doctor --json` and start a fresh cockpit session."
owner = "assay"
doc = "../../assay/docs/INTERNAL-CONSUMERS.md"

[components.assay_observer_identity.verify.controller]
command = "python3 -c 'import os,stat; from pathlib import Path; p=Path(os.environ[\"CGPROFILE_OBSERVER_SOCKET\"]); d=p.parent; ds=d.lstat(); ss=p.lstat(); dg=int(os.environ[\"MDT_HOST_DOCKER_GID\"]); og=int(os.environ[\"CGPROFILE_OBSERVER_GID\"]); assert stat.S_ISDIR(ds.st_mode) and ds.st_uid==0 and ds.st_gid==0 and not stat.S_ISLNK(ds.st_mode) and (ds.st_mode & 0o010) and not (ds.st_mode & 0o022); assert stat.S_ISSOCK(ss.st_mode) and ss.st_uid==0 and ss.st_gid==og and ss.st_gid>0 and ss.st_gid!=dg and (ss.st_mode & 0o020) and not (ss.st_mode & 0o007); print(ss.st_gid)'"
expected_regex = '^[1-9][0-9]*$'
timeout_seconds = 5

[components.assay_observer_identity.verify.test-host]
command = "docker exec -u vscode \"$ESTATE_COCKPIT\" python3 -c 'import os,stat; from pathlib import Path; p=Path(os.environ[\"CGPROFILE_OBSERVER_SOCKET\"]); d=p.parent; ds=d.lstat(); ss=p.lstat(); dg=int(os.environ[\"MDT_HOST_DOCKER_GID\"]); og=int(os.environ[\"CGPROFILE_OBSERVER_GID\"]); assert stat.S_ISDIR(ds.st_mode) and ds.st_uid==0 and ds.st_gid==0 and not stat.S_ISLNK(ds.st_mode) and (ds.st_mode & 0o010) and not (ds.st_mode & 0o022); assert stat.S_ISSOCK(ss.st_mode) and ss.st_uid==0 and ss.st_gid==og and ss.st_gid>0 and ss.st_gid!=dg and (ss.st_mode & 0o020) and not (ss.st_mode & 0o007); print(ss.st_gid)'"
expected_regex = '^[1-9][0-9]*$'
timeout_seconds = 10

[components.docker_engine]
kind = "host-cli-and-service"
applies_to = "both"
requires = []
provides = ["docker.engine-api"]
minimum_version = "not established; host-setup uses Docker capabilities"
required = true
fix = "Install or repair the host Docker Engine and its API endpoint using the host's approved Debian provisioning and `mdt-cockpit/host-setup/README.md`; verify with `docker version`."
owner = "mdt-cockpit"
doc = "../host-setup/README.md"

[components.docker_engine.verify]
command = "docker version --format '{{.Server.Version}}' >/dev/null && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.buildx]
kind = "host-cli"
applies_to = "both"
requires = ["docker_engine"]
provides = ["docker.buildx"]
minimum_version = "not established; verify the required Buildx capability"
required = true
fix = "Install or repair Docker Buildx with the Docker CLI distribution selected by the host; verify with `docker buildx version`. Use the same Docker endpoint selected by MDT."
owner = "mdt-cockpit"
doc = "../docs/CONSUMERS.md"

[components.buildx.verify]
command = "docker buildx version >/dev/null && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.mdt_buildkit_endpoint]
kind = "host-service-socket-and-builder"
applies_to = "both"
requires = ["docker_engine", "buildx"]
provides = ["mdt-buildkitd.service", "BUILDKIT_HOST", "BUILDX_BUILDER"]
minimum_version = "published socket endpoint and selectable Buildx builder; daemon version floor not established"
required = true
fix = "Use MDT host-setup to install or repair its managed BuildKit service and endpoint fragment, then run `sudo augeaswrap endpoints check --json` and verify `mdt-buildkitd.service` from the host. The controller host also runs a production game server; agents must not change its services without the operator."
owner = "mdt-cockpit"
doc = "../host-setup/README.md#managed-buildkit-backend-mandatory"

[components.mdt_buildkit_endpoint.verify.controller]
command = "test -n \"${BUILDX_BUILDER:-}\" && test -n \"${BUILDKIT_HOST:-}\" && case \"$BUILDKIT_HOST\" in unix://*) test -S \"${BUILDKIT_HOST#unix://}\" ;; *) exit 1 ;; esac && docker buildx inspect \"$BUILDX_BUILDER\" >/dev/null && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.mdt_buildkit_endpoint.verify.test-host]
command = "systemctl is-active --quiet mdt-buildkitd.service && docker exec -u vscode \"$ESTATE_COCKPIT\" /bin/bash -c 'test -n \"${BUILDX_BUILDER:-}\" && test -n \"${BUILDKIT_HOST:-}\" && case \"$BUILDKIT_HOST\" in unix://*) test -S \"${BUILDKIT_HOST#unix://}\" ;; *) exit 1 ;; esac && docker buildx inspect \"$BUILDX_BUILDER\" >/dev/null && printf PASS'"
expected_regex = '^PASS$'
timeout_seconds = 15

[components.tester_base_image]
kind = "container-image"
applies_to = "both"
requires = ["docker_engine", "buildx"]
provides = ["tester-base:local"]
minimum_version = "source-hash label matches the selected checkout"
required = true
fix = "Build or redeploy `tester-base:local` from `tester-base/README.md` and `scripts/netcup/runner/README.md`; the source-hash label must match `tester-base/Dockerfile`."
owner = "tester-base"
doc = "../../tester-base/README.md"

[components.tester_base_image.verify]
command = "expected=$(sha256sum \"$ESTATE_REPO_ROOT/tester-base/Dockerfile\" | awk '{print $1}'); actual=$(docker image inspect --format '{{index .Config.Labels \"org.vbpub.tester-base.source-hash\"}}' tester-base:local) && kind=$(docker image inspect --format '{{index .Config.Labels \"org.vbpub.tester-base.kind\"}}' tester-base:local) && test \"$kind\" = tester-base && test \"$actual\" = \"$expected\" && printf PASS"
expected_regex = '^PASS$'
timeout_seconds = 10

[components.tester_unified_image]
kind = "container-image-and-wheel"
applies_to = "both"
requires = ["tester_base_image", "buildx"]
provides = ["tester-unified:local", "run-gate.published-wheel"]
minimum_version = "installed Run-Gate stable version and published wheel SHA-256"
required = true
fix = "Build or redeploy the selected tester-unified image with `tester-unified/build-image.sh`; its org.vbpub.run-gate.version and org.vbpub.run-gate.wheel-sha256 labels must match the installed stable Run-Gate wheel. The doctor derives identity from the installed CLI and its non-editable wheel metadata, following CMRU's release-gate check."
owner = "tester-unified"
doc = "../../tester-unified/README.md"

[components.tester_unified_image.verify.controller]
command = "python3 \"$ESTATE_REPO_ROOT/mdt-cockpit/host-setup/check_tester_run_gate_image.py\""
expected_regex = '^PASS run-gate \d+\.\d+\.\d+ [0-9a-f]{64}$'
failure_evidence_regex = "^(tester-unified image does not contain the published Run-Gate wheel:.*|tester-unified image is missing or cannot be inspected)$"
timeout_seconds = 10

[components.tester_unified_image.verify.test-host]
command = "python3 \"$ESTATE_REPO_ROOT/mdt-cockpit/host-setup/check_tester_run_gate_image.py\" --cockpit \"$ESTATE_COCKPIT\" --runner-env \"$HOME/runner-scripts/runner.env\""
expected_regex = '^PASS run-gate \d+\.\d+\.\d+ [0-9a-f]{64}$'
failure_evidence_regex = "^(tester-unified image does not contain the published Run-Gate wheel:.*|tester-unified image is missing or cannot be inspected)$"
timeout_seconds = 10

[components.run_gate]
kind = "installed-cli"
applies_to = "both"
requires = ["cgprofile_session_delivery", "tester_unified_image"]
provides = ["run-gate.cli", "run-gate.host-profiling"]
minimum_version = "25.4.0"
required = true
fix = "Install the released Run-Gate wheel selected by the host's runner configuration. On runner hosts set `RUN_GATE_BIN` only to an installed wheel that meets this floor; then start a fresh cockpit session with the endpoint environment."
owner = "run-gate-project"
doc = "../../run-gate-project/CONSUMERS.md"

[components.run_gate.verify.controller]
command = "run-gate --version"
expected_regex = '^run-gate\\s+\\d+\\.\\d+\\.\\d+'
version_pattern = 'run-gate\\s+(\\d+\\.\\d+\\.\\d+)'
timeout_seconds = 10

[components.run_gate.verify.test-host]
command = "run_gate_bin=$(python3 -c 'import re,shlex; from pathlib import Path; p=Path.home()/\"runner-scripts/runner.env\"; rows=[shlex.split(line,comments=True) for line in p.read_text().splitlines()]; values=[token.split(\"=\",1)[1] for row in rows for token in row if token.startswith(\"RUN_GATE_BIN=\")]; value=values[-1] if values else \"/home/vscode/.local/bin/run-gate\"; assert value.startswith(\"/\"); print(value)') && docker exec -u vscode \"$ESTATE_COCKPIT\" \"$run_gate_bin\" --version"
expected_regex = '^run-gate\\s+\\d+\\.\\d+\\.\\d+'
version_pattern = 'run-gate\\s+(\\d+\\.\\d+\\.\\d+)'
timeout_seconds = 10

[components.assay_checkout_source]
kind = "source-consumer"
applies_to = "both"
