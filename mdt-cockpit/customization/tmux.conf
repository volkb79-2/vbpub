# mdt-cockpit tmux defaults. Installed as /etc/tmux.conf; tmux reads ~/.tmux.conf
# (or ~/.config/tmux/tmux.conf) AFTER it, so anything there overrides what follows.
# tmux is opt-in: nothing starts it. Start it by hand (`tmux new -A -s main`) or pick
# the "tmux" terminal profile from templates/vscode/terminal-tmux.settings.jsonc.

# Prefix Ctrl+Space. Ctrl+B belongs to Claude Code (background task) and to vim/mc
# paging, Ctrl+O to mc (panels) and Claude Code (transcript), Ctrl+A to readline.
# VS Code sends Ctrl+Space as NUL, which tmux accepts as C-Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal description: tmux-256color inside tmux, xterm-256color outside (VS Code).
# Never export TERM globally; tmux sets it for the panes.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# Let copy inside tmux reach the outer terminal's clipboard via OSC 52.
set -g set-clipboard on
set -as terminal-features ",xterm*:clipboard"

# A small non-zero escape-time keeps Esc responsive in vim without breaking
# Alt-key sequences that arrive as ESC + key over SSH.
set -sg escape-time 30
set -g focus-events on
# With mouse on, hold Shift to make a native terminal selection.
set -g mouse on
set -g history-limit 10000

# Numbering from 1 matches the keyboard row; keep windows contiguous.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and splits start in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload the system file and the user's own.
bind r source-file /etc/tmux.conf \; source-file -q ~/.tmux.conf \; source-file -q ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
