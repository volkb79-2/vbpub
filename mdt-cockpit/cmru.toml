schema_version = 1

[runtime]
kind = "none"

[env]
# Privileged sidecar: digest-pinned, started --pull=never (must be local).
# `docker image inspect --format '{{index .RepoDigests 0}}' docker:dind`, 2026-10-05.
CMRU_TESTER_DIND_IMAGE = "docker@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e"
# Required DinD limits (nested containers draw on these, separate from the workload's).
CMRU_TESTER_DIND_MEMORY = "2g"
CMRU_TESTER_DIND_CPUS = "1.5"
CMRU_TESTER_DIND_PIDS_LIMIT = "2048"
RELEASE_IMAGE_FLOW = "load"
IMAGE_COMPRESSION = "zstd"
IMAGE_COMPRESSION_LEVEL = "3"
IMAGE_FORCE_COMPRESSION = "false"
IMAGE_OCI_MEDIA_TYPES = "true"
IMAGE_PROVENANCE_MODE = "max"
IMAGE_SBOM = "true"
BUILDX_BUILDER = "mdt-managed"
BUILDKIT_HOST = "unix:///run/mdt-buildkitd/buildkitd.sock"
REPACK_WORK_DIR = "build/repack"
REPACK_TARGET_SIZE = "2GB"
REPACK_COMPRESSION_LEVEL = "9"
REPACK_JOBS = "1"
REPACK_CONCURRENCY = "2"
REPACK_VMEM_KB = "unlimited"
REPACK_KEEP_FAILED = "true"
DOCKER_REPACK_LOG = "warn"
OCI_VENDOR = "Volker Badziong"
OCI_DESCRIPTION = "mdt-cockpit image family. Includes curated Debian/Python tooling and CIU-focused workflow tools."
OCI_DESCRIPTION_BASE = "mdt-cockpit base image."
OCI_DESCRIPTION_VSC = "mdt-cockpit VS Code devcontainer image."

[build_metadata]
date_env = "BUILD_DATE"
date_format = "%Y%m%d"

[project]
id = "mdt-cockpit"
description = "Curated Debian and Python development/debug container images."
template_revision = 4
prefix = "mdt-cockpit-v"
artifacts = ["oci-image"]

[project.version]
strategy = "none"
bump = "conventional"

[project.release]
git_tag = false
build_step = "prepare"
commit_generated = ["package-manifests-versioned"]
artifact_dirs = ["package-manifests-versioned"]

[steps.prepare]
quiet = true
commands = [
  { label = "mdt-cockpit: private build and manifest extraction", argv = ["python3", "build-push.py", "--build"], cwd = "." },
]

[steps.run-tests]
quiet = true
commands = [
  { label = "mdt-cockpit: run-gate release lane", argv = ["./run-gate.py", "release"], cwd = "." },
  { label = "mdt-cockpit: run-gate oci-push lane (runs in the image this release just built)", argv = ["./run-gate.py", "oci-push"], cwd = "." },
]

[steps.build]
quiet = true
no_cache_env = "BUILD_NO_CACHE"
bake_set_prefix = "base.args."
bake_set_vars = ["AWSCLI_VERSION", "B2_VERSION", "BACKPORTS_URI", "BAT_VERSION", "CRANE_VERSION", "REGCTL_VERSION", "CODEX_VERSION", "CLAUDE_CODE_VERSION", "ANTIGRAVITY_VERSION", "REASONIX_VERSION", "OPENCODE_VERSION", "INSTALL_CODEX", "INSTALL_CLAUDE_CODE", "INSTALL_ANTIGRAVITY", "INSTALL_AIDER", "INSTALL_REASONIX", "INSTALL_OPENCLAW", "INSTALL_OPENCODE", "NODE_MAJOR", "ENABLE_KSM_OPTIN", "DELTA_VERSION", "GH_VERSION", "GRPCURL_VERSION", "LNAV_VERSION", "CONSUL_VERSION", "FD_VERSION", "FZF_VERSION", "POSTGRESQL_CLIENT_VERSION", "REDIS_TOOLS_VERSION", "RIPGREP_VERSION", "RGA_VERSION", "SHELLCHECK_VERSION", "VAULT_VERSION", "YQ_VERSION", "NVIM_VER", "NVCHAD_VER", "GITHUB_USERNAME", "GITHUB_REPO", "PWMCP_VERSION", "PWMCP_GETPY_URL", "PWMCP_GETPY_SHA256", "PWMCP_CONTRACT_URL", "PWMCP_CONTRACT_SHA256", "CIU_WHEEL_TAG", "CIU_WHEEL_ASSET_NAME", "CIU_INSTALL_REQUIRED", "OCI_TITLE", "OCI_DESCRIPTION", "OCI_DESCRIPTION_BASE", "OCI_DESCRIPTION_VSC", "OCI_SOURCE", "OCI_DOCUMENTATION", "OCI_URL", "OCI_LICENSES", "OCI_VENDOR", "OCI_VERSION", "OCI_REVISION", "OCI_CREATED", "BUILD_TIMESTAMP", "DEVCONTAINERS_RELEASE_STABLE", "DEVCONTAINERS_RELEASE_DEV", "DEVCONTAINERS_VERSION_STABLE", "DEVCONTAINERS_VERSION_DEV", "DEVCONTAINERS_BASE_DYNAMIC_LATEST", "DEVCONTAINERS_DYNAMIC_LATEST_TAG", "DEVCONTAINERS_DYNAMIC_LATEST_PYTHON", "DEVCONTAINERS_DYNAMIC_LATEST_DEBIAN"]
commands = [
  { label = "mdt-cockpit: build images", argv = ["bash", "scripts/release-bake.sh", "build"], cwd = "." },
]

[steps.push]
quiet = true
bake_set_prefix = "base.args."
bake_set_vars = ["AWSCLI_VERSION", "B2_VERSION", "BACKPORTS_URI", "BAT_VERSION", "CRANE_VERSION", "REGCTL_VERSION", "CODEX_VERSION", "CLAUDE_CODE_VERSION", "ANTIGRAVITY_VERSION", "REASONIX_VERSION", "OPENCODE_VERSION", "INSTALL_CODEX", "INSTALL_CLAUDE_CODE", "INSTALL_ANTIGRAVITY", "INSTALL_AIDER", "INSTALL_REASONIX", "INSTALL_OPENCLAW", "INSTALL_OPENCODE", "NODE_MAJOR", "ENABLE_KSM_OPTIN", "DELTA_VERSION", "GH_VERSION", "GRPCURL_VERSION", "LNAV_VERSION", "CONSUL_VERSION", "FD_VERSION", "FZF_VERSION", "POSTGRESQL_CLIENT_VERSION", "REDIS_TOOLS_VERSION", "RIPGREP_VERSION", "RGA_VERSION", "SHELLCHECK_VERSION", "VAULT_VERSION", "YQ_VERSION", "NVIM_VER", "NVCHAD_VER", "GITHUB_USERNAME", "GITHUB_REPO", "PWMCP_VERSION", "PWMCP_GETPY_URL", "PWMCP_GETPY_SHA256", "PWMCP_CONTRACT_URL", "PWMCP_CONTRACT_SHA256", "CIU_WHEEL_TAG", "CIU_WHEEL_ASSET_NAME", "CIU_INSTALL_REQUIRED", "OCI_TITLE", "OCI_DESCRIPTION", "OCI_DESCRIPTION_BASE", "OCI_DESCRIPTION_VSC", "OCI_SOURCE", "OCI_DOCUMENTATION", "OCI_URL", "OCI_LICENSES", "OCI_VENDOR", "OCI_VERSION", "OCI_REVISION", "OCI_CREATED", "BUILD_TIMESTAMP", "DEVCONTAINERS_RELEASE_STABLE", "DEVCONTAINERS_RELEASE_DEV", "DEVCONTAINERS_VERSION_STABLE", "DEVCONTAINERS_VERSION_DEV", "DEVCONTAINERS_BASE_DYNAMIC_LATEST", "DEVCONTAINERS_DYNAMIC_LATEST_TAG", "DEVCONTAINERS_DYNAMIC_LATEST_PYTHON", "DEVCONTAINERS_DYNAMIC_LATEST_DEBIAN"]
required_env = ["GITHUB_USERNAME", "GITHUB_PUSH_PAT"]
commands = [
  { label = "mdt-cockpit: push images", argv = ["bash", "scripts/release-bake.sh", "push"], cwd = "." },
]

