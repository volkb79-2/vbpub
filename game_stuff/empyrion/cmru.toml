schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"

[targets]
host = "github"
registry = ["ghcr.io"]

[project]
id = "empyrion-translation"
description = "German Empyrion translation release asset."
template_revision = 2
prefix = "empyrion-translation-v"
artifacts = ["tarball"]

[project.version]
strategy = "none"
bump = "conventional"

[project.release]
git_tag = false
build_step = "build"
artifact_dirs = ["dist"]

[steps.build]
quiet = true
commands = [
  { label = "empyrion: package DE translation artifact", argv = ["python3", "release-empyrion-translation.py"], cwd = "." },
]

[steps.run-tests]
quiet = true
commands = [
  { label = "empyrion: syntax check release builder", argv = ["python3", "-m", "compileall", "-q", "release-empyrion-translation.py"], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "empyrion: publish DE translation artifact", argv = ["python3", "release-empyrion-translation.py", "--publish-github", "--publish-only"], cwd = "." },
]
