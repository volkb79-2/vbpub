# cmru.toml — the one config for releasing this monorepo (SPEC S2 schema).
#
# NO SECRETS here (this file is committed). The GitHub token is resolved at run time
# from $GITHUB_PUSH_PAT / $GITHUB_TOKEN, or the gitignored cmru.secret.toml overlay
# ([github].token). See SPEC S2.4 and cmru.sample.toml.
#
# Usage:  ./cmru status   ./cmru release   ./cmru cleanup --remove-assets 30d

[github]
owner      = "volkb79-2"
repo       = "vbpub"
owner_type = "user"          # "user" | "org"  (V03)

[targets]
host     = "github"          # release host (S11)
registry = ["ghcr.io"]       # OCI registries to push images to (S11.3)

[orchestration]
# Only projects listed here are auto-tagged/released by `status`/`release` (S-CLI.2).
# empyrion-translation stays on-demand (date-tagged game asset, not in this set).
project_order    = ["ciu", "cmru", "nyxloom", "assay", "topos", "modern-debian-tools-python-debug", "pwmcp", "tls-edge"]
default_projects = ["ciu", "cmru", "nyxloom", "assay", "topos", "modern-debian-tools-python-debug", "pwmcp", "tls-edge"]
default_steps    = ["run-tests", "build", "push", "validate"]
execution_mode   = "project-first"

[orchestration.step_project_order]
run-tests = ["ciu", "assay", "topos", "modern-debian-tools-python-debug", "pwmcp"]
build     = ["ciu", "cmru", "nyxloom", "assay", "topos", "modern-debian-tools-python-debug", "pwmcp", "tls-edge"]
push      = ["ciu", "cmru", "nyxloom", "assay", "topos", "modern-debian-tools-python-debug", "pwmcp", "tls-edge"]
validate  = ["ciu", "assay", "modern-debian-tools-python-debug", "pwmcp"]

[cleanup]
release_tag_prefixes = ["*"]
keep_release_tags    = ["ciu-latest", "cmru-latest", "pwmcp-latest"]
ghcr_packages        = ["*"]
ghcr_delete_packages = ["modern-debian-tools-python-debug-vsc-devcontainer-dev"]

[env]
# Shared env for all projects. Per-project defaults live in <project>/cmru.build.toml [env].
# Route the built-in wheel-build handler (ciu + cmru) through the dedicated
# wheel-builder container instead of the host interpreter — see wheel-builder/Dockerfile.
# Build once: docker build -f wheel-builder/Dockerfile -t wheel-builder:local /workspaces/vbpub
CMRU_WHEEL_BUILDER_IMAGE = "wheel-builder:local"

# Every CMRU-managed project receives source-first CHANGES.md history by default.
# Do not add a per-project opt-in: `[project.X.release].changelog` is only for a
# non-standard project-relative filename or the rare, explicit `false` opt-out.

# tester-gate per-container safe bounds (cmru/src/cmru/tester_gate.py has no
# hardcoded fallback for these — an unresolvable value is a hard error, so
# this IS the estate's actual default, not just documentation of one).
# Docker's --memory-swap is the COMBINED mem+swap total, not swap alone.
CMRU_TESTER_MEMORY = "3g"
CMRU_TESTER_MEMORY_SWAP = "16g"

# ─── ciu — Python wheel (built-in handlers; only run-tests is ciu-specific) ────
# build/push/validate come from cmru's built-in wheel handlers (cmru/handlers.py).
# The only project-specific inputs are the test command and the release-notes text.
[project.ciu]
prefix    = "ciu-v"
artifacts = ["wheel"]        # → wheel profile: semver tag + GitHub Release + latest.json
scm_dist  = "ciu"
cwd       = "ciu"
[project.ciu.version]
strategy = "scm"
bump     = "conventional"
[project.ciu.env]
CIU_RELEASE_NOTES = "## CIU CLI wheel\nRelease history for this version is generated from the project-scoped source range and committed as `ciu/CHANGES.md` before CIU's isolated release gate runs. See that file at the release tag for the change list.\n\n**Install**\n```bash\npython -m pip install ./<wheel-file>\n```"
[project.ciu.steps.run-tests]
commands = [
  { label = "CIU: tester-unified coverage gate", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "ciu", "--", "/opt/tester-venv/bin/python", "run-ciu-tests.py"], cwd = "." },
]

# ─── cmru — Python wheel (dogfood: zero step scripts, cmru built-in handlers) ──
# Declares the wheel profile and NO [steps.*]: cmru builds/publishes/validates it via
# its own built-in handlers (cmru/handlers.py). The only project-specific input is the
# release-notes text below (read by wheel-publish via --notes-env CMRU_RELEASE_NOTES).
# Proof that a standard Python wheel project needs ~7 lines of config and no scripts.
[project.cmru]
prefix    = "cmru-v"
artifacts = ["wheel"]
scm_dist  = "cmru"
cwd       = "cmru"
[project.cmru.version]
strategy = "scm"
bump     = "conventional"
[project.cmru.env]
CMRU_RELEASE_NOTES = "## cmru wheel\nBuild, publish, and release orchestration for CIU-family monorepos. The incomplete built-in OCI repack prototype now fails closed before auth/Docker work; standard Buildx load/push remains supported while the production-equivalence requirements are implemented.\n\n**Install**\n```bash\npipx install cmru-*.whl\n```"
[project.cmru.steps.run-tests]
commands = [
  { label = "cmru: tester-unified suite", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "cmru", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q"], cwd = "." },
]

# ─── nyxloom — Python wheel (built-in handlers; dogfood-style, no step scripts) ─
# Files-first daemon control plane. Ordered BEFORE modern-debian-tools-python-debug
# so the nyxloom-v* wheel's GitHub Release exists when mdt's devcontainer build
# resolves first-party wheels (modern-debian-tools-python-debug/pip/wheels.list).
# strategy=scm mints the `nyxloom-vX.Y.Z` tag that setuptools_scm reads
# (nyxloom/pyproject.toml). The `nyxloom` CLI (onboard/lint/gate-verify/doctor/
# resync/daemon) ships in the wheel. OCI images (daemon + agent-cli bundle) are a
# SEPARATE step-driven addition (nyxloom/build-push.py) added when that lands.
[project.nyxloom]
prefix    = "nyxloom-v"
artifacts = ["wheel", "oci-image"]   # wheel → GH Release + latest.json; images → ghcr
scm_dist  = "nyxloom"
cwd       = "nyxloom"
[project.nyxloom.version]
# scm is legal here because the project is NOT oci-image-ONLY (cmru's guard fires
# only for all-oci projects): one `nyxloom-vX.Y.Z` tag versions the wheel Release
# AND both image tags — single-source versioning across all three artifacts.
strategy = "scm"
bump     = "conventional"
[project.nyxloom.steps.run-tests]
commands = [
  { label = "nyxloom: tester-unified parallel suite", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "nyxloom", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-n", "auto", "-q"], cwd = "." },
]
# Explicit build/push steps own the OCI half (the mdt/pwmcp pattern): build-push.py
# resolves NYXLOOM_VERSION from the git tag and bakes BOTH images (nyxloomd +
# nyxloom-agent-cli) from the single docker-bake.hcl that `ciu` also builds locally
# — one recipe, two drivers.
#
# CAUTION (cmru/src/cmru/cli.py:233, "an explicit [steps.<step>] wins"): declaring
# ANY explicit build/push step suppresses the profile BUILT-INS for that step — for
# the WHOLE project, both profiles. A bare image-only step here would therefore
# silently stop building/publishing the WHEEL (no error; mdt's devcontainer build
# would then find no nyxloom-latest Release). So each step invokes the built-in
# wheel handler EXPLICITLY first, then the images. Keep both commands in each step.
[project.nyxloom.steps.build]
commands = [
  { label = "nyxloom: build wheel (cmru built-in handler, invoked explicitly)", argv = ["python3", "cmru/src/cmru/handlers.py", "wheel-build", "--cwd", "nyxloom"], cwd = "." },
  { label = "nyxloom: build OCI images (nyxloomd + agent-cli)", argv = ["python3", "build-push.py", "--build"], cwd = "nyxloom" },
]
[project.nyxloom.steps.push]
commands = [
  { label = "nyxloom: publish wheel (cmru built-in handler, invoked explicitly)", argv = ["python3", "cmru/src/cmru/handlers.py", "wheel-publish", "--prefix", "nyxloom", "--cwd", "nyxloom", "--notes-env", "NYXLOOM_RELEASE_NOTES"], cwd = "." },
  { label = "nyxloom: push OCI images to ghcr", argv = ["python3", "build-push.py", "--push"], cwd = "nyxloom" },
]
[project.nyxloom.env]
NYXLOOM_RELEASE_NOTES = "## nyxloom wheel\nFiles-first, daemon-supervised control plane for role-separated AI-assisted development. Installs the `nyxloom` CLI: project onboarding, handoff lint, gate verify, doctor, resync, and the reconciler daemon.\n\n**Install**\n```bash\npipx install nyxloom-*.whl\n```"

# ─── assay — Python wheel + zipapp (OWN build; cmru orchestrates only) ────────
# assay adopts cmru's ORCHESTRATION (semver tag, GitHub Release, per-product
# prefix, latest.json, the isolated release worktree) and DECLINES its BUILD.
#
# WHY, because this reads as an unnecessary override until you check
# (assay/nyxloom-trove/decisions.md A-247/A-249): cmru's built-in wheel-build is
# `python -m build --wheel` (handlers.py cmd_wheel_build). assay's own release
# build is a private, exact-OID, --no-local sparse clone, built with a
# hash-checked five-wheel offline closure installed via `pip --require-hashes`
# from a committed wheelhouse, then `pip wheel --no-index --no-build-isolation`
# (A-198/A-199). Taking the built-in would silently replace that with an
# unpinned ambient build -- a regression in the one property assay's P24 exists
# to establish. So steps.build runs assay's own builder, which ALSO emits the
# reproducible zipapp, both .sha256 sidecars, and -- only for a tagged release --
# the hash-bound release manifest A-200 defines.
#
# CAUTION, the same trap nyxloom documents above: an explicit [steps.<step>]
# wins over the profile built-in for that step, for the WHOLE project. So
# steps.push invokes the built-in wheel-publish EXPLICITLY, with --extra-asset
# globs for the zipapp and the manifest (globs because the step cannot know the
# version string in the filename).
#
# `prefix` MUST stay "assay-v": assay/pyproject.toml's setuptools_scm reads
# `--match assay-v*` and gate/distribution/build_release.py's TAG_GLOB is the
# same string. assay/tests/test_distribution_build_release.py pins all three
# together, because the monorepo shares one tag line and a mismatch would
# version an assay release off another product's tag.
[project.assay]
prefix    = "assay-v"
artifacts = ["wheel"]
scm_dist  = "assay"
cwd       = "assay"
[project.assay.version]
strategy = "scm"
bump     = "conventional"
[project.assay.steps.run-tests]
# assay's REGISTERED gate, not a bare pytest: it builds the wheel from a
# committed OID, installs it into a separate run-venv, and self-hosts through
# it. A-040 is explicit that a bare-pytest green is NOT a ship signal.
commands = [
  { label = "assay: registered tester-unified gate (self-hosted through the built wheel)", argv = ["bash", "assay/tools/tester-unified-gate.sh", "/workspaces/vbpub"], cwd = "." },
]
[project.assay.steps.build]
commands = [
  { label = "assay: hash-bound release build (wheel + reproducible zipapp + sidecars)", argv = ["python3", "assay/gate/distribution/build_release.py", "--repo", ".", "--outdir", "assay/dist"], cwd = "." },
]
[project.assay.steps.push]
commands = [
  { label = "assay: publish wheel + zipapp + manifest (cmru built-in, invoked explicitly)", argv = ["python3", "cmru/src/cmru/handlers.py", "wheel-publish", "--prefix", "assay", "--cwd", "assay", "--notes-env", "ASSAY_RELEASE_NOTES", "--extra-asset", "assay/dist/assay-*.pyz", "--extra-asset", "assay/dist/assay-*.pyz.sha256"], cwd = "." },
]
[project.assay.env]
ASSAY_RELEASE_NOTES = "## assay wheel + zipapp\nHow to judge a change: declared lanes, declared rigor, one machine-readable verdict per lane per commit. Zero runtime dependencies, stdlib only.\n\n**Install (wheel)**\n```bash\npipx install assay-*.whl\n```\n\n**No Python package manager? Use the zipapp**\n```bash\nchmod +x assay-*.pyz && ./assay-*.pyz --help\n```\n\nThe wheel's identity is bound by `release-manifest.json`; feed its PEP 508 line to `pip install --require-hashes` so pip rechecks the bytes it opens. `assay/gate/distribution/release_wheel.py verify` emits that line and is stdlib-only, so it runs before assay is installed."

# ─── modern-debian-tools-python-debug — OCI images ────────────────────────────
# Deliverable is the ghcr image(s) only — NOT a GitHub Release. So: no semver git tag
# (version = image tag / BUILD_DATE), push images, and commit the regenerated manifests
# (build inputs/docs) via the generic commit_generated path. cmru orchestrates; the
# build step (build-push.py) owns what an image build + manifest regen actually means.
[project.modern-debian-tools-python-debug]
prefix    = "modern-debian-tools-python-debug-v"   # kept for resolve/cleanup symmetry; unused for tagging
artifacts = ["oci-image"]
cwd       = "modern-debian-tools-python-debug"
[project.modern-debian-tools-python-debug.oci]
target = "all"
# Explicit project steps below own MDT's guarded push/repack flow. Keep the
# generic handler disabled until CMRU's built-in OCI path reaches equivalent
# scratch isolation, validation, resource controls, and final-digest evidence.
repack = false
[project.modern-debian-tools-python-debug.version]
strategy = "none"          # OCI images aren't git-tagged
[project.modern-debian-tools-python-debug.release]
commit_generated = ["package-manifests-versioned"]   # private-build provenance; committed before tag/push
[project.modern-debian-tools-python-debug.env]
# Build locally so manifest extraction remains private. cmru commits/promotes the
# extracted provenance before the separate push command publishes registry images.
RELEASE_IMAGE_FLOW = "load"
[project.modern-debian-tools-python-debug.steps.prepare]
commands = [
  { label = "modern-debian-tools-python-debug: private build + extract manifests", argv = ["python3", "build-push.py", "--build"], cwd = "modern-debian-tools-python-debug" },
]
[project.modern-debian-tools-python-debug.steps.run-tests]
# --enable-docker: ONLY this project's gate gets an isolated, nested Docker
# daemon (docker:dind sidecar — see cmru/src/cmru/tester_gate.py's dind_sidecar()).
# test_oci_layout_push.py needs it (real docker buildx + crane + regctl + a
# throwaway registry:2 container) to validate the checksum-identical OCI publish
# path (FEAT-02, cmru/KNOWN_ISSUES_TODO_BACKLOG.md). Never the HOST's own Docker
# daemon — the sidecar is fully disposable and isolated. No other project's
# run-tests step passes this flag.
commands = [
  { label = "modern-debian-tools-python-debug: release-flow tests", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "modern-debian-tools-python-debug", "--enable-docker", "--", "/opt/tester-venv/bin/python", "-m", "unittest", "scripts.test_release_flow", "scripts.test_oci_tool_staging", "scripts.test_oci_layout_push"], cwd = "." },
]
[project.modern-debian-tools-python-debug.steps.push]
commands = [
  { label = "modern-debian-tools-python-debug: push images", argv = ["python3", "build-push.py", "--push"], cwd = "modern-debian-tools-python-debug" },
]

# ─── pwmcp — OCI image + stack bundle ─────────────────────────────────────────
# pwmcp's version is playwright-driven (pwmcp-v<playwright>-r<N>). The prepare
# step resolves and commits its pinned inputs, then writes PWMCP_VERSION to the
# transaction-local cmru.vars. cmru owns the annotated tag for that prepared commit.
[project.pwmcp]
prefix    = "pwmcp-v"
artifacts = ["oci-image", "bundle"]   # emits BOTH a ghcr image and a GitHub-Release bundle
cwd       = "pwmcp"
[project.pwmcp.version]
strategy = "external:PWMCP_VERSION"    # derived by prepare; cmru owns the tag
[project.pwmcp.release]
commit_generated = ["ciu.defaults.toml.j2", "ciu.toml.j2", "docker-bake.hcl", "pwmcp.contract.json"]
[project.pwmcp.steps.prepare]
commands = [
  { label = "pwmcp: resolve and pin publishable Playwright inputs", argv = ["python3", "scripts/resolve-playwright-version.py"], cwd = "pwmcp" },
]
[project.pwmcp.steps.run-tests]
commands = [
  { label = "pwmcp: resolver and build-contract tests", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "pwmcp", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q"], cwd = "." },
]
[project.pwmcp.steps.build]
commands = [
  { label = "pwmcp: build playwright-server image", argv = ["python3", "build-push.py", "--build"], cwd = "pwmcp" },
  { label = "pwmcp: build stack bundle", argv = ["python3", "scripts/build-bundle.py"], cwd = "pwmcp" },
]
[project.pwmcp.steps.push]
commands = [
  { label = "pwmcp: push playwright-server image", argv = ["python3", "build-push.py", "--push"], cwd = "pwmcp" },
  { label = "pwmcp: publish stack bundle", argv = ["python3", "scripts/publish-bundle.py"], cwd = "pwmcp" },
]

# ─── tls-edge — tarball (built-in publish; in project_order) ───────────────────
# build step is project-owned (build-artifact.sh); push + validate come from the
# tarball built-in (cmru/handlers.py tarball-publish / tarball-validate).
# scripts/release.sh stays for standalone manual cuts; it calls scripts/publish-release.py,
# which routes through cmru.release.publish_versioned — the same keystone as the built-in.
# [project.tls-edge.installer] is the single source for the emitted get.py installer:
#   `cmru get-py --project tls-edge --config cmru.toml` regenerates tls-edge/get.py.
[project.tls-edge]
prefix    = "tls-edge-v"
artifacts = ["tarball"]
cwd       = "tls-edge"
[project.tls-edge.version]
strategy = "file:VERSION"     # version from tls-edge/VERSION; cmru tags + commits it
[project.tls-edge.installer]
install_dir_system = "/opt/tls-edge"
install_dir_user   = "tls-edge"
asset_suffix       = ".tar.xz"
# entrypoint not set — tls-edge has no bundled adapter (degrades cleanly: no adapter call, no venv)
required_commands  = ["python3", "docker"]
preserve           = ["ciu-stack/ciu.toml.j2", "edge-proxy/.env"]
manifest_name      = "manifest.json"
signature_name     = "manifest.json.minisig"
[project.tls-edge.env]
TLS_EDGE_RELEASE_NOTES = "## tls-edge tarball\nEdge proxy + TLS termination stack for the vbpub infra.\n\n**Verify**\n```bash\nsha256sum -c tls-edge-v*.tar.xz.sha256\n```"
[project.tls-edge.steps.run-tests]
commands = [
  { label = "tls-edge: standalone render validation", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "tls-edge", "--", "/opt/tester-venv/bin/python", "scripts/render_standalone.py", "--check", "--defaults-only"], cwd = "." },
]
[project.tls-edge.steps.build]
commands = [
  { label = "tls-edge: build tarball", argv = ["bash", "scripts/build-artifact.sh"], cwd = "tls-edge" },
]

# ─── topos — Python wheel + host systemd daemon templates ────────────────────
# The package is a wheel.  Its optional root daemon is deployed through the
# packaged systemd unit/tmpfiles/slice templates, not a privileged OCI image.
[project.topos]
prefix    = "topos-v"
artifacts = ["wheel"]
scm_dist  = "topos"
cwd       = "topos"
[project.topos.version]
strategy = "scm"
bump     = "conventional"
[project.topos.env]
CMRU_RELEASE_NOTES = "## topos wheel\nHost pressure inspector and cgroup forensics console. This is a pre-1.0 operator release: see `topos/docs/RELEASE-READINESS.md` for explicit live-host certification gaps and non-claims. The optional root daemon is deployed with the packaged systemd service/tmpfiles/slice templates; no privileged container image is published.\n\n**Install**\n```bash\npipx install topos-*.whl\n```"
# No CMRU_TESTER_CGROUP_PARENT here (was nyxloom-gates.slice): this is a
# repo/developer test run, not nyxloom-the-product dispatching a gate on
# topos's behalf, so it falls through to the ambient CGROUP_PARENT_DEV_BACKGROUND
# like every other project — see AGENTS.md and cmru/src/cmru/tester_gate.py.
[project.topos.steps.run-tests]
commands = [
  { label = "topos: tester-unified parallel suite", argv = ["python3", "cmru.py", "tester-gate", "--cwd", ".", "--", "bash", "-c", "set -euo pipefail; export PYTHONPATH=topos/src:topos; /opt/tester-venv/bin/python -m pytest topos/tests -q -n auto"], cwd = "." },
]

# ─── empyrion-translation — game asset (delegated; NOT in project_order) ────────
# Self-managed, date-tagged (empyrion-de-translation-YYYYMMDD); not a CIU-family product.
# Released on demand via ./cmru.build.sh / ./cmru.publish.sh --project empyrion-translation.
[project.empyrion-translation]
prefix    = "empyrion-translation-v"
artifacts = ["tarball"]
cwd       = "game_stuff/empyrion"
[project.empyrion-translation.version]
strategy = "delegated"
[project.empyrion-translation.steps.build]
commands = [
  { label = "empyrion: package DE translation artifact", argv = ["python3", "release-empyrion-translation.py"], cwd = "game_stuff/empyrion" },
]
[project.empyrion-translation.steps.push]
commands = [
  { label = "empyrion: publish DE translation artifact", argv = ["python3", "release-empyrion-translation.py", "--publish-github", "--publish-only"], cwd = "game_stuff/empyrion" },
]
