# Installed as /etc/tmpfiles.d/thrashguard.conf (design §3, D7).
#
# The two socket directories are group-owned so each group can reach exactly one
# socket: `thrashguard-registrant` may register, `thrashguard-reader` may read.
# The mode of the directory is 0750 and of the socket 0660 (set by the .socket
# units, not here), so a member of neither group reaches nothing.
#
# Group gating is ADVISORY: container root bypasses socket DAC and can setgroups()
# any GID (design §3). The real boundary is the container->scope resolution, which
# refuses anything that does not resolve to one scope under an allowed ancestor.
#
# `/run` is tmpfs, so these are recreated on every boot; the journal is rotated
# rather than grown for the same reason (src/events.rs).
d /run/thrashguard 0755 root root -
d /run/thrashguard/registrant 0750 root thrashguard-registrant -
d /run/thrashguard/reader 0750 root thrashguard-reader -
