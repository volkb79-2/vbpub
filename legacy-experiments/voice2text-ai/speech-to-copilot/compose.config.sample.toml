# Speech-to-Copilot Service Configuration
# Voice2Text AI - Orchestration and API Stack

[metadata]
project_name = "speech-to-copilot"
env_tag = "prod"

[project]
name = "speech-to-copilot"
type = "application"

[compinit]
enable_env_expansion = true

[global]
project_name = "Voice2Text-AI"
environment = "prod"

[global.labels]
prefix = "de.vxxu.volkb79"

[infrastructure]
# AUTO-DETECTED: Public FQDN via external IP lookup
public_fqdn = '''$(curl -s https://api.ipify.org | xargs -I{} sh -c 'host {} | grep pointer | head -1 | awk '\''{print $NF}'\'' | sed '\''s/\.$//'\''; echo {}')'''
public_tls_key_pem = "/etc/letsencrypt/live/$(echo $PUBLIC_FQDN | cut -d. -f1-)/privkey.pem"
public_tls_crt_pem = "/etc/letsencrypt/live/$(echo $PUBLIC_FQDN | cut -d. -f1-)/fullchain.pem"

[api]
# API service configuration
demo_mode = false
log_level = "info"
key_required = false
token_internal = "internal-api-token-change-in-production"
cors_origins = "*"
whisper_service_url = "http://whisper-service:9000"
llm_service_url = "http://openai-shim:8300"
rate_limit_rpm = "60"
max_audio_duration = "300"
workspace_path = "${HOME}"

# Volume host directories - CRITICAL: Must use hostdir_ prefix for pre-creation
hostdir_logs = "./vol-speech-api-logs"

[redis]
# Redis configuration
hostdir_data = "./vol-speech-redis-data"

[health]
interval = "10s"
timeout = "5s"
retries = 3
start_period = "20s"

[hooks]
pre_compose = []
post_compose = []

[env]
UID = "$(id -u)"
GID = "$(id -g)"
