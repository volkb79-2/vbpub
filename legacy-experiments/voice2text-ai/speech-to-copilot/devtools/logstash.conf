input {
  file {
    path => "/usr/share/logstash/logs/**/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }

  # Add service field based on log path
  if [path] =~ "webapp" {
    mutate { add_field => { "service" => "webapp" } }
  } else if [path] =~ "api" {
    mutate { add_field => { "service" => "api" } }
  } else if [path] =~ "scanner" {
    mutate { add_field => { "service" => "scanner" } }
  }

  # Parse log levels
  if [level] {
    mutate { uppercase => [ "level" ] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "speech-to-copilot-logs-%{+YYYY.MM.dd}"
  }
  
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}