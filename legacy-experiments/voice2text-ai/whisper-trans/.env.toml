# Migrated from .env.sample to TOML format
# Generated by env-sample-to-toml migration script

[metadata]
project_name = "whisper-trans"
env_tag = "dev"
label_prefix = "volkb79.vxxu.de"

[control]
compose_start_mode = "abort-on-failure"
reset_before_start = "none"
image_check_enabled = false
image_check_continue_on_error = false

[infrastructure]
public_fqdn = "ra-r2001.vxxu.de"
public_tls_key_pem = "/etc/letsencrypt/live/${PUBLIC_FQDN}/privkey.pem"
public_tls_crt_pem = "/etc/letsencrypt/live/${PUBLIC_FQDN}/fullchain.pem"

[health]
interval = "2s"
timeout = "1s"
retries = 5
start_period = "20s"

[user]
uid = "$(id -u)"
gid = "$(id -g)"

[variables]
GLOBAL_DEMO_FLAG = {type = "boolean", value = "false", description = "Global Demo Flag"}
WHISPER_PORT = {type = "number", value = "9000", description = "Whisper Port"}
WHISPER_ASR_ENGINE = "faster_whisper"
WHISPER_ASR_MODEL = "base"
WHISPER_ASR_DEVICE = "cpu"
WHISPER_ASR_MODEL_PATH = {type = "path", value = "/data/whisper", description = "Whisper Asr Model Path"}
WHISPER_OMP_NUM_THREADS = "7"
WHISPER_OPENBLAS_NUM_THREADS = "7"
WHISPER_MKL_NUM_THREADS = "7"
WHISPER_SAMPLE_RATE = "16000"
WHISPER_MODEL_QUANTIZATION = "float32"
WHISPER_ENABLE_POST_PROCESSING = {type = "boolean", value = "false", description = "Whisper Enable Post Processing"}
WHISPER_MIN_TEXT_LENGTH = "10"
WHISPER_POST_PROCESSING_PROMPT_PATH = {type = "path", value = "/config/post-processing-prompt.txt", description = "Whisper Post Processing Prompt Path"}
WHISPER_POST_PROCESSING_MODEL = "gpt-4o-mini"
WHISPER_RESOURCE_MEMORY_LIMIT = "12G"
WHISPER_RESOURCE_CPU_LIMIT = "4"
TRAEFIK_HTTP_PORT = {type = "number", value = "80", description = "Traefik Http Port"}
TRAEFIK_HTTPS_PORT = {type = "number", value = "443", description = "Traefik Https Port"}
TRAEFIK_DASHBOARD_ENTRYPOINT = "dashboard"
TRAEFIK_DASHBOARD_INTERNAL_PORT = {type = "number", value = "8443", description = "Traefik Dashboard Internal Port"}
TRAEFIK_DASHBOARD = {type = "boolean", value = "true", description = "Traefik Dashboard"}
TRAEFIK_DASHBOARD_PORT = {type = "number", value = "9005", description = "Traefik Dashboard Port"}
WHISPER_HOSTDIR_CACHE = {type = "path", value = "./vol-whisper-cache", description = "Whisper Hostdir Cache"}
WHISPER_HOSTDIR_AUDIO_TEMP = {type = "path", value = "./vol-audio-temp", description = "Whisper Hostdir Audio Temp"}
WHISPER_API_TOKEN = {type = "token", value = "# left empty to be queried from user input", length = 64, description = "Whisper Api Token"}
TRAEFIK_DASHBOARD_PASSWORD = {type = "password", value = "# left empty to be dynamically generated", length = 32, description = "Traefik Dashboard Password"}
