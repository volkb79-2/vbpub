# The only installed probe configuration (PROBE-PROCESS.md §(g)).
[probe]
levels = ["observe", "operator", "observer"]
tick_ms = 1000
cgroup_root = "/sys/fs/cgroup"

[limits]
max_rows = 1024
annotate_rate_per_s = 50
annotate_burst = 64

[store]
dir = "/var/lib/hostobs/probe"
tmpfs_dir = "/run/hostobs/tiers"
events_cap_bytes = 67108864
events_ring_bytes = 4194304
