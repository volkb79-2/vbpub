[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.93
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The two local, unpublished workspace crates are path dependencies without a registry version.
allow-wildcard-paths = true

# The imported sampler lock resolves separate winnow lines through toml 0.9.8.
[[bans.skip]]
crate = "winnow@0.7.15"
reason = "toml 0.9.8 and toml_parser 1.1.5 resolve separate winnow lines in the imported sampler lock"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
