[workspace]
members = [
    "crates/act",
    "crates/client",
    "crates/eval",
    "crates/kernel",
    "crates/model",
    "crates/proto",
    "crates/store",
    "bins/act",
    "bins/probe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# P-hostobs-08: rustix 1.1.6 = the newest release at least 14 days old on 2026-11-24 (released 2026-10-27).
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "net", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
