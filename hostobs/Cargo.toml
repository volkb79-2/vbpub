[workspace]
members = [
    "crates/act",
    "crates/client",
    "crates/eval",
    "crates/kernel",
    "crates/model",
    "crates/proto",
    "crates/store",
    "bins/act",
    "bins/probe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# P-hostobs-08: rustix 1.1.6 = the newest release at least 14 days old on 2026-11-24 (released 2026-10-27).
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "net", "time"] }
# P-hostobs-09: toml 1.2.1 = the newest release at least 14 days old on 2026-11-24 (released 2026-11-06; 1.2.2 is from 2026-11-21).
# default-features off: only the parser and the serde bridge, no `display` writer.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
# serde 1.0.229 = the newest release (released 2026-07-18).
serde = { version = "1.0.229", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
