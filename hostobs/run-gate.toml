schema_version = 1

[lanes.lint]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Run Rust formatting, Clippy, rustdoc, cargo-deny, and workspace boundary lints offline."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
tools/cargo-offline.sh fmt --all --check
tools/cargo-offline.sh clippy --workspace --all-targets --locked --offline -- -D warnings
RUSTDOCFLAGS="-D warnings" tools/cargo-offline.sh doc --workspace --no-deps --locked --offline
tools/cargo-offline.sh deny --locked --offline check licenses bans sources
tools/check-lints.sh
python3 -I tools/check-lints-mutation.py .''',
]
clean_tree = true
budget = "20m"

[lanes.selftest]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Run nextest, doctests, llvm-cov, and per-crate line/region floors offline."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
tools/cargo-offline.sh llvm-cov nextest --workspace --locked --offline --profile ci --no-tests=fail --lcov --output-path lcov.info
tools/cargo-offline.sh test --doc --workspace --locked --offline
tools/cargo-offline.sh llvm-cov report --json --summary-only --output-path cov-summary.json
python3 tools/crate-floors.py cov-summary.json coverage-floors.toml''',
]
clean_tree = true
budget = "20m"
artifacts = ["lcov.info", "cov-summary.json"]

# The Python conformance lane (plan v4 §B.5, HOB-4): the independent reference decoders, the
# fixture regeneration checks and the `hostobs_client` tests, standard library only, no
# network. It runs on `tester-unified-rust` because that is the image every hostobs lane
# uses; its `python3` is Debian's apt package (CPython 3.13.5 on Debian 13, no pip), not the
# CPython 3.14.10 the WIRE.md §7.8 absolute memory bound was measured on, so that one bound is
# skipped here (its skip reason names the pinned version) and the growth and line-count gates
# run. `-B` keeps `__pycache__` out of the mounted tree. This lane is not judged by Assay.
[lanes.conformance]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Run the Python reference decoders, fixture checks and hostobs_client tests (standard library only)."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
python3 -B -I -W error::ResourceWarning -m unittest discover -s python/tests''',
]
clean_tree = true
budget = "10m"

# Assay R1 over the four functional crates (hostobs plan v4, M1 row: "+ assay-r1
# once R-2 lands"; assay B243/B523 consumer integration).
#
# This is a COMMAND lane, not `kind = "assay"`, and that is a deliberate shape
# rather than a shortcut: assay is stdlib-only, so the judge runs straight from
# the mounted worktree's own source (`PYTHONPATH={worktree}/assay/src`) and needs
# NO install. A `kind = "assay"` lane would make Run-Gate `python3 -m pip install
# --editable <worktree>/assay` first, and `tester-unified-rust` deliberately
# ships the offline, lock-bound Cargo toolchain WITHOUT pip/ensurepip/venv
# (HOB-44, assay B549): that lane died at the install step before the judge ever
# ran (`No module named pip`, verdict ERROR 2), so its declaration was the defect
# and not the image.
#
# The judged lane itself (rigor, judge, argv, the 95.0 line floor over the 53
# declared `src/*.rs` files, the floor's derivation) still lives in
# `assay.toml [lanes.assay-r1]` -- this lane only says how to REACH the judge in
# this image. Parity with the estate's assay lanes is kept where it is free:
# `--verdict-json` under the git-ignored `.assay/`, `--resume --progress
# --state-dir` (no-ops for an R1 lane, load-bearing if this lane ever gains R2).
#
# `PYTHONDONTWRITEBYTECODE=1` keeps the judge's own import from writing
# `__pycache__` into the mounted tree; the Cowtree source is on PYTHONPATH for
# the same reason every sibling source-Assay lane declares it (assay's lazy
# workspace importer, inert on the Rust R1 path). `assay/analysis/src` is needed
# only by `assay analyze` (the post-checks below): assay.cli imports
# `assay_analysis` lazily, exactly as the assay project's own lanes declare it.
#
# The judge's own exit status IS the lane's verdict (0 PASS, 1 FAIL, 2 ERROR),
# and `exit_map` states that rather than inheriting "nonzero means FAIL": a
# judge that could not run at all is ERROR, not a coverage failure. Three
# post-checks bind the artifact to what was judged -- schema/internal
# consistency (`assay verify`), the judged commit equal to the lane's own HEAD
# (`assay analyze verdict --expected-commit`, which assay's `verify` does NOT
# compare), and the measured totals plus branch capability printed into the
# lane log from the artifact itself -- and each of them failing is ERROR,
# because an artifact that cannot be bound is not a measurement.
#
# `network = "none"` matches the Rust environment: cargo runs `--offline`
# `--locked` from the image's lock-keyed crate cache, so a network attempt
# would be a loud failure rather than a download.
[lanes.assay-r1]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Judge the four functional crates with Assay Rust R1 (source tree, no install) and bind the verdict to HEAD."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
export PYTHONDONTWRITEBYTECODE=1
export PYTHONPATH="{worktree}/assay/src:{worktree}/assay/analysis/src:{worktree}/libraries/cowtree/src"
mkdir -p .assay .run-gate/assay-state
rm -f -- .assay/verdict-assay-r1.json .assay/progress-assay-r1.jsonl
# The judge's status is captured, not left to abort the script: the checks below
# must run even on FAIL, so a red log still states what was measured and why.
rc=0
python3 -m assay.cli run assay-r1 --file assay.toml \
  --verdict-json .assay/verdict-assay-r1.json \
  --resume --progress .assay/progress-assay-r1.jsonl \
  --state-dir .run-gate/assay-state || rc=$?
python3 -m assay.cli verify .assay/verdict-assay-r1.json \
  || { echo "run-gate: the Assay verdict is not schema-conformant" >&2; exit 2; }
if ! python3 -m assay.cli analyze verdict .assay/verdict-assay-r1.json \
     --expected-commit "$(git rev-parse HEAD)" --format text \
     > .assay/verdict-assay-r1-summary.txt; then
  echo "run-gate: the Assay verdict does not describe this lane's HEAD" >&2
  exit 2
fi
cat .assay/verdict-assay-r1-summary.txt
python3 - .assay/verdict-assay-r1.json <<'PY'
import json, sys
with open(sys.argv[1], encoding="utf-8") as handle:
    claims = json.load(handle)["claims"]
for claim in claims:
    print("assay-r1 claim: %s %s %s" % (
        claim["rigor"], claim["status"], claim.get("reason_code") or ""))
    coverage = claim.get("coverage")
    if not coverage:
        continue
    print("  lines %d/%d = %.4f%% over %d targets; branches %d/%d (%s)" % (
        coverage["covered"], coverage["executable"], coverage["pct"],
        coverage["considered"], coverage["branches_covered"],
        coverage["branches_total"], coverage["branch_capability"]))
    print("  uncovered lines listed as findings in %d file(s)"
          % len(coverage["missing_lines"]))
PY
exit "$rc"''',
]
exit_map = { "0" = "PASS", "2" = "ERROR" }
clean_tree = true
budget = "20m"
artifacts = ["lcov.info", "cov-summary.json", ".assay/verdict-assay-r1.json"]

# Assay Rust R2 (mutation, by ingesting cargo-mutants' report) over the CHANGED lines of the
# five judged crates (assay B245 U8b). The judged lane lives in `assay.toml [lanes.assay-r2]`
# (flags, source roots, output directory, the budget estimate and their reasons); this lane,
# like `assay-r1` above, only says how to REACH the judge in this image (source Assay from the
# worktree, no install).
#
# HAND-RUN ONLY, K15 evidence, never in a default gate: it is not a member of any sequence
# and nothing chains it. A cargo-mutants campaign costs about 20-35 s per mutant (estimate,
# compile-dominated), so hours per run; the T3 queue that runs it automatically is later
# work. Use it as
#
#   run-gate assay-r2 --base <ref> --worktree <worktree>
#
# with a base that yields about 100-300 mutants (count them first with `cargo mutants --list
# --in-diff <diff>`; there are no hostobs release tags yet, so pick a commit). K15 stays open
# until one such run exists.
#
# HOW THE BASE REACHES THE JUDGE. `assay.toml` declares `judge.base_source = "request"`, so
# the judge refuses to run without `--request-base` (`ERROR/BAD_LANE_CONFIG`, never a guessed
# base). A run-gate COMMAND lane has no automatic forwarding; it receives the base through the
# `{base}` token in its argv (the mechanism `gate-full` in run-gate-project and `r2` in cmru
# use), which run-gate fills from `--base REF` or, when absent, from its own resolution of the
# worktree's recorded fork point. The script passes it as `--request-base "{base}"`.
#
# EXIT STATUS. The judge's closed exit codes are 0 PASS, 1 FAIL (a surviving mutant), 2 ERROR,
# 3 NO_MEASUREMENT, 4 BUDGET_EXCEEDED (a timed-out mutant, or the campaign budget) and 5
# INCONCLUSIVE (a diff with nothing to mutate: `NO_MUTANTS`). Only 0 is a pass. Run-gate's
# command `exit_map` can map to PASS, FAIL or ERROR only, so 3, 4 and 5 are mapped to FAIL
# EXPLICITLY (they would be FAIL by default; stating it keeps a future reader from
# "fixing" 5 to PASS: a run that mutated nothing proved nothing). The post-checks below exit 2
# (ERROR) when the artifact cannot be bound to this lane's HEAD.
#
# The same environment facts as `assay-r1` apply: `network = "none"`, cargo `--offline
# --locked` from the image's lock-keyed crate cache, `PYTHONDONTWRITEBYTECODE=1`. The
# cargo-mutants output directory `assay-mutants-out` is git-ignored and is assay's to create
# (empty) in its own snapshot, so there is no `mkdir` of it here.
[lanes.assay-r2]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Hand-run Assay Rust R2 (cargo-mutants, changed lines vs --base) over the five judged crates; K15 evidence, never default."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
export PYTHONDONTWRITEBYTECODE=1
export PYTHONPATH="{worktree}/assay/src:{worktree}/assay/analysis/src:{worktree}/libraries/cowtree/src"
mkdir -p .assay .run-gate/assay-state
rm -f -- .assay/verdict-assay-r2.json .assay/progress-assay-r2.jsonl
# The judge's status is captured, not left to abort the script: the checks below
# must run even on FAIL, so a red log still states what was measured and why.
rc=0
python3 -m assay.cli run assay-r2 --file assay.toml \
  --request-base "{base}" \
  --verdict-json .assay/verdict-assay-r2.json \
  --resume --progress .assay/progress-assay-r2.jsonl \
  --state-dir .run-gate/assay-state || rc=$?
python3 -m assay.cli verify .assay/verdict-assay-r2.json \
  || { echo "run-gate: the Assay verdict is not schema-conformant" >&2; exit 2; }
if ! python3 -m assay.cli analyze verdict .assay/verdict-assay-r2.json \
     --expected-commit "$(git rev-parse HEAD)" --format text \
     > .assay/verdict-assay-r2-summary.txt; then
  echo "run-gate: the Assay verdict does not describe this lane's HEAD" >&2
  exit 2
fi
cat .assay/verdict-assay-r2-summary.txt
python3 - .assay/verdict-assay-r2.json <<'PY'
import json, sys
with open(sys.argv[1], encoding="utf-8") as handle:
    claims = json.load(handle)["claims"]
for claim in claims:
    print("assay-r2 claim: %s %s %s" % (
        claim["rigor"], claim["status"], claim.get("reason_code") or ""))
PY
exit "$rc"''',
]
exit_map = { "0" = "PASS", "1" = "FAIL", "2" = "ERROR", "3" = "FAIL", "4" = "FAIL", "5" = "FAIL" }
clean_tree = true
# Run-gate's outer bound is deliberately LONGER than `assay.toml [lanes.assay-r2].budget`
# (4h, the per-attempt bound, an estimate; the first real run sets the figure), so assay can
# still write its structured BUDGET_EXCEEDED/LANE_TIMEOUT verdict before this hard limit.
budget = "5h"
artifacts = [".assay/verdict-assay-r2.json"]

# A hard container memory cap. Both first attempts (2026-11-18) ran this lane in a container with NO
# limit and one test process of the unmutated baseline grew to GBs and had to be cancelled by hand
# at 3.6-6.4 GiB on the shared 8 GiB host (the slice total also tripped a neighbour guest's own stop rule).
# With `--memory` such a runaway is OOM-killed inside its own container (the baseline fails and the lane
# ends non-green) instead.
[lanes.assay-r2.resources]
memory = "2500m"
# Equal to `memory`: docker's `--memory-swap` is memory PLUS swap, so without it a runaway spills into the
# host's swap partitions instead of being OOM-killed at the cap (pwmcp PWMCP-61, iogovmon use the same pair).
memory_swap = "2500m"
