schema_version = 1

[lanes.lint]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Run Rust formatting, Clippy, rustdoc, cargo-deny, and workspace boundary lints offline."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
tools/cargo-offline.sh fmt --all --check
tools/cargo-offline.sh clippy --workspace --all-targets --locked --offline -- -D warnings
RUSTDOCFLAGS="-D warnings" tools/cargo-offline.sh doc --workspace --no-deps --locked --offline
tools/cargo-offline.sh deny --locked --offline check licenses bans sources
tools/check-lints.sh
python3 -I tools/check-lints-mutation.py .''',
]
clean_tree = true
budget = "20m"

[lanes.selftest]
kind = "command"
environment = "tester-unified-rust"
network = "none"
description = "Run nextest, doctests, llvm-cov, and per-crate line/region floors offline."
argv = [
  "bash", "-c",
  '''set -eu
cd {worktree}/hostobs
tools/cargo-offline.sh llvm-cov nextest --workspace --locked --offline --profile ci --no-tests=fail --lcov --output-path lcov.info
tools/cargo-offline.sh test --doc --workspace --locked --offline
tools/cargo-offline.sh llvm-cov report --json --summary-only --output-path cov-summary.json
python3 tools/crate-floors.py cov-summary.json coverage-floors.toml''',
]
clean_tree = true
budget = "20m"
artifacts = ["lcov.info", "cov-summary.json"]

# Assay R1 over the four functional crates (hostobs plan v4, M1 row: "+ assay-r1
# once R-2 lands"; assay B243/B523 consumer integration). `kind = "assay"`
# means Run-Gate installs the worktree's own `assay/` source and runs the judge;
# the lane's argv/rigor/judge live in `assay.toml [lanes.assay-r1]`, which owns
# the measured-floor derivation (95.0 line over the 36 judged `src/*.rs` files).
# `network = "none"` matches the Rust environment: cargo runs `--offline
# --locked` from the image's lock-keyed crate cache, so a network attempt would
# be a loud failure rather than a download.
[lanes.assay-r1]
kind = "assay"
assay_lane = "assay-r1"           # -> assay/../assay.toml [lanes.assay-r1]
environment = "tester-unified-rust"
network = "none"
clean_tree = true
budget = "20m"
artifacts = ["lcov.info", "cov-summary.json"]
