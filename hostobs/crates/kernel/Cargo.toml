[package]
name = "hostobs-kernel"
version.workspace = true
edition.workspace = true
publish = false

# The plan's `unsafe` allowance for this crate (§A.3) stays declared, but nothing here
# uses it: the crate carries its own `#![forbid(unsafe_code)]`, which a package lint
# override cannot raise. Cargo refuses to combine `[lints] workspace = true` with a
# package-level override, so the allowance is spelled out directly (the same shape
# `crates/act` has).
[lints.rust]
unsafe_code = "allow"

[dependencies]
hostobs-model = { path = "../model" }
rustix.workspace = true
