[package]
name = "hostobs-kernel"
version.workspace = true
edition.workspace = true
publish = false

# The plan's `unsafe` allowance for this crate (§A.3) stays declared for the private
# `activation::raw` module: `adopt_raw` claims a systemd-owned listening fd and
# `peer_credentials_raw` reads `SO_PEERCRED` (HOB-90). The crate carries
# `#![deny(unsafe_code)]`; Cargo refuses to combine `[lints] workspace = true` with a
# package-level override, so the allowance is spelled out directly (the same shape
# `crates/act` has).
[lints.rust]
unsafe_code = "allow"

[dependencies]
hostobs-model = { path = "../model" }
rustix.workspace = true
