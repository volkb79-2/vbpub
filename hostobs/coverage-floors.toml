# Per-package line and region floors, checked by tools/crate-floors.py from one
# llvm-cov summary. The first seven packages still carry the M0 bootstrap scaffold
# floor; `model` and `proto` carry M1 behavioral floors measured on their own tests
# (model: 98.06% line / 97.90% region, proto: 99.43% line / 97.69% region at the
# measuring commit of the M1 package). Floors are never lowered: a crate whose coverage drops raises
# its own floor instead of hiding code, and a floor may only be returned to the
# bootstrap value by deleting the crate.
[crates."crates/act"]
line = 90.0
region = 85.0

[crates."crates/client"]
line = 90.0
region = 85.0

[crates."crates/eval"]
line = 90.0
region = 85.0

[crates."crates/kernel"]
line = 90.0
region = 85.0

[crates."crates/model"]
line = 97.0
region = 96.0

[crates."crates/proto"]
line = 98.0
region = 96.0

[crates."crates/store"]
line = 90.0
region = 85.0

[crates."bins/act"]
line = 90.0
region = 85.0

[crates."bins/probe"]
line = 90.0
region = 85.0
