# Per-package line and region floors, checked by tools/crate-floors.py from one
# llvm-cov summary. Five packages carry a 90%/85% floor; `model`, `proto`, `kernel`,
# `serve` and `store` carry behavioral floors measured on their own tests
# (model: 98.06% line / 97.90% region, proto: 99.43% line / 97.77% region measured in
# the image on the M1 fix-round head). `kernel` carries the M1 part-2 behavioral floor
# measured on its own tests (92.19% line / 93.50% region), and `store` carries the M1
# part-3 floor measured on its own tests (94.87% line / 93.90% region, 108 unit tests plus
# the two fixture integration tests), because neither is scaffold any more. Floors are never
# lowered: a crate whose coverage drops raises its own floor instead of hiding code, and a
# floor may only be returned to the bootstrap value by deleting the crate. `serve` takes the
# stricter of its two P-hostobs-12 move donors, `proto` (which owned the hub), rather than
# `bins/probe`'s 90%/85%; its first post-move measurement was 98.49% line / 98.50% region.
[crates."crates/act"]
line = 90.0
region = 85.0

[crates."crates/client"]
line = 90.0
region = 85.0

[crates."crates/eval"]
line = 90.0
region = 85.0

[crates."crates/kernel"]
line = 92.0
region = 93.0

[crates."crates/model"]
line = 97.0
region = 96.0

[crates."crates/proto"]
line = 98.0
region = 96.0

[crates."crates/serve"]
line = 98.0
region = 96.0

[crates."crates/store"]
line = 94.0
region = 93.0

[crates."bins/act"]
line = 90.0
region = 85.0

[crates."bins/probe"]
line = 90.0
region = 85.0
