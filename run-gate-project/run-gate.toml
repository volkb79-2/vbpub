# =============================================================================
# run-gate-project's own gate lanes — parsed ONLY by the installed run-gate CLI (one parser,
# D-110). This file declares the lane only.
#
# The selftest lane IS the release gate: cmru.toml [steps.run-tests] runs
# `run-gate selftest`, so a release cannot be tagged or published unless
# this passes. Dogfooding by design — run-gate gates itself through its own
# machinery.
#
# The lane owns its tester-unified container so Run-Gate itself enforces
# placement, --init, and resource caps; callers do not need an outer
# `cmru tester-gate` wrapper. Inside that container, the suite exercises
# Run-Gate's direct host-subprocess path. Use tester-unified's dedicated
# venv explicitly; its system python does not carry pytest.
# `host` continues to mean an ephemeral container by default (R-38).
# test_run_gate.py's own suite is self-referential: many tests exercise
# physical_path()'s REAL /proc/self/mountinfo lookup against pytest's own
# tmp_path fixtures (only `docker run` itself is faked; RG-3's dual-mount and
# friends need a genuinely host-mounted path to resolve). Pytest's default
# /tmp is private to tester-unified, so keep pytest's basetemp under this
# bind-mounted checkout. This preserves the real mountinfo comparison. Tests
# that bind AF_UNIX sockets use their own short /tmp fixture, because pytest
# resolves basetemp symlinks and the checkout path can exceed sun_path.
#
# Coverage discipline: the release lane enforces DIFF coverage at 100%
# (topos/nyxloom estate pattern, vendored thin gate in tools/coverage_gate.py):
# every executable line added or changed since the newest reachable stable
# run-gate-vX.Y.Z tag must be covered, same-commit. Stable tags exist (19 as
# of 24.1.0), so the lane does NOT pass --allow-first-release: a checkout
# without them (a --no-tags clone, a tester mount missing the tags) must
# ERROR, not report SKIPPED with exit 0 — an absent tag is indistinguishable
# from a first release (RG-116 item 2). Only tools/release_candidate.py's
# prepare step may accept a first release, after it checked origin's tags.
# A present but unreachable stable tag remains an error.
# This release baseline stays
# fixed after merge, unlike merge-base(main, HEAD), which becomes HEAD once the
# candidate is merged and can hide the very changes the release is meant to
# judge. It does not claim a
# whole-project 100% floor; the broader line-and-branch `assay-r1` lane is a
# separate, explicitly invoked judge.
#
# --source is scoped to run_gate.py ALONE (not the whole project directory),
# mirroring topos's own `--source topos/src/topos`: the gate never measures
# itself (tools/coverage_gate.py is vendored infrastructure, outside the
# scope it enforces, exactly like topos/tools/coverage_gate.py sits outside
# topos/src/topos) or the test suite (a test's own "coverage" of itself is
# not a meaningful check). Both --source and --coverage-json are plain
# "run_gate.py"/"coverage.json" (no "run-gate-project/" prefix): the tool
# invokes rename-aware `git diff --relative ...` from CWD, then filters parsed
# paths to --source; unrelated project files stay outside the denominator.
# The selftest command explicitly enters the effective project dir before
# pytest and coverage_gate.py run, so the bare filename is what git reports,
# not a repo-root-relative path.
# =============================================================================
schema_version = 1

[lanes.selftest]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/run-gate-project && mkdir -p .run-gate/ && if [[ -n \"${RUN_GATE_RELEASE_WHEEL_RECEIPT:-}\" ]]; then /opt/tester-venv/bin/python tools/release_candidate.py verify-running --receipt \"$RUN_GATE_RELEASE_WHEEL_RECEIPT\"; fi && RUN_GATE_TMP=$(mktemp -d .run-gate/selftest.XXXXXX) && trap 'status=$?; if [ -n \"$RUN_GATE_TMP\" ]; then rm -rf \"$RUN_GATE_TMP\"; fi; exit \"$status\"' EXIT && RUN_GATE_ABS=\"$(realpath \"$RUN_GATE_TMP\")\" && GIT_CEILING_DIRECTORIES=\"$RUN_GATE_ABS\" /opt/tester-venv/bin/python -m pytest tests -q -rs --basetemp \"$RUN_GATE_ABS\" --cov=. --cov-branch --cov-report=json:coverage.json && /opt/tester-venv/bin/python tools/coverage_gate.py --repo . --base latest-release-tag --coverage-json coverage.json --source run_gate.py"]
budget = "20m"
artifacts = ["coverage.json"]       # disclosed after every run (RG-10)

[lanes.selftest.resources]
memory = "1g"
memory_swap = "16g"
cpus = "3"

# =============================================================================
# RG-55 wave, package P2, C2: assay lanes (D-11). `selftest` above stays the
# direct pytest and diff-coverage gate, without depending on Assay; these
# lanes are the SECOND,
# stricter judge, same reasoning cmru/scripts-cgroup-profiler already apply
# in this repo. Judged scope is DELIBERATELY WIDER than selftest's:
# `assay.toml`'s `source_roots = ["."]` (RW-8, run-gate-WAVE-RG55-
# CONTROLLER-LOG.md) judges `tools/coverage_gate.py` too, not just
# run-gate — a changed line there must be covered by
# tests/test_coverage_gate.py, exactly what "100% on every changed line"
# means for this project once real judgment (not just diff-coverage) is in
# the loop. `tests/` is excluded automatically by assay's own
# `is_test_path` rule; `tools/assay/*.pyz` and `tests/fixtures/` are not
# `.py` source under a non-test path and cannot enter the judged set either
# way.
#
# `kind = "assay"`, tester-unified (each lane owns its isolated container;
# see `selftest` above). `clean_tree = true` is the documented default (README "Lane
# schema"), declared explicitly here because an assay R1+/R2 lane's own
# DIRTY_TREE check would refuse a moment later anyway (assay/docs/
# CONSUMERS.md) — stating the position once, at the layer that can name the
# reason, beats a second, unexplained refusal one level down.
# =============================================================================

[lanes.assay-r1]
kind = "assay"
assay_lane = "r1"                   # -> assay.toml [lanes.r1]
environment = "tester-unified"
clean_tree = true
budget = "30m"

[lanes.assay-r1.resources]
memory = "2g"
memory_swap = "16g"

# Mutation (R2). Run in tester-unified with its private cgroup namespace;
# the observer-only cgprofile socket supplies the hidden host ancestry needed
# by Assay B145 without exposing the daemon control socket or using
# --cgroupns=host. Assay runs one candidate at a time and Docker caps this
# container at 3 CPUs, below dev-gates.slice's 5-CPU ceiling. The shared tester
# cgroup makes Assay's resource-event windows serial (jobs = 1).
#
# RW-23b (round-1 review S1): NO `stall_timeout` here. `stall_timeout`
# (RG-36/R-40c) bounds SILENCE via `ProgressWatch`/`LogStreamWatch`, both of
# which only exist for CONTAINER lanes (`await_container`'s log-stream poll,
# gated on `kind == "command" and lane.get("stall_timeout")`, and the
# progress-file watch built for container lanes) — `run_bare_host_lane`
# (this lane's own runner, `environment = "bare-host"`) is a plain
# `subprocess.run` with no watch of any kind, so a `stall_timeout` here was
# SILENTLY INERT: a stuck-but-still-running mutation sweep was never
# stopped early, contrary to what the config used to claim. This lane's
# total-time bound is the hard `budget` below; `stall_timeout` separately
# bounds silence while a container is running. After RG-43's host/bare-host
# role swap, `stall_timeout` is live only on a lane with
# `environment = "host"` (a real container), never on `bare-host`.
[lanes.assay-r2]
kind = "assay"
assay_lane = "r2"                   # -> assay.toml [lanes.r2]
environment = "tester-unified"
resource_observer = "cgprofile"
clean_tree = true
budget = "4h"

[lanes.assay-r2.resources]
memory = "2g"
pids = 8192
cpus = "3"

# R3: proves the gate REJECTS known-bad code (`tools/canary-run.sh`, including
# the median-not-mean `duration_stats` RG-27 trap). A
# plain `kind = "command"` lane, not `kind = "assay"`: the canary script
# runs its own disposable tar copy and pytest invocation directly (see the
# script's own header for why it does not go through `assay run` itself).
[lanes.assay-r3]
kind = "command"
environment = "tester-unified"
argv = ["bash", "-c", "cd {worktree}/run-gate-project && exec tools/canary-run.sh"]
budget = "15m"

[lanes.assay-r3.resources]
memory = "1g"
memory_swap = "16g"

# The implementation/release gate for THIS project's assay lanes: proves
# selftest AND the r1/r3 pair together. r2 (mutation, up to 4h) is
# deliberately NOT a member — it is invoked separately, pre-merge, per the
# handoff (§2 C2) — a conjunction that could silently take 4+ hours is not
# something a routine "does this change gate clean" check should have to
# pay for. cmru.toml's own release-gate step keeps pointing at `selftest`
# alone (see its own comment for why gate-full is not the release gate
# either).
[lanes.gate-full]
kind = "command"
environment = "bare-host"
# assay-r1 delegates its comparison base. Carry the conjunction's resolved
# base into that sub-invocation so `--base REF gate-full` is honored instead
# of being refused before the sub-lane can run (RG-26).
argv = ["bash", "-c", "run-gate selftest && run-gate --base {base} assay-r1 && run-gate assay-r3"]
clean_tree = false   # sub-lanes each enforce their own clean-tree check
budget = "1h"
