# =============================================================================
# run-gate-project's own gate lanes — parsed ONLY by run-gate.py (one parser,
# D-110). This file declares the lane only.
#
# The selftest lane IS the release gate: cmru.toml [steps.run-tests] runs
# `./run-gate.py selftest`, so a release cannot be tagged or published unless
# this passes. Dogfooding by design — run-gate gates itself through its own
# machinery.
#
# BARE-HOST mode, deliberately (rev 24: 'host' now means a container by
# default, same as any named environment — R-38; this lane is the ONE
# known case that needs the 'bare-host' opt-out instead) — NOT tester-unified
# either (verified empirically 2026-08-24, a container run of this exact
# lane produced 53 unrelated failures a bare-host run did not).
# test_run_gate.py's own suite is
# self-referential: many tests exercise physical_path()'s REAL
# /proc/self/mountinfo lookup against pytest's own tmp_path fixtures (only
# `docker run` itself is faked; RG-3's dual-mount and friends need a genuine
# host-mounted /tmp to resolve). Wrapping that suite inside ANOTHER
# container layer breaks mountinfo resolution for paths pytest creates
# fresh inside that container's own filesystem — they were never
# bind-mounted from anywhere, so "is the repo bind-mounted into this
# container?" fires on tests that have nothing to do with this change. This
# is unlike every other consumer's suite, which doesn't test run-gate's own
# docker-orchestration internals and gates cleanly in tester-unified.
#
# Coverage discipline (2026-08-24 decision): TOTAL line+branch coverage sits
# at ~47% today, so a passing --cov-fail-under=100 does not exist yet. The
# floor enforced here is DIFF coverage at 100% (topos/nyxloom estate pattern,
# vendored thin gate in tools/coverage_gate.py): every executable line added
# or changed since the merge-base with main must be covered, same-commit.
# The total-100 campaign is Phase 2 of the release-adoption program; when it
# lands this lane flips to --cov-fail-under=100 like cmru's.
#
# --source is scoped to run-gate.py ALONE (not the whole project directory),
# mirroring topos's own `--source topos/src/topos`: the gate never measures
# itself (tools/coverage_gate.py is vendored infrastructure, outside the
# scope it enforces, exactly like topos/tools/coverage_gate.py sits outside
# topos/src/topos) or the test suite (a test's own "coverage" of itself is
# not a meaningful check). Both --source and --coverage-json are plain
# "run-gate.py"/"coverage.json" (no "run-gate-project/" prefix): the tool
# invokes `git diff --relative ...`, which reports paths relative to CWD,
# and run_host_lane execs argv with cwd = the effective project dir (i.e.
# run-gate-project/ itself) — so the bare filename is what git actually
# reports, not a repo-root-relative path.
# =============================================================================
schema_version = 1

[lanes.selftest]
kind = "command"
environment = "bare-host"
argv = ["bash", "-c", "python3 -m pytest tests -q --cov=. --cov-branch --cov-report=json:coverage.json && exec python3 tools/coverage_gate.py --repo . --base main --coverage-json coverage.json --source run-gate.py"]
budget = "20m"
artifacts = ["coverage.json"]       # disclosed after every run (RG-10)

# =============================================================================
# RG-55 wave, package P2, C2: assay lanes (D-11). `selftest` above stays the
# vendored, standalone gate (zero-install, `--source run-gate.py` only,
# unrelated to whether assay is even reachable); these lanes are the SECOND,
# stricter judge, same reasoning cmru/scripts-cgroup-profiler already apply
# in this repo. Judged scope is DELIBERATELY WIDER than selftest's:
# `assay.toml`'s `source_roots = ["."]` (RW-8, run-gate-WAVE-RG55-
# CONTROLLER-LOG.md) judges `tools/coverage_gate.py` too, not just
# run-gate.py — a changed line there must be covered by
# tests/test_coverage_gate.py, exactly what "100% on every changed line"
# means for this project once real judgment (not just diff-coverage) is in
# the loop. `tests/` is excluded automatically by assay's own
# `is_test_path` rule; `tools/assay/*.pyz` and `tests/fixtures/` are not
# `.py` source under a non-test path and cannot enter the judged set either
# way.
#
# `kind = "assay"`, bare-host (same reasoning as `selftest`: this project's
# own suite is self-referential against real mountinfo/docker-orchestration
# internals — see that lane's header — so it never runs inside a container
# layer). `clean_tree = true` is the documented default (README "Lane
# schema"), declared explicitly here because an assay R1+/R2 lane's own
# DIRTY_TREE check would refuse a moment later anyway (assay/docs/
# CONSUMERS.md) — stating the position once, at the layer that can name the
# reason, beats a second, unexplained refusal one level down.
# =============================================================================

[lanes.assay-r1]
kind = "assay"
assay_lane = "r1"                   # -> assay.toml [lanes.r1]
environment = "bare-host"
assay_command = ["python3", "tools/assay/assay-6.1.1.pyz"]
clean_tree = true
budget = "30m"

[lanes.assay-r1.pins.assay]
version = "6.1.1"
sha256 = "tools/assay/assay-6.1.1.pyz.sha256"

# Mutation (R2). Bare-host and serial (HOST LOAD §6: 8 cores shared with a
# production game server, jobs = 1 in assay.toml's own [lanes.r2.judge.
# mutation] — no headroom for parallel mutant workers). `stall_timeout`
# (RG-36/R-40c): the SAME grammar as `budget`, but it bounds SILENCE in
# `.assay/progress-r2.jsonl` (`--progress`/`--resume` are unconditional on
# every assay lane, R-38/RG-33) — a stuck-but-still-running mutation sweep
# is stopped after 20 minutes with no progress line, not after the whole
# 4h budget elapses.
[lanes.assay-r2]
kind = "assay"
assay_lane = "r2"                   # -> assay.toml [lanes.r2]
environment = "bare-host"
assay_command = ["python3", "tools/assay/assay-6.1.1.pyz"]
clean_tree = true
stall_timeout = "20m"
budget = "4h"

[lanes.assay-r2.pins.assay]
version = "6.1.1"
sha256 = "tools/assay/assay-6.1.1.pyz.sha256"

# R3: proves the gate REJECTS known-bad code (`tools/canary-run.sh`, one
# canary today — median-not-mean on `duration_stats`, the RG-27 trap). A
# plain `kind = "command"` lane, not `kind = "assay"`: the canary script
# runs its own disposable tar copy and pytest invocation directly (see the
# script's own header for why it does not go through `assay run` itself).
[lanes.assay-r3]
kind = "command"
environment = "bare-host"
argv = ["bash", "-c", "exec tools/canary-run.sh"]
budget = "15m"

# The implementation/release gate for THIS project's assay lanes: proves
# selftest AND the r1/r3 pair together. r2 (mutation, up to 4h) is
# deliberately NOT a member — it is invoked separately, pre-merge, per the
# handoff (§2 C2) — a conjunction that could silently take 4+ hours is not
# something a routine "does this change gate clean" check should have to
# pay for. cmru.toml's own release-gate step keeps pointing at `selftest`
# alone (see its own comment for why gate-full is not the release gate
# either).
[lanes.gate-full]
kind = "command"
environment = "bare-host"
argv = ["bash", "-c", "./run-gate.py selftest && ./run-gate.py assay-r1 && ./run-gate.py assay-r3"]
clean_tree = false   # sub-lanes each enforce their own clean-tree check
budget = "1h"
