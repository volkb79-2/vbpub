# =============================================================================
# run-gate-project release contract — parsed ONLY by cmru (one parser per
# format, D-110). Adopted 2026-08-24 from the ciu/cmru pattern: the central
# orchestration file supplies [github]/[targets], while this file carries the
# [project]/[steps] release contract, wheel artifact, and scm versioning.
#
# Naming has ONE deliberate quirk: `project.id` below MUST equal the key this
# project is registered under in the root cmru.orchestration.toml
# ([orchestration.project.run-gate-project]) — cmru's config loader errors
# ("config declares project.id=X, expected Y") if they diverge; that key is
# what actually drives the change-detection watch path (the directory holding
# WHATEVER file that key's `config = "..."` names, not the id itself). It
# equals this directory's name here only because that is what the key was
# chosen to be — a readability convention this file follows, not a mechanical
# requirement. test_run_gate.py::test_cmru_toml_id_matches_orchestration_key
# pins the two staying equal structurally. Release/tag/publish naming does
# NOT use the id at all: tags are minted as `<prefix><version>` and the
# GitHub Release is keyed by --prefix on the push step, so everything
# user-facing stays `run-gate-v*` / `run_gate-*.whl`.
#
# The installed wheel's SemVer is the public identity and compatibility
# floor. Internal revision fields remain only in persisted record provenance.
#
# Historical bootstrap note: the first semver release followed the bare
# integer tag `run-gate-v22`, so it used `--set-version 23.0.0`. Semver tags
# have existed since then; routine releases should omit `--set-version` and
# let SCM apply the configured conventional bump. For a deliberate override,
# pass a bare semver (never the `run-gate-v`-prefixed tag).
# =============================================================================
schema_version = 1

[runtime]
kind = "none"

[env]
RUN_GATE_RELEASE_NOTES = "## run-gate 24.0.0\n\nRun-Gate is now supported as an installed wheel with a SemVer identity. Check the installed version with `run-gate --version`; the reported version is read from wheel metadata.\n\n### Breaking change\n\nConsumer scripts and symlinks have been retired. Install the `run-gate` wheel, then invoke the `run-gate` console command from the project directory containing `run-gate.toml`. Config examples, release commands, and Buildkite generation use the installed CLI. `run-gate validate-pointers` reports legacy `run-gate.py` references.\n\nInternal revision fields remain only for saved-record provenance and do not act as an upgrade floor.\n\n**Install**\n```bash\npython -m pip install ./run_gate-24.0.0-py3-none-any.whl\n```"

[project]
id = "run-gate-project"
description = "run-gate — the per-project gate entrypoint: declared lanes and reserved exit codes"
template_revision = 4
prefix = "run-gate-v"
artifacts = ["wheel"]
scm_dist = "run_gate"

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]
# The selftest release gate writes this commit-bound coverage report.
evidence_paths = ["coverage.json"]

# SSOT pointer (D-110/D-111): the release gate IS the project's own run-gate
# lane (`run-gate selftest` -> run-gate.toml), not a duplicated pytest
# line. The lane owns all test logic (pytest + diff-coverage floor) in exactly
# one place. CMRU executes step commands directly; the registered Run-Gate
# lane owns its tester-unified container, placement, init, and resource caps.
# Do not wrap it with `cmru tester-gate`: that wrapper starts a separate
# privileged host-PID systemd probe which this package gate does not need.
# The lane's container bind-mounts this checkout so mountinfo tests exercise
# a real mapping, and the release step runs with project_root as cwd.
# The installed CMRU 6.1.0 executes this argv as a project step; Run-Gate
# itself now supplies `--init` for the tester container (RG-84).
# Run-Gate must be installed from its wheel before invoking this release step.
#
# RG-55 wave, package P2, C2 (2026-09-12): run-gate.toml grew `assay-r1`/
# `assay-r2`/`assay-r3`/`gate-full` (assay-based judgment, stricter and
# wider-scoped than selftest's vendored diff-coverage check — see
# run-gate.toml's own header). The release gate STAYS `selftest` alone,
# deliberately: `assay-r2` (mutation) can run up to 4h, which is not a bound
# a release step should impose on every tag; `gate-full` omits r2 for the
# exact same reason, so making `gate-full` the release gate would not even
# buy full assay coverage, only a slower `selftest`. `assay-r1`/`assay-r3`
# are run by hand (or by CI outside the release path) before merge; `r2` is
# invoked separately again before merge. When a bounded, release-safe
# assay conjunction is wanted here, it is a deliberate follow-up, not a
# silent swap of this pointer.
[steps.run-tests]
quiet = true
commands = [
  { label = "run-gate: selftest in tester-unified", argv = ["run-gate", "selftest"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "run-gate: build wheel", argv = ["cmru", "handler", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "run-gate: publish wheel", argv = ["cmru", "handler", "wheel-publish", "--prefix", "run-gate", "--cwd", ".", "--notes-env", "RUN_GATE_RELEASE_NOTES"], cwd = "." },
]
