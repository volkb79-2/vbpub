project_root = "."
dist_dir = "dist"
bundle_dir = "bundle"
client_dir = "wheels"

[wheel]
enabled = true
python_bin = "python3"
project_root = "client"
find_links = "vendor"

[archive]
# PWMCP_VERSION is written by CMRU's explicit pwmcp prepare phase (e.g. "1.60.0-r2").
name_template = "pwmcp-{version}.tar.xz"
format = "xztar"
version_env = "PWMCP_VERSION"

[copy]
# Consumer-facing stack files only. Maintainer-only files (Dockerfile, docker-bake.hcl,
# cmru.toml, bundle.toml, scripts/) are excluded — the image is already on GHCR.
#
# The maintainer's build-test root configs remain excluded. `standalone/` contains the
# separate root defaults for the CMRU-managed /srv/pwmcp-instance install; the ordinary
# bundle remains usable as a sub-stack of a consumer's CIU root.
files = [
  "ciu.compose.yml.j2",
  "ciu.defaults.toml.j2",
  "pwmcp.contract.json",
  "README.md",
]
dirs = ["docs", "client", "standalone", "installer"]
