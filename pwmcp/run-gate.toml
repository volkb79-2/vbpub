# =============================================================================
# pwmcp project gate lanes — parsed ONLY by Run-Gate CLI (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.root.toml. The tests
# are self-contained (importlib loads build-push.py by path), so the lane is
# a plain pytest run in tester-unified.
# See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.r1]
kind = "assay"
assay_lane = "r1"
environment = "tester-unified"
clean_tree = true
budget = "20m"

[lanes.r2]
kind = "assay"
assay_lane = "r2"
environment = "tester-unified"
resource_observer = "cgprofile"
clean_tree = true
budget = "245m"
# CPU-bound single-threaded suite (~300 s on one CPU, ~260 MiB): let run-gate
# pick the worker count (min of assay.toml jobs_max=3, cpus 3, memory /
# candidate_ram). Needs run-gate >= 25.0.1 for pyz-pinned consumers (RG-154) and
# a btrfs MDT_COW_ROOT host; otherwise auto clamps to one worker.
jobs = "auto"

# pids: required by the resource observer (observer-backed lanes need it for attributable counters).
# memory_swap equals memory on purpose (PWMCP-61): Docker's default leaves swap UNBOUNDED for the
# container, so a runaway mutant swaps on the host instead of dying at its cap. Equal values make
# the combined memory-plus-swap ceiling the same 3 GiB the memory cap already declares.
[lanes.r2.resources]
memory = "3g"
memory_swap = "3g"
pids = 8192
cpus = "3"
candidate_ram = "450m"
