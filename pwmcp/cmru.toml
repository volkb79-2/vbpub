schema_version = 1

[runtime]
kind = "none"

[env]
BUILDX_BUILDER = "mdt-managed"
BUILDKIT_HOST = "unix:///run/mdt-buildkitd/buildkitd.sock"

[project]
id = "pwmcp"
description = "Playwright MCP server OCI image and deployable stack bundle."
template_revision = 4
prefix = "pwmcp-v"
artifacts = ["oci-image", "bundle"]

[project.version]
strategy = "external:PWMCP_VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
commit_generated = ["ciu.defaults.toml.j2", "ciu.toml.j2", "docker-bake.hcl", "containers/pwmcp/Dockerfile", "pwmcp.contract.json", "client/requirements-runtime.txt", "get.py"]
artifact_dirs = ["dist"]
evidence_paths = ["coverage.json", ".assay"]

[project.installer]
install_dir_system = "/srv/pwmcp-instance"
install_dir_user = "pwmcp-instance"
asset_suffix = ".tar.xz"
entrypoint = "installer/adapter.py"
required_commands = ["python3"]
launchers = ["pwmcp"]

[[project.installer.wheels]]
path = "wheels/cli_extended-*.whl"
distribution = "cli-extended"

[[project.installer.wheels]]
path = "wheels/greenlet-*.whl"
distribution = "greenlet"

[[project.installer.wheels]]
path = "wheels/pyee-*.whl"
distribution = "pyee"

[[project.installer.wheels]]
path = "wheels/playwright-*.whl"
distribution = "playwright"

[[project.installer.wheels]]
path = "wheels/pwmcp_client-*.whl"
distribution = "pwmcp-client"

[steps.prepare]
quiet = true
commands = [
  { label = "pwmcp: render CMRU get.py installer", argv = ["cmru", "get-py", "pwmcp", "--output", "get.py"], cwd = "." },
  { label = "pwmcp: validate committed publishable version inputs", argv = ["python3", "scripts/resolve-playwright-version.py", "--check"], cwd = "." },
]

[steps.run-tests]
quiet = true
commands = [
  { label = "pwmcp: Assay R1 tester gate", argv = ["./run-gate.py", "r1"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "pwmcp: build Playwright server image", argv = ["python3", "build-push.py", "--build"], cwd = "." },
  { label = "pwmcp: stage client and Playwright wheels", argv = ["python3", "scripts/prepare-client-wheels.py"], cwd = "." },
  { label = "pwmcp: build stack bundle", argv = ["python3", "scripts/build-bundle.py"], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "pwmcp: push Playwright server image", argv = ["python3", "build-push.py", "--push"], cwd = "." },
  { label = "pwmcp: publish stack bundle", argv = ["python3", "scripts/publish-bundle.py"], cwd = "." },
]

[versions.targets."oci.playwright"]
mode = "single"
constraint = ">=1.62.0,<2.0.0"

[versions.targets."oci.playwright".oci]
image = "mcr.microsoft.com/playwright"
tag = "v{version}-noble"
