schema_version = 2

[lanes.r1]
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = ["/opt/tester-venv/bin/python", "-m", "pytest", "tests", "client/tests", "-q", "--cov=.", "--cov-branch", "--cov-report=json:coverage.json"]
env = { PYTHONPATH = "client/src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
budget = "15m"
allow_argv_append = false

[lanes.r1.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.r1.judge]
language = "python"
source_roots = ["."]
mode = "whole_target"
targets = [
  "build-push.py",
  "client/src/pwmcp_client/__init__.py",
  "client/src/pwmcp_client/cli.py",
  "client/src/pwmcp_client/mcp_client.py",
  "client/src/pwmcp_client/contract.py",
  "client/src/pwmcp_client/diagnostics.py",
  "client/src/pwmcp_client/ocr.py",
  "containers/ocr/ocr_service.py",
  "client/src/pwmcp_client/session.py",
  "client/src/pwmcp_client/storage_state.py",
  "client/src/pwmcp_client/user_agent.py",
  "client/src/pwmcp_client/blocked.py",
  "scripts/resolve-playwright-version.py",
]
fail_under = 100.0
allow_excluded = false
require_branch = true

[lanes.r1.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.r2]
scope = "S1"
rigor = ["R0", "R1", "R2"]
enforcement = "gate"
# -x: a killed mutant stops at its first failing test (assay warns that fail-fast
# can leave a coverage artifact incomplete; the green baseline runs everything).
argv = ["/opt/tester-venv/bin/python", "-m", "pytest", "tests", "client/tests", "-q", "-x", "--cov=.", "--cov-branch", "--cov-report=json:coverage.json"]
env = { PYTHONPATH = "client/src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
budget = "4h"
allow_argv_append = false

[lanes.r2.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.r2.judge]
language = "python"
source_roots = ["."]
mode = "whole_target"
targets = [
  "build-push.py",
  "client/src/pwmcp_client/__init__.py",
  "client/src/pwmcp_client/cli.py",
  "client/src/pwmcp_client/mcp_client.py",
  "client/src/pwmcp_client/contract.py",
  "client/src/pwmcp_client/diagnostics.py",
  "client/src/pwmcp_client/ocr.py",
  "containers/ocr/ocr_service.py",
  "client/src/pwmcp_client/session.py",
  "client/src/pwmcp_client/storage_state.py",
  "client/src/pwmcp_client/user_agent.py",
  "client/src/pwmcp_client/blocked.py",
  "scripts/resolve-playwright-version.py",
]
fail_under = 100.0
allow_excluded = false
require_branch = true

[lanes.r2.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.r2.judge.mutation]
# Ceiling for concurrent candidate windows (assay >= 11; run-gate's `jobs = "auto"`
# in run-gate.toml picks the count). The suite is single-threaded and CPU-bound:
# 1091 tests take ~300 s on one CPU (310 s without --cov; slowest: imagegen
# degrade tests, glyphgrid perf corpus, nested pytest spawns in test_testdeps),
# ~260 MiB RSS. So one worker per CPU: 3 workers on the 3-CPU lane. No fixed
# ports or shared dirs in tests/ and client/tests. Audit:
# reports/assay-jobs-audit-REPORT.md.
jobs_max = 3
max_mutants = 1000
operators = ["python:compare-swap", "python:boolop-swap", "python:bool-const-flip", "python:falsy-swap"]
budget_per_candidate = "900s"
liveness = false
