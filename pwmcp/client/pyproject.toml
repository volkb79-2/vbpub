[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pwmcp-client"
# The single version source is src/pwmcp_client/VERSION (see [tool.setuptools.dynamic]):
# installed metadata and the CLI identity (CliIdentity.resolve) read the same value and
# must agree, so there is no literal fallback anywhere.
dynamic = ["version"]
description = "Python consumer helpers for a GitHub-released pwmcp server"
requires-python = ">=3.11"
dependencies = [
    "cli-extended>=0.3.0",
    "playwright==1.64.0",
]
# cli-extended is a REAL wheel dependency (unified-adoption CX-D1), never vendored.
# Floor 0.3.0: the first release whose `register_skills_verbs` forwards the consumer's
# global options (`--contract`) to the `skills` child registry (CLI-EXT-26), which the
# `pwmcp skills` group needs; it also carries CliIdentity.resolve, register_doctor and
# the cli_extended.testing helpers this CLI and its tests use (same floor as cmru).
# requirements-runtime.txt mirrors these runtime dependencies for CMRU's offline wheel
# staging. The release resolver checks both projections against pwmcp.contract.json.
# cli-extended is published on GitHub Releases only.

[project.optional-dependencies]
pytest = ["pytest>=8"]
# The registered gate (tester-unified) derives its closure from this extra
# (tester-unified/gen-requirements.py, TEST_EXTRAS_ONLY: the runtime `playwright` pin is NOT installed
# there). Every module the pwmcp tests import and would otherwise silently skip on is declared here, so
# the gate cannot lose coverage by an accident of another project's dependencies.
# Floors: pillow>=10 (Image.Resampling, Image.open(formats=...)) for the OCR sidecar's image tests;
# websockets>=12 for the fake CDP server in the user-agent override test; jinja2>=3.1 and pyyaml>=6 for
# the ciu/compose template render tests.
test = [
    "pytest>=8",
    "pillow>=10",
    "websockets>=12",
    "jinja2>=3.1",
    "pyyaml>=6",
]

[project.scripts]
pwmcp = "pwmcp_client.cli:main"

# Surface lifecycle (cli-extended AC-16..AC-18): the operator-facing `pwmcp` CLI is the
# only catalogued CLI. The release-step scripts (build-push.py, scripts/*.py) are
# internal CMRU steps on the same library registration (scripts/_vars.py) and are
# covered by tests/test_script_cli.py instead. Paths are relative to this file; run
# `cli-extended surface check` from pwmcp/ with the client installed or PYTHONPATH=client/src.
[tool.cli-extended]
schema_version = 1

[[tool.cli-extended.clis]]
id = "pwmcp"
factory = "pwmcp_client.cli:build_cli"
review = "../docs/cli-review.toml"
manifest = "../docs/cli-surface.json"
spec = "../docs/CLI-SPEC.md"
findings = "../docs/cli-review-findings.toml"

[tool.setuptools.dynamic]
version = {file = ["src/pwmcp_client/VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

# VERSION and the agent skills ship as package data (AC-01, AC-19): `pwmcp skills install`
# always matches the installed wheel, and the CLI identity can read VERSION beside the code.
[tool.setuptools.package-data]
pwmcp_client = ["VERSION", "skills/**/*"]
