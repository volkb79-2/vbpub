[pytest]
# Node IDs in docs/cli-review.toml are relative to this directory (the pytest rootdir),
# so it must stay the one place pytest is anchored for pwmcp (AC-22).
# The plugin links every active reviewed CLI case to a collected `cli_case` test and
# fails the run when one is missing (strict mode; the registered gate runs everything).
# The reviewed CLI is configured in client/pyproject.toml [tool.cli-extended].
addopts = -p cli_extended.pytest_plugin
cli_extended_config = client/pyproject.toml
testpaths = tests client/tests
