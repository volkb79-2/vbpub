# cmru-runner-template: build-config
# cmru-runner-template-revision: 1
project_root = "."
log_dir = "logs"
release_config = "../cmru.toml"

[project_metadata.builder]
name = "pwmcp-governed-v1"
memory = "4g"
# Docker's memory-swap value is the combined RAM + swap allowance.
memory_swap = "12g"
cpu_shares = 128
cpu_quota = 400000
cpu_period = 100000

[steps.build-images]
quiet = true
commands = [
  { label = "pwmcp: build unified image", argv = ["docker", "buildx", "bake", "all", "--load"], cwd = "." },
]

[steps.push-images]
quiet = true
required_env = ["GITHUB_USERNAME", "GITHUB_PUSH_PAT"]

commands = [
  { label = "pwmcp: push unified image", argv = ["docker", "buildx", "bake", "all", "--push"], cwd = "." },
]

[steps.push-images.login]
registry = "ghcr.io"
username_env = "GITHUB_USERNAME"
token_env = "GITHUB_PUSH_PAT"
required = true
