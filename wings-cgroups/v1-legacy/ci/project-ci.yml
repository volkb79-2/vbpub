# CI for the Wings cgroups project. The patch series source lives in the
# canonical top-level wings-patchstack/ directory.
name: wings-cgroups-ci

on:
  push:
    paths: ["wings-cgroups/**", "wings-patchstack/**", "libraries/patchseries/**"]
  pull_request:
    paths: ["wings-cgroups/**", "wings-patchstack/**", "libraries/patchseries/**"]

jobs:
  patchstack:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pterodactyl
            remote: https://github.com/pterodactyl/wings.git
            ref: v1.13.3
            commit: 6987d5e6f0612133e031255a99655e822d30579a
            patches: wings-patchstack/patches/pterodactyl-v1.13.3
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream and apply series
        run: |
          git clone --branch "${{ matrix.ref }}" --depth 50 "${{ matrix.remote }}" /tmp/wings
          cd /tmp/wings
          git config user.name ci && git config user.email ci@localhost
          test "$(git rev-parse 'HEAD^{commit}')" = "${{ matrix.commit }}"
          git checkout -b cgroup-ci "${{ matrix.commit }}"
          git am "$GITHUB_WORKSPACE/${{ matrix.patches }}"/*.patch
      - uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/wings/go.mod
          cache: true
      - name: Build + vet + test
        working-directory: /tmp/wings
        run: |
          go build ./...
          go vet ./config/... ./cmd/... ./environment/... ./internal/cgroups/...
          go test ./config/... ./environment/... ./server/... ./internal/cgroups/...
          go vet -tags systemdintegration ./internal/cgroups/
          go test -tags dockerintegration -count=1 ./environment/docker/ -run "Cgroup|Override|Default" -v

  slice-manager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wings-cgroups/t3a-slice-manager/go.mod
          cache: true
      - name: Build + vet + test
        working-directory: wings-cgroups/t3a-slice-manager
        run: |
          go build ./...
          go vet ./...
          go test ./...
          go vet -tags systemdintegration ./...

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all project scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y shellcheck
          find wings-cgroups wings-patchstack -name '*.sh' -print0 | xargs -0 shellcheck -S warning
