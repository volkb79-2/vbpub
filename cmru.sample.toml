# Minimal CMRU configuration — copy to cmru.toml and replace every placeholder.
# Secrets never belong here: use GITHUB_PUSH_PAT / GITHUB_TOKEN or the gitignored
# cmru.secret.toml overlay.  See cmru/docs/SPEC.md S2 for the full schema.

[github]
owner      = "your-github-owner"
repo       = "your-monorepo"
owner_type = "user" # "user" | "org"

[targets]
host     = "github"
registry = ["ghcr.io"]

[orchestration]
project_order    = ["example-wheel"]
default_projects = ["example-wheel"]
default_steps    = ["run-tests", "build", "push", "validate"]
execution_mode   = "project-first"

[cleanup]
release_tag_prefixes = ["*"]
keep_release_tags    = ["example-wheel-latest"]
ghcr_packages        = ["*"]

# A normal Python wheel needs only its profile, versioning policy, release notes,
# and a real isolated gate. CMRU supplies build/push/validate handlers.
[project.example-wheel]
prefix    = "example-wheel-v"
artifacts = ["wheel"]
scm_dist  = "example-wheel"
cwd       = "example-wheel"
[project.example-wheel.version]
strategy = "scm"
bump     = "conventional"
[project.example-wheel.env]
CMRU_RELEASE_NOTES = "## example-wheel\n\nInstall with `pipx install example-wheel-*.whl`."
[project.example-wheel.steps.run-tests]
commands = [
  { label = "example-wheel: isolated gate", argv = ["python3", "cmru.py", "tester-gate", "--cwd", "example-wheel", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q"], cwd = "." },
]

# CMRU automatically creates and updates example-wheel/CHANGES.md before the gate.
# Do not add an opt-in. These are the only supported exceptions:
#
# [project.example-wheel.release]
# changelog = "docs/CHANGES.md" # another project-relative location
# # changelog = false            # explicit opt-out; avoid unless history is externally owned

# Image-only projects use `strategy = "none"` and get source-revision history instead
# of a semver heading. Keep their private provenance build in prepare, declare only its
# tracked outputs, and let CMRU commit/gate them before the registry push:
#
# [project.example-image]
# prefix    = "example-image-v"
# artifacts = ["oci-image"]
# cwd       = "example-image"
# [project.example-image.version]
# strategy = "none"
# [project.example-image.release]
# commit_generated = ["provenance.json"]

# A bundle/tarball may publish multiple ABI/interpreter variants under one semver tag.
# The generated installer refuses to guess a variant on a non-interactive host.
#
# [project.example-bundle]
# prefix    = "example-bundle-v"
# artifacts = ["bundle"]
# cwd       = "example-bundle"
# [project.example-bundle.version]
# strategy = "file:VERSION"
# [project.example-bundle.installer]
# install_dir_system = "/opt/example-bundle"
# install_dir_user   = "example-bundle"
# asset_suffix       = ".tar.xz"
# entrypoint         = "scripts/adapter.py"
# required_commands  = ["python3", "minisign"]
# preserve           = ["shared/host.toml"]
# manifest_name      = "manifest.json"
# signature_name     = "manifest.json.minisig"
# [[project.example-bundle.variants]]
# name      = "py311"
# build_arg = "PYTHON_VERSION=3.11"
# label     = "Python 3.11"
# [[project.example-bundle.variants]]
# name      = "py312"
# build_arg = "PYTHON_VERSION=3.12"
# label     = "Python 3.12"

# A prepare step may derive a version into <project>/cmru.vars. CMRU then owns the
# annotated tag; never create a tag in the project script itself.
#
# [project.example-external-version]
# prefix    = "example-external-version-v"
# artifacts = ["wheel"]
# cwd       = "example-external-version"
# [project.example-external-version.version]
# strategy = "external:EXAMPLE_VERSION"
# [project.example-external-version.steps.prepare]
# commands = [
#   { label = "resolve exact upstream input", argv = ["python3", "scripts/resolve.py"], cwd = "example-external-version" },
# ]
