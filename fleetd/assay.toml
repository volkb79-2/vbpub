# Source-backed R0/R1 qualification. Mutation qualification is outside this MVP.
schema_version = 2

[lanes.fleetd]
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = [
  "/opt/tester-venv/bin/python3", "-m", "pytest", "tests", "-q",
  "--cov=fleetd", "--cov-branch", "--cov-report=json:coverage.json", "--cov-fail-under=100",
]
env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["PATH"]
budget = "30m"
allow_argv_append = false

[lanes.fleetd.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = []

[lanes.fleetd.judge]
language = "python"
source_roots = ["src"]
fail_under = 100.0
allow_excluded = false
require_branch = true
base = "main"

[lanes.fleetd.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"
