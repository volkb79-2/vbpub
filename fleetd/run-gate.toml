# fleetd test lanes always run in tester-unified; the cockpit never runs tests.
schema_version = 1

[lanes.r0-r1]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/fleetd && PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests -q --cov=fleetd --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json",
]
clean_tree = false
budget = "30m"
# RG-320/RG-326: SILENT BY CONSTRUCTION during the pytest suite; no 300s
# output cadence is guaranteed by each test; no bound is measured; see RG-326.
stall_timeout = "30m"
artifacts = ["coverage.json"]

[lanes.r0-r1.resources]
memory = "1g"
io_sync = "durable"

[lanes.campaign-contract]
kind = "command"
environment = "tester-unified"
# A focused subset of the suite, so the cli-extended review plugin runs in partial mode
# (AC-22): the catalog's grammar cases live in tests/test_cli_review_cases.py and are covered
# by the r0-r1 lane, which collects the whole suite and stays strict.
argv = [
  "bash", "-c",
  "cd {worktree}/fleetd && PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 /opt/tester-venv/bin/python3 -m pytest tests/test_campaign.py -q --cli-case-partial",
]
clean_tree = false
budget = "5m"
# RG-320/RG-326: SILENT BY CONSTRUCTION during the campaign pytest; a test
# may run without output for 300s; no bound is measured; see RG-326.
stall_timeout = "5m"

[lanes.campaign-contract.resources]
memory = "1g"
io_sync = "durable"
