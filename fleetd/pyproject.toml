[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetd"
description = "RAM-first campaign planning and host facts for the vbpub compute fleet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Volker Badziong" }]
dependencies = []
dynamic = ["version"]

[project.scripts]
fleet = "fleetd.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
root = ".."
tag_regex = "^fleetd-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "fleetd-v*"]
