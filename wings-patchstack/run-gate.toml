# Wings Go tests and workflow tests inherit the estate tester-unified
# environment, including its CPU cap and forwarded host facts.
schema_version = 1

[lanes.wings]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/wings-patchstack && exec bash scripts/run-tests-in-gate.sh pterodactyl",
]
clean_tree = false
budget = "30m"
stall_timeout = "30m"
# RG-320/H1: SILENT BY CONSTRUCTION. scripts/run-tests-in-gate.sh runs
# `go build ./...` (:26-27), `go vet` (:28-39) and the pytest phase before them;
# none of those prints a byte on success, and a cold build on a loaded host can
# exceed 300 s. Declared EQUAL to this lane's budget, so a slow cold build cannot
# be reported STALLED. No silence bound has been measured yet; RG-326 tracks a
# real progress signal.

[lanes.wings.resources]
memory = "4g"
pids = 4096

[lanes.coverage]
kind = "command"
environment = "tester-unified"
argv = [
  "bash", "-c",
  "cd {worktree}/wings-patchstack && exec bash scripts/run-coverage-in-gate.sh pterodactyl",
]
clean_tree = false
budget = "60m"
stall_timeout = "60m"
# RG-320/H1: SILENT BY CONSTRUCTION. Same script shape as `wings` above plus
# `go mod download` (:53-54) and the assay coverage run, whose candidate progress
# is a FILE (.assay/progress-coverage.jsonl) this lane only prints after it ends.
# Declared EQUAL to this lane's budget; no silence bound measured yet (RG-326).
artifacts = [
  ".assay/coverage/verdict.json",
  ".assay/coverage/cover.out",
  ".assay/progress-coverage.jsonl",
]

[lanes.coverage.resources]
memory = "4g"
pids = 4096
