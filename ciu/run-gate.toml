# =============================================================================
# ciu project gate lanes — parsed ONLY by run-gate.py (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.root.toml (nearest
# ancestor); judgment policy lives in assay.toml [lanes.ciu] (R0-R3: the full
# pytest suite, 100% line AND branch floor plus native mutation and
# canary). This file is the SSOT
# for how ciu's gate runs; consumers point at `./run-gate.py ciu`.
# See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.ciu]
kind = "assay"
assay_lane = "ciu"                  # -> assay.toml [lanes.ciu]
environment = "tester-unified"
budget = "8h"
# Internal vbpub lanes omit assay_command and pins deliberately. run-gate
# installs assay from the selected worktree in the lane environment; the
# verdict records the exact runtime assay version and source commit.

[lanes.ciu.resources]
cpus = "3"
memory = "2g"
memory_swap = "16g"

# `get.py enroll` is ciu-owned (ciu/installer/enroll.py, inlined into ciu/get.py by
# cmru's installer extensions; cmru program 2026-10 W1-CIU-ENROLL, O4). Its
# security-critical container oracles (O2/O3: real user creation, authorized_keys
# writes, modes/ownership, a fingerprint cross-check and a login against a REAL
# sshd) moved here from cmru's former [lanes.enroll] (KI-25). They start their own
# disposable docker containers from inside the test process, and tester-unified has
# no docker-socket mount, so this runs bare-host on the invoking shell's python
# (no /opt/tester-venv/ path: that venv exists only inside the tester-unified
# image). CIU_ENROLL_REQUIRED=1 makes missing docker / CGROUP_PARENT_DEV_GATES /
# a failed fixture-image build FAIL the lane instead of skipping O2/O3. No
# [lanes.enroll.resources]: the fixture caps its own containers
# (--cgroup-parent/--cpus/--memory). The pytest process needs cmru importable for
# the gate-slice preflight (cmru.tester_gate), hence ../cmru/src on PYTHONPATH.
[lanes.enroll]
kind = "command"
environment = "bare-host"
argv = ["bash", "-c", "cd {worktree}/ciu && exec env CIU_ENROLL_REQUIRED=1 PYTHONPATH=src:../cmru/src:../libraries/cli-extended/src:../libraries/worktree/src PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/tests/test_getpy_enroll.py -k 'TestEnrollAgainstRealSystem or registered_enroll_lane' -q"]
budget = "20m"
