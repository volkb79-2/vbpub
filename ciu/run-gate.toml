# =============================================================================
# ciu project gate lanes — parsed ONLY by run-gate.py (one parser, D-110).
# Environment facts come from the CENTRAL vbpub-root run-gate.toml (nearest
# ancestor); judgment policy lives in assay.toml [lanes.ciu] (R0+R1: the full
# run-ciu-tests.py suite, 100% line AND branch floor). This file is the SSOT
# for how ciu's gate runs; consumers point at `./run-gate.py ciu`.
# See run-gate-project/SPEC.md.
# =============================================================================
schema_version = 1

[lanes.ciu]
kind = "assay"
assay_lane = "ciu"                  # -> assay.toml [lanes.ciu]
environment = "tester-unified"
assay_command = ["/opt/tester-venv/bin/python", "tools/assay/assay-5.2.0.pyz"]
budget = "30m"

# Re-pinned 3.2.0 -> 5.2.0 on 2026-09-08 via `cmru tool-deps --refresh assay`
# (ciu now declares assay as a cmru.toml tool_dependency for the first time --
# it and nyxloom previously pinned a zipapp here with nothing tracking its
# freshness at all, three majors stale by the time this was found). KI-27:
# --refresh does not itself rewrite this file's own pin/argv -- manual
# follow-up here, same recurring gap as cmru's own project.
[lanes.ciu.pins.assay]
version = "5.2.0"
sha256 = "tools/assay/assay-5.2.0.pyz.sha256"
