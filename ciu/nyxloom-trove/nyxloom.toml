[project]
id = "ciu"
default_branch = "main"

trove = "nyxloom-trove"

handoff_globs   = ["nyxloom-trove/handoffs/*.md"]
reports_dir     = "nyxloom-trove/reports"
decisions_inbox = "nyxloom-trove/decisions.md"
archive_dir     = "nyxloom-trove/archive"
archive_keep_visible = 10
agent_logs      = "nyxloom-trove/agent-logs"

worktree_root = "../.worktrees"

[refs]
readme = "README.md"
spec = "docs/SPEC.md"
architecture = "docs/ARCHITECTURE.md"
configuration = "docs/CONFIG.md"
docs_dir = "docs"

# CIU's implementation gate is intentionally not the interactive cockpit.  It
# runs inside tester-unified and is judged by the RELEASED Assay CLI — a
# hash-pinned, vendored zipapp (tools/assay/assay-3.2.0.pyz + .sha256),
# verified by sha256sum before use and invoked explicitly; Assay source is
# never imported and no nyxloom evidence-judgment command remains.
#
# The lane (assay.toml) runs CIU's full suite under pytest-cov (whole-source
# 100% line AND branch via run-ciu-tests.py) inside Assay's isolated snapshot,
# and Assay itself judges the changed-line floor on base..HEAD plus the
# coverage artifact (R1). The verdict is retained at .assay/verdict-ciu.json
# in the bound worktree (gitignored) as review evidence.
#
# Cgroup (estate doctrine): the gate resolves the container slice ONLY from
# $CGROUP_PARENT_DEV_BACKGROUND (no literal, no fallback — absent is a hard
# error). The LoadState=loaded pre-check runs ONLY where systemd is actually
# reachable ([ -d /run/systemd/system ] — measured at checkpoint review: the
# devcontainer ships a systemctl SHIM that exits 0 with advisory stdout, so an
# unconditional check can never pass in any containerized gate context; there
# the trusted source is devcontainer.json per S18.3). The var is ALSO passed
# INTO the container (-e): the four governance tests read it ambiently (S15.2)
# and the lane env_passthrough can only pass through what exists — measured at
# review: the image does not bake it, so without -e the suite reds. The assay
# job's own exit status is the gate's final status (no wrapper/pipe masking).
#
# Manual reproduction of this gate: see vbpub AGENTS.md "Manual tester-unified
# gate runs — the four traps" (cgroup env passthrough, dual-path mount for
# worktree gitfiles, safe.directory, detached run form) and the checkpoint-A
# review record in nyxloom-trove/reports/.
[gates.tester-unified]
# SSOT pointer (D-110/D-111): all test definitions live in ciu/run-gate.toml;
# this entry owns only scheduling policy. run-gate resolves the slice from
# $CGROUP_PARENT_DEV_BACKGROUND, dual-mounts the repo, and runs the pinned
# assay lane (assay.toml [lanes.ciu]) in tester-unified.
argv = ["bash", "-c", "cd {worktree}/ciu && exec ./run-gate.py --worktree {worktree} ciu"]
phase = "implementation"
asserts = ["tests-pass", "changed-line-coverage", "canary-verified", "assay-verdict"]
timeout_seconds = 1800
environment = "tester-unified"

[policy]
max_active_tasks = 3
ready_queue_target = 5
max_attempts_per_task = 3
merge_mode = "manual"
retention_days = 60
reconcile_interval_seconds = 30
gate_verify_interval_days = 14
http_port = 8942

[notify]
