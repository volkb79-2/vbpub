# CIU's implementation gate claim (P07 — Assay-backed qualification).
#
# The lane invokes pytest directly, with argv kept byte-for-byte aligned to
# run-ciu-tests.py's shared pytest_args() helper. The full suite runs under
# pytest-cov with a 100% line AND branch floor and emits coverage.json. Direct
# invocation is intentional: Assay's argv contract can then require R2
# liveness instead of silently disabling it behind a wrapper.
# tester-unified supplies the environment; the selected-worktree assay source
# is installed by run-gate and is the Assay CLI boundary; no consumer-owned
# artifact is imported and no nyxloom evidence-judgment command remains in the
# gate (see nyxloom.toml).
#
# snapshot_selection = "repository-minus-unsafe-symlinks": this monorepo
# tracks exactly three security-fixture symlinks whose targets are absolute
# (topos), and they are declared verbatim below (CONSUMERS.md "A monorepo
# lane"). A NEW unsafe symlink anywhere in the repo reds this lane until its
# owner declares it here or untracks it — fail-closed, by design.
schema_version = 2

# Lane `ciu` = the async R2 mutation lane (needs run-gate.toml's
# resource_observer = "cgprofile" + resources.pids because every native R2
# candidate is judged against observed CANDIDATE resource-limit counters --
# see the [lanes.ciu.judge.mutation] comment below, which also says which
# part of that is liveness's own and which is not).
# Lane `ciu-gate` (further down) = the release gate R0/R1/R3 without mutation.
[lanes.ciu]
scope = "S1"
rigor = ["R0", "R1", "R2", "R3"]
enforcement = "gate"
argv = [
  "/opt/tester-venv/bin/python", "-m", "pytest", "tests",
  "--cov=ciu", "-n", "0", "--dist", "loadfile", "--cov-branch",
  "--cov-report=term-missing", "--cov-report=json:coverage.json",
  "--cov-fail-under=100", "--maxfail=1", "-rs",
]
# Assay's Git boundary pins resource-affecting Git options for every child.
# Keep the full suite in one process in the mutation container: mutation
# already runs one candidate at a time, and even one xdist worker adds a child
# process while snapshots are being materialized. `0` retains the same tests
# and 100% line+branch floor without that extra process. --maxfail=1 lets an
# R2 mutant's first failure terminate that candidate before later tests can
# cascade into resource/lock failures; passing full-suite runs still execute
# every test.
# cmru/worktree sources are on PYTHONPATH (W1-CIU-ENROLL review fix) so the
# get.py drift guard and render tests (test_ciu_host_enroll.py, test_getpy_enroll.py)
# can import cmru and FAIL, not skip, when it is missing. cli-extended is NOT on the
# path (AC-25): the tester image installs the released wheel, which is what ciu
# declares (`cli-extended>=0.5.0`) and what the lane must test against. The CLI
# resolves its version from a stand-in dist-info that tests/conftest.py provides
# (the image installs cli-extended but not ciu). Coverage stays scoped to ciu
# (--cov=ciu above; source_roots = ["src"] below).
env = { PYTHONPATH = "src:../cmru/src:../libraries/worktree/src", PYTHONDONTWRITEBYTECODE = "1" }
# The suite genuinely reads these from the ambient environment: the four
# governance tests read CGROUP_PARENT_DEV_BACKGROUND by design (S15.2), xdist
# worker spawn + git/ssh detection need PATH, and HOME is required for tests
# that write ~/.config / ~/.cache. Stripping them (env_passthrough = []) reds
# the lane; passing them keeps the run hermetic (everything else is dropped).
env_passthrough = ["CGROUP_PARENT_DEV_BACKGROUND", "HOME", "PATH", "TERM", "LANG"]
budget = "8h"
allow_argv_append = false

[lanes.ciu.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

# base = "main" (2026-09-11, corrected from "origin/main"): same fix and
# same reasoning as nyxloom/assay.toml's tester-unified lane (see that
# file's comment for the full mechanism). assay's resolve_base() always
# computes merge-base(base, HEAD), so a stale remote-tracking ref (origin
# drifted behind local main under the standing "not pushed, flagged
# separately" policy) silently widens the R1 changed-line floor to the
# whole accumulated local backlog instead of the current worktree's own
# diff. "main" self-updates via merge-base and needs no re-pinning.
[lanes.ciu.judge]
language = "python"
source_roots = ["src"]
fail_under = 100.0
allow_excluded = false
require_branch = true
# 2026-11-05: base_source = "request" replaces base = "main". A release R2
# campaign run from a checkout at the commit being released had an EMPTY plan
# with base = "main" (merge-base(main, HEAD) == HEAD). The comparison base is
# now delegated to run-gate: `run-gate --base <ref> ciu` (a release campaign
# passes the previous release tag, e.g. --base ciu-v7.19.0). Without --base
# run-gate falls back to the ciu-recorded worktree fork point, then @{upstream}
# (RG-51), i.e. the same "diff of this worktree" meaning base = "main" had.
base_source = "request"

[lanes.ciu.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.ciu.judge.mutation]
# 2026-11-11 host pilot on a four-core runner: three workers raised throughput
# from 0.41 to 1.27 candidates/min, with a 0.83 GiB lane-container peak and no
# OOM. Run-Gate requests auto workers and caps the lane at three, leaving one
# core for the host and sampler. Assay <= 12.1.1 includes this setting in judge
# identity, so changing it invalidates finished-candidate state. Assay >=
# 12.2.0 keeps reusable finished records when only resource settings change;
# changed tests, sources, argv, env, or Assay version still invalidate. See
# ../run-gate-project/CONSUMERS.md#native-r2-worker-selection.
jobs_max = 3
max_mutants = 10000
operators = [
  "python:compare-swap",
  "python:boolop-swap",
  "python:bool-const-flip",
  "python:falsy-swap",
]
# `auto` (CIU-235, fixed by review r1 H1 on the controller's 2026-11-26 ruling).
# The bound is DERIVED from the same run's own measurement, never guessed: the
# lane's R0 baseline command wall time, taken once the baseline PASSes and
# before any candidate is submitted (assay/src/assay/mutation.py:2636-2641 calls
# `baseline_wall_seconds` (mutation.py:2121-2134) and
# `auto_budget_per_candidate_seconds` (mutation.py:2136-2153), whose formula is
# `max(3 x baseline, baseline + 60 s)`). It therefore scales with the host the
# lane happens to run on, which a fixed number cannot. The verdict's
# `budget_per_candidate_derived_s` carries the value THIS invocation derived;
# candidates resumed or carried over keep the bound from the run that judged
# them, and the store records that run's resource digest.
#
# Why this lane needs it (CIU-235): this suite measured ~416 s in the baseline of
# run `rgw-ciu-20261125T202211-v1001` (v1001), and a mutant that no test kills
# runs ALL of it, so the old 5m bound cut such a candidate at 302 s and reported
# `BUDGET_EXCEEDED` instead of `survived` -- an adverse bucket that is a
# measurement failure, not a verdict about the tests. At 416 s `auto` derives
# ~1249 s (~21 min), which is above the whole suite on that host and above it by
# construction on a loaded one.
#
# WHAT ENDS A CANDIDATE (assay's behaviour, stated precisely -- review r1 M1):
# liveness ends an idle stall only. `hung` needs an idle window with a flat CPU
# (`idle_hang = idle_for >= bound and not cpu_growing`, liveness.py:2073;
# `hung = resource_trace_complete and (idle_hang or finish_hang)`, :2080) AND a
# complete, pressure-free resource trace -- a truncated trace never certifies a
# hang (:2020-2025), and the idle clock accrues only over intervals whose
# counters are `clear` (:1975-1979). Growing CPU is what PREVENTS `hung`; stdout/
# stderr growth also counts as progress (:2029-2033). So a candidate that keeps
# working -- spinning on CPU, printing without end, blocked under a busy child,
# or under pressure that never clears -- is NOT idle and is never ended by
# liveness. While MORE than the derived bound remains in the lane, the
# per-candidate bound ends it and reports `budget_exceeded`.
# If no more than the derived bound remains in the lane, the lane clock wins;
# on expiry, the candidate is unclassified for resume and the lane ends
# `BUDGET_EXCEEDED`/`LANE_TIMEOUT` (mutation.py:3691-3701, :3838-3850). The
# lane's own `hung` bucket remains available for a genuine idle stall:
# liveness.py:2086-2095 -> runner.py:1840-1843 ReasonCode.CANDIDATE_HUNG ->
# termination.py:80-83 Termination.HUNG -> _R2_BUCKETS "hung", mapped in
# mutation.py:5696-5706, outside `mutation_pct`). That bound is a WALL CLOCK, and
# it is the interim: assay's CPU-seconds-without-progress bound is design P4
# (docs/design/no-time-budgets/DESIGN.md S7.1) and replaces it when it ships.
#
# The cgroup observer (run-gate.toml `resource_observer = "cgprofile"`,
# `resources.pids`) is required for the CANDIDATE RESOURCE-LIMIT evidence every
# native R2 candidate is judged against (mutation.py:3504-3505 calls
# `_read_candidate_resource_counters`, mutation.py:1704-1721, and
# mutation_store.py:4608 passes `observation_required=True`), NOT by liveness:
# liveness reads its own procfs sources (/proc/<pid>/cgroup, mountinfo, PSI,
# cpu.stat: assay/src/assay/liveness_resources.py:124-164).
budget_per_candidate = "auto"
liveness = true

[lanes.ciu.judge.canary]
# Import-break proves that the complete declared CIU gate rejects a known-bad
# source snapshot independently of individual test mutations.
mechanism = "import-break"
target = "src/ciu/worktree.py"
# 45m, as on `ciu-gate` below (CIU-235): 20m expired 20 minutes into the
# attempt, after the baseline and during the control run. One attempt runs the
# control and transformed suites; the cited loaded-host baseline measured
# 1108 s for one suite, so the two runs take about 2216 s together.
budget_per_attempt = "45m"

# Release gate (operator 2026-11-05: R0+R1+R3 gate a release; R2 mutation is async on the latest
# release only). Same argv, environment, isolation and judge as [lanes.ciu] minus the R2 mutation
# sweep, which stays on lane `ciu` (needs the cgroup observer). Run it as
# `run-gate --base <previous release tag or main> ciu-gate`.
[lanes.ciu-gate]
# No --maxfail: this lane has no R2 mutants to cut short, and fail-fast can leave coverage.json
# incomplete (assay warning), hiding the full set of failures and uncovered lines.
scope = "S1"
rigor = ["R0", "R1", "R3"]
enforcement = "gate"
argv = [
  "/opt/tester-venv/bin/python", "-m", "pytest", "tests",
  "--cov=ciu", "-n", "0", "--dist", "loadfile", "--cov-branch",
  "--cov-report=term-missing", "--cov-report=json:coverage.json",
  "--cov-fail-under=100", "-rs",
]
env = { PYTHONPATH = "src:../cmru/src:../libraries/worktree/src", PYTHONDONTWRITEBYTECODE = "1" }
env_passthrough = ["CGROUP_PARENT_DEV_BACKGROUND", "HOME", "PATH", "TERM", "LANG"]
# Baseline plus one import-break canary attempt (control run of the full suite + the fast-fail run).
budget = "90m"
allow_argv_append = false

[lanes.ciu-gate.isolation]
snapshot_selection = "repository-minus-unsafe-symlinks"
unsafe_symlink_omissions = [
  "topos/tests/fixtures/inspect_files/_danger/passwd_link",
  "topos/tests/fixtures/inspect_files/cgroup_escape/system.slice/ssh.service/dangerous_link/passwd_escape",
  "topos/tests/fixtures/inspect_files/cgroup_nonreg/system.slice/ssh.service/memory.current",
]

[lanes.ciu-gate.judge]
language = "python"
source_roots = ["src"]
fail_under = 100.0
allow_excluded = false
require_branch = true
base_source = "request"

[lanes.ciu-gate.judge.coverage]
format = "coverage-py-json"
artifact = "coverage.json"

[lanes.ciu-gate.judge.canary]
mechanism = "import-break"
target = "src/ciu/worktree.py"
# 45m (CIU-235 review r1): 20m expired 20 minutes into the attempt, after its
# baseline and during the canary control run. Run
# `rgw-ciu-gate-20261125T222402-v1001` (lane
# `ciu-gate`, head d5b83200a) ended BUDGET_EXCEEDED/LANE_TIMEOUT (exit 4) with the
# R3 attempt recorded `not_attempted`/`budget_exhausted`, because the coverage
# baseline ALONE took 1108 s there (its `command_started`/`command_finished` pair
# in `progress-ciu-gate.jsonl`; it is ~416 s on an unloaded host). One attempt =
# control snapshot + control run + transform snapshot + transformed run
# (assay/src/assay/canary.py:723-746), i.e. two whole-suite runs, so the bound
# must cover two loaded-host baselines. 45m does that and still fits the lane's
# own 90m `budget` below (run-gate's 100m outer `budget` is the 90m + 10m margin;
# `run-gate lanes --check` reports 0 findings).
budget_per_attempt = "45m"
