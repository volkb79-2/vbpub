# infra-global/registry-lightweight/ciu.stack.toml — v8 notation (plain TOML, draft.3)
# Realization `registry_lightweight` (bound by ciu.toml [realization.registry_lightweight])
# = the `registry` LogicalService. Services:
#   init       one-shot: data-dir ownership (root:docker), then exits 0
#   registry   PRIMARY: the registry itself (distribution v3)
#   ui         joxit web UI
#   tls_proxy  nginx TLS termination for standalone external access (host-published)
# DERIVED, never written here: the identities (dstdns-<instance>-registry-lightweight-<svc>),
# sibling addresses (identity.hostname), depends_on conditions, the docker gid
# (host.docker_gid), the config-DIRECTORY mount of the rendered nginx config.
# Gone: the [ports] table (endpoints now), version/ui_version (folded into the
# image tags), the REGISTRY__ENABLE_TLS env override (`enabled` on tls_proxy — a
# bool or a [project.control] flag name, no expressions, S6.7.1), and the
# hook-rendered nginx-tls.conf (a config file rendered by ciu, S6.9).

[ciu_stack.init]
image = "registry:2"
one_shot = true

[ciu_stack.registry]
image = "registry:3"
primary = true
depends_on = ["init"]
endpoints.registry = { port = 5000, protocol = "http" }    # instance-only; the TLS proxy / reverse proxy front it
[ciu_stack.registry.hostdir]
data = ""
auth = ""                            # the pre_compose hook writes htpasswd here (the resolved path is in its context); mounted read-only at /auth
[ciu_stack.registry.settings]
proxy_enabled = false                # pull-through cache mode
proxy_use_credentials = false
proxy_remoteurl = ""
auth_enabled = true                  # local htpasswd, generated by pre_compose_hook.py from the auth_password secret
auth_username = ""                   # "" → the hook's default (admin)
config_file = ""                     # optional registry config.yml to mount (absolute host path)
# registry_http_secret: `generate` with the default local store (S10.1), minted
# once into ciu.secrets.toml. Docker Hub credentials for the pull-through cache:
# `ask` sources, read by the template only when proxy_enabled AND
# proxy_use_credentials — a site that keeps the cache off may add
# `enabled = false` to both (S10.2: neither materialized nor prompted for).
[ciu_stack.registry.secrets]
registry_http_secret = { from = "generate", delivery = "env", env_name = "REGISTRY_LIGHTWEIGHT_SECRETS_REGISTRY_HTTP_SECRET" }
dockerhub_username   = { from = "ask", var = "DOCKERHUB_USERNAME", delivery = "env", env_name = "REGISTRY_LIGHTWEIGHT_SECRETS_DOCKERHUB_USERNAME" }
dockerhub_password   = { from = "ask", var = "DOCKERHUB_PASSWORD", delivery = "env", env_name = "REGISTRY_LIGHTWEIGHT_SECRETS_DOCKERHUB_PASSWORD" }

[ciu_stack.ui]
image = "joxit/docker-registry-ui:latest"
depends_on = ["registry"]
endpoints.ui = { port = 80, protocol = "http", path = "/registry-ui" }   # `path`: the prefix the reverse proxy fronts it under (publish = "proxy") once its enable_registry feature is on
[ciu_stack.ui.settings]
title = ""
delete_images = "true"
show_content_digest = "true"
show_catalog_nb_tags = "true"

[ciu_stack.tls_proxy]
image = "nginx:alpine"
enabled = true                       # standalone mode; behind the main reverse proxy (integrated mode) switch it off — ciu drops its block from the rendered compose (S6.7.1)
depends_on = ["registry", "ui"]
endpoints.tls = { port = 443, protocol = "https", publish = "host", host_port = 5443 }
[ciu_stack.tls_proxy.tls]
self_signed = true                   # false = mount /etc/letsencrypt (its live/ symlinks resolve inside the container)
# Certificate material for the public FQDN would be host-scoped ([hosts.<h>.secrets],
# consumed through from = "host", S10.4) — same note as infra-global/reverse-proxy.
# nginx-tls.conf.j2 is rendered by ciu with the compose context (sibling
# identities + endpoint ports, host.fqdn) to ciu.rendered/tls_proxy/etc/nginx/ciu/nginx.conf;
# the PARENT directory /etc/nginx/ciu is mounted read-only (S6.9.1) — deliberately
# a subdirectory: mounting /etc/nginx itself would hide the image's mime.types,
# so the compose command starts nginx with -c on the rendered file.
[ciu_stack.tls_proxy.configfile.nginx]
template = "nginx-tls.conf.j2"
target = "/etc/nginx/ciu/nginx.conf"

# Stack-level, hook-delivered (S10.2.5): the pre_compose hook reads it from its
# context (ctx.secrets["auth_password"]) to write htpasswd into the auth hostdir,
# which `registry` mounts — not one service's secret.
[ciu_stack.secrets]
auth_password = { from = "generate", delivery = "hook" }

[hooks]
# local_secrets_hook: a no-op kept to show a shared script outside the stack dir
# (paths are relative to the stack directory; a missing script aborts the run, S12.1);
# pre_compose_hook: writes htpasswd (bcrypt) from the hook-delivered auth_password;
# post_compose_registry: waits for the registry (ciu.hookkit wait_http, S12.5), checks the catalog, optional push/pull test.
pre_compose = ["../../scripts/ciu/hooks/local_secrets_hook.py", "./pre_compose_hook.py"]
post_compose = ["./post_compose_registry.py"]
