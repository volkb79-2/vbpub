# applications/worker-io/ciu.stack.toml — v8 notation (plain TOML, draft.3)
# Realization `worker_io` (bound by ciu.toml [realization.worker_io]): ONE
# service `worker` with `instances = 2`. The hand-declared worker-io-1/-2
# services are gone — ciu derives dstdns-<instance>-worker-io-worker-1/-2 and
# hands the compose template the replica identities (identity.replicas, S6.5 —
# a render fact; a stack file is plain data and cannot read `ciu_stack`). Also
# DERIVED, never written here: every peer address (the bindings below — the
# rev-2 [settings]/[redis]/[consul]/[tracing] mapping tables and the [workflow]
# copy are gone: config.toml.j2 reads ciu_stack.worker.binds.<local>.* and the
# [workflow] user table directly, S3.5.1), the instance id, the vault edge and
# the minter edges (from the secrets, S8.3 — internal_dlq_token → controller,
# the rest → db_core / redis_core / consul_server), the wave. D-095 still holds:
# ciu keeps PHYSICAL facts only — app tunables live in
# applications/worker-io/config.defaults.toml.

[ciu_stack.worker]
image = "dstdns/worker-io:latest"    # <project.registry.namespace>/worker-io — a literal in plain TOML; `ciu build` tags exactly this
instances = 2
endpoints.http = { port = 8080, protocol = "http" }    # /health; instance network only
# No `requires`: every dependency carries data (a binding below); the vault edge
# derives from the secrets (S8.3).

# Bindings (S6.4): `template` delivery = the resolution is bound as
# ciu_stack.worker.binds.<local> for config.toml.j2 (rendered once per replica)
# and the compose template. Default wait = "healthy" (was an init edge);
# wait = "none" = a resolution only, read at run time (no ordering edge, S8.2).
[ciu_stack.worker.binds.redis]
to = "redis.redis"
delivery = "template"                # compose env REDIS_HOST/REDIS_PORT AND config.toml.j2 read it — an env-delivered binding is invisible to templates (S3.5.4)

[ciu_stack.worker.binds.consul]
to = "consul.http"
delivery = "template"                # config.toml.j2: [consul] address = .url

[ciu_stack.worker.binds.controller]
to = "controller.http"
delivery = "template"                # config.toml.j2: [settings] controller_url = .url. Default wait: the DLQ token minted there must exist (that minter edge is derived, S8.3) and the API must answer before this wave

[ciu_stack.worker.binds.object_store]
to = "object_store.s3"
delivery = "template"                # config.toml.j2: [minio] endpoint = host:port
facts = ["minio:user/worker-io"]     # created by db_core's post_compose hook ([registry.minio.users.worker_io])

[ciu_stack.worker.binds.tracing]
to = "tracing.grpc"
wait = "none"
delivery = "template"                # compose: SW_AGENT_COLLECTOR_BACKEND_SERVICES = host:port for the native agent

[ciu_stack.worker.hostdir]
logs = ""
cache = ""

[ciu_stack.worker.vantage]           # consumer data (was [worker_io.identity] — `identity` is the DERIVED table, S6.2.2)
# Per-vantage geo zone label (GeoDNS multi-vantage, r1). "" = unlabelled
# single-vantage default; per-instance overrides go in ciu.instance.toml
# ([realization.worker_io.services.worker.vantage] geo_zone = "…", S3.1.3).
# Consumed by config.toml.j2 -> [settings.defaults.identity].
geo_zone = ""

[ciu_stack.worker.minio]             # consumer data; endpoint = binds.object_store; bucket "<instance.project>-<instance.id>", repo name and instance id come from instance.* in config.toml.j2
secure = false
prefix = "screenshots"

# D-105 Q3: the SSRF baseline is security policy in the app's L0; ciu carries
# only this deployment's deltas. Retuning is a re-render + restart, deliberately.
[ciu_stack.worker.ssrf]
extra_blocked_networks = []
allowed_networks = []
allowed_schemes = ["http", "https"]

[ciu_stack.worker.worker_execution]
max_in_flight = 20
max_per_run = 10
max_per_resource_class = 15
operation_resource_classes = { echo = "egress", query_domain_dns = "egress", scan_web_server = "egress", analyze_web_content = "egress", discover_dns_servers = "egress", test_dns_servers = "egress" }

# Secrets: structured sources (S10.1); `delivery` is mandatory. env kept from
# the originals' expose_env (restart-bound; ciu check lists them); the compose
# template references every one of them as ${env_name} (S10.2.2). One secret,
# one delivery: a value the config file should render instead would be
# `delivery = "configfile"` + secret("<key>") in config.toml.j2 (S10.2.6).
# internal_dlq_token is READ here (`from = "vault"`); controller's generated
# secret provides vault:secret/internal/internal_dlq_token, which is where the
# derived minter edge points (S8.3).
[ciu_stack.worker.secrets]
redis_password     = { from = "vault", path = "redis_password",             delivery = "env", env_name = "WORKER_IO_REDIS_PASSWORD" }
consul_token       = { from = "vault", path = "consul_worker_io_token",      delivery = "env", env_name = "WORKER_IO_CONSUL_TOKEN" }
internal_dlq_token = { from = "vault", path = "internal_dlq_token",         delivery = "env", env_name = "WORKER_IO_SECRETS_INTERNAL_DLQ_TOKEN" }
minio_access_key   = { from = "vault", path = "minio_worker_io_access_key", delivery = "env", env_name = "WORKER_IO_MINIO_ACCESS_KEY" }
minio_secret_key   = { from = "vault", path = "minio_worker_io_secret_key", delivery = "env", env_name = "WORKER_IO_MINIO_SECRET_KEY" }

[ciu_stack.worker.configfile.app]    # declared ONCE; ciu renders it per replica into ciu.rendered/worker-<k>/… with `replica` bound (S6.9.4); the PARENT directory /etc/worker-io is mounted read-only (S6.9.1)
template = "config.toml.j2"
target = "/etc/worker-io/config.toml"

[hooks]
pre_compose = []
post_compose = []
