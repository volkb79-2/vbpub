# ciu.hosts.toml — host inventory (gitignored; plain TOML; secrets as structured
# sources, values never stored here). Declared ONCE; layouts in ciu.toml place
# bundles on these names. Every host lists one address per network it sits on;
# binding resolution picks the first network in the consumer host's `reach`
# that both hosts share. There is no built-in `localhost`: `ciu init` writes it.
#
# Inventory source: hosts-avail.md (netcup VPS). r12 is listed there with an
# incomplete row and is deliberately not declared.

[hosts.localhost]
local = true                                   # the machine running ciu (devcontainer/laptop); no SSH facts
fqdn = "gstammtisch.dchive.de"                 # DECLARED, not detected (S7.2, R-16): the devcontainer runs on gstammtisch
[hosts.localhost.secrets]                      # the `local` layout places the edge bundle here too: reverse_proxy's `from = "host"`
tls_cert_pem = { from = "file", path = "/home/vb/.config/ciu/dev-tls/fullchain.pem" }   # secrets need both entries on EVERY host the stack lands on (S10.1.3);
tls_key_pem  = { from = "file", path = "/home/vb/.config/ciu/dev-tls/privkey.pem" }     # a self-signed dev pair — path recorded, value never stored (S10.1)

[hosts.gstammtisch]                            # 8 cores / 16 GB — core, db, identity, worker-db
fqdn = "gstammtisch.dchive.de"
ssh_host = "gstammtisch.dchive.de"
ssh_user = "ops"
ssh_port = 22
ssh_key = "~/.ssh/ciu_deploy_ed25519"
known_host = "gstammtisch.dchive.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI<redacted-demo>"
bundle_dir = "/opt/ciu"                        # holds releases/, candidate, current, previous (S17.3–S17.4); never the `current` link itself
push_mode = "rsync"
bundle_excludes = [".git", "node_modules", "artifacts"]
[hosts.gstammtisch.addresses]
mesh = "100.64.0.11"                           # tailscale
public = "152.53.179.117"
[hosts.gstammtisch.activate]                   # the conventional commands (S17.4), run inside the candidate release; --host regenerates [ciu.host.generated] for THIS host (S14.2.3)
bootstrap = "ciu instance init --host gstammtisch && ciu check --layout prod3"
apply = "ciu up --layout prod3"
health = "ciu check --live --layout prod3"
# no rollback command: `ciu activate rollback` swaps current/previous and runs the previous release's own apply (S17.4.1, draft.5)

[hosts.rs1002]                                 # 4 cores / 8 GB — apps, worker-io, observability
fqdn = "rs1002.dchive.de"
ssh_host = "rs1002.dchive.de"
ssh_user = "ops"
ssh_key = "~/.ssh/ciu_deploy_ed25519"
known_host = "rs1002.dchive.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI<redacted-demo>"
[hosts.rs1002.addresses]
mesh = "100.64.0.12"
public = "203.0.113.12"
[hosts.rs1002.activate]
bootstrap = "ciu instance init --host rs1002 && ciu check --layout prod3"
apply = "ciu up --layout prod3"
health = "ciu check --live --layout prod3"
# no rollback command: `ciu activate rollback` swaps current/previous and runs the previous release's own apply (S17.4.1, draft.5)

[hosts.tsstammtisch]                           # 4 cores / 4 GB — edge (public ingress), global services
fqdn = "tsstammtisch.dchive.de"
ssh_host = "tsstammtisch.dchive.de"
ssh_user = "ops"
ssh_key = "~/.ssh/ciu_deploy_ed25519"
known_host = "tsstammtisch.dchive.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI<redacted-demo>"
[hosts.tsstammtisch.addresses]
mesh = "100.64.0.13"
public = "203.0.113.13"
[hosts.tsstammtisch.activate]
bootstrap = "ciu instance init --host tsstammtisch && ciu check --layout prod3"
apply = "ciu up --layout prod3"
health = "ciu check --live --layout prod3"
# no rollback command: `ciu activate rollback` swaps current/previous and runs the previous release's own apply (S17.4.1, draft.5)
[hosts.tsstammtisch.secrets]                   # host-scoped: materialized on the CIU host before push, shipped only to THIS host (S10.4, S17.3.1)
tls_cert_pem = { from = "ask", var = "EDGE_TLS_CRT" }   # CIU_SECRET_EDGE_TLS_CRT, else the store, else a prompt
tls_key_pem  = { from = "ask", var = "EDGE_TLS_KEY" }

[hosts.nano1]                                  # 2 cores / 2 GB — in the inventory, placed by no layout yet
fqdn = "nano1.dchive.de"
ssh_host = "nano1.dchive.de"
ssh_user = "ops"
ssh_key = "~/.ssh/ciu_deploy_ed25519"
known_host = "nano1.dchive.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI<redacted-demo>"
[hosts.nano1.addresses]
