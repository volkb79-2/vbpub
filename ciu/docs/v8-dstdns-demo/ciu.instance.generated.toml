# ciu.instance.generated.toml — CIU-OWNED facts of this instance (gitignored; plain
# TOML, not a template; mode 0644). Rewritten WHOLE by ciu: `ciu instance init`
# (identity + host facts), `ciu build` (build facts), the first `ciu up` of a
# layout (that layout's realness record). A hand edit is overwritten without
# notice (S14.2.1).
#
# The split (S14.2): the hand-edited OVERLAY ciu.global.instance.toml.j2 carries
# only what the operator decides for this instance (layout, bundles, label,
# host-port overrides, joins). Everything ciu KNOWS about the instance lives
# here, merged AFTER the overlay (S3.1.1) — so no CIU-owned table is ever
# hand-edited and no operator table is ever machine-rewritten.
#
# The file travels with the bundle on `ciu push`, so instance_id is identical on
# every host of a layout; [ciu.host.generated] is regenerated on each target by
# `ciu instance init --host <h>` (S14.2.3, S17.3.1). This example is the primary
# devcontainer checkout of dstdns.

[ciu.instance.generated]              # instance IDENTITY — identical on every host of a layout
instance_id = "98535c"                # first 6 hex chars of sha256(physical checkout path), S4.1.1

[ciu.host.generated]                  # HOST-LOCAL facts — regenerated per host
name = "localhost"                    # which [deploy.hosts.<h>] this machine is (the `local = true` host without --host)
repo_root = "/workspaces/dstdns"
physical_repo_root = "/home/vb/volkb79-2/dstdns"   # the HOST path the daemon sees (docker-outside-of-docker)
public_fqdn = "gstammtisch.dchive.de" # reverse DNS of the first public-described address, else ""
env_type = "devcontainer"             # devcontainer | native | github-actions
user_uid = 1003
user_gid = 1003
docker_gid = 994

[ciu.instance.build]                  # written by `ciu build` (S18): version, time (+ image digests in a real file)
build_version = "2026.08.30-9f3c1a2"
build_time = "2026-08-30T11:02:41Z"

[ciu.instance.realness.local]         # S9.4: ONE table per layout, written at that layout's first `ciu up`; immutable until `ciu clean --vanilla`
main_db = "live"                      # (a real record lists every LogicalService of the deploy set; the three that carry a choice are shown)
app_schema = "live"
probe_targets = "simulated"           # this instance runs the mock DNS/HTTP targets, not the internet
