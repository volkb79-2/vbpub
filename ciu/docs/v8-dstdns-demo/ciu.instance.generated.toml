# ciu.instance.generated.toml — CIU-OWNED facts of this instance that are true on EVERY host of
# a layout (gitignored; plain TOML; mode 0644). Rewritten WHOLE by ciu: `ciu instance init`
# (identity + owner token), `ciu build` (build facts). A hand edit is overwritten without notice
# (S14.2.1). Since draft.6 it holds NOTHING host-local: host facts live in ciu.host.toml in the
# state root (S2.6, S14.2), and the per-layout realness record lives in ciu.instance.json (S9.4) —
# so this file travels with a release unchanged and the release stays byte-identical to its
# manifest for life (S17.3.1, round-3 T3-02).
#
# The split (S14.2): the operator's ciu.instance.toml carries only what the operator decides
# (layout, bundles, label, host-port overrides, joins); this file carries what ciu KNOWS about the
# instance as a whole; ciu.host.toml carries what ciu knows about THIS machine. This example is the
# primary devcontainer checkout of dstdns.

[ciu.instance.generated]              # instance IDENTITY — identical on every host of a layout
instance_id = "98535c"                # first 6 hex chars of sha256(physical checkout path), S4.1.1
owner_id = "3f9c2a7e8b1d4c5f6a0e9d8c7b6a5f4e"   # 128-bit owner token, generated once (S4.1.1); stamped on every resource as ciu.owner;
                                      # a collision mark, not a proof of a move — moves are cold (S4.1.2)

[ciu.instance.build]                  # written by `ciu build` (S17.6.1): version, time (+ the image map's ids and digests in a real file)
build_version = "2026.09.02-9f3c1a2"
build_time = "2026-09-02T11:02:41Z"
