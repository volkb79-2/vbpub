# examples/ciu.instance.generated.joined.toml — the CIU-OWNED generated file of the
# package worktree whose instance file is examples/ciu.instance.joined.toml.
# Plain TOML, gitignored, rewritten whole by ciu (S14.2.1); merged AFTER that
# file (S3.1.1). The instance file holds the operator's choices (layout, bundles,
# label, the joins); this file holds the worktree's OWN identity (a different
# path hash than the primary's, and its own owner token) and its build facts.
# Its host file (ciu.host.toml in the worktree — its own state root, S2.6) is
# identical to the primary's: same machine. Its realness record — for joined
# services the level the reference ACTUALLY runs (S9.5.2) — is in the worktree's
# ciu.instance.json (`realness.local = { main_db = "live", app_schema = "live",
# probe_targets = "simulated" }`, S9.4), never in this file.

[ciu.instance.generated]
instance_id = "a1b2c3"                # sha256 of the worktree's physical path, not the primary's
owner_id = "9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6"   # its own token (S4.1.1); a `cp -a` of the primary would carry the primary's and be refused (S4.1.2)

[ciu.instance.build]                  # this worktree builds its own app images (`ciu build` here, not in the primary)
build_version = "2026.09.02-4d1e77b"
build_time = "2026-09-02T13:40:05Z"
