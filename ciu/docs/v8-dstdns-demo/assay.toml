# assay.toml — judge lane policy (assay lane schema v2; assay's own file, unchanged
# in shape by CIU v8). Excerpt: four of dstdns's 25 lanes. What v8 changed on the
# CIU side: (1) ciu never parses this file — it asks `assay lanes --json` for lane
# names, base_source, external_tools, argv0 and env_required (S16.7.1); (2) a lane
# that delegates its comparison base to the gate (`judge.base_source = "request"`)
# gets --request-base from `ciu gate` without any ciu-side key; (3) infrastructure
# facts arrive as ENVIRONMENT VARIABLES injected by the gate environment's
# `binds` (ciu.toml [testing.environments.clean]), so `required-env:` covers them
# and assay needs no knowledge of ciu's file layout. `derived:` paths stay
# supported (they would target resolved.bindings.env.clean.db.host in
# ciu.resolved.toml) but nothing here uses them any more.
schema_version = 2

[lanes.durable_dlq]
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = ["pytest", "-q", "tests/unit/test_durable_dlq.py", "--cov=libs/common/dlq", "--cov-report=json:artifacts/coverage/durable_dlq.json"]
env_passthrough = ["PATH", "PYTHONPATH"]
budget = "15m"
allow_argv_append = false
[lanes.durable_dlq.isolation]
snapshot_selection = "repository"
[lanes.durable_dlq.judge]
language = "python"
source_roots = ["libs/common/dlq"]
mode = "whole_target"
targets = ["libs/common/dlq/durable.py"]
fail_under = 0.9
allow_excluded = false
[lanes.durable_dlq.judge.coverage]
format = "coverage-py-json"
artifact = "artifacts/coverage/durable_dlq.json"

[lanes.p129_enumeration_cursor]                 # changed-lines judging; base supplied per invocation by the gate
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = ["pytest", "-q", "tests/unit/test_enumeration_cursor.py", "--cov=applications/worker-io/enumeration", "--cov-report=json:artifacts/coverage/p129.json"]
env_passthrough = ["PATH", "PYTHONPATH", "SCHEMA_GATE_PG_IMAGE"]
env_required = ["SCHEMA_GATE_PG_IMAGE"]
budget = "10m"
allow_argv_append = false
[lanes.p129_enumeration_cursor.isolation]
snapshot_selection = "repository"
[lanes.p129_enumeration_cursor.judge]
language = "python"
source_roots = ["applications/worker-io/enumeration"]
mode = "changed_lines"
base_source = "request"                         # never `base = "origin/main"` here: the gate knows the PR
fail_under = 0.8
allow_excluded = false
require_branch = true
[lanes.p129_enumeration_cursor.judge.coverage]
format = "coverage-py-json"
artifact = "artifacts/coverage/p129.json"

[lanes.cw2b_schema]                             # SQL mutation lane against the live database
scope = "S1"
rigor = ["R0", "R2"]
enforcement = "gate"
argv = ["scripts/schema-gate-lane.sh"]
env_passthrough = ["PATH", "POSTGRES_HOST", "POSTGRES_PORT", "SCHEMA_GATE_PG_DUMP"]
env_required = ["POSTGRES_HOST", "POSTGRES_PORT", "SCHEMA_GATE_PG_DUMP"]
[lanes.cw2b_schema.infrastructure]              # facts from the instance — as environment variables the gate environment injects (binds.db, env_prefix = "POSTGRES")
db_host = "required-env:POSTGRES_HOST"
db_port = "required-env:POSTGRES_PORT"
[lanes.cw2b_schema.isolation]
snapshot_selection = "repository"
[lanes.cw2b_schema.judge]
language = "sql"
source_roots = ["infra/db-init/init-scripts"]
mode = "whole_target"
targets = ["infra/db-init/init-scripts/10-schema.sql"]
[lanes.cw2b_schema.judge.mutation]
jobs = 2
max_mutants = 200
operators = ["sql:constraint-drop", "sql:default-swap"]
equivalence_artifact = "artifacts/schema/equivalence.json"

[lanes.ui_unit]                                 # a language-bound lane (javascript, assay >= 3.1.0; B041)
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
# assay's snapshot holds committed objects only — no node_modules. The closure is
# rebuilt OFFLINE from the committed lockfile out of the npm cache the tester
# environment provides (extra_mounts, ciu.toml [testing.environments.tester]);
# --offline and --no-install make a missing package a refusal, never a fetch.
# The `bash -c "cd …"` shape retires with assay B043 (`cwd`).
argv = ["bash", "-c", "npm ci --offline --no-audit --no-fund --prefix applications/webapp-ui-react && npx --no-install --prefix applications/webapp-ui-react vitest run --coverage --root applications/webapp-ui-react"]
env = { npm_config_cache = "/opt/npm-cache", CI = "1" }
env_passthrough = ["PATH", "HOME"]
budget = "15m"
allow_argv_append = false
[lanes.ui_unit.isolation]
snapshot_selection = "repository"
[lanes.ui_unit.judge]
language = "javascript"
source_roots = ["applications/webapp-ui-react/src"]
mode = "changed_lines"
base_source = "request"
fail_under = 100.0
allow_excluded = false
# require_branch stays unset until assay B045 (declared producer) — A-344.
[lanes.ui_unit.judge.coverage]
format = "coverage-istanbul-json"               # vite.config.ts: coverage.provider = 'istanbul', NEVER 'v8' (assay A-346)
artifact = "applications/webapp-ui-react/.assay/coverage-final.json"
