<?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" style="background:#f4f5f8" viewBox="0 0 1180 780" role="img" aria-label="Wave 0: vault alone, the only genuinely self-contained bootstrap. Wave 1: db-core, redis, and consul, each needing vault live to GEN_TO_VAULT their own secrets, an edge none of them declare. Wave 2: db-init and authentik, consuming wave-1 facts; db-init produces the schema but nothing downstream requires it, shown in red as a missing edge. Wave 3: controller, which needs db-init's schema in addition to db-core's roles. Wave 4: worker-io, which requires internal_dlq_token from controller — the edge that broke when both were declared in the same phase, shown highlighted.">
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1b222c"></path>
          </marker>
          <marker id="arrow2-bug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"></path>
          </marker>
          <marker id="arrow2-missing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"></path>
          </marker>
        </defs>

        <text x="20" y="24" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 0 — genuinely self-contained (writes only to its own storage)</text>

        <!-- wave 0 -->
        <rect x="460" y="40" width="260" height="90" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="475" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">vault</text>
        <text x="475" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: vault:secret/vault/</text>
        <text x="475" y="94" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">*/role_id, */secret_id</text>
        <text x="475" y="112" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">operator init + unseal — needs nothing</text>

        <text x="20" y="164" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 1 — each GEN_TO_VAULTs its own secrets; none declares vault as a dependency</text>

        <!-- wave 1 -->
        <rect x="150" y="180" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="165" y="202" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">db_core</text>
        <text x="165" y="220" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: pg:db/dstdns,</text>
        <text x="165" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">pg:role/*, minio:user/*</text>
        <text x="165" y="252" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">GEN_TO_VAULTs its own passwords</text>
        <text x="165" y="266" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">— undeclared: needs vault live first</text>

        <rect x="460" y="180" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="475" y="202" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">redis_stack</text>
        <text x="475" y="220" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: vault:secret/redis/</text>
        <text x="475" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">password</text>
        <text x="475" y="252" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">same undeclared dependency on vault</text>

        <rect x="770" y="180" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="785" y="202" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">consul_stack</text>
        <text x="785" y="220" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: vault:secret/consul/</text>
        <text x="785" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">*/token</text>
        <text x="785" y="252" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">same undeclared dependency on vault</text>

        <text x="20" y="314" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 2 — consume wave-1 facts (docker-stats-exporter: same shape as authentik, minus db_core)</text>

        <!-- wave 2 -->
        <rect x="150" y="330" width="260" height="110" rx="6" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"></rect>
        <text x="165" y="352" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#c0392b">db-init</text>
        <text x="165" y="370" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: pg:schema/dstdns</text>
        <text x="165" y="388" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#c0392b" font-weight="600">no pg:schema/* ref kind yet —</text>
        <text x="165" y="402" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#c0392b" font-weight="600">nothing downstream requires this.</text>
        <text x="165" y="420" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">Ordering today: hand-placed phase +</text>
        <text x="165" y="434" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">a runtime schema_meta poll as backstop.</text>

        <rect x="460" y="330" width="260" height="110" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="475" y="352" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">authentik</text>
        <text x="475" y="370" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: db_core, redis_stack,</text>
        <text x="475" y="384" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">consul_stack (role/password/token)</text>
        <text x="475" y="404" font-family="IBM Plex Mono, monospace" font-size="9" fill="#204f79">own OIDC client bootstrap fetched</text>
        <text x="475" y="418" font-family="IBM Plex Mono, monospace" font-size="9" fill="#204f79">LAZILY by controller/webapp-server at</text>
        <text x="475" y="432" font-family="IBM Plex Mono, monospace" font-size="9" fill="#204f79">call time — checked, not a graph edge.</text>

        <text x="20" y="474" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 3 — needs db-init's schema too, not just db-core's roles (webapp-server, worker-db: same shape)</text>

        <!-- wave 3 -->
        <rect x="310" y="490" width="260" height="110" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.6"></rect>
        <text x="325" y="512" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">controller</text>
        <text x="325" y="530" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: our_vault, our_main_db,</text>
        <text x="325" y="544" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">our_redis, our_consul, pg:schema/dstdns</text>
        <text x="325" y="564" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="325" y="578" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/internal/internal_dlq_token</text>

        <text x="20" y="634" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 4 — depends on a wave-3 stack's own output, not just foundational facts</text>

        <!-- wave 4 -->
        <rect x="310" y="650" width="260" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"></rect>
        <text x="325" y="675" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#c0392b">worker-io</text>
        <text x="325" y="693" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: internal_dlq_token</text>
        <text x="325" y="707" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">(controller), our_redis</text>

        <!-- key edges: wave0 -> wave3 (vault approle) -->
        <path d="M 590 130 C 590 220, 460 350, 440 490" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <text x="470" y="230" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">role_id / secret_id</text>

        <!-- wave1 -> wave2 -->
        <path d="M 280 280 L 280 330" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <text x="290" y="308" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">db+role+ddl_password</text>

        <path d="M 590 280 L 590 330" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <path d="M 900 280 C 780 310, 650 320, 620 330" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>

        <!-- wave1 -> wave3 (controller's direct db_core/redis/consul needs) -->
        <path d="M 320 280 C 350 380, 400 430, 420 490" fill="none" stroke="#b56a2f" stroke-width="1.2" marker-end="url(#arrow2)"></path>
        <path d="M 550 280 C 530 380, 480 430, 460 490" fill="none" stroke="#b56a2f" stroke-width="1.2" marker-end="url(#arrow2)"></path>
        <path d="M 850 280 C 700 400, 550 450, 500 490" fill="none" stroke="#b56a2f" stroke-width="1.2" marker-end="url(#arrow2)"></path>

        <!-- redis to worker-io directly, wave 1 -> wave 4 -->
        <path d="M 720 220 C 1080 320, 1080 550, 570 690" fill="none" stroke="#b56a2f" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#arrow2)"></path>
        <text x="1000" y="500" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">password</text>

        <!-- db-init -> controller: the MISSING edge -->
        <path d="M 380 400 C 420 440, 430 460, 440 490" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow2-missing)"></path>
        <text x="410" y="455" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="700" fill="#c0392b">MISSING</text>

        <!-- controller -> worker-io: THE bug edge -->
        <path d="M 440 600 L 440 650" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow2-bug)"></path>
        <text x="455" y="630" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#c0392b">internal_dlq_token</text>
        <text x="455" y="646" font-family="IBM Plex Mono, monospace" font-size="9" fill="#c0392b">— same phase = unsatisfiable</text>

      </svg>
