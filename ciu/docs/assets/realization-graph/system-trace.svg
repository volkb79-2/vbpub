<?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" style="background:#f4f5f8" viewBox="0 0 1180 620" role="img" aria-label="Wave 0: vault, db-core, redis, and consul stacks are self-sufficient producers. Wave 1: db-init, authentik, controller, and webapp-server each consume wave-0 facts to start; db-init produces the schema but nothing in the graph requires it, shown in red as a missing edge. Wave 2: worker-io, which requires internal_dlq_token from controller — the one edge that broke when both were declared in the same phase, shown highlighted.">
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1b222c"></path>
          </marker>
          <marker id="arrow2-bug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"></path>
          </marker>
        </defs>

        <text x="20" y="24" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 0 — self-sufficient (generate their own credentials)</text>

        <!-- wave 0 -->
        <rect x="20" y="40" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="35" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">vault_stack</text>
        <text x="35" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="35" y="94" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/vault/*/role_id,</text>
        <text x="35" y="108" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">secret_id</text>

        <rect x="310" y="40" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="325" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">db_core</text>
        <text x="325" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="325" y="94" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">pg:db/dstdns, pg:role/*,</text>
        <text x="325" y="108" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">minio:user/*, vault:secret/db/*</text>

        <rect x="600" y="40" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="615" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">redis_stack</text>
        <text x="615" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="615" y="94" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/redis/password</text>

        <rect x="890" y="40" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="905" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">consul_stack</text>
        <text x="905" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="905" y="94" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/consul/*/token</text>

        <text x="20" y="240" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 1 — need wave 0's facts to start; none needs a dedicated init job of their own</text>

        <!-- wave 1 -->
        <rect x="20" y="260" width="260" height="120" rx="6" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"></rect>
        <text x="35" y="282" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#c0392b">db-init</text>
        <text x="35" y="300" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: pg:schema/dstdns</text>
        <text x="35" y="318" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#c0392b" font-weight="600">no pg:schema/* ref kind yet —</text>
        <text x="35" y="332" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#c0392b" font-weight="600">nothing downstream requires this.</text>
        <text x="35" y="350" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#4a5361">Ordering today: hand-placed phase +</text>
        <text x="35" y="364" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#4a5361">a runtime schema_meta poll as backstop.</text>

        <rect x="310" y="260" width="260" height="120" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="325" y="282" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">authentik</text>
        <text x="325" y="300" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: same 3 producers</text>
        <text x="325" y="314" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">as controller →</text>
        <text x="325" y="336" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#204f79">own OIDC client bootstrap fetched</text>
        <text x="325" y="350" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#204f79">LAZILY by controller/webapp-server at</text>
        <text x="325" y="364" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#204f79">call time — checked, not a graph edge.</text>

        <rect x="600" y="260" width="260" height="120" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.6"></rect>
        <text x="615" y="282" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">controller</text>
        <text x="615" y="300" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: our_vault, our_main_db,</text>
        <text x="615" y="314" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">our_redis, our_consul</text>
        <text x="615" y="336" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="615" y="350" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/internal/internal_dlq_token</text>

        <rect x="890" y="260" width="260" height="120" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="905" y="282" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">webapp-server</text>
        <text x="905" y="300" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: same 3 producers</text>
        <text x="905" y="314" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">as controller, plus our_vault</text>

        <text x="20" y="490" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 2 — depends on something a wave-1 stack produces, not just wave 0</text>

        <!-- wave 2 -->
        <rect x="600" y="510" width="260" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"></rect>
        <text x="615" y="535" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#c0392b">worker-io</text>
        <text x="615" y="553" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: internal_dlq_token</text>
        <text x="615" y="567" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">(controller), our_redis</text>

        <!-- key edges -->
        <path d="M 150 140 C 150 200, 700 220, 700 260" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <text x="330" y="210" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">role_id / secret_id</text>

        <path d="M 440 140 L 440 260" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <text x="450" y="205" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">role/password</text>

        <path d="M 400 140 C 300 190, 150 220, 150 260" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>

        <path d="M 730 140 C 730 190, 730 220, 730 260" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>

        <path d="M 1000 140 C 900 190, 770 220, 730 260" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>

        <!-- redis to worker-io directly, wave 0 -> wave 2 -->
        <path d="M 860 100 C 1080 220, 1080 420, 860 555" fill="none" stroke="#b56a2f" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#arrow2)"></path>
        <text x="1000" y="420" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">password</text>

        <!-- controller -> worker-io: THE bug edge -->
        <path d="M 730 380 L 730 510" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow2-bug)"></path>
        <text x="745" y="450" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#c0392b">internal_dlq_token</text>
        <text x="745" y="466" font-family="IBM Plex Mono, monospace" font-size="9" fill="#c0392b">— the edge that broke: same phase = unsatisfiable</text>

      </svg>
