<?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" style="background:#f4f5f8" viewBox="0 0 1180 780" role="img" aria-label="Wave 0: vault alone, the only genuinely self-contained bootstrap, self-declaring stack:infra/vault:healthy. Wave 1: db-core, redis, and consul, each now declaring requires = stack:infra/vault:healthy before GEN_TO_VAULTing their own secrets. Wave 2: db-init, the sole producer of application-facing database facts (role, password, and schema), self-declaring stack:infra/db-init:completed as a stand-in for the still-nonexistent pg:schema ref kind; and docker-stats-exporter, which never touches the database. Wave 3: controller and authentik, both now requiring stack:infra/db-init:completed rather than waiting on db-core directly or trusting phase order alone. Wave 4: worker-io, which requires internal_dlq_token from controller — the edge that broke when both were declared in the same phase, shown highlighted.">
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1b222c"></path>
          </marker>
          <marker id="arrow2-bug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"></path>
          </marker>
          <marker id="arrow2-fixed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"></path>
          </marker>
        </defs>

        <text x="20" y="24" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 0 — genuinely self-contained (writes only to its own storage)</text>

        <!-- wave 0 -->
        <rect x="460" y="40" width="260" height="90" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="475" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">vault</text>
        <text x="475" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: stack:infra/vault:healthy,</text>
        <text x="475" y="94" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/vault/*/role_id, */secret_id</text>
        <text x="475" y="112" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2e7d4f">operator init + unseal — needs nothing</text>

        <text x="20" y="164" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 1 — each now declares requires = [stack:infra/vault:healthy] before GEN_TO_VAULT (dstdns@d1688765)</text>

        <!-- wave 1 -->
        <rect x="150" y="180" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="165" y="202" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">db_core</text>
        <text x="165" y="220" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: pg:db/dstdns (empty),</text>
        <text x="165" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">minio:user/*, admin credentials only</text>
        <text x="165" y="252" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">generic infra — no app roles/passwords</text>
        <text x="165" y="266" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2e7d4f">requires: stack:infra/vault:healthy</text>

        <rect x="460" y="180" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="475" y="202" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">redis_stack</text>
        <text x="475" y="220" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: vault:secret/redis/</text>
        <text x="475" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">password</text>
        <text x="475" y="252" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2e7d4f">requires: stack:infra/vault:healthy</text>

        <rect x="770" y="180" width="260" height="100" rx="6" fill="#f3e6d8" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="785" y="202" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">consul_stack</text>
        <text x="785" y="220" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: vault:secret/consul/</text>
        <text x="785" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">*/token</text>
        <text x="785" y="252" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2e7d4f">requires: stack:infra/vault:healthy</text>

        <text x="20" y="314" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 2 — db-init: the SOLE producer of app-facing DB facts now, not split with db-core</text>

        <!-- wave 2 -->
        <rect x="150" y="330" width="260" height="130" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.6"></rect>
        <text x="165" y="352" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">db-init</text>
        <text x="165" y="370" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides: pg:role/*,</text>
        <text x="165" y="384" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/db/postgres/*_password —</text>
        <text x="165" y="398" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">expressible today, real ciu ref kinds</text>
        <text x="165" y="418" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#2e7d4f" font-weight="600">+ stack:infra/db-init:completed — stands</text>
        <text x="165" y="432" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#2e7d4f" font-weight="600">in for pg:schema/dstdns (no ref kind yet);</text>
        <text x="165" y="446" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#2e7d4f" font-weight="600">self-declared only for CIU-63's static lint.</text>

        <rect x="460" y="330" width="260" height="90" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.4"></rect>
        <text x="475" y="352" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">docker-stats-exporter</text>
        <text x="475" y="370" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: redis_stack,</text>
        <text x="475" y="384" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">consul_stack — never touches the DB</text>
        <text x="475" y="402" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">stays at wave 2, unaffected by the fix</text>

        <text x="20" y="494" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 3 — now require stack:infra/db-init:completed explicitly (webapp-server, worker-db: same shape)</text>

        <!-- wave 3 -->
        <rect x="310" y="510" width="260" height="110" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.6"></rect>
        <text x="325" y="532" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">controller</text>
        <text x="325" y="550" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: our_vault, our_main_db,</text>
        <text x="325" y="564" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#2e7d4f">stack:infra/db-init:completed, our_redis</text>
        <text x="325" y="584" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_provides:</text>
        <text x="325" y="598" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">vault:secret/internal/internal_dlq_token</text>

        <rect x="620" y="510" width="220" height="110" rx="6" fill="#ffffff" stroke="#b56a2f" stroke-width="1.3"></rect>
        <text x="635" y="532" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#8a4f22">authentik</text>
        <text x="635" y="550" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: our_main_db,</text>
        <text x="635" y="564" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#2e7d4f">stack:infra/db-init:completed, our_redis</text>
        <text x="635" y="584" font-family="IBM Plex Mono, monospace" font-size="9" fill="#204f79">own OIDC bootstrap fetched lazily</text>
        <text x="635" y="598" font-family="IBM Plex Mono, monospace" font-size="9" fill="#204f79">by controller — checked, not a graph edge</text>

        <text x="20" y="654" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4a5361">WAVE 4 — depends on a wave-3 stack's own output, not just foundational facts</text>

        <!-- wave 4 -->
        <rect x="310" y="670" width="260" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"></rect>
        <text x="325" y="695" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#c0392b">worker-io</text>
        <text x="325" y="713" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">init_requires: internal_dlq_token</text>
        <text x="325" y="727" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b222c">(controller), our_redis</text>

        <!-- wave0 -> wave1: newly-declared vault-liveness edges (dstdns@d1688765) -->
        <path d="M 520 130 C 400 150, 320 165, 290 180" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#arrow2-fixed)"></path>
        <path d="M 590 130 L 590 180" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#arrow2-fixed)"></path>
        <path d="M 660 130 C 780 150, 860 165, 890 180" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#arrow2-fixed)"></path>
        <text x="595" y="160" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2e7d4f">stack:...:healthy (declared)</text>

        <!-- wave0 -> wave3: vault approle -->
        <path d="M 590 130 C 590 260, 460 400, 440 510" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <text x="470" y="260" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">role_id / secret_id</text>

        <!-- wave1(db_core) -> wave2(db-init): admin access -->
        <path d="M 280 280 L 280 330" fill="none" stroke="#b56a2f" stroke-width="1.3" marker-end="url(#arrow2)"></path>
        <text x="290" y="308" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">admin credentials</text>

        <!-- wave1(redis/consul) -> wave2(docker-stats-exporter) -->
        <path d="M 590 280 C 570 300, 550 315, 560 330" fill="none" stroke="#b56a2f" stroke-width="1.2" marker-end="url(#arrow2)"></path>
        <path d="M 900 280 C 780 310, 650 315, 620 340" fill="none" stroke="#b56a2f" stroke-width="1.2" marker-end="url(#arrow2)"></path>

        <!-- wave2(db-init) -> wave3(controller, authentik): role/password + stack:...:completed, ONE producer now -->
        <path d="M 340 460 C 380 490, 410 495, 420 510" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#arrow2-fixed)"></path>
        <path d="M 340 460 C 500 500, 650 495, 680 510" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#arrow2-fixed)"></path>
        <text x="430" y="480" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2e7d4f">role / password + stack:...:completed (declared)</text>

        <!-- wave1(redis/consul) -> wave3(controller, authentik) -->
        <path d="M 550 280 C 500 400, 460 460, 460 510" fill="none" stroke="#b56a2f" stroke-width="1.1" marker-end="url(#arrow2)"></path>
        <path d="M 850 280 C 750 420, 720 470, 720 510" fill="none" stroke="#b56a2f" stroke-width="1.1" marker-end="url(#arrow2)"></path>

        <!-- redis to worker-io directly, wave 1 -> wave 4 -->
        <path d="M 720 220 C 1080 340, 1080 570, 570 710" fill="none" stroke="#b56a2f" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#arrow2)"></path>
        <text x="1000" y="520" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4a5361">password</text>

        <!-- controller -> worker-io: THE bug edge -->
        <path d="M 440 620 L 440 670" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow2-bug)"></path>
        <text x="455" y="650" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#c0392b">internal_dlq_token</text>
        <text x="455" y="666" font-family="IBM Plex Mono, monospace" font-size="9" fill="#c0392b">— same phase = unsatisfiable</text>

      </svg>
