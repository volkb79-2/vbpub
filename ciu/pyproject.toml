# Build toolchain is pinned exactly so wheel builds are reproducible
# (same toolchain + SOURCE_DATE_EPOCH → identical sha256). See docs/VERSIONING.md.
[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "ciu"
dynamic = ["version"]
description = "CIU — Container Infrastructure Utility (compose · init · up)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
# cli-extended is a REAL wheel dependency (unified-adoption CX-D1), never vendored and
# never put on a path. Floor 0.5.0: the released wheel tester-unified installs; it carries
# register_doctor/register_skills_verbs (doctor + skills groups), CliIdentity.resolve with
# version_probe, VerbSpec(dry_run=...) and the surface lifecycle ciu's CLI is registered with.
# It is published to GitHub Releases only (the bare name is unclaimed on PyPI), so every
# install of ciu MUST be `--no-index --find-links <wheelhouse>` or `--no-deps` after
# installing cli-extended first; get.py hoists cli-extended first (KI-51).
dependencies = [
	"cli-extended>=0.5.0",
	"Jinja2>=3.1.2",
	"PyYAML>=6.0.1",
	"tomli_w>=1.0.0",
]

[project.optional-dependencies]
# tester-unified SoT: ciu's test closure (runtime deps above + pytest)
test = [
    "pytest>=8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    # Property tests exercise path, size, and worktree grammar invariants in
    # the same tester-unified closure as the full branch-coverage gate.
    "hypothesis>=6.140",
    # S5.7: configfile schema validation exercises the real jsonschema
    # library in the test closure; runtime users get it via ciu[schema].
    "jsonschema>=4.18",
    # S13.4b: `ciu check`'s registry stage exercises the real pydantic models
    # in the test closure; runtime users get it via ciu[registry].
    "pydantic>=2",
]
ssh = ["paramiko>=5.0"]
# S5.7: optional runtime extra — schema-validated configfile render (CIU-37).
# jsonschema >= 4.18 for JSON Schema Draft 2020-12 support.
schema = ["jsonschema>=4.18"]
# S13.4b: optional runtime extra — `[registry.*]` schema validation in
# `ciu check` (ciu-P19). pydantic >= 2 for the v2 model API
# (ConfigDict/model_validate/field_validator/StringConstraints).
registry = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src", "../libraries/worktree/src"]

[tool.setuptools.package-dir]
worktree = "../libraries/worktree/src/worktree"

# S15.17 — the KSM shim SOURCE ships with CIU (built on demand into the
# consumer's .ciu/ksm/, never checked in as a binary). Without this the wheel
# installs ciu.ksm but not the .c it compiles, and `ciu ksm build` fails at
# runtime rather than at package time.
# hook_templates/* (ciu-P20) — `ciu init --hooks NAME` copies these files
# into a consumer stack by reading them via importlib.resources, mirroring
# how templates/* already ships `ciu init`'s scaffold templates the same way.
[tool.setuptools.package-data]
# skills/** — the agent skills ship as package data (`ciu skills install`; AC-19).
ciu = ["data/*.c", "templates/*", "hook_templates/*", "skills/**/*"]

# Surface lifecycle (cli-extended AC-16..AC-18): one entry covers every ciu route (the
# delegated groups are mounted on the root registry). Run `cli-extended surface check`
# from ciu/ with the package importable (PYTHONPATH=src or an installed wheel).
[tool.cli-extended]
schema_version = 1

[[tool.cli-extended.clis]]
id = "ciu"
factory = "ciu.cli_registry:build_cli"
review = "docs/cli-review.toml"
manifest = "docs/cli-surface.json"
spec = "docs/SPEC.md"
findings = "docs/cli-review-findings.toml"

# Version is derived from git tags by setuptools-scm (no clock, no manual bump).
# Release = annotated tag `ciu-vX.Y.Z`; untagged commit = `X.Y.(Z+1).devN+g<sha>`.
# ciu MAJOR tracks the SPEC MAJOR (SPEC 5.0.0 → ciu-v5.0.0).
[tool.setuptools_scm]
root = ".."
tag_regex = "^ciu-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "ciu-v*"]
version_file = "src/ciu/_version.py"

[project.scripts]
ciu = "ciu.cli:main"
