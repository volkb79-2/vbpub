# Build toolchain is pinned exactly so wheel builds are reproducible
# (same toolchain + SOURCE_DATE_EPOCH → identical sha256). See docs/VERSIONING.md.
[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0", "setuptools_scm==10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "ciu"
dynamic = ["version"]
description = "CIU — Container Infrastructure Utility (compose · init · up)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Volker Badziong"}]
dependencies = [
	"Jinja2>=3.1.2",
	"PyYAML>=6.0.1",
	"tomli_w>=1.0.0",
]

[project.optional-dependencies]
# tester-unified SoT: ciu's test closure (runtime deps above + pytest)
test = [
    "pytest>=8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    # S5.7: configfile schema validation exercises the real jsonschema
    # library in the test closure; runtime users get it via ciu[schema].
    "jsonschema>=4.18",
]
ssh = ["paramiko>=5.0"]
# S5.7: optional runtime extra — schema-validated configfile render (CIU-37).
# jsonschema >= 4.18 for JSON Schema Draft 2020-12 support.
schema = ["jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

# S15.17 — the KSM shim SOURCE ships with CIU (built on demand into the
# consumer's .ciu/ksm/, never checked in as a binary). Without this the wheel
# installs ciu.ksm but not the .c it compiles, and `ciu ksm build` fails at
# runtime rather than at package time.
[tool.setuptools.package-data]
ciu = ["data/*.c"]

# Version is derived from git tags by setuptools-scm (no clock, no manual bump).
# Release = annotated tag `ciu-vX.Y.Z`; untagged commit = `X.Y.(Z+1).devN+g<sha>`.
# ciu MAJOR tracks the SPEC MAJOR (SPEC 5.0.0 → ciu-v5.0.0).
[tool.setuptools_scm]
root = ".."
tag_regex = "^ciu-v(?P<version>[0-9].*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "ciu-v*"]
version_file = "src/ciu/_version.py"

[project.scripts]
ciu = "ciu.cli:main"
