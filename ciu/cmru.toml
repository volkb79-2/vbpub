schema_version = 1

[github]
owner = "volkb79-2"
repo = "vbpub"
owner_type = "user"

[targets]
host = "github"
registry = ["ghcr.io"]

[env]
CIU_RELEASE_NOTES = "## CIU CLI wheel\n\nRelease history is generated from the project-scoped source range in `CHANGES.md`.\n\n**Install**\n```bash\npython -m pip install ./<wheel-file>\n```"

[project]
id = "ciu"
description = "Compose inventory and update tooling for vbpub deployments."
template_revision = 4
prefix = "ciu-v"
artifacts = ["wheel"]
scm_dist = "ciu"

[project.version]
strategy = "scm"
bump = "conventional"

# S15: a first-party artifact ciu's OWN release gate consumes (run-gate.toml's
# pinned `[lanes.ciu.pins.assay]` zipapp), tracked here so `cmru tool-deps`
# can verify integrity/authenticity/freshness and `--refresh` can re-vendor
# it -- see cmru's own cmru.toml for the pattern this mirrors. KI-27: refresh
# does NOT itself rewrite run-gate.toml's own pin/argv -- that needs a manual
# follow-up edit every time, same as cmru's own project.
[[project.tool_dependencies]]
project = "assay"
version = "6.1.1"
path    = "tools/assay/assay-6.1.1.pyz"
sha256  = "3798a5f74908ec6c60d9089dd1a5015151314a07ce2f84379d117327fd519f6f"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

# S14.7a / CIU-93 — inputs for `cmru get-py --project ciu`, whose rendered
# output is committed at `ciu/get.py` and published as a release asset (see
# [steps.push]'s --extra-asset below). `ciu host enroll` prints
#   https://github.com/<owner>/<repo>/releases/download/ciu-v<version>/get.py
# as the target admin's one-liner, so this table is what makes that URL real.
# NOTE (CIU-99): `asset_suffix`/`wheels` describe the release BUNDLE
# `get.py install` would download. ciu today publishes only a bare wheel
# (`[steps.push]` → cmru wheel-publish), so no `ciu-v<version>.tar.xz` asset
# exists yet and the enroll one-liner's INSTALL half is not reachable until
# that bundle is built; the key-installation half (`enroll --no-install`)
# works now. Filed as CIU-99 rather than silently pretending otherwise.
[project.installer]
install_dir_system = "/opt/ciu"
install_dir_user = "ciu"
asset_suffix = ".tar.xz"
required_commands = ["python3"]
preserve = []
manifest_name = "manifest.json"
signature_name = "manifest.json.minisig"

[[project.installer.wheels]]
path = "vendor/ciu-*.whl"
distribution = "ciu"

[steps.run-tests]
quiet = true
commands = [
  { label = "CIU: tester-unified coverage gate", argv = ["cmru", "tester-gate", "--cwd", ".", "--", "/opt/tester-venv/bin/python", "run-ciu-tests.py"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "CIU: build wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-build", "--cwd", "."], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  # --extra-asset get.py (S14.7a): the enroll one-liner names
  # releases/download/ciu-v<version>/get.py, so the committed installer must
  # ride along on every ciu release as its own asset.
  { label = "CIU: publish wheel", argv = ["python3", "-m", "cmru.handlers", "wheel-publish", "--prefix", "ciu", "--cwd", ".", "--notes-env", "CIU_RELEASE_NOTES", "--extra-asset", "get.py"], cwd = "." },
]
