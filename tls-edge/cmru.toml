schema_version = 1

[runtime]
kind = "none"

[env]
TLS_EDGE_RELEASE_NOTES = "## tls-edge offline installer\n\nEdge proxy and TLS termination (Traefik v3) as a self-contained instance, one bundle per interpreter: `tls-edge-v<ver>-py313.tar.xz` and `-py314`. Install with `get.py install --variant py313`, then configure the instance with the bundled `tls-edge` command and start it as `docs/INSTALL.md` describes.\n\n**Verify** (releases are unsigned: SHA-256 and the in-bundle manifest only)\n```bash\nsha256sum -c tls-edge-v*-py313.tar.xz.sha256\n```"

[project]
id = "tls-edge"
description = "Edge proxy and TLS termination stack."
template_revision = 5
prefix = "tls-edge-v"
artifacts = ["tarball"]

[project.version]
strategy = "file:VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[project.installer]
install_dir_system = "/srv/tls-edge-instance"
install_dir_user = "tls-edge-instance"
asset_suffix = ".tar.xz"
entrypoint = "installer/adapter.py"
required_commands = ["python3", "docker", "git"]
manifest_name = "manifest.json"
signature_name = "manifest.json.minisig"
extensions = ["tools/bundle_contract.py"]
# The bundled ciu (wheel + dependency wheels) runs the stack from <root>/stack/.
launchers = ["ciu", "tls-edge"]
stable_dir = "stack"
stub_launchers = ["ciu"]

# MarkupSafe and PyYAML are platform wheels: one asset per interpreter variant,
# selected at install time with `get.py install --variant py313`.
[[project.variants]]
name = "py313"
build_arg = "PYTHON_VERSION=3.13"
label = "CPython 3.13, x86_64 glibc"

[[project.variants]]
name = "py314"
build_arg = "PYTHON_VERSION=3.14"
label = "CPython 3.14, x86_64 glibc"

[[project.installer.wheels]]
path = "wheels/ciu-*.whl"
distribution = "ciu"

[[project.installer.wheels]]
path = "wheels/jinja2-*.whl"
distribution = "Jinja2"

[[project.installer.wheels]]
path = "wheels/markupsafe-*.whl"
distribution = "MarkupSafe"

[[project.installer.wheels]]
path = "wheels/pyyaml-*.whl"
distribution = "PyYAML"

[[project.installer.wheels]]
path = "wheels/tomli_w-*.whl"
distribution = "tomli_w"

[[project.installer.wheels]]
path = "wheels/tls_edge_cli-*.whl"
distribution = "tls-edge-cli"

[[project.installer.wheels]]
path = "wheels/cli_extended-*.whl"
distribution = "cli-extended"

[[project.installer.wheels]]
path = "wheels/tomlkit-*.whl"
distribution = "tomlkit"

[[project.installer.wheels]]
path = "wheels/questionary-*.whl"
distribution = "questionary"

[[project.installer.wheels]]
path = "wheels/prompt_toolkit-*.whl"
distribution = "prompt-toolkit"

[[project.installer.wheels]]
path = "wheels/wcwidth-*.whl"
distribution = "wcwidth"

[steps.run-tests]
quiet = true
commands = [
  { label = "tls-edge: R0/R1/R3 release gate", argv = ["run-gate", "release-gate"], cwd = "." },
]

[steps.build]
quiet = true
clean_dirs = ["dist"]
required_env = ["TLS_EDGE_VERSION"]
env_command = ["python3", "tools/bundle_wheels.py", "version-env"]
commands = [
  { label = "tls-edge: build one reproducible bundle per interpreter variant", argv = ["cmru", "handler", "bundle-build", "--bundle-config", "bundle.toml", "--cmru-config", "../cmru.orchestration.toml", "--name", "tls-edge", "--variant", "all"], cwd = "." },
  { label = "tls-edge: retain publisher version and installer inputs", argv = ["python3", "tools/bundle_wheels.py", "retain", "dist"], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  # One tarball per interpreter variant, all under the same release tag or none (cmru KI-115).
  # The --variant names and labels repeat [[project.variants]] above; tests/test_release_config.py
  # keeps the two in step. dist/get.py is the installer, published beside the bundles.
  { label = "tls-edge: publish variant bundles", argv = ["cmru", "handler", "tarball-publish", "--prefix", "tls-edge", "--cwd", ".", "--glob", "tls-edge-v*-py*.tar.xz", "--version-file", "dist/VERSION", "--notes-env", "TLS_EDGE_RELEASE_NOTES", "--variant", "py313=CPython 3.13, x86_64 glibc", "--variant", "py314=CPython 3.14, x86_64 glibc", "--extra-asset", "dist/get.py"], cwd = "." },
]

[versions.targets."oci.socket-proxy"]
mode = "single"
constraint = ">=0.5.0"

[versions.targets."oci.socket-proxy".oci]
image = "docker.io/tecnativa/docker-socket-proxy"
tag = "v{version}"

[versions.targets."oci.traefik"]
mode = "single"
constraint = ">=3.7.0,<3.8.0"

[versions.targets."oci.traefik".oci]
image = "docker.io/library/traefik"
tag = "v{version}"
