schema_version = 1

[runtime]
kind = "none"

[env]
TLS_EDGE_RELEASE_NOTES = "## tls-edge offline installer\n\nEdge proxy and TLS termination (Traefik v3) as a self-contained instance, one bundle per interpreter: `tls-edge-v<ver>-py313.tar.xz` and `-py314`. Install with `get.py install --variant py313`, then configure the instance with the bundled `tls-edge` command (see docs/INSTALL.md).\n\nHTTP/3 over QUIC is an optional shared endpoint feature and publishes UDP on the public HTTPS port when enabled. The generic defaults keep it off and keep the Mattermost Calls TCP+UDP preset off; enable only the listeners required by the host. HTTP/1.1 and HTTP/2 remain available over TCP.\n\n**Breaking**: the alternate HTTPS port (9443) is removed; ciu container names are `tls-edge-<id>-traefik` / `-dockerproxy`; Calls media is no longer published by default. Read docs/INSTALL.md section 8 before updating a live edge.\n\n**Verify** (releases are unsigned: SHA-256 and the in-bundle manifest only)\n```bash\nsha256sum -c tls-edge-v*-py313.tar.xz.sha256\n```"

[project]
id = "tls-edge"
description = "Edge proxy and TLS termination stack."
template_revision = 5
prefix = "tls-edge-v"
artifacts = ["tarball"]

[project.version]
strategy = "file:VERSION"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

[project.installer]
install_dir_system = "/srv/tls-edge-instance"
install_dir_user = "tls-edge-instance"
asset_suffix = ".tar.xz"
entrypoint = "installer/adapter.py"
required_commands = ["python3", "docker", "git"]
manifest_name = "manifest.json"
signature_name = "manifest.json.minisig"
# The bundled ciu (wheel + dependency wheels) runs the stack from <root>/stack/.
launchers = ["ciu", "tls-edge"]
stable_dir = "stack"
stub_launchers = ["ciu"]

# MarkupSafe and PyYAML are platform wheels: one asset per interpreter variant,
# selected at install time with `get.py install --variant py313`.
[[project.variants]]
name = "py313"
build_arg = "PYTHON_TAG=cp313"
label = "CPython 3.13, x86_64 glibc"

[[project.variants]]
name = "py314"
build_arg = "PYTHON_TAG=cp314"
label = "CPython 3.14, x86_64 glibc"

[[project.installer.wheels]]
path = "wheels/ciu-*.whl"
distribution = "ciu"

[[project.installer.wheels]]
path = "wheels/jinja2-*.whl"
distribution = "Jinja2"

[[project.installer.wheels]]
path = "wheels/markupsafe-*.whl"
distribution = "MarkupSafe"

[[project.installer.wheels]]
path = "wheels/pyyaml-*.whl"
distribution = "PyYAML"

[[project.installer.wheels]]
path = "wheels/tomli_w-*.whl"
distribution = "tomli_w"

[[project.installer.wheels]]
path = "wheels/tls_edge_cli-*.whl"
distribution = "tls-edge-cli"

[[project.installer.wheels]]
path = "wheels/cli_extended-*.whl"
distribution = "cli-extended"

[[project.installer.wheels]]
path = "wheels/tomlkit-*.whl"
distribution = "tomlkit"

[[project.installer.wheels]]
path = "wheels/questionary-*.whl"
distribution = "questionary"

[[project.installer.wheels]]
path = "wheels/prompt_toolkit-*.whl"
distribution = "prompt-toolkit"

[[project.installer.wheels]]
path = "wheels/wcwidth-*.whl"
distribution = "wcwidth"

[steps.run-tests]
quiet = true
commands = [
  { label = "tls-edge: standalone render validation", argv = ["cmru", "tester-gate", "--cwd", ".", "--", "/opt/tester-venv/bin/python", "scripts/render_standalone.py", "--check", "--defaults-only"], cwd = "." },
  { label = "tls-edge: Calls defaults agreement", argv = ["cmru", "tester-gate", "--cwd", ".", "--", "/opt/tester-venv/bin/python", "-m", "pytest", "tests", "-q", "-p", "no:cacheprovider"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "tls-edge: stage ciu and dependency wheels per interpreter", argv = ["python3", "scripts/stage-wheels.py"], cwd = "." },
  { label = "tls-edge: build one installer bundle per interpreter variant", argv = ["bash", "scripts/build-artifact.sh"], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  # One tarball per interpreter variant, all under the same release tag or none (cmru KI-115).
  # The --variant names and labels repeat [[project.variants]] above; tests/test_release_config.py
  # keeps the two in step. dist/get.py is the installer, published beside the bundles.
  { label = "tls-edge: publish variant bundles", argv = ["cmru", "handler", "tarball-publish", "--prefix", "tls-edge", "--cwd", ".", "--glob", "tls-edge-v*.tar.xz", "--version-file", "dist/VERSION", "--notes-env", "TLS_EDGE_RELEASE_NOTES", "--variant", "py313=CPython 3.13, x86_64 glibc", "--variant", "py314=CPython 3.14, x86_64 glibc", "--extra-asset", "dist/get.py"], cwd = "." },
]

[versions.targets."oci.socket-proxy"]
mode = "single"
constraint = ">=0.5.0"

[versions.targets."oci.socket-proxy".oci]
image = "docker.io/tecnativa/docker-socket-proxy"
tag = "v{version}"

[versions.targets."oci.traefik"]
mode = "single"
constraint = ">=3.7.0,<3.8.0"

[versions.targets."oci.traefik".oci]
image = "docker.io/library/traefik"
tag = "v{version}"
