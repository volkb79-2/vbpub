# ─── Example 2 (pattern E): web UI + application-published TCP/UDP media ─────
#
# HTTPS goes through Traefik on :443. Raw WebRTC media does not: the
# application publishes its own TCP and UDP listener directly on the host.
#
#   https://rtc.<TLS_EDGE_DOMAIN> -> websecure (:443) -> app:8080
#   <public-ip>:<MEDIA_PUBLIC_PORT>/udp -> app:<MEDIA_CONTAINER_PORT>/udp
#   <public-ip>:<MEDIA_PUBLIC_PORT>/tcp -> app:<MEDIA_CONTAINER_PORT>/tcp
#
# Both media variables are required. They let the application advertise and
# publish its real listener; tls-edge owns only the shared HTTPS entrypoint.
# Allow the same host port for TCP and UDP in both host and provider firewalls.
#
# Run: docker compose --env-file ../.env.example up -d  (set all variables first)

services:

  app:
    image: your-image:tag          # replace with the real image
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${MEDIA_PUBLIC_PORT:?set MEDIA_PUBLIC_PORT}:${MEDIA_CONTAINER_PORT:?set MEDIA_CONTAINER_PORT}/tcp"
      - "${MEDIA_PUBLIC_PORT:?set MEDIA_PUBLIC_PORT}:${MEDIA_CONTAINER_PORT:?set MEDIA_CONTAINER_PORT}/udp"
    networks:
      - ingress_public
    labels:
      - traefik.enable=true
      # Tell Traefik which network to use when the container has several.
      - traefik.docker.network=ingress_public

      # (1) HTTPS UI: host-name router, certificate issued for this host.
      - traefik.http.routers.pattern-e-app.rule=Host(`rtc.${TLS_EDGE_DOMAIN:?set TLS_EDGE_DOMAIN}`)
      - traefik.http.routers.pattern-e-app.entrypoints=websecure
      - traefik.http.services.pattern-e-app.loadbalancer.server.port=8080

networks:
  ingress_public:
    external: true
