# ─── Example 3 (pattern D): a route guarded by basicAuth middleware ───────────
#
# Use case: a service that must not be reachable without a shared secret
# (staging, tooling endpoints, dashboards).  The guard is a Traefik middleware
# declared in THIS container's labels; the edge needs no change.
#
#   https://guarded.<TLS_EDGE_DOMAIN>  ->  basicAuth  ->  app:8080
#
# The hash comes from the environment (.env), never from the compose file:
#   scripts/gen-guard-secret.sh user 'a-long-secret'   # prints user:$2y$...
#   put it in .env SINGLE-QUOTED:   GUARD_HASH='user:$2y$12$...'
# Single quotes stop Compose from treating `$2y` / `$12` as variable
# references when it reads .env.  Compose substitutes the value into the label
# verbatim (it does not interpolate it again), so Traefik receives the exact
# htpasswd line.  If you instead paste a hash INTO this file, double every $.
# Verify offline:  docker compose config | grep basicauth   (must equal the
# htpasswd output).
#
# Naming rule: router, service and middleware names are global on the host:
# <stack>-<service> for routers/services, <router>-guard for the middleware.
#
# WebSocket clients (Playwright connect()) usually cannot send Basic auth on
# the upgrade request: guard the HTTP route only (see README.md).
#
# Run:  cp .env.example .env  (edit)  &&  docker compose up -d

services:

  app:
    image: your-image:tag          # replace with the real image
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - ingress_public
      - private
    labels:
      - traefik.enable=true
      - traefik.http.routers.pattern-d-app.rule=Host(`guarded.${TLS_EDGE_DOMAIN:?set TLS_EDGE_DOMAIN}`)
      - traefik.http.routers.pattern-d-app.entrypoints=websecure
      - traefik.http.services.pattern-d-app.loadbalancer.server.port=8080
      # The middleware: users is a comma-separated list of user:hash entries.
      - traefik.http.middlewares.pattern-d-app-guard.basicauth.users=${GUARD_HASH:?set GUARD_HASH}
      # Optional: realm shown in the browser prompt.
      - traefik.http.middlewares.pattern-d-app-guard.basicauth.realm=Restricted
      # Attach it.  The edge's secure-headers middleware is attached at the
      # entrypoint and does not need to be listed.
      - traefik.http.routers.pattern-d-app.middlewares=pattern-d-app-guard

networks:
  ingress_public:
    external: true
  private:
    driver: bridge
    internal: true
