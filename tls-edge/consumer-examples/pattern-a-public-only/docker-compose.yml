# ─── Example 1 (pattern A): a plain web app behind the edge ───────────────────
#
# Use case: one container with one HTTP(S) port.  Every request arrives through
# Traefik; the container publishes NO host port.
#
#   https://app.<TLS_EDGE_DOMAIN>  ->  Traefik (:443)  ->  app:8080
#
# What the edge does for you: it terminates TLS on :443 and obtains one
# certificate PER HOST NAME from the ACME resolver the first time the host is
# requested (the router's Host() rule is the list of names to certify).  No
# tls= or certresolver label is needed: TLS is set on the entrypoint.
#
# DNS: app.<TLS_EDGE_DOMAIN> must resolve to the edge host (an A/AAAA record
# per service, or one wildcard record).  Each service gets its OWN host name.
#
# Variable (see ../.env.example):  TLS_EDGE_DOMAIN  - your base domain.
#
# Naming rule: router and service names are global on the host.  Use
# <stack>-<service> (here pattern-a-app); two stacks with the same router name
# conflict and Traefik drops or misroutes them.
#
# Run:  docker compose --env-file ../.env.example up -d   (edit the domain first)
#
# Label by label: see ../README.md.

services:

  app:
    image: your-image:tag          # replace with the real image
    restart: unless-stopped
    expose:
      - "8080"                     # documentation only; nothing is published
    networks:
      - ingress_public             # the shared network Traefik routes on
      - private                    # optional: only if the app has local peers
    labels:
      - traefik.enable=true        # opt in (the edge has exposedByDefault=false)
      - traefik.http.routers.pattern-a-app.rule=Host(`app.${TLS_EDGE_DOMAIN:?set TLS_EDGE_DOMAIN}`)
      - traefik.http.routers.pattern-a-app.entrypoints=websecure
      - traefik.http.services.pattern-a-app.loadbalancer.server.port=8080

networks:
  ingress_public:
    external: true                 # created and owned by the edge
  private:
    driver: bridge
    internal: true                 # no outbound access
